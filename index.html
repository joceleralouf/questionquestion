 {cat:"Histoire du bar", q:"L'angostura bitter a été mis au point :", o:["Par un médecin allemand au Venezuela","Par un pharmacien de Trinidad","Par un botaniste anglais en Guyane","Par un moine espagnol"], r:0, e:"Johann Siegert, chirurgien de l'armée de Bolívar, à Angostura (aujourd'hui Ciudad Bolívar) en 1824, comme tonique digestif. La production est transférée à Trinidad en 1875. Sa grande étiquette dépasse de la bouteille par erreur jamais corrigée."},
 {cat:"Histoire du bar", q:"Le Gimlet est lié historiquement :", o:["À la Royal Navy et au scorbut","À la marine marchande portugaise","Aux planteurs de Ceylan","À la Compagnie des Indes"], r:0, e:"Le Merchant Shipping Act de 1867 impose le jus d'agrumes à bord ; le Rose's Lime Juice, conservé sans alcool, s'impose. Le nom viendrait du chirurgien Gimlette ou de la vrille (gimlet) à percer les fûts."},
 {cat:"Histoire du bar", q:"Le tonic doit son amertume :", o:["À la quinine, extraite du quinquina","Au houblon","À la gentiane","À l'écorce d'orange amère"], r:0, e:"Utilisée contre le paludisme par les officiers britanniques aux Indes, adoucie au sucre, au citron et au gin : le gin tonic naît d'une prophylaxie. Le quinquina, « arbre à fièvre », a donné son nom à Fever-Tree."},
 {cat:"Histoire du bar", q:"Le Pisco Sour a été créé :", o:["Au Morris' Bar de Lima, vers 1920","À Santiago du Chili","À Ica","À Arequipa"], r:0, e:"Par l'Américain Victor Vaughen Morris. Le Pérou et le Chili se disputent l'appellation pisco ; le Pérou impose une distillation unique au degré, sans eau ni bois — la règle des Cuatro Gallos."},
 {cat:"Histoire du bar", q:"Le Mai Tai et le Zombie appartiennent :", o:["Au répertoire tiki","Aux cocktails de la Prohibition","Aux classiques du Savoy","Aux drinks de la Belle Époque"], r:0, e:"Le Zombie est de Donn Beach (1934), le Mai Tai de Trader Vic (1944). Les deux maisons se sont longtemps disputé la paternité du style polynésien."},
 {cat:"Histoire du bar", q:"Le Corpse Reviver n°2 associe gin, Lillet, Cointreau, citron et :", o:["Un rinçage d'absinthe","Un trait de Fernet","Du marasquin","Un blanc d'œuf"], r:0, e:"Publié par Craddock dans le Savoy Cocktail Book (1930), avec sa note fameuse : quatre pris coup sur coup raniment le cadavre — et le retuent. La famille des « Corpse Reviver » est celle des remontants du matin."},
 {cat:"Histoire du bar", q:"La première édition du Savoy Cocktail Book contient environ :", o:["300 recettes","500 recettes","750 recettes","1 200 recettes"], r:1, e:"Environ 750 selon les décomptes, souvent arrondi à 500 pour les recettes proprement dites. C'est le livre le plus réédité du métier ; la mise en page art déco est de Gilbert Rumbold."},

 /* ===== RÉGLEMENTATION & PRODUCTION — APPROFONDISSEMENT ===== */
 {cat:"Réglementation & production", q:"Un bourbon doit contenir au minimum :", o:["40 % de maïs","51 % de maïs","70 % de maïs","80 % de maïs"], r:1, e:"Le reste du mash bill — seigle, blé, orge maltée — est libre. Le maïs apporte le sucre et le corps ; c'est le plancher qui distingue le bourbon du rye."},
 {cat:"Réglementation & production", q:"Le bourbon doit sortir de l'alambic à :", o:["Maximum 160 proof (80 % vol)","Minimum 160 proof","Maximum 190 proof","Exactement 125 proof"], r:0, e:"Ce plafond protège les congénères : au-delà, on s'approche de l'alcool neutre. Entrée en fût à 125 proof maximum (62,5 %), embouteillage à 80 proof minimum (40 %)."},
 {cat:"Réglementation & production", q:"Le bourbon doit vieillir :", o:["Deux ans minimum, sans exception","Sans durée minimale légale","Quatre ans minimum","Trois ans minimum"], r:1, e:"PIÈGE CLASSIQUE. Aucune durée n'est exigée pour dire « bourbon » : le texte impose seulement le fût de chêne NEUF et CARBONISÉ. Ce sont les deux ans qui font le « straight bourbon », et les quatre ans le « bottled-in-bond »."},
 {cat:"Réglementation & production", q:"Un bourbon doit obligatoirement être produit :", o:["Dans le Kentucky","Aux États-Unis","Dans le Sud des États-Unis","Dans le comté de Bourbon"], r:1, e:"Autre idée reçue : le Kentucky n'est pas obligatoire. Seule la mention « Kentucky Bourbon » impose distillation et vieillissement dans l'État."},
 {cat:"Réglementation & production", q:"Une étiquette de bourbon doit porter une mention d'âge si le whiskey a moins de :", o:["Deux ans","Trois ans","Quatre ans","Six ans"], r:2, e:"En dessous de quatre ans, l'âge doit être affiché — et c'est celui du plus jeune whiskey de l'assemblage."},
 {cat:"Réglementation & production", q:"Ce qui distingue le Tennessee whiskey du bourbon :", o:["Le Lincoln County Process, filtrage au charbon d'érable","Un mash bill différent","Un vieillissement plus long","L'absence de fût neuf"], r:0, e:"Jack Daniel's coche toutes les cases du bourbon mais revendique cette filtration supplémentaire avant le fût, d'où sa catégorie propre."},
 {cat:"Réglementation & production", q:"Combien de catégories légales de Scotch whisky ?", o:["Trois","Quatre","Cinq","Sept"], r:2, e:"Single malt, single grain, blended malt, blended grain, blended Scotch. Définies par les Scotch Whisky Regulations 2009."},
 {cat:"Réglementation & production", q:"Un « blended malt Scotch » est :", o:["Un mélange de malt et de grain","Un assemblage de single malts de plusieurs distilleries","Un malt vieilli en plusieurs fûts","Un malt d'une seule distillerie"], r:1, e:"Anciennement « vatted malt » ou « pure malt ». Le « blended Scotch » tout court, lui, mélange malt et grain — c'est près de 90 % du marché."},
 {cat:"Réglementation & production", q:"Le Scotch doit vieillir au minimum :", o:["Deux ans en Écosse","Trois ans en fûts de chêne, en Écosse","Trois ans n'importe où","Cinq ans en Écosse"], r:1, e:"Distillé en Écosse à partir d'eau et d'orge maltée, fermenté par levures, vieilli au moins trois ans en fûts de chêne SUR LE SOL ÉCOSSAIS. Le caramel colorant y reste autorisé."},
 {cat:"Réglementation & production", q:"Un « single malt Scotch » est produit :", o:["Dans une seule distillerie, en alambic à repasse, 100 % orge maltée","À partir d'un seul fût","Dans une seule région","À partir d'une seule récolte"], r:0, e:"« Single » désigne la distillerie, pas le fût. Un fût unique se dit « single cask »."},
 {cat:"Réglementation & production", q:"L'AOC Rhum agricole de la Martinique date de :", o:["1975","1986","1996","2005"], r:2, e:"Première AOC rhumière au monde, révisée en 2005 et 2014. Canne fraîchement coupée, pur jus, rectification interdite, 40 % vol minimum."},
 {cat:"Réglementation & production", q:"Dans l'AOC Martinique, la seconde distillation est :", o:["Obligatoire","Interdite","Facultative","Réservée aux rhums vieux"], r:1, e:"La rectification est proscrite : une seule passe en colonne créole, pour garder les composés volatils — le texte impose même un minimum de 225 g/hl pour le rhum blanc."},
 {cat:"Réglementation & production", q:"L'âge affiché sur un assemblage, quelle que soit la catégorie, est :", o:["La moyenne des eaux-de-vie","L'âge du plus jeune composant","L'âge du plus vieux composant","L'âge du fût"], r:1, e:"Règle universelle : cognac, armagnac, whisky, rhum. C'est ce qui explique qu'un XO puisse contenir des eaux-de-vie bien plus vieilles que ses dix ans."},
 {cat:"Réglementation & production", q:"Le « bottled-in-bond » américain exige :", o:["Quatre ans de vieillissement et 100 proof","Deux ans et 80 proof","Six ans et 90 proof","Huit ans et 110 proof"], r:0, e:"Issu du Bottled-in-Bond Act de 1897, l'une des premières lois de protection du consommateur : une seule distillerie, une seule saison de distillation, entrepôt sous contrôle fédéral."},
 {cat:"Réglementation & production", q:"Le « char » d'un fût de bourbon désigne :", o:["Le brûlage de la face interne","Le séchage du bois","Le type de chêne","La contenance"], r:0, e:"Le char casse la lignine en vanilline et caramélise les sucres du bois, créant la « red layer ». Les niveaux 1 à 4 sont un usage professionnel, pas une obligation légale — le n°4 est dit « alligator »."},
 {cat:"Réglementation & production", q:"La différence entre macération et infusion tient :", o:["À la température : à froid contre à chaud","À la durée","Au titre alcoométrique","Au type de plante"], r:0, e:"Macération à froid, longue, dans l'alcool ; infusion dans un liquide chaud. La percolation, elle, fait circuler le liquide en continu à travers la matière."},
 {cat:"Réglementation & production", q:"Un alcool distillé à plus de 96 % vol est :", o:["Un spiritueux aromatisé","De l'alcool neutre","Une eau-de-vie de tête","Un distillat de cœur"], r:1, e:"Au-delà de ce seuil, il ne reste quasiment plus de congénères : c'est la base des vodkas, gins et liqueurs. Le whisky, lui, est plafonné à 94,8 % précisément pour garder du goût."},

 /* ===== HISTOIRE DU BAR — APPROFONDISSEMENT SOURCÉ ===== */
 {cat:"Histoire du bar", q:"L'Old Fashioned moderne est traditionnellement associé :", o:["Au Pendennis Club de Louisville","Au Waldorf Astoria","Au Manhattan Club","Au Pendleton Hotel"], r:0, e:"Club social de Louisville, Kentucky, vers 1880. L'attribution est traditionnelle et non prouvée : la formule spiritueux-sucre-eau-bitters est en réalité la définition même du cocktail de 1806. « Old Fashioned » était d'abord un argot de barman pour réclamer l'ancienne manière."},
 {cat:"Histoire du bar", q:"Le Martinez figure pour la première fois dans une édition du guide de Jerry Thomas datée de :", o:["1862","1876","1887","1900"], r:2, e:"L'édition de 1887, parue l'année de sa mort : un pony d'Old Tom gin, un verre de vermouth, deux traits de marasquin, un trait de Boker's bitters. Deux récits d'origine concurrents : Thomas à l'Occidental Hotel, ou un barman nommé Richelieu à Martinez, en Californie."},
 {cat:"Histoire du bar", q:"La Margarita a une origine :", o:["Documentée et incontestée","Disputée entre plusieurs revendications","Attribuée à Jerry Thomas","Espagnole"], r:1, e:"Au moins trois prétendants : Carlos « Danny » Herrera au Rancho La Gloria de Tijuana (1938), le Kentucky Club de Ciudad Juárez, et la mondaine Margarita Sames à Acapulco (1948). Aucune n'est établie. Structure : c'est un Daisy à la tequila — « margarita » veut dire marguerite."},
 {cat:"Histoire du bar", q:"La Piña Colada est traditionnellement attribuée à :", o:["Ramón « Monchito » Marrero, au Caribe Hilton en 1954","Don Ramón Portas Mingot, chez Barrachina en 1963","Ricardo García","Les trois revendications coexistent"], r:3, e:"Le Caribe Hilton de San Juan défend Marrero (1954), Barrachina affiche une plaque au nom de Portas Mingot (1963), et García revendique 1953. Un fait est sûr : la crème de coco Coco López, mise au point par le professeur Ramón López Irizarry en 1954, rend le drink possible. Boisson nationale de Porto Rico depuis 1978."},
 {cat:"Histoire du bar", q:"Le Zombie a été créé par :", o:["Donn Beach, en 1934","Trader Vic, en 1944","Ernest Raymond Gantt à Hawaï","Constante Ribalaigua"], r:0, e:"Donn Beach — de son vrai nom Ernest Raymond Beaumont Gantt — à Hollywood. Il protégeait tellement sa recette qu'il codait ses ingrédients en flacons numérotés, que ses propres barmen ne savaient pas identifier."},
 {cat:"Histoire du bar", q:"Le Cuba Libre naît de :", o:["L'arrivée du Coca-Cola à Cuba au début du XXe siècle","Un cocktail espagnol du XIXe","La révolution de 1959","Un rhum arrangé de La Havane"], r:0, e:"Coca-Cola arrive à Cuba en 1902, après la guerre hispano-américaine. Le toast « ¡Por Cuba libre! » donne son nom au rhum-cola. Le trait de citron vert distingue le Cuba Libre du simple rhum-coca."},
 {cat:"Histoire du bar", q:"Le Bottled-in-Bond Act, qui garantissait l'authenticité du whiskey américain, date de :", o:["1862","1897","1920","1933"], r:1, e:"L'une des premières lois de protection du consommateur aux États-Unis, bien avant la Prohibition : elle répondait aux whiskeys frelatés, coupés et colorés."},
 {cat:"Histoire du bar", q:"Harry Craddock est crédité de la création :", o:["Du White Lady","Du Manhattan","Du Negroni","Du Sidecar"], r:0, e:"Il est aussi considéré comme le popularisateur du Dry Martini à Londres, et l'auteur du Corpse Reviver n°2. Surnommé le « roi des shakers »."},
 {cat:"Histoire du bar", q:"Combien de recettes contient le Savoy Cocktail Book de 1930 ?", o:["Environ 250","Environ 500","Environ 750","Environ 1 500"], r:2, e:"750 recettes en moins de 300 pages, dosées en « glasses », « dashes » et « hookers » — jamais en millilitres. Illustrations art déco de Gilbert Rumbold."},
 {cat:"Histoire du bar", q:"L'angostura bitter a été mis au point en :", o:["1806","1824","1850","1875"], r:1, e:"Par le chirurgien allemand Johann Siegert, médecin de l'armée de Bolívar, après quatre ans de recherches, comme tonique contre les maux d'estomac. Premier export en 1830 ; la production part pour Trinidad en 1875, fuyant l'instabilité vénézuélienne."},
 {cat:"Histoire du bar", q:"Le Vieux Carré est né à l'hôtel Monteleone, mais attention :", o:["Le Carousel Bar n'ouvre qu'en 1949, onze ans après","Bergeron n'y a jamais travaillé","Il vient en réalité de Baton Rouge","La recette est de Craddock"], r:0, e:"Le comptoir tournant qu'on associe au drink est postérieur. Autre nuance de datation : la recette paraît dès 1937 dans le livre de Stanley Clisby Arthur, un an avant la date de création communément retenue."},
 {cat:"Histoire du bar", q:"Le Last Word a été créé par :", o:["Frank Fogarty","Un barman inconnu du Detroit Athletic Club","Ted Saucier","Murray Stenson"], r:1, e:"PIÈGE. Le vaudevilliste Fogarty l'a popularisé, Saucier l'a publié en 1951, Stenson l'a ressuscité en 2003-2004 — mais le créateur reste inconnu. Le drink figure à la carte du club dès 1916, où il était le plus cher : 35 cents."},
 {cat:"Histoire du bar", q:"Qui a ramené le Last Word dans la lumière, et où ?", o:["Murray Stenson, au Zig Zag Café de Seattle","Dale DeGroff, au Rainbow Room","Audrey Saunders, au Pegu Club","Sasha Petraske, au Milk & Honey"], r:0, e:"En 2003-2004, après l'avoir trouvé dans « Bottoms Up! » de Ted Saucier (1951). Le drink relance la mode des cocktails à parts égales — et, accessoirement, la pénurie mondiale de Chartreuse verte."},
 {cat:"Histoire du bar", q:"Le Bloody Mary est attribué à Fernand Petiot, mais :", o:["L'attribution est disputée avec l'acteur George Jessel","Il n'a jamais travaillé à Paris","Il l'a créé après 1950","Il en a nié la paternité"], r:0, e:"Jessel revendiquait le simple vodka-tomate ; Petiot soutenait avoir ajouté les épices et les sauces qui en font un vrai Bloody Mary. Il commence garçon de cuisine au New York Bar de Paris à 16 ans, sous MacElhone, puis passe au King Cole Bar du St. Regis, où le drink devient le Red Snapper."},
 {cat:"Histoire du bar", q:"Les cocktails du Vieux Carré représentent :", o:["Les quatre saisons","Les communautés du quartier français","Les quatre familles de cocktails","Les états du Sud"], r:1, e:"Rye pour les Américains, cognac et Bénédictine pour les Français, vermouth rouge pour les Italiens, Peychaud's et angostura pour les Créoles. « Vieux Carré » est le nom d'origine du French Quarter."},
 {cat:"Histoire du bar", q:"Le Gimlet trouve son origine dans :", o:["La lutte contre le scorbut dans la Royal Navy","Un cocktail de la Prohibition","Une recette de Jerry Thomas","Un drink colonial indien"], r:0, e:"Le Merchant Shipping Act de 1867 impose le jus d'agrumes à bord ; le Rose's Lime Juice, conservé sans alcool, s'impose. Le nom viendrait du chirurgien Gimlette ou de la vrille à percer les fûts — aucune des deux pistes n'est établie."},
 {cat:"Histoire du bar", q:"Le premier « cocktail party » documenté est attribué à :", o:["Mrs Julius S. Walsh Jr, à Saint-Louis en 1917","Harry McElhone, à Paris en 1923","Le Savoy, en 1930","Trader Vic, en 1944"], r:0, e:"Missouri, 1917. Le format s'impose ensuite pendant la Prohibition, où recevoir chez soi devient la seule manière légale de boire en société."},

 /* ===== CRÉATEURS & MODERN CLASSICS — SUITE ===== */
 {cat:"Créateurs & modern classics", q:"Le Gold Rush, dont dérive le Penicillin, a été créé par :", o:["T.J. Siegal, au Milk & Honey","Sam Ross","Sasha Petraske","Michael McIlroy"], r:0, e:"Vers 2001 : bourbon, citron, sirop de miel — un Whiskey Sour dont le sucre devient du miel. Sam Ross en tirera le Penicillin en changeant la base pour du scotch et en ajoutant le gingembre."},
 {cat:"Créateurs & modern classics", q:"Le Penicillin se termine par :", o:["Un float de scotch tourbé d'Islay","Un rinçage d'absinthe","Un float de vin rouge","Une mousse de gingembre"], r:0, e:"La base est un blended scotch, le float un single malt tourbé. Miel-gingembre et citron complètent. Sam Ross, Milk & Honey, 2005."},
 {cat:"Créateurs & modern classics", q:"Le Paper Plane assemble à parts égales :", o:["Bourbon, Aperol, Amaro Nonino, citron","Rye, Campari, Chartreuse, citron vert","Mezcal, Aperol, Chartreuse, citron vert","Bourbon, Campari, vermouth, citron"], r:0, e:"Sam Ross, pour l'ouverture du Violet Hour à Chicago, 2007. La première version utilisait du Campari, remplacé ensuite par l'Aperol. Nommé d'après le morceau de M.I.A."},
 {cat:"Créateurs & modern classics", q:"Le Naked and Famous assemble à parts égales :", o:["Mezcal, Chartreuse jaune, Aperol, citron vert","Mezcal, Campari, Cointreau, citron","Tequila, Chartreuse verte, Aperol, citron vert","Mezcal, Aperol, amaro, citron"], r:0, e:"Joaquín Simó, Death & Co, New York, 2011 : le Paper Plane transposé à l'agave, avec la Chartreuse jaune en plus. Il partage sa structure à parts égales avec le Last Word."},
 {cat:"Créateurs & modern classics", q:"Le Milk & Honey de New York a ouvert en :", o:["1995","1999","2003","2007"], r:1, e:"Sasha Petraske, sur Eldridge Street. Porte sans enseigne, réservation, règles de conduite : le modèle du néo-speakeasy. Y naissent le Gold Rush, le Penicillin et le Red Hook."},
 {cat:"Créateurs & modern classics", q:"Le Red Hook, le Greenpoint ou le Bensonhurst forment une famille de twists nommés d'après :", o:["Des quartiers de Brooklyn","Des barmen new-yorkais","Des rues de Manhattan","Des marques de rye"], r:0, e:"Tous partent du Manhattan en remplaçant le vermouth ou en y ajoutant un amer. Le Red Hook de Vincenzo Errico (Milk & Honey, 2003), au Punt e Mes et marasquin, a ouvert la série."},
 {cat:"Créateurs & modern classics", q:"Dans le Trinidad Sour, l'angostura est :", o:["Un assaisonnement au trait","L'ingrédient principal, environ 45 ml","Absente","Remplacée par du Peychaud's"], r:1, e:"Giuseppe González, 2008. Avec orgeat, rye et citron. Le bitter passe du rôle d'épice à celui de base : un renversement complet de la hiérarchie du verre."},
 {cat:"Créateurs & modern classics", q:"Le Gin Basil Smash a été créé à :", o:["Londres","Hambourg","Berlin","Copenhague"], r:1, e:"Par Jörg Meyer, au Le Lion, en 2008. Gin, basilic frais, citron, sucre. L'un des rares modern classics d'origine allemande à s'être imposé mondialement."},
 {cat:"Créateurs & modern classics", q:"Le Tommy's Margarita se distingue de la Margarita classique par :", o:["L'absence de liqueur d'orange, remplacée par du sirop d'agave","L'ajout de piment","L'absence de sel","L'usage du mezcal"], r:0, e:"Julio Bermejo, Tommy's Mexican Restaurant, San Francisco, début des années 1990. Il supprime le triple sec pour laisser parler l'agave — et impose le 100 % agave dans son établissement."},
 {cat:"Créateurs & modern classics", q:"Le Porn Star Martini s'appelait d'abord :", o:["Maverick Martini","Passion Martini","Star Martini","Townhouse Martini"], r:0, e:"Douglas Ankrah, au Townhouse de Londres, 2001. Vodka vanille et fruit de la passion, servi avec un shot de champagne à part. C'est aujourd'hui l'un des cocktails les plus vendus au Royaume-Uni."},
 {cat:"Créateurs & modern classics", q:"L'Old Cuban d'Audrey Saunders est essentiellement :", o:["Un mojito couronné de champagne","Un daiquiri allongé","Un French 75 au rhum","Un Cuba Libre premium"], r:0, e:"Rhum vieux, menthe, citron vert, angostura et champagne, en 2001. Saunders, formée auprès de Dale DeGroff, ouvrira le Pegu Club en 2005 — d'où sortira aussi le Gin-Gin Mule."},
 {cat:"Créateurs & modern classics", q:"Le Jasmine de Paul Harrington part du :", o:["Pegu Club","Negroni","White Lady","Bronx"], r:0, e:"Il remplace l'angostura du Pegu Club par du Campari et le citron vert par du citron jaune. Emeryville, Californie, 1993. Nommé d'après son ami Matt Jasmin — dont il a mal orthographié le nom."},
 {cat:"Créateurs & modern classics", q:"Dick Bradsell a créé l'Espresso Martini :", o:["Sous le nom de Vodka Espresso, dans les années 1980","Au Savoy en 1995","Sous le nom de Café Royale","Au Fred's Club en 1984"], r:0, e:"Au Soho Brasserie de Londres. Le nom Espresso Martini est venu plus tard, à l'époque où tout ce qui passait en verre à martini prenait ce nom. Le Bramble, lui, naît au Fred's Club vers 1984."},
 {cat:"Créateurs & modern classics", q:"Dale DeGroff est aussi l'auteur :", o:["Du French Martini","Du Cosmopolitan","Du Bramble","Du Penicillin"], r:0, e:"Créé au Balthazar de Keith McNally à New York. DeGroff, surnommé « King Cocktail », officiait au Rainbow Room depuis 1987 : c'est lui qui remet les jus frais et les recettes historiques au centre du métier américain."},
 {cat:"Créateurs & modern classics", q:"Salvatore Calabrese est surnommé :", o:["The Maestro","King Cocktail","The Professor","The Dean"], r:0, e:"« The Professor », c'est Jerry Thomas ; « King Cocktail », Dale DeGroff. Calabrese, né sur la côte amalfitaine, a créé le Breakfast Martini au Library Bar du Lanesborough en 1996."},

 /* ===== HISTOIRE DU BAR — LOT 2 ===== */
 {cat:"Histoire du bar", q:"Le punch est arrivé en Europe par :", o:["Les marins de la Compagnie anglaise des Indes orientales","Les corsaires français","Les conquistadors espagnols","Les colons portugais du Brésil"], r:0, e:"Le mot vient probablement du hindi « pāñč », cinq, pour ses cinq composants : alcool, sucre, citron, eau, épices. Première recette publiée en Inde en 1638. C'est l'ancêtre de toute la mixologie."},
 {cat:"Histoire du bar", q:"Le mot « toddy » désigne à l'origine :", o:["Une boisson chaude au whisky","La sève fermentée de palmier, en Inde","Un grog de marin","Un punch de Noël"], r:1, e:"De l'hindi « tāṛī ». Le sens glisse ensuite vers le mélange chaud spiritueux-sucre-eau, servi en hiver."},
 {cat:"Histoire du bar", q:"Le julep tire son nom :", o:["Du persan « gulab », eau de rose","D'un barman de Virginie","Du latin « julius »","D'une plante de Louisiane"], r:0, e:"Via l'arabe « julāb ». À l'origine une préparation médicinale sucrée servant de véhicule aux remèdes — comme beaucoup de cocktails, il descend de la pharmacopée."},
 {cat:"Histoire du bar", q:"Le Mint Julep est la boisson officielle :", o:["Du Kentucky Derby","Du Preakness Stakes","Du Belmont Stakes","De la Breeders' Cup"], r:0, e:"Depuis 1938. Servi dans une timbale en argent ou en étain, sur glace pilée, jusqu'à ce que le métal givre."},
 {cat:"Histoire du bar", q:"Le « swizzle stick » antillais est à l'origine :", o:["Une branche de l'arbre Quararibea turbinata","Une tige de canne à sucre","Un os de poisson","Une cuiller à absinthe"], r:0, e:"Le « bois lélé », dont les branches en étoile s'utilisent en le roulant entre les paumes dans la glace pilée, jusqu'au givrage du verre."},
 {cat:"Histoire du bar", q:"Le Sazerac est la boisson officielle :", o:["De la Louisiane","De La Nouvelle-Orléans","Du Mississippi","De l'Alabama"], r:1, e:"Cocktail officiel de la ville depuis 2008. Rinçage à l'absinthe, Peychaud's, sucre, rye — et un zeste de citron qu'on ne laisse traditionnellement pas tomber dans le verre."},
 {cat:"Histoire du bar", q:"Antoine Amédée Peychaud, créateur du bitter, était :", o:["Barman","Apothicaire","Distillateur","Planteur"], r:1, e:"Réfugié de Saint-Domingue installé à La Nouvelle-Orléans. Son bitter, plus floral et anisé que l'angostura, est indissociable du Sazerac et du Vieux Carré."},
 {cat:"Histoire du bar", q:"Le Brandy Crusta, ancêtre du Sidecar, est né :", o:["À La Nouvelle-Orléans, vers 1850","À Paris, en 1920","À Londres, en 1880","À New York, en 1900"], r:0, e:"Attribué à Joseph Santini. Il introduit deux gestes majeurs : le sucre sur le bord du verre et le long ruban de zeste tapissant l'intérieur. C'est le premier cocktail à intégrer un agrume de façon structurelle."},
 {cat:"Histoire du bar", q:"La famille « Daisy » se caractérise par :", o:["Un sour où une liqueur remplace une partie du sucre","Un cocktail servi sur glace pilée","Un drink au champagne","Un cocktail à l'œuf"], r:0, e:"La Margarita est un Daisy à la tequila — « margarita » veut d'ailleurs dire marguerite en espagnol. Le Yellow Daisy, lui, porte le nom sans appartenir à la famille."},
 {cat:"Histoire du bar", q:"Un « flip » contient traditionnellement :", o:["Un œuf entier","Un blanc d'œuf","Un jaune d'œuf","De la crème"], r:0, e:"À l'origine une bière chauffée au tisonnier rougi — d'où le nom, qui évoque le jaillissement. Le « fizz » au blanc d'œuf, lui, n'est pas un flip."},
 {cat:"Histoire du bar", q:"Le « cobbler » a popularisé :", o:["La paille","Le shaker","Le zeste flambé","Le verre à pied"], r:0, e:"Servi sur glace pilée avec des fruits, il impose la paille au XIXe siècle. Jerry Thomas le décrit comme la boisson la plus populaire de son temps. Le Sherry Cobbler en est l'archétype."},
 {cat:"Histoire du bar", q:"La glace devient accessible au bar grâce à :", o:["Frederic Tudor, le « roi de la glace »","La machine de Carré","Les frères Lumière","Le chemin de fer"], r:0, e:"Le Bostonien exporte dès 1806 la glace des lacs gelés de Nouvelle-Angleterre vers les Caraïbes et l'Inde. Sans commerce de la glace, pas de cocktail moderne."},
 {cat:"Histoire du bar", q:"Le cocktail arrive en Europe massivement :", o:["Avec les expositions universelles et les barmen américains itinérants","Avec les soldats de 1918","Avec la Prohibition uniquement","Après 1945"], r:0, e:"Dès la fin du XIXe siècle, les hôtels de luxe européens recrutent des barmen américains. La Prohibition accélérera ce mouvement déjà lancé."},
 {cat:"Histoire du bar", q:"Le Harry's New York Bar de Paris doit son existence à :", o:["Tod Sloan, jockey américain","Harry MacElhone","Frank Meier","Fernand Petiot"], r:0, e:"Il fait démonter un bar new-yorkais et le remonter rue Daunou en 1911. MacElhone, barman écossais, en devient propriétaire en 1923 et lui donne son nom."},
 {cat:"Histoire du bar", q:"Le Ritz de Paris est associé au barman :", o:["Frank Meier","Harry Craddock","Constante Ribalaigua","Joe Gilmore"], r:0, e:"Vermeire le cite pour ses recettes de Paradise et de Rosslyn. Le bar du Ritz porte aujourd'hui le nom d'Hemingway."},
 {cat:"Histoire du bar", q:"Constante Ribalaigua, du Floridita, est célèbre pour :", o:["Le daiquiri frappé","Le mojito","Le Cuba Libre","Le Presidente"], r:0, e:"Il passe le daiquiri au blender et met au point le Daiquiri n°3, sans sucre et au marasquin, que réclamait Hemingway. Le Floridita se surnomme « la cathédrale du daiquiri »."},
 {cat:"Histoire du bar", q:"Le Singapore Sling est attribué au barman :", o:["Ngiam Tong Boon","Joe Gilmore","Peter Dorelli","Colin Field"], r:0, e:"Au Long Bar du Raffles Hotel, vers 1915. Gin, Bénédictine, cherry brandy, ananas, citron vert, Cointreau, grenadine, angostura : la recette d'origine est perdue et les versions divergent."},
 {cat:"Histoire du bar", q:"Le Pisco Sour est né :", o:["Au Morris' Bar de Lima","À Santiago du Chili","À Ica","À Arequipa"], r:0, e:"Vers 1920, par l'Américain Victor Vaughen Morris. Pisco, citron vert, sucre, blanc d'œuf et quelques gouttes d'amargo de angostura sur la mousse."},
 {cat:"Histoire du bar", q:"La Caipirinha est à base de :", o:["Cachaça","Rhum agricole","Pisco","Aguardiente"], r:0, e:"Eau-de-vie brésilienne de pur jus de canne, distincte du rhum par sa réglementation nationale. La version à la vodka s'appelle Caipiroska, celle au rhum Caipiríssima."},
 {cat:"Histoire du bar", q:"Le Jungle Bird est né :", o:["À l'hôtel Hilton de Kuala Lumpur, en 1978","À Singapour","À Hawaï","En Jamaïque"], r:0, e:"Malaisie. C'est l'un des rares tiki à intégrer un amer italien : rhum noir, Campari, ananas, citron vert, sucre. Redécouvert dans les années 2010."},
 {cat:"Histoire du bar", q:"Le Painkiller est associé :", o:["Aux îles Vierges britanniques","À la Jamaïque","À Porto Rico","Aux Bahamas"], r:0, e:"Au Soggy Dollar Bar de Jost Van Dyke. Rhum, ananas, orange, crème de coco, muscade râpée. La marque Pusser's en détient le nom déposé."},
 {cat:"Histoire du bar", q:"Le Dark 'n' Stormy est une marque déposée par :", o:["Gosling's","Mount Gay","Appleton","Pusser's"], r:0, e:"La maison bermudienne a déposé le nom : légalement, un Dark 'n' Stormy se fait au Gosling's Black Seal et à la ginger beer. Un rare cas de cocktail protégé."},
 {cat:"Histoire du bar", q:"Le Hurricane est né :", o:["Chez Pat O'Brien's à La Nouvelle-Orléans","À Miami","Aux Bermudes","À Galveston"], r:0, e:"Années 1940 : le bar devait écouler du rhum, seul alcool disponible en volume pendant la guerre, imposé à l'achat avec le whisky. Servi dans un verre en forme de lampe-tempête."},
 {cat:"Histoire du bar", q:"Le Vesper apparaît :", o:["Dans « Casino Royale » de Ian Fleming, 1953","Au Savoy en 1930","Chez Duke's Bar","Dans un film de 1962"], r:0, e:"Gin, vodka, Kina Lillet — ce dernier n'existe plus sous cette forme, ce qui rend la recette d'origine irreproduisible. Bond le nomme d'après Vesper Lynd."},
 {cat:"Histoire du bar", q:"Le Bee's Knees est typiquement :", o:["Un cocktail de la Prohibition","Un drink victorien","Un tiki","Une création des années 1980"], r:0, e:"Gin, miel, citron. Le miel masquait la rudesse du bathtub gin. L'expression « the bee's knees » signifiait alors « le nec plus ultra »."},
 {cat:"Histoire du bar", q:"Le Southside est associé :", o:["À Chicago et à la Prohibition","À New York","À Boston","À Philadelphie"], r:0, e:"Gin, citron, sucre, menthe. La légende le rattache au gang du South Side de Chicago, dont le gin médiocre appelait la menthe. Attribution invérifiable — à présenter comme légende."},
 {cat:"Histoire du bar", q:"Le Aviation contient, dans sa version d'origine :", o:["De la crème de violette","De la Chartreuse","Du curaçao bleu","De l'absinthe"], r:0, e:"Gin, citron, marasquin et crème de violette, chez Hugo Ensslin en 1916. Le Savoy en 1930 omet la violette, devenue introuvable — d'où deux versions coexistantes."},
 {cat:"Histoire du bar", q:"Le Corpse Reviver n°2 est accompagné chez Craddock d'un avertissement :", o:["Quatre pris coup sur coup raniment le cadavre — et le retuent","À ne boire qu'avant midi","Interdit aux dames","À consommer tiède"], r:0, e:"La famille des « Corpse Reviver » regroupe les remontants du matin. Le n°2 — gin, Lillet, Cointreau, citron, rinçage d'absinthe — a survécu ; le n°1, au cognac et calvados, beaucoup moins."},
 {cat:"Histoire du bar", q:"Le Pimm's Cup repose sur :", o:["Un gin-sling aromatisé créé par un marchand d'huîtres","Un vermouth anglais","Un punch colonial","Une bière aromatisée"], r:0, e:"James Pimm, tenancier d'un bar à huîtres londonien, vers 1840. Le Pimm's n°1 est à base de gin ; d'autres numéros ont existé, à base de whisky, brandy, rhum, rye et vodka."},
 {cat:"Histoire du bar", q:"Le terme « mixologist » apparaît :", o:["Au XIXe siècle, souvent de façon ironique","Dans les années 1990","Chez Jerry Thomas comme titre officiel","Dans le Savoy Cocktail Book"], r:0, e:"Attesté dès les années 1850-1860 dans la presse américaine, souvent avec une pointe de moquerie. Sa réhabilitation date de la renaissance des années 1990-2000."},
 {cat:"Histoire du bar", q:"David Wondrich est connu pour :", o:["« Imbibe! », qui a réhabilité Jerry Thomas","Le Savoy Cocktail Book","« The Fine Art of Mixing Drinks »","Le Bartender's Manual"], r:0, e:"Historien américain du cocktail, auteur aussi de « Punch ». Son travail d'archive a fourni la base documentaire de la renaissance des années 2000."},
 {cat:"Histoire du bar", q:"David Embury, auteur de « The Fine Art of Mixing Drinks » (1948), était :", o:["Avocat fiscaliste et amateur","Barman du Waldorf","Journaliste","Distillateur"], r:0, e:"Un amateur éclairé. Il formalise les ratios — notamment le sour en 8:2:1 — et classe les cocktails en apéritifs et digestifs. Son approche par proportions reste une référence."},
 {cat:"Histoire du bar", q:"Charles H. Baker Jr. est l'auteur de :", o:["« The Gentleman's Companion »","« Imbibe! »","« Bottoms Up! »","« Café Royal Cocktail Book »"], r:0, e:"Récit de voyage autant que recueil : il collecte les recettes autour du monde dans les années 1930. Une source précieuse pour les drinks exotiques d'avant-guerre."},
 {cat:"Histoire du bar", q:"Le « Café Royal Cocktail Book » (1937) est l'œuvre de :", o:["William J. Tarling","Harry Craddock","Robert Vermeire","Ted Saucier"], r:0, e:"Président du United Kingdom Bartenders Guild. Vermeire le cite d'ailleurs pour sa recette du Silver Jubilee."},
 {cat:"Histoire du bar", q:"Le Gimlet doit son nom, selon l'hypothèse la plus citée :", o:["Au chirurgien de marine Thomas Gimlette","À une vrille de tonnelier","Aux deux hypothèses, sans trancher","À un officier de Singapour"], r:2, e:"Ni l'une ni l'autre n'est établie. Ce qui est documenté : le Merchant Shipping Act de 1867 impose les agrumes à bord, et le Rose's Lime Juice, conservé sans alcool, s'impose dans la Royal Navy."},
 {cat:"Histoire du bar", q:"Le gin tonic naît :", o:["De la prophylaxie antipaludique britannique aux Indes","D'un pari à Londres","D'une erreur de barman","D'une recette de Jerry Thomas"], r:0, e:"La quinine, très amère, est adoucie au sucre, au citron et au gin par les officiers. Le tonic commercial de Schweppes suit en 1870."},
 {cat:"Histoire du bar", q:"Le vermouth devient central au bar :", o:["Dans les années 1880-1890, avec le Martinez et le Manhattan","Dès 1786","Après 1945","Pendant la Prohibition"], r:0, e:"Son arrivée aux États-Unis fait basculer le cocktail du modèle « spiritueux-sucre-bitters » vers un modèle à deux alcools. C'est la naissance de la famille Martini-Manhattan."},
 {cat:"Histoire du bar", q:"L'Americano tire son nom :", o:["Probablement de sa popularité auprès des Américains à Milan","D'un barman nommé Americo","De l'Amérique du Sud","D'une marque de vermouth"], r:0, e:"Anciennement Milano-Torino. Le nom se fixe au début du XXe siècle. C'est le premier cocktail commandé par James Bond dans l'œuvre de Fleming."},
 {cat:"Histoire du bar", q:"Le Boulevardier a été redécouvert :", o:["Dans les années 2000, par le mouvement craft","Dès 1950","Par l'IBA en 1961","Par Dale DeGroff en 1987"], r:0, e:"Oublié pendant près de 80 ans après sa parution chez McElhone en 1927. Il entre dans la liste officielle IBA en 2020."},

 /* ===== CRÉATEURS & MODERN CLASSICS — LOT 2 ===== */
 {cat:"Créateurs & modern classics", q:"Le Chartreuse Swizzle a été créé par :", o:["Marcovaldo Dionysos, à San Francisco","Sam Ross","Jeffrey Morgenthaler","Phil Ward"], r:0, e:"Vers 2003. Chartreuse verte, falernum, ananas, citron vert, sur glace pilée au bâton lélé. L'un des premiers modern classics à faire d'une liqueur de plantes la base du verre."},
 {cat:"Créateurs & modern classics", q:"Le Siesta, twist de Hemingway Daiquiri à la tequila, est de :", o:["Katie Stipe","Audrey Saunders","Julie Reiner","Ivy Mix"], r:0, e:"Au Flatiron Lounge de New York, vers 2006. Tequila, Campari, pamplemousse, citron vert. Un pont direct entre l'agave et l'amer italien."},
 {cat:"Créateurs & modern classics", q:"Jeffrey Morgenthaler est surtout connu pour :", o:["Sa réhabilitation de l'Amaretto Sour","Le Penicillin","Le Paper Plane","Le Bramble"], r:0, e:"Barman de Portland, Oregon. Sa version ajoute du bourbon overproof et un blanc d'œuf à un drink jusque-là méprisé. Il a aussi théorisé les cocktails en bouteille et la carbonatation."},
 {cat:"Créateurs & modern classics", q:"Le Benton's Old Fashioned, emblème du fat-washing, est de :", o:["Don Lee, au PDT","Eben Freeman","Tony Conigliaro","Dave Arnold"], r:0, e:"New York, 2007 : bourbon lavé au gras de bacon Benton's, sirop d'érable, bitters. La technique du fat-washing est due à Eben Freeman ; Don Lee en signe l'application la plus célèbre."},
 {cat:"Créateurs & modern classics", q:"Dave Arnold est l'auteur de :", o:["« Liquid Intelligence »","« Imbibe! »","« The Craft of the Cocktail »","« Death & Co »"], r:0, e:"Il applique la physique et la chimie au bar : clarification à la centrifugeuse, carbonatation, contrôle de la dilution et de la température. Fondateur du Booker and Dax à New York."},
 {cat:"Créateurs & modern classics", q:"Tony Conigliaro est associé :", o:["Au bar-laboratoire londonien et au 69 Colebrooke Row","Au Death & Co","Au Pegu Club","Au Dead Rabbit"], r:0, e:"Il travaille la distillation, le vieillissement et les arômes de synthèse au bar. Son Drinks Factory a essaimé dans toute la scène londonienne."},
 {cat:"Créateurs & modern classics", q:"Le Dead Rabbit, à New York, est associé :", o:["À Sean Muldoon et Jack McGarry","À Sasha Petraske","À Julie Reiner","À Dale DeGroff"], r:0, e:"Ouvert en 2013, il remet au goût du jour le punch et le style irlando-américain du XIXe, avec un menu illustré en bande dessinée."},
 {cat:"Créateurs & modern classics", q:"Julie Reiner a fondé :", o:["Le Flatiron Lounge et le Clover Club","Le Milk & Honey","Le PDT","Le Employees Only"], r:0, e:"Figure majeure de la scène new-yorkaise, elle a formé une génération de barmen — c'est au Clover Club que Giuseppe González crée le Trinidad Sour."},
 {cat:"Créateurs & modern classics", q:"Le PDT de New York signifie :", o:["Please Don't Tell","Public Drinking Tavern","Post Dinner Tipple","Pour Drink Talk"], r:0, e:"Néo-speakeasy ouvert en 2007, accessible par une cabine téléphonique dans un fast-food à hot-dogs. Don Lee y crée le Benton's Old Fashioned."},
 {cat:"Créateurs & modern classics", q:"Kazuo Uyeda est connu pour :", o:["Le hard shake japonais","Le throwing","Le swizzle","La clarification au lait"], r:0, e:"Barman de Ginza, il a codifié un geste de shake très précis censé aérer sans sur-diluer. Son efficacité réelle est débattue, mais son influence sur la discipline japonaise est incontestable."},
 {cat:"Créateurs & modern classics", q:"Hidetsugu Ueno est associé :", o:["Au Bar High Five de Ginza et à la taille de la glace","Au Le Lion de Hambourg","Au Connaught","Au Artesian"], r:0, e:"Sa taille du diamant à la pique à glace est devenue un emblème de l'école japonaise, où le geste et le produit priment sur la créativité affichée."},
 {cat:"Créateurs & modern classics", q:"Le Connaught Bar de Londres est dirigé par :", o:["Ago Perrone","Salvatore Calabrese","Peter Dorelli","Alex Kratena"], r:0, e:"Son Martini servi au chariot, avec une sélection de bitters maison, est devenu un rituel de référence. Le bar a plusieurs fois été classé premier mondial."},
 {cat:"Créateurs & modern classics", q:"Le Paradiso de Barcelone, classé meilleur bar du monde, est dirigé par :", o:["Giacomo Giannotti","Simone Caporale","Ago Perrone","Marian Beke"], r:0, e:"Bar caché derrière une devanture de pastrami. Il incarne la vague de la mixologie « expérientielle » : scénographie, récit et technique de laboratoire."},
 {cat:"Créateurs & modern classics", q:"Le Gin-Gin Mule est une création :", o:["D'Audrey Saunders","De Dick Bradsell","De Sam Ross","De Dale DeGroff"], r:0, e:"Elle croise le Mojito et le Moscow Mule sur une base de gin : menthe, citron vert, sirop de gingembre, ginger beer. Créé avant l'ouverture du Pegu Club, qu'elle fonde en 2005."},
 {cat:"Créateurs & modern classics", q:"Le Division Bell, twist du Last Word, est de :", o:["Phil Ward","Joaquín Simó","Sam Ross","Giuseppe González"], r:0, e:"Mezcal, Aperol, marasquin, citron vert — comme le Naked and Famous, il démontre que la structure à parts égales du Last Word accepte presque toutes les bases."},
 {cat:"Créateurs & modern classics", q:"Le Death & Co, à New York, a ouvert en :", o:["2006","2010","2013","2001"], r:0, e:"Dans l'East Village. Phil Ward y crée l'Oaxaca Old-Fashioned, Joaquín Simó le Naked and Famous. Son livre de 2014 est devenu une référence de méthode."},
 {cat:"Créateurs & modern classics", q:"Le terme « craft cocktail » désigne :", o:["Le mouvement de retour aux jus frais et aux recettes historiques","Les cocktails de moins de trois ingrédients","Les cocktails à base de bière artisanale","Les cocktails servis sans glace"], r:0, e:"Né aux États-Unis dans les années 1990-2000 autour de DeGroff, Petraske et Saunders, en réaction aux sirops industriels et aux mélanges tout prêts des années 70-80."},
 {cat:"Créateurs & modern classics", q:"Simone Caporale et Alex Kratena ont marqué :", o:["L'Artesian du Langham à Londres","Le Savoy","Le Connaught","Le Dandelyan"], r:0, e:"Quatre années consécutives en tête du classement mondial. Ils ont poussé la présentation et la scénographie du service à un niveau spectaculaire."},
 {cat:"Créateurs & modern classics", q:"Ryan Chetiyawardana, dit Mr Lyan, est connu pour :", o:["Ses bars sans déchets et sans frigo","Le hard shake","Le Trinidad Sour","Le Dead Rabbit"], r:0, e:"White Lyan à Londres, en 2013 : ni glace, ni agrumes frais, ni marques visibles. Une provocation devenue influente sur la question de la durabilité au bar."},
 {cat:"Créateurs & modern classics", q:"L'Espresso Martini connaît sa seconde vie :", o:["Dans les années 2010-2020","Dans les années 1990","Jamais, il n'a pas disparu","Après 2023"], r:0, e:"Devenu l'un des cocktails les plus commandés au monde, quarante ans après sa création par Bradsell. Sa renaissance tient beaucoup aux liqueurs de café de nouvelle génération."},

 /* ===== RÉGLEMENTATION & PRODUCTION — LOT 2 ===== */
 {cat:"Réglementation & production", q:"La cachaça se distingue légalement du rhum par :", o:["Son origine brésilienne et un degré de 38 à 48 %","Sa matière première","Son vieillissement obligatoire","Sa distillation continue"], r:0, e:"Pur jus de canne, comme le rhum agricole, mais avec une catégorie nationale propre, reconnue par les États-Unis en 2013."},
 {cat:"Réglementation & production", q:"Le mezcal peut être produit à partir :", o:["De nombreuses variétés d'agave","Uniquement d'agave bleu Weber","Uniquement d'espadín","D'agave et de canne"], r:0, e:"Espadín, tobalá, tepeztate, madrecuishe… La tequila, elle, impose l'agave bleu Weber. L'appellation mezcal couvre plusieurs États mexicains, Oaxaca en tête."},
 {cat:"Réglementation & production", q:"La tequila est produite principalement dans l'État :", o:["De Jalisco","D'Oaxaca","De Guerrero","Du Michoacán"], r:0, e:"Plus quelques communes de quatre autres États. Deux grandes zones : Los Altos, aux sols rouges et agaves plus fruités, et la vallée de Tequila, plus terreuse."},
 {cat:"Réglementation & production", q:"Le numéro NOM sur une bouteille de tequila indique :", o:["La distillerie de production","Le degré alcoolique","L'année de récolte","Le nombre d'agaves"], r:0, e:"Norma Oficial Mexicana. Plusieurs marques peuvent partager un même NOM, donc une même distillerie — une information précieuse pour savoir qui produit réellement quoi."},
 {cat:"Réglementation & production", q:"Le pisco péruvien interdit :", o:["L'ajout d'eau après distillation et le passage sous bois","Les cépages aromatiques","La double distillation uniquement","Le repos en cuve"], r:0, e:"Distillation unique, directement au degré de mise en bouteille, repos minimum de trois mois en contenant inerte. Le pisco chilien, lui, autorise la réduction à l'eau."},
 {cat:"Réglementation & production", q:"Le champagne impose une seconde fermentation :", o:["En bouteille","En cuve close","En fût","En amphore"], r:0, e:"C'est la méthode traditionnelle. La méthode Charmat, en cuve close, donne le prosecco. Une différence qui explique la finesse des bulles et le prix."},
 {cat:"Réglementation & production", q:"Le calvados Pays d'Auge impose :", o:["La double distillation en alambic à repasse","La distillation continue","Le vieillissement en inox","L'usage exclusif de poires"], r:0, e:"L'AOC générique Calvados autorise la colonne. Le Domfrontais, lui, impose au moins 30 % de poires."},
 {cat:"Réglementation & production", q:"Le genièvre belge et néerlandais (jenever) se distingue du gin par :", o:["Sa base de moutwijn, un distillat de céréales aromatique","Son degré plus élevé","L'absence de genièvre","Son vieillissement obligatoire"], r:0, e:"Le gin part d'un alcool neutre ; le jenever conserve un vin de grain maltée. C'est l'ancêtre du gin, ramené en Angleterre au XVIIe siècle."},
 {cat:"Réglementation & production", q:"L'Old Tom gin se caractérise par :", o:["Une légère édulcoration","Un vieillissement en fût","Une double dose de genièvre","Une base de mélasse"], r:0, e:"Style intermédiaire entre le jenever et le London Dry. Indispensable pour reconstituer les recettes du XIXe — le Martinez de Jerry Thomas en réclame explicitement."},
 {cat:"Réglementation & production", q:"Le sloe gin est légalement :", o:["Une liqueur","Un gin aromatisé","Une eau-de-vie de fruit","Un vin aromatisé"], r:0, e:"Macération de prunelles dans du gin avec du sucre. Le règlement européen lui impose un minimum de 25 % vol — une exception par rapport aux 15 % des liqueurs ordinaires."},
 {cat:"Réglementation & production", q:"Le triple sec et le curaçao se distinguent :", o:["Surtout par l'usage commercial, pas par une frontière légale nette","Par le degré","Par la couleur obligatoire","Par le pays d'origine"], r:0, e:"Tous deux sont des liqueurs d'écorces d'orange. Le curaçao renvoie à l'orange laraha de l'île du même nom ; « triple sec » désigne un style sec et limpide, sans définition juridique stricte."},
 {cat:"Réglementation & production", q:"Le marasquin est une eau-de-vie de :", o:["Cerises marasques, distillées avec leurs noyaux","Cerises noires","Prunelles","Griottes macérées"], r:0, e:"Originaire de Zadar, en Dalmatie. Les noyaux apportent l'amertume d'amande caractéristique. La bouteille gainée de paille de Luxardo est un repère visuel du bar classique."},
 {cat:"Réglementation & production", q:"Le falernum est originaire :", o:["De la Barbade","De la Jamaïque","De Cuba","De Trinidad"], r:0, e:"Sirop ou liqueur au citron vert, gingembre, clou de girofle et amande. Indispensable au tiki et au Chartreuse Swizzle. Existe en version alcoolisée et non alcoolisée."},
 {cat:"Réglementation & production", q:"La thuyone, longtemps accusée dans l'absinthe, est aujourd'hui :", o:["Limitée par la réglementation, et innocentée des effets qu'on lui prêtait","Totalement interdite","Sans aucune limite","Obligatoire"], r:0, e:"Les analyses d'absinthes d'époque ont montré des taux très inférieurs à ce qu'on croyait. Les effets attribués relevaient surtout du degré élevé et des adultérations."},
 {cat:"Réglementation & production", q:"La fermentation malolactique concerne :", o:["Le vin, pas les spiritueux","Le whisky","Le rhum","La tequila"], r:0, e:"Elle transforme l'acide malique en acide lactique, adoucissant le vin. Utile à connaître pour parler des vins de base du vermouth et du cognac."},
 {cat:"Réglementation & production", q:"Les esters, responsables du « funk » jamaïcain, naissent :", o:["De la fermentation, notamment longue et avec dunder","De la distillation seule","Du vieillissement","De l'ajout d'arômes"], r:0, e:"Le dunder, résidu de distillation réintroduit dans la cuve, pousse la fermentation. Hampden et Worthy Park en ont fait leur signature ; la mesure se fait en g/hlAP."},
 {cat:"Réglementation & production", q:"Le « angel's share » est plus élevé :", o:["En climat tropical","En climat froid","En cave enterrée","En fût neuf uniquement"], r:0, e:"Jusqu'à 6-8 % par an aux Caraïbes contre 2 % environ en Écosse. C'est ce qui rend un rhum de huit ans tropical comparable à un whisky bien plus vieux."},
 {cat:"Réglementation & production", q:"La filtration à froid d'un spiritueux vise :", o:["À éviter le trouble à basse température","À augmenter le degré","À accélérer le vieillissement","À retirer la couleur"], r:0, e:"Elle retire des acides gras et esters qui précipitent au froid — au prix d'une perte de texture. D'où les mentions « non chill-filtered » revendiquées par certains producteurs."},
 {cat:"Réglementation & production", q:"Le caramel E150a est autorisé :", o:["Dans le Scotch, pour ajuster la couleur","Dans aucun spiritueux","Uniquement dans les liqueurs","Uniquement dans le rhum"], r:0, e:"Les Scotch Whisky Regulations l'autorisent explicitement. Le bourbon, lui, n'admet aucun additif hormis l'eau — une différence de philosophie entre les deux traditions."},
 {cat:"Réglementation & production", q:"La mention « single cask » signifie :", o:["Embouteillé depuis un seul fût","Produit par une seule distillerie","Vieilli une seule fois","Issu d'une seule récolte"], r:0, e:"À ne pas confondre avec « single malt », où « single » désigne la distillerie. Un single cask est souvent embouteillé brut de fût, en série limitée numérotée."},
 {cat:"Réglementation & production", q:"Le « brut de fût » (cask strength) signifie :", o:["Embouteillé sans réduction à l'eau","Embouteillé à 40 %","Vieilli en fût neuf","Non filtré"], r:0, e:"Le degré varie selon l'évaporation et la durée : souvent entre 50 et 60 %. Isautier Double Agent Fusion, à 55 %, donne une idée de ce registre."},
 {cat:"Réglementation & production", q:"Le vin muté à l'alcool, base des mistelles, se nomme :", o:["Mistelle ou vin de liqueur","Vin cuit","Vin doux naturel uniquement","Vermouth"], r:0, e:"Le moût est muté avant fermentation complète, gardant son sucre. Pineau des Charentes, Floc de Gascogne, Macvin du Jura — et la mistelle de muscat qui entre dans le Noilly Prat."},

 /* ===== RÉFÉRENTIEL CULTURE BAR — 600 questions sourcées ===== */
 {cat:"Histoire du bar", q:"En quelle année paraît la première définition écrite du mot « cocktail » ?", o:["1762","1806","1862","1920"], r:1, e:"1806, dans le journal The Balance and Columbian Repository, État de New York. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Que contient la définition originelle du cocktail de 1806 ?", o:["Alcool, sucre, eau, bitters","Gin et vermouth","Rhum, citron, sucre","Vin et eau-de-vie"], r:0, e:"Alcool, sucre, eau et bitters : c'est exactement la structure de l'Old Fashioned. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Qui publie en 1862 le premier livre de recettes de cocktails ?", o:["Harry Craddock","Dale DeGroff","Jerry Thomas","Harry MacElhone"], r:2, e:"Jerry Thomas, « The Professor », avec How to Mix Drinks. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quel surnom porte Jerry Thomas ?", o:["The King","The Professor","The Beachcomber","The Doctor"], r:1, e:"« The Professor », père de la mixologie américaine. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Sur quelle période s'étend la Prohibition aux États-Unis ?", o:["1900-1913","1914-1918","1920-1933","1933-1945"], r:2, e:"De 1920 (Volstead Act) à 1933, abrogée par le 21e amendement. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Comment appelle-t-on les bars clandestins de la Prohibition ?", o:["Speakeasies","Saloons","Taverns","Cabarets"], r:0, e:"Les speakeasies, où l'on commandait à voix basse. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Dans quel hôtel londonien officiait Harry Craddock, auteur du Savoy Cocktail Book (1930) ?", o:["Le Ritz","Le Savoy","Le Claridge's","Le Connaught"], r:1, e:"Au Savoy de Londres, dont il a rédigé la bible de 1930. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quelle ville devient une grande capitale du cocktail pendant la Prohibition grâce à l'exode des barmen ?", o:["Mexico","La Havane","Montréal","Lisbonne"], r:1, e:"La Havane, à Cuba, toute proche de la Floride. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quel bar parisien est lié au Bloody Mary et au French 75 ?", o:["Le Bar Hemingway","Harry's New York Bar","Le Forvm","La Closerie"], r:1, e:"Le Harry's New York Bar d'Harry MacElhone, rue Daunou. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"À qui attribue-t-on, de façon disputée, la création du Mai Tai en 1944 ?", o:["Donn Beach","Trader Vic","Dale DeGroff","Sasha Petraske"], r:1, e:"Trader Vic (Victor Bergeron), mais Donn Beach l'a aussi revendiqué. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quel est l'esprit de base de la quasi-totalité des cocktails tiki ?", o:["Le gin","La tequila","Le rhum","Le whisky"], r:2, e:"Le rhum, accompagné de sirops exotiques et d'orgeat. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {cat:"Réglementation & production", q:"Pourquoi l'IPA était-elle si fortement houblonnée ?", o:["Pour le goût des soldats","Le houblon conservait la bière en mer","Le houblon était bon marché","Une mode londonienne"], r:1, e:"Le houblon, antiseptique naturel, protégeait la bière pendant les mois de traversée. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},

 {cat:"Réglementation & production", q:"Dans quelle ville la pilsner est-elle née en 1842 ?", o:["Munich","Plzeň","Vienne","Prague"], r:1, e:"À Plzeň (Pilsen), en Bohême, d'où son nom. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Quel brasseur a créé la première pilsner ?", o:["Josef Groll","Anton Dreher","Arthur Guinness","Christian Moerlein"], r:0, e:"Josef Groll, brasseur bavarois appelé à Plzeň. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"En quelle année Arthur Guinness s'installe-t-il à St James's Gate à Dublin ?", o:["1759","1799","1842","1886"], r:0, e:"1759, avec un bail fameux de 9 000 ans. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"De quel style londonien du 18e siècle descend le stout ?", o:["Le porter","La pale ale","La lambic","La bitter"], r:0, e:"Du porter, bière brune des porteurs des marchés de Londres. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Les ales relèvent de quel type de fermentation ?", o:["Fermentation haute","Fermentation basse","Fermentation spontanée","Fermentation mixte"], r:0, e:"Fermentation haute (températures plus chaudes). Les lagers : fermentation basse. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Quel terme désigne les bières de fermentation basse ?", o:["Ales","Lagers","Lambics","Stouts"], r:1, e:"Les lagers, fermentées à froid puis stockées (« lagern » : entreposer). <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Dans quelle ville Jacob Schweppe a-t-il fondé Schweppes en 1783 ?", o:["Londres","Genève","Zurich","Paris"], r:1, e:"À Genève — piège classique, l'usine de Londres ne date que de 1792. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},
 {cat:"Réglementation & production", q:"Quel était le métier d'origine de Jacob Schweppe ?", o:["Pharmacien","Horloger-joaillier","Brasseur","Médecin"], r:1, e:"Horloger et joaillier, installé à Genève en 1766. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},
 {cat:"Réglementation & production", q:"Sur les travaux de quel chimiste Schweppe s'est-il appuyé pour gazéifier l'eau ?", o:["Joseph Priestley","Antoine Lavoisier","Louis Pasteur","Humphry Davy"], r:0, e:"Joseph Priestley, pionnier de la dissolution du CO2 dans l'eau. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},
 {cat:"Réglementation & production", q:"Vers quelle décennie la quinine entre-t-elle dans l'Indian Tonic de Schweppes ?", o:["1790","1830","1870","1920"], r:2, e:"Vers 1870, donnant naissance à l'Indian Tonic Water. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},
 {cat:"Réglementation & production", q:"Qui a créé le Coca-Cola en 1886 ?", o:["John Pemberton","Asa Candler","Caleb Bradham","Charles Hires"], r:0, e:"John Pemberton, pharmacien d'Atlanta, qui le vendait comme tonique. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},
 {cat:"Réglementation & production", q:"Dans quelle ville le Coca-Cola a-t-il été inventé ?", o:["New York","Atlanta","La Nouvelle-Orléans","Chicago"], r:1, e:"Atlanta, Géorgie, à la pharmacie Jacobs. <span class='src'>Source : Difford’s Guide ; archives des marques</span>"},

 {cat:"Histoire du bar", q:"Dans quel établissement le Hurricane a-t-il été créé ?", o:["Pat O'Brien's","Le Carousel Bar","Antoine's","Commander's Palace"], r:0, e:"Chez Pat O'Brien's, dans le French Quarter de La Nouvelle-Orléans, années 1940. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {cat:"Histoire du bar", q:"À quoi le verre « hurricane » doit-il sa forme ?", o:["À une lampe-tempête","À un coquillage","À une vague","À un cyclone stylisé"], r:0, e:"À la lampe-ouragan (hurricane lamp), au verre galbé. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Techniques & matériel", q:"Quel cocktail du 19e siècle a fait exploser la demande de paille et de glace pilée ?", o:["Le Sherry Cobbler","Le Sazerac","Le Manhattan","Le Flip"], r:0, e:"Le Sherry Cobbler, immense succès servi sur glace pilée avec paille. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Réglementation & production", q:"Que signifie le mot allemand « lagern », racine de « lager » ?", o:["Entreposer","Refroidir","Brasser","Filtrer"], r:0, e:"« Entreposer » : ces bières étaient stockées en cave froide. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Histoire du bar", q:"Dans quelle ville le Moscow Mule a-t-il été inventé ?", o:["Moscou","Los Angeles","New York","Londres"], r:1, e:"À Los Angeles (pub Cock'n'Bull), vers 1941, pour vendre la vodka Smirnoff. Rien de russe sinon la vodka. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Dans quelle ville le Black Russian a-t-il été créé en 1949 ?", o:["Moscou","Bruxelles","Paris","New York"], r:1, e:"À l'Hôtel Métropole de Bruxelles, par le barman belge Gustave Tops. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {cat:"Histoire du bar", q:"Malgré son nom tahitien, où le Mai Tai a-t-il été créé ?", o:["À Tahiti","À Oakland, Californie","À Honolulu","À Cuba"], r:1, e:"Chez Trader Vic's à Oakland (1944). « Maita'i » signifie « excellent » en tahitien. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Où le Zombie a-t-il été inventé ?", o:["En Haïti","À Hollywood","À La Havane","En Jamaïque"], r:1, e:"À Hollywood, chez Don the Beachcomber, dans les années 1930. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Que contient le Japanese Cocktail de Jerry Thomas ?", o:["Du saké","Aucun ingrédient japonais","Du thé matcha","Du yuzu"], r:1, e:"Cognac, orgeat, bitters : aucun ingrédient japonais. Nommé en hommage à une délégation japonaise à New York. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"D'où vient le nom du « grog » de la marine britannique ?", o:["Du surnom de l'amiral Vernon","D'un mot créole","D'une île","D'un tonneau"], r:0, e:"De l'amiral « Old Grog » Vernon, surnommé d'après son manteau de grogram, qui fit couper le rhum à l'eau en 1740. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"La coupe à champagne a-t-elle été moulée sur le sein de Marie-Antoinette ?", o:["Oui, c'est documenté","Non, c'est une légende","Oui, sur ordre de Louis XVI","Partiellement"], r:1, e:"Légende : la coupe existait en Angleterre dès les années 1660, un siècle avant elle. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Dans quel pays le Bloody Caesar (clamato) a-t-il été créé en 1969 ?", o:["Les États-Unis","Le Canada","L'Italie","Le Mexique"], r:1, e:"Au Canada : Walter Chell, à Calgary. C'est le cocktail national canadien. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Où sont produits les Angostura bitters ?", o:["Au Venezuela","À Trinidad","En Angleterre","À Cuba"], r:1, e:"À Trinidad. Le nom vient de la ville vénézuélienne d'Angostura, et ils ne contiennent pas d'écorce d'angostura. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"De quel pays vient le mot « spritz » ?", o:["D'Italie","D'Autriche","De Suisse","D'Allemagne"], r:1, e:"De l'autrichien « spritzen » (asperger) : les soldats autrichiens coupaient d'eau gazeuse les vins de Vénétie. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quelle particularité juridique a le Dark 'n' Stormy ?", o:["C'est une marque déposée par Gosling's","Il est interdit aux USA","Il est protégé par l'IBA","Aucune"], r:0, e:"Gosling's (Bermudes) a déposé le nom : un Dark 'n' Stormy « officiel » exige leur rhum Black Seal. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quel autre cocktail tiki est une marque déposée, liée au rhum Pusser's ?", o:["Le Painkiller","Le Mai Tai","Le Zombie","Le Jungle Bird"], r:0, e:"Le Painkiller, déposé par Pusser's, né au Soggy Dollar Bar (Îles Vierges britanniques). <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"D'où le Sidecar tirerait-il son nom ?", o:["D'un side-car de moto","D'un bar de Marseille","D'un wagon de train","D'un cheval"], r:0, e:"D'un client arrivant en side-car de moto, selon la légende parisienne des années 1920. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Réglementation & production", q:"Selon le règlement européen des vins aromatisés, un vermouth « dry » contient moins de :", o:["30 g/L de sucre","50 g/L de sucre","90 g/L de sucre","130 g/L de sucre"], r:1, e:"Moins de 50 g/L. « Extra-dry » : moins de 30 g/L. <span class='src'>Source : Règlement UE 2019/787 (seuils de sucre)</span>"},

 {cat:"Réglementation & production", q:"À partir de quel taux de sucre un vermouth est-il dit « doux » (sweet) ?", o:["50 g/L","90 g/L","130 g/L","250 g/L"], r:2, e:"Plus de 130 g/L : c'est le profil des vermouths rouges classiques. <span class='src'>Source : Règlement UE 2019/787 (seuils de sucre)</span>"},
 {cat:"Réglementation & production", q:"Un champagne « brut » contient au maximum :", o:["3 g/L","6 g/L","12 g/L","17 g/L"], r:2, e:"Moins de 12 g/L de sucre après dosage. <span class='src'>Source : Comité Champagne ; Règlement UE vins aromatisés</span>"},
 {cat:"Réglementation & production", q:"Que signifie « brut nature » (ou « non dosé ») pour un champagne ?", o:["0 à 3 g/L, sans sucre ajouté","Moins de 12 g/L","6 à 12 g/L","Sans bulles"], r:0, e:"Aucune liqueur d'expédition ajoutée, 0 à 3 g/L de sucre résiduel. <span class='src'>Source : Comité Champagne ; Règlement UE vins aromatisés</span>"},
 {cat:"Réglementation & production", q:"Quelle fourchette de sucre définit un champagne « demi-sec » ?", o:["12-17 g/L","17-32 g/L","32-50 g/L","50+ g/L"], r:2, e:"32 à 50 g/L : le compagnon classique des desserts. <span class='src'>Source : Comité Champagne ; Règlement UE vins aromatisés</span>"},
 {cat:"Réglementation & production", q:"Piège : un champagne « extra-dry » est-il plus ou moins sucré qu'un « brut » ?", o:["Plus sucré","Moins sucré","Identique","Sans sucre"], r:0, e:"Plus sucré : extra-dry = 12 à 17 g/L, au-dessus du brut (moins de 12). <span class='src'>Source : Comité Champagne ; Règlement UE vins aromatisés</span>"},
 {cat:"Réglementation & production", q:"Au-delà de quel taux un champagne est-il dit « doux » ?", o:["32 g/L","50 g/L","100 g/L","130 g/L"], r:1, e:"Plus de 50 g/L, la catégorie la plus sucrée de l'échelle des dosages. <span class='src'>Source : Comité Champagne ; Règlement UE vins aromatisés</span>"},

 {cat:"Réglementation & production", q:"La liqueur aux œufs type advocaat doit contenir au minimum :", o:["150 g/L de sucre et 140 g/L de jaune d'œuf","100 g/L de sucre","250 g/L de sucre","70 g/L de jaune d'œuf seulement"], r:0, e:"150 g/L de sucre et 140 g/L de jaune d'œuf pur (règlement UE). <span class='src'>Source : Règlement UE 2019/787 (seuils de sucre)</span>"},

 {cat:"Réglementation & production", q:"Un London Dry gin tolère un édulcorant ajouté d'au maximum :", o:["0,1 g/L","1 g/L","10 g/L","100 g/L"], r:0, e:"0,1 g/L de produit édulcorant : autant dire rien. <span class='src'>Source : Règlement UE 2019/787 (seuils de sucre)</span>"},

 {cat:"Réglementation & production", q:"Quelle est la durée de validité du permis d'exploitation ?", o:["5 ans","10 ans","15 ans","À vie"], r:1, e:"10 ans, renouvelable par une formation de mise à jour. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Quelle est la durée de la formation de mise à jour pour renouveler le permis d'exploitation ?", o:["3 heures","6 heures","10 heures","20 heures"], r:1, e:"6 heures, à l'issue des 10 ans. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Depuis la loi du 21 juillet 2009, la vente d'alcool est interdite aux moins de :", o:["16 ans","17 ans","18 ans","21 ans"], r:2, e:"18 ans, pour toutes les boissons alcooliques (avant : 16 ans pour certaines). <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Quelle loi de 1991 encadre la publicité pour l'alcool en France ?", o:["La loi Évin","La loi Bachelot","La loi Veil","La loi Royer"], r:0, e:"La loi Évin, du nom du ministre Claude Évin. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Combien de boissons sans alcool un débit doit-il au minimum mettre en évidence (étalage) ?", o:["5","10","15","20"], r:1, e:"Au moins 10 boissons sans alcool de catégories différentes. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Servir une personne manifestement ivre est :", o:["Toléré en boîte de nuit","Interdit par la loi","Autorisé avant minuit","Une simple faute pro"], r:1, e:"Interdit : c'est la répression de l'ivresse publique et manifeste. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Quels groupes la « petite licence à emporter » couvre-t-elle ?", o:["Le groupe 3","Tous les groupes","Les groupes 4 et 5","Le groupe 1"], r:0, e:"Le groupe 3 uniquement. La « licence à emporter » couvre tous les groupes. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"La « petite licence restaurant » permet de servir les groupes 1 et 3 :", o:["À toute heure","Seulement pendant les repas","Seulement en terrasse","Sans condition"], r:1, e:"Uniquement à l'occasion des principaux repas, comme accessoire de la nourriture. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Au bout de combien d'années une licence III ou IV non exploitée devient-elle caduque ?", o:["2 ans","5 ans","10 ans","Jamais"], r:1, e:"5 ans sans exploitation, sauf exceptions prévues par le code de la santé publique. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Où déclare-t-on l'ouverture ou la mutation d'un débit de boissons ?", o:["En mairie (préfecture de police à Paris)","Au tribunal de commerce","À la DGCCRF","À la chambre des métiers"], r:0, e:"En mairie, 15 jours à l'avance (préfecture de police pour Paris). <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Pendant une happy hour, la loi impose de :", o:["Réduire aussi le prix de boissons sans alcool","Limiter à une heure","Fermer à 22h","Servir à table uniquement"], r:0, e:"Proposer également des boissons non alcooliques à prix réduit (loi de 2009). <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"Les « open bars » (alcool illimité contre forfait) sont :", o:["Autorisés","Interdits sauf exceptions","Réservés aux hôtels","Soumis à licence V"], r:1, e:"Interdits par la loi de 2009, sauf exceptions (dégustations, fêtes privées encadrées). <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"La vente d'alcool à emporter entre 22h et 8h (hors débits sur place) exige :", o:["Une formation spécifique","Une licence IV","Rien de particulier","Un agrément préfectoral annuel"], r:0, e:"Une formation spécifique à la vente nocturne, prévue par le code de la santé publique. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
