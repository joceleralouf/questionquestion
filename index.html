xford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 3}, {"id": "389cd334ec", "t": "h2", "q": "De quel bar parisien le Pick Me Up est-il un classique ?", "o": ["Le Bar Hemingway", "Le Harry's New York Bar", "Le Forvm", "Le Little Red Door"], "r": 1, "e": "Le Harry's New York Bar, comme le Blue Lagoon et tant d'autres.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "f2110d52a7", "t": "c5", "q": "Dans quelle ville se trouve le musée des Meilleurs Ouvriers de France ?", "o": ["Paris", "Lyon", "Bourges", "Tours"], "r": 2, "e": "À Bourges, dans l'ancien palais archiépiscopal.", "s": "Comité d’organisation d’un concours MOF", "lv": 2}, {"id": "fc34f3b6f2", "t": "c3", "q": "Selon la doctrine classique, de combien d'ingrédients se compose un classic cocktail ?", "o": ["2", "3", "4", "5"], "r": 1, "e": "Trois, base, modificateur, trait d'équilibre. Doctrine d'école, à nuancer au comptoir.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 3}, {"id": "d6832c4807", "t": "p7", "q": "Une eau minérale naturelle doit-elle avoir une composition stable en minéraux ?", "o": ["Oui, c'est une exigence légale", "Non, elle varie librement"], "r": 0, "e": "Oui : la stabilité de composition est précisément ce qui définit l'eau minérale naturelle face à l'eau de source. Piège : un corrigé répandu répond non.", "s": "Directive 2009/54/CE (eaux minérales naturelles)", "lv": 2}, {"id": "8bcc1cd976", "t": "c5", "q": "Le grade GFOP désigne-t-il le meilleur thé ?", "o": ["Oui", "Non"], "r": 1, "e": "Non : l'échelle monte jusqu'à SFTGFOP (Special Finest Tippy Golden Flowery Orange Pekoe).", "s": "Classification internationale du thé (orthodoxe)", "lv": 2}, {"id": "f50d4536a9", "t": "p8", "q": "En 2026, qui a terminé deuxième aux Wizard Awards de Gabriel Boudier ?", "o": ["Romain Cattenoz", "Etienne Henry", "Lucas Weisgerber", "Thibault Marchal"], "r": 1, "e": "Etienne Henry, deuxième des Wizard Awards Gabriel Boudier 2026.", "s": "Gabriel Boudier, Wizard Awards 2026", "lv": 2}, {"id": "bc0070cbc5", "t": "c5", "q": "Dans quel pays se situe Pinar del Río ?", "o": ["Le Brésil", "L'Espagne", "Cuba", "Le Portugal"], "r": 2, "e": "Cuba : la province du tabac, terroir de la Vuelta Abajo.", "s": "Habanos S.A.", "lv": 2}, {"id": "2b08161cbd", "t": "c5", "q": "Que mesure l'échelle de Scoville ?", "o": ["L'amertume du houblon", "La force piquante des piments", "L'acidité d'un agrume", "Le degré de torréfaction"], "r": 1, "e": "La pungence (capsaïcine) des piments, en unités Scoville.", "s": "Échelle de Scoville (W. Scoville, 1912)", "lv": 2}, {"id": "681853d0c7", "t": "p8", "q": "Que signifie le sigle D.O.M. sur la Bénédictine ?", "o": ["Deo Optimo Maximo", "Domus Omnium Monachorum", "Dominus Omnia Meum", "Deo Optimo Mundi"], "r": 0, "e": "« Deo Optimo Maximo » : à Dieu très bon, très grand, devise bénédictine.", "s": "Bénédictine, Palais Bénédictine (Fécamp)", "lv": 1}, {"id": "ed24ec476e", "t": "p8", "q": "À quoi correspond le « 54 » de l'Izarra 54 ?", "o": ["Son département de production", "Son nombre de plantes", "Son degré d'alcool", "Son année de création"], "r": 2, "e": "54 % vol : la liqueur basque verte dans sa version au degré d'origine.", "s": "Izarra (producteur, Bayonne)", "lv": 2}, {"id": "82e28e75ad", "t": "p8", "q": "Qui a remis aux Chartreux le manuscrit de l'élixir en 1605 ?", "o": ["Hannibal de Voiron", "François Hannibal d'Estrées", "Hannibal d'Isère", "Le duc de Lesdiguières"], "r": 1, "e": "Le maréchal François Hannibal d'Estrées, d'où la date fondatrice de 1605.", "s": "Chartreuse Diffusion (chartreuse.fr)", "lv": 2}, {"id": "5a02dafd68", "t": "p2", "q": "Quelles sont les trois AOC du pommeau ?", "o": ["Normandie, Bretagne, Maine", "Normandie, Anjou, Perche", "Bretagne, Vendée, Maine", "Normandie, Bretagne, Picardie"], "r": 0, "e": "Pommeau de Normandie, de Bretagne et du Maine, moût de pomme muté au calvados ou à l'eau-de-vie de cidre locale.", "s": "INAO", "lv": 2}, {"id": "69a9f93399", "t": "c5", "q": "En quelle année le permis d'exploitation a-t-il été créé ?", "o": ["2002", "2006", "2008", "2010"], "r": 1, "e": "Par la loi du 31 mars 2006, formation devenue obligatoire pour ouvrir ou reprendre un débit.", "s": "Code de la santé publique / Légifrance", "lv": 3}, {"id": "93d5c90724", "t": "p2", "q": "TAV maximal de distillation du cognac ?", "o": ["65 %", "72,4 %", "75 %", "94,8 %"], "r": 1, "e": "72,4 % au récipient journalier, sortie d'alambic charentais, pour préserver les volatils. Vente : 40 % minimum.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "34630e6b6c", "t": "p2", "q": "Entre quelles bornes se situe le TAV des eaux-de-vie d'Armagnac à la distillation ?", "o": ["40 et 65 %", "52 et 72,4 %", "65 et 75 %", "70 et 85 %"], "r": 1, "e": "52–72,4 % en colonne armagnacaise (65–72,4 % pour les bonnes chauffes à repasse). Le bas degré garde le gras du vin.", "s": "INAO / BNIAA, cahiers des charges Armagnac", "lv": 3}, {"id": "7ba2c7dd51", "t": "p4", "q": "TAV de sortie de colonne du rhum AOC Martinique ?", "o": ["40–55 %", "55–65 %", "65–75 %", "75–85 %"], "r": 2, "e": "65–75 % en sortie de colonne : assez bas pour conserver 225 g/hL d'éléments volatils. Embouteillage : 40 % minimum.", "s": "Règlement UE 2019/787 ; AOC Rhum agricole Martinique", "lv": 3}, {"id": "b120057fcf", "t": "p6", "q": "TAV acquis du pineau des Charentes à la mise en marché ?", "o": ["15–17 %", "16–22 %", "17–25 %", "18–20 %"], "r": 1, "e": "Entre 16 et 22 % vol, un vrai cas de minimum ET maximum réglementaires (décret de 2009).", "s": "INAO, AOC Pineau des Charentes", "lv": 3}, {"id": "fce29e88d6", "t": "p6", "q": "TAV du floc de Gascogne ?", "o": ["15–17 %", "16–18 %", "16–22 %", "17–20 %"], "r": 1, "e": "16–18 % vol : deux tiers de moût, un tiers d'armagnac. Fourchette plus serrée que le pineau (16–22).", "s": "INAO / BNIAA, cahiers des charges Armagnac", "lv": 3}, {"id": "3ddc77d9db", "t": "p6", "q": "TAV acquis d'un vin doux naturel ?", "o": ["12–15 %", "15–18 %", "16–22 %", "18–21 %"], "r": 1, "e": "15–18 % vol acquis après mutage à l'alcool neutre, Banyuls, Maury, Rivesaltes.", "s": "INAO, AOC VDN", "lv": 3}, {"id": "3bca2a29b9", "t": "p3", "q": "TAV maximal de distillation du whisky dans l'UE ?", "o": ["72,4 %", "85 %", "94,8 %", "96 %"], "r": 2, "e": "Moins de 94,8 % : au-dessus, le distillat perdrait l'arôme des matières premières. Vente : 40 % minimum.", "s": "Cahiers des charges AOC/IG ; Règlement UE 2019/787", "lv": 3}, {"id": "248932870f", "t": "p4", "q": "Entre quelles bornes une tequila doit-elle titrer ?", "o": ["35–55 %", "38–48 %", "36–50 %", "40–55 %"], "r": 0, "e": "35–55 % vol selon la norme mexicaine. Piège croisé : 38–48 %, c'est la cachaça.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "e573326f0c", "t": "p6", "q": "Entre quelles bornes le porto doit-il titrer ?", "o": ["15–18 %", "16–22 %", "19–22 %", "20–25 %"], "r": 2, "e": "19–22 % vol pour l'essentiel des portos, mutés à l'aguardente à 77 %.", "s": "IVDP, Instituto dos Vinhos do Douro e do Porto", "lv": 3}, {"id": "4e781082c7", "t": "p4", "q": "À la commercialisation, le rhum AOC Martinique titre :", "o": ["Entre 37,5 et 65 %", "Entre 40 et 75 %", "Minimum 50 %", "Maximum 62 %"], "r": 1, "e": "Entre 40 % (minimum légal) et 75 % (plafond du brut de colonne), les blancs 50°/55° vivent dans cette fourchette.", "s": "Règlement UE 2019/787 ; AOC Rhum agricole Martinique", "lv": 3}, {"id": "a0c16916aa", "t": "p2", "q": "Quelle est la date limite de distillation des vins destinés au Cognac ?", "o": ["31 décembre de l'année de récolte", "31 janvier suivant la récolte", "31 mars de l'année qui suit la récolte", "30 juin suivant la récolte"], "r": 2, "e": "31 mars de l'année qui suit la récolte, pour limiter l'érosion aromatique des vins non sulfités.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "36ac755223", "t": "p2", "q": "Au moment de la distillation, les vins de Cognac doivent titrer :", "o": ["Entre 5 et 9 %", "Entre 7 et 12 %", "Entre 9 et 14 %", "Entre 10 et 13 %"], "r": 1, "e": "TAV entre 7 et 12 % vol, des vins peu alcoolisés pour concentrer les arômes, et acides pour se conserver sans SO2.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "de75072b3f", "t": "p2", "q": "TAV minimal du Cognac à la mise en marché vers le consommateur ?", "o": ["37,5 %", "40 %", "41 %", "43 %"], "r": 1, "e": "40 % vol minimum, avec au moins 200 g de substances volatiles par hl d'alcool pur.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "bed6d0a94e", "t": "p2", "q": "Qu'est-ce que l'« Esprit de Cognac » ?", "o": ["Un distillat à 80-85 % pour les mousseux", "Un cognac hors d'âge de réserve", "Le cœur de la bonne chauffe", "Un cognac embouteillé brut de fût"], "r": 0, "e": "Distillation supplémentaire de la deuxième chauffe, 80–85 % vol, non vieillie, exclusivement pour l'élaboration des vins mousseux.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "8c55658e48", "t": "p2", "q": "Quel cru du Cognac est réputé pour son parfum de violette ?", "o": ["Grande Champagne", "Fins Bois", "Borderies", "Bons Bois"], "r": 2, "e": "Les Borderies : eaux-de-vie rondes, bouquetées et douces, marquées par la violette.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "48cf0e8086", "t": "p2", "q": "Quel est le cru le plus vaste du vignoble de Cognac ?", "o": ["Grande Champagne", "Petite Champagne", "Fins Bois", "Bois Ordinaires"], "r": 2, "e": "Les Fins Bois, eaux-de-vie rondes et souples au bouquet de raisin pressé, vieillissant assez vite.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "953399af20", "t": "p2", "q": "Quel géologue est à l'origine du classement des crus du Cognac vers 1860 ?", "o": ["Henri Coquand", "Louis Pasteur", "Jules Guyot", "Victor Rendu"], "r": 0, "e": "Henri Coquand, professeur de géologie, valide avec un dégustateur un classement selon les sols, base du décret de 1938.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "03bcc8aa4f", "t": "p2", "q": "Volume de charge maximal de l'alambic charentais en bonne chauffe ?", "o": ["12 hl", "25 hl", "30 hl", "120 hl"], "r": 1, "e": "25 hl de charge (chaudière de 30 hl max, tolérance 5 %). Les 120/140 hl ne valent que pour la première chauffe.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "bd6a966968", "t": "p2", "q": "Vieillissement minimal pour qu'une mention « XXO » figure sur un Cognac ?", "o": ["10 ans", "12 ans", "14 ans", "20 ans"], "r": 2, "e": "XXO / Extra Extra Old : 14 ans minimum. Mention rattachée au compte 10 mais avec exigence propre de 14 ans.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "c8112b9305", "t": "p2", "q": "L'effet des méthodes de finition (caramel, sucre, boisé) sur l'obscuration du Cognac est limité à :", "o": ["1 % vol", "2 % vol", "4 % vol", "8 % vol"], "r": 2, "e": "4 % vol maximum, différence entre TAV réel et TAV brut. Seuls caramel E150a, édulcoration et infusion de copeaux de chêne sont autorisés.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "a1f55c3862", "t": "p2", "q": "En quelle année le Cognac est-il reconnu en appellation d'origine contrôlée ?", "o": ["1909", "1936", "1938", "1946"], "r": 1, "e": "1936. La zone est délimitée dès 1909, les crus en 1938, et le BNIC naît en 1946.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 3}, {"id": "2c35fc129d", "t": "p2", "q": "Lequel n'est PAS un cépage principal du Cognac ?", "o": ["Colombard", "Folle blanche", "Montils", "Chardonnay"], "r": 3, "e": "Les cépages principaux : ugni blanc, colombard, folle blanche, montils et sémillon. Le chardonnay n'en fait pas partie.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "dc5a7eb275", "t": "p2", "q": "Pourquoi le SO2 est-il interdit pendant les fermentations des vins de Cognac ?", "o": ["Il bloque la fermentation", "Il génère un excès d'acétaldéhyde", "Il colore le vin", "Il attaque le cuivre de l'alambic"], "r": 1, "e": "Le sulfitage en fermentation provoque une formation accrue d'acétaldéhyde, caractère oxydé rédhibitoire à la distillation.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "0d82c3f8f0", "t": "p2", "q": "Quel champignon noircit les pierres autour des chais de Cognac ?", "o": ["Botrytis cinerea", "Torula compniacensis", "Aspergillus niger", "Penicillium roqueforti"], "r": 1, "e": "Torula compniacensis, nourri par la part des anges, l'évaporation annuelle équivaut à plusieurs millions de bouteilles.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "fc5141655c", "t": "p2", "q": "Quel autre nom officiel l'AOC Cognac peut-elle porter ?", "o": ["Eau-de-vie des Charentes", "Fine de Saintonge", "Brandy charentais", "Eau-de-vie d'Aunis"], "r": 0, "e": "« Cognac », « Eau-de-vie de Cognac » ou « Eau-de-vie des Charentes », trois noms pour la même AOC.", "s": "BNIC, cahier des charges AOC Cognac", "lv": 2}, {"id": "c177c68268", "t": "p2", "q": "Combien d'AOC de Calvados existe-t-il ?", "o": ["2", "3", "4", "5"], "r": 1, "e": "Trois : Calvados, Calvados Pays d'Auge et Calvados Domfrontais, anciennement scindées en partie en AOR.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "44ead07fc8", "t": "p2", "q": "Quel mode de distillation est obligatoire pour le Calvados Pays d'Auge ?", "o": ["Colonne continue", "Alambic à repasse", "Hydrodistillation", "Aucun mode imposé"], "r": 1, "e": "L'alambic à repasse (double distillation) est obligatoire en Pays d'Auge. L'AOC Calvados, elle, n'impose rien.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 2}, {"id": "7508b18a3d", "t": "p2", "q": "Comment est distillé le Calvados Domfrontais ?", "o": ["Une seule passe, en colonne", "Double distillation à repasse", "Au choix du producteur", "Triple distillation à repasse"], "r": 0, "e": "Simple distillation en jet continu à l'alambic à colonne, à l'opposé du Pays d'Auge.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 2}, {"id": "bf130053e8", "t": "p2", "q": "Vieillissement minimal du Calvados Domfrontais ?", "o": ["2 ans", "3 ans", "4 ans", "6 ans"], "r": 1, "e": "3 ans sous chêne, un an de plus que le Calvados et le Pays d'Auge (2 ans).", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "994341cf36", "t": "p2", "q": "Vieillissement minimal de l'AOC Calvados avant commercialisation ?", "o": ["1 an", "2 ans", "3 ans", "30 mois"], "r": 1, "e": "2 ans en fûts de chêne, comme le Pays d'Auge. Seul le Domfrontais exige 3 ans.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "c80233ad20", "t": "p2", "q": "Proportion maximale de poires à poiré dans les cidres à distiller du Pays d'Auge ?", "o": ["10 %", "20 %", "30 %", "50 %"], "r": 2, "e": "30 % maximum en Pays d'Auge, alors que le Domfrontais en impose au minimum 30 %. Piège miroir classique.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "4eb839ea4b", "t": "p2", "q": "Quelle surface couvre le verger dédié au Calvados ?", "o": ["3 000 ha", "8 000 ha", "15 000 ha", "25 000 ha"], "r": 1, "e": "Environ 8 000 hectares répartis sur les trois aires d'appellation.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "73e2a093de", "t": "p2", "q": "Combien de variétés de pommes à cidre sont sélectionnées pour le Calvados ?", "o": ["48", "139", "230", "312"], "r": 2, "e": "230 variétés de pommes à cidre et 139 variétés de poires à poiré, choisies pour leur richesse en polyphénols.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "a9138b633b", "t": "p2", "q": "Les vergers de Calvados comportent au moins 70 % de variétés dites :", "o": ["Phénoliques (amères, douces-amères)", "Acidulées (acides, aigres)", "Douces (sucrées, peu tanniques)", "Tardives (à maturité lente)"], "r": 0, "e": "Au moins 70 % de variétés phénoliques, pommes amères et douces-amères, riches en tanins.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 2}, {"id": "ca957eb893", "t": "p2", "q": "Part minimale des surfaces en haute tige dans le verger du Calvados Domfrontais ?", "o": ["35 %", "45 %", "60 %", "80 %"], "r": 3, "e": "80 % minimum en Domfrontais, contre 45 % en Pays d'Auge et 35 % pour l'AOC Calvados.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "a3393d0df4", "t": "p2", "q": "Dans le Domfrontais, les poiriers représentent au minimum quelle part de la surface des vergers ?", "o": ["10 %", "25 %", "40 %", "50 %"], "r": 1, "e": "25 % minimum de la surface totale des vergers de l'exploitation, la signature du Domfrontais.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "3b4304e69c", "t": "p2", "q": "Densité maximale d'un verger haute tige en AOC Calvados ?", "o": ["150 arbres/ha", "280 arbres/ha", "500 arbres/ha", "1 000 arbres/ha"], "r": 1, "e": "280 arbres/ha maximum, écartement minimal de 5 m entre arbres, rendement plafonné à 25 t/ha.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "b705b4ab3f", "t": "p2", "q": "Quelle hauteur peuvent atteindre les poiriers haute tige du Domfrontais ?", "o": ["5 m", "8 m", "15 m", "25 m"], "r": 2, "e": "Jusqu'à 15 m, des arbres de plein vent, parfois tricentenaires, uniques en France.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 3}, {"id": "598511f278", "t": "p2", "q": "Quels sols dominent l'aire du Calvados Pays d'Auge ?", "o": ["Argilo-calcaires, en coteaux", "Sableux, sur granite", "Schisteux, en terrasses", "Limoneux, très profonds"], "r": 0, "e": "Coteaux argilo-calcaires peu profonds, sur la partie orientale du département du Calvados et quelques communes de l'Orne et de l'Eure.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 2}, {"id": "2211a569d5", "t": "p2", "q": "Sur quels départements s'étend principalement le Calvados Domfrontais ?", "o": ["Calvados, Eure, Oise", "Manche, Orne, Mayenne", "Seine-Maritime, Eure", "Sarthe, Mayenne, Loire-Atlantique"], "r": 1, "e": "Sud du bocage normand : Manche, Orne et Mayenne principalement.", "s": "INAO / IDAC, cahier des charges AOC Calvados", "lv": 2}, {"id": "c4b34758c7", "t": "p3", "q": "Quelle distillerie signe la première distillation d'un Whisky de France dans sa version actuelle, en 1983 ?", "o": ["Distillerie Monce", "Warenghem", "Rozelieures", "Glann ar Mor"], "r": 1, "e": "Warenghem, dans les Côtes-d'Armor (Bretagne), en 1983. Le whisky français moderne est né là.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "02247a1dd3", "t": "p3", "q": "Quelle est l'aire géographique de l'IG Whisky de France ?", "o": ["La France métropolitaine, Corse incluse", "La France hexagonale sans la Corse", "France + DROM", "Bretagne et Alsace uniquement"], "r": 0, "e": "Toute la France métropolitaine, y compris la Corse, du broyage des grains à la mise sous bois. IG en cours d'instruction à l'INAO (non homologuée début 2026).", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "f4c7b5c189", "t": "p3", "q": "TAV maximal au collecteur journalier pour un Whisky de France en distillation discontinue ?", "o": ["72 %", "85 %", "88 %", "94,8 %"], "r": 2, "e": "88 % vol à 20 °C en discontinu. Le 94,8 % est le plafond UE générique du whisky, piège classique.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "79778b699c", "t": "p3", "q": "TAV maximal au collecteur pour un Whisky de France en distillation continue multi-étagée ?", "o": ["88 %", "90 %", "92 %", "94,8 %"], "r": 2, "e": "92 % vol en continu, contre 88 % en discontinu, deux plafonds distincts, tous deux sous le 94,8 % européen.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "6ba670671f", "t": "p3", "q": "Capacité maximale de la chaudière d'un alambic discontinu pour le Whisky de France ?", "o": ["25 hl", "30 hl", "120 hl", "250 hl"], "r": 2, "e": "120 hl en discontinu. Les 25/30 hl, c'est le Cognac, ne pas croiser les cahiers des charges.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "d7148e3560", "t": "p3", "q": "Capacité maximale d'un appareil de distillation continue pour le Whisky de France ?", "o": ["120 hl de moût par 24 h", "250 hl de moût par 24 h", "400 hl de moût par 24 h", "Aucune limite"], "r": 1, "e": "250 hl de moûts fermentés par période de 24 heures et par appareil.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "1f5f8b8de5", "t": "p3", "q": "L'ajout de sucre dans le moût avant distillation d'un Whisky de France est :", "o": ["Autorisé jusqu'à 10 g/L", "Autorisé en année déficitaire", "Interdit", "Autorisé sur dérogation"], "r": 2, "e": "Interdit, garantie de l'origine naturelle de l'eau-de-vie, comme l'interdiction des céréales transgéniques.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "05eaa80e49", "t": "p3", "q": "Quelles céréales sont explicitement interdites pour le Whisky de France ?", "o": ["Le maïs", "Les variétés transgéniques", "Le seigle", "Les céréales importées"], "r": 1, "e": "Les variétés transgéniques. Aucune céréale n'est imposée ni exclue par nature, seuls les OGM sont bannis.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "790a732dbd", "t": "p3", "q": "Pour la mention « Single Malt », un Whisky de France doit être distillé :", "o": ["En discontinu, orge maltée, une distillerie", "En colonne, orge maltée, une distillerie", "En discontinu, toutes céréales, deux fois", "En alambic charentais uniquement"], "r": 0, "e": "Moût d'orge maltée exclusivement, une seule distillerie, et distillation discontinue (simple ou multi-étagée), la colonne continue est exclue du Single Malt.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "7d936513c5", "t": "p3", "q": "Quel type de fût est interdit pour l'affinage (finishing) d'un Whisky de France ?", "o": ["Un fût ayant contenu une boisson aromatisée", "Un fût ayant contenu du sherry", "Un fût ayant contenu du cognac", "Un fût neuf en chêne français"], "r": 0, "e": "Les fûts de boissons alcoolisées aromatisées sont interdits. Sherry, cognac, porto : autorisés et revendicables en étiquette.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "30990897dd", "t": "p3", "q": "Le changement de fût en cours de vieillissement d'un Whisky de France :", "o": ["Autorisé si le fût fait moins de 700 L", "Interdit : il rompt le vieillissement", "Interdit sans aucune exception", "Autorisé une seule et unique fois"], "r": 0, "e": "Autorisé sans rompre le vieillissement, à condition que le nouveau fût fasse moins de 700 litres.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "4e9df45d34", "t": "p3", "q": "Comment un Whisky de France peut-il être expédié en vrac hors de l'aire géographique ?", "o": ["En barrique uniquement", "En récipients inertes uniquement", "Il ne peut pas quitter l'aire", "En cuve bois de plus de 700 L"], "r": 1, "e": "Récipients inertes obligatoires : le vieillissement sous bois hors de l'aire est interdit, donc pas de barrique au départ.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "9e0f146c03", "t": "p3", "q": "Quelles IG régionales de whisky préexistent à l'IG Whisky de France ?", "o": ["Whisky de Bretagne et Whisky d'Alsace", "Whisky de Lorraine et Whisky de Corse", "Whisky des Charentes", "Whisky de Normandie"], "r": 0, "e": "Whisky de Bretagne et Whisky d'Alsace, un produit peut être déclaré sous l'IG régionale puis replié en Whisky de France.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "39843f1127", "t": "p3", "q": "En 2023, la filière du whisky français compte environ :", "o": ["20 distilleries", "50 distilleries", "100 distilleries", "300 distilleries"], "r": 2, "e": "Une centaine de distilleries et ~1,5 million de bouteilles vendues, contre 7 distilleries et 100 000 bouteilles en 2000.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 3}, {"id": "51cec0605a", "t": "p3", "q": "Quelle mention peut désigner l'assemblage de deux Single Malt français ?", "o": ["Pure Malt", "Double Malt", "Twin Malt", "Blended Grain"], "r": 1, "e": "« Double Malt » (ou Triple Malt pour trois, etc.), variantes du Blended/Multiple Malt prévues par le cahier des charges.", "s": "INAO, cahier des charges IG Whisky de France", "lv": 2}, {"id": "c217bece12", "t": "p3", "q": "TAV maximal de distillation du bourbon ?", "o": ["70 % (140 proof)", "80 % (160 proof)", "85 % (170 proof)", "94,8 %"], "r": 1, "e": "160 proof soit 80 % vol maximum, en dessous du plafond UE du whisky (94,8 %), pour préserver le caractère du grain.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "b7266eaae5", "t": "p3", "q": "TAV maximal d'entrée en fût du bourbon ?", "o": ["55 % (110 proof)", "62,5 % (125 proof)", "70 % (140 proof)", "80 % (160 proof)"], "r": 1, "e": "125 proof soit 62,5 % vol maximum à la mise en fût, troisième chiffre du trio légal : 160 distillation, 125 entrée, 80 embouteillage.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "c7bc80a31b", "t": "p3", "q": "Durée minimale de vieillissement d'un bourbon « tout court » ?", "o": ["Aucune", "6 mois", "2 ans", "4 ans"], "r": 0, "e": "Aucune ! Le contact avec le chêne neuf carbonisé suffit. Seul le « straight bourbon » exige 2 ans minimum.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "2de79a9073", "t": "p3", "q": "Que garantit la mention « straight » sur un bourbon ?", "o": ["Un seul fût", "Minimum 2 ans de vieillissement", "Aucune réduction à l'eau", "Production au Kentucky"], "r": 1, "e": "Straight = minimum 2 ans en chêne neuf carbonisé, sans additif. Sous 4 ans, l'âge doit figurer sur l'étiquette.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "5772b3674e", "t": "p3", "q": "En dessous de quel âge la mention d'âge est-elle obligatoire sur un straight bourbon ?", "o": ["2 ans", "3 ans", "4 ans", "6 ans"], "r": 2, "e": "Sous 4 ans, l'âge exact doit être indiqué. Au-delà, l'étiquette peut rester muette.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "80e4f27537", "t": "p3", "q": "Quels additifs sont autorisés dans le bourbon ?", "o": ["Aucun, seulement l'eau de réduction", "Du caramel E150a", "Du caramel et des arômes de chêne", "Du sucre jusqu'à 2 g/L"], "r": 0, "e": "Aucun additif, contrairement au Scotch (caramel autorisé) ou au Cognac. Seule l'eau de réduction est permise.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "7357e0ac17", "t": "p3", "q": "Qu'a déclaré le Congrès américain au sujet du bourbon en 1964 ?", "o": ["« Distinctive product of the United States »", "« Boisson nationale officielle »", "« Monopole de l'État du Kentucky »", "« Produit interdit à l'export »"], "r": 0, "e": "Résolution de 1964 : le bourbon est un « produit distinctif des États-Unis », il ne peut être produit ailleurs.", "s": "Résolution du Congrès des États-Unis (4 mai 1964)", "lv": 2}, {"id": "e9bc425d5a", "t": "p3", "q": "Qu'est-ce qui distingue le corn whiskey du bourbon ?", "o": ["Au moins 80 % de maïs, fût usagé ou non brûlé", "Moins de 51 % de maïs dans le moût", "Une distillation en colonne interdite", "Une mise en bouteille toujours sans vieillissement"], "r": 0, "e": "Corn whiskey : minimum 80 % de maïs, et s'il est vieilli, c'est en fût usagé ou neuf NON carbonisé, l'inverse exact du bourbon.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "c12d052fec", "t": "p3", "q": "Que désigne le « mashbill » ?", "o": ["Le registre de distillation", "La composition céréalière du moût", "La facture du malteur", "Le niveau de chauffe du fût"], "r": 1, "e": "La recette céréalière : ex. 75 % maïs, 13 % seigle, 12 % orge maltée. Elle signe le style de chaque maison.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "342f3a7618", "t": "p3", "q": "Que signifie le procédé « sour mash » ?", "o": ["Ajouter au moût une part du résidu de distillation précédent", "Laisser le moût tourner en fermentation lactique", "Ajouter du jus de citron au moût", "Distiller un moût non filtré, avec ses grains"], "r": 0, "e": "Une fraction du moût épuisé (backset, acide) ensemence le nouveau brassin : pH stabilisé, profil constant. Quasi universel dans le bourbon.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "670b95ab64", "t": "p3", "q": "Qu'est-ce qu'un « wheated bourbon » ?", "o": ["Du blé à la place du seigle, en second", "Au moins 51 % de blé dans le moût", "Un whiskey de blé non vieilli", "Un bourbon sans aucune orge maltée"], "r": 0, "e": "Le maïs reste majoritaire (≥51 %), mais le blé remplace le seigle : profil plus doux. Maker's Mark, Weller, Pappy Van Winkle.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "e8abc078b3", "t": "p3", "q": "Que garantit la mention « single barrel » ?", "o": ["Un assemblage de moins de 10 fûts", "L'embouteillage d'un seul et unique fût", "Un fût neuf", "Un seul passage en alambic"], "r": 1, "e": "Le contenu d'un seul fût, sans assemblage, chaque fût a donc son profil propre, contrairement au small batch.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "b4eb67ffe4", "t": "p3", "q": "Comment s'appelle le chai de vieillissement traditionnel du bourbon ?", "o": ["Dunnage", "Rickhouse", "Bodega", "Paradis"], "r": 1, "e": "Le rickhouse (ou rackhouse) : chai à étages où la position du fût (haut chaud, bas frais) modifie fortement le profil.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "7922747bda", "t": "p3", "q": "Comment surnomme-t-on le niveau de carbonisation n°4 des fûts ?", "o": ["Devil char", "Alligator char", "Black snake", "Ember char"], "r": 1, "e": "« Alligator char » (~55 s de flamme) : le bois craquelé évoque une peau d'alligator. Niveau le plus courant pour le bourbon.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "13fa79d2f4", "t": "p3", "q": "Un « blended bourbon » doit contenir au minimum :", "o": ["20 % de straight bourbon", "51 % de straight bourbon", "75 % de straight bourbon", "100 % de bourbon"], "r": 1, "e": "51 % minimum de straight bourbon, le reste pouvant être d'autres whiskeys ou alcool neutre, d'où sa réputation inférieure.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 3}, {"id": "cb4cf7c7d8", "t": "p3", "q": "Dans quel type de fût le rye whiskey américain doit-il vieillir ?", "o": ["Chêne usagé", "Chêne neuf carbonisé", "Tout chêne de moins de 700 L", "Chêne français neuf"], "r": 1, "e": "Chêne neuf carbonisé, comme le bourbon, mêmes plafonds aussi : 160 proof à la distillation, 125 à l'entrée en fût.", "s": "US TTB, 27 CFR §5 (Standards of Identity)", "lv": 2}, {"id": "c8a450600e", "t": "p3", "q": "Quelle teneur minimale en seigle exige le whisky canadien étiqueté « rye » ?", "o": ["51 %", "40 %", "25 %", "Aucune"], "r": 3, "e": "Aucune ! « Rye » est au Canada une appellation traditionnelle, pas réglementaire. Le piège transfrontalier classique.", "s": "Canada, Règlement sur les aliments et drogues, B.02.020", "lv": 3}, {"id": "dab5dc56a0", "t": "p3", "q": "Quelles régions sont le berceau historique du rye américain ?", "o": ["Kentucky et Tennessee", "Pennsylvanie et Maryland", "New York et Boston", "Virginie et Caroline"], "r": 1, "e": "Pennsylvanie (style Monongahela, puissant) et Maryland (réputé plus souple), bien avant la domination du Kentucky bourbon.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rye whiskey »", "lv": 2}, {"id": "8b108d1cbc", "t": "p3", "q": "Quel whiskey servait de base originelle au Manhattan ?", "o": ["Le bourbon", "Le rye", "Le Canadian whisky", "L'Irish whiskey"], "r": 1, "e": "Le rye, whiskey dominant à New York au 19e siècle. Le bourbon ne s'est imposé qu'après la Prohibition.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Manhattan cocktail »", "lv": 2}, {"id": "3e5f62e4bd", "t": "p8", "q": "Quelle est la plus ancienne marque de whiskey américain en activité continue ?", "o": ["Jim Beam", "Old Overholt", "Buffalo Trace", "Old Forester"], "r": 1, "e": "Old Overholt, rye de Pennsylvanie fondé en 1810 par Abraham Overholt, survivant de la Prohibition via le whiskey médicinal.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Old Overholt »", "lv": 2}, {"id": "7c58422187", "t": "p3", "q": "Quel mashbill rye emblématique signe la distillerie MGP (Indiana) ?", "o": ["51 % seigle / 49 % maïs", "75 % seigle / 25 % orge", "95 % seigle / 5 % orge maltée", "100 % seigle"], "r": 2, "e": "95/5, le profil aneth-épices derrière Bulleit Rye, Dickel Rye et une foule de marques « sourced ».", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « MGP »", "lv": 3}, {"id": "f4e8fc93e2", "t": "p3", "q": "Qu'est-ce que le « Rock and Rye » ?", "o": ["Une liqueur de rye au sucre candi", "Un rye servi sur glace pilée", "Un rye non filtré, brut de fût", "Un cocktail tiki au rye"], "r": 0, "e": "Liqueur du 19e siècle : rye, sucre candi (rock candy) et souvent agrumes, vendue en pharmacie contre le rhume.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rock and rye »", "lv": 2}, {"id": "ef7bf66722", "t": "p8", "q": "Quel président américain exploitait une importante distillerie de rye ?", "o": ["Thomas Jefferson", "George Washington", "Abraham Lincoln", "Andrew Jackson"], "r": 1, "e": "George Washington, à Mount Vernon (1797), l'une des plus grandes distilleries du pays à sa mort en 1799.", "s": "Mount Vernon (mountvernon.org), la distillerie de George Washington", "lv": 2}, {"id": "8f5005cf22", "t": "p3", "q": "Que garantit la désignation « Empire Rye » ?", "o": ["Au moins 75 % de seigle new-yorkais", "Un rye de l'ancien Empire britannique", "Un rye 100 % seigle malté", "Un rye distillé avant la Prohibition"], "r": 0, "e": "Création de distillateurs new-yorkais (2015) : min 75 % de seigle de l'État de NY, entrée en fût ≤ 115 proof, 2 ans minimum, une seule distillerie.", "s": "Empire Rye (empirerye.com), cahier des charges", "lv": 3}, {"id": "e24f662dd9", "t": "p3", "q": "Dans les recettes de cocktails d'avant la Prohibition, « whiskey » désignait par défaut :", "o": ["Le bourbon", "Le rye", "Le Scotch", "Le corn whiskey"], "r": 1, "e": "Le rye, roi des bars de la côte Est. Old Fashioned, Manhattan, Whiskey Sour : tous pensés au rye à l'origine.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rye whiskey »", "lv": 2}, {"id": "6eebfe7f31", "t": "p3", "q": "Pourquoi le seigle est-il réputé difficile à brasser ?", "o": ["Un moût visqueux et mousseux", "Une fermentation beaucoup trop rapide", "L'absence totale d'amidon", "Un maltage obligatoirement à froid"], "r": 0, "e": "Ses bêta-glucanes et pentosanes rendent le moût visqueux et très moussant, brassins capricieux, d'où la prime aux maisons qui le maîtrisent.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rye whiskey »", "lv": 1}, {"id": "71b2584a6d", "t": "h1", "q": "Le Ward Eight (Boston, 1898) associe rye, citron, orange et :", "o": ["Miel", "Grenadine", "Falernum", "Marasquin"], "r": 1, "e": "Grenadine, créé au Locke-Ober pour fêter l'élection du district Ward 8. Un rye sour fruité d'avant la Prohibition.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Ward Eight »", "lv": 1}, {"id": "7f719e5445", "t": "h3", "q": "L'Algonquin associe rye, vermouth dry et :", "o": ["Jus d'ananas", "Jus de pamplemousse", "Chartreuse", "Bénédictine"], "r": 0, "e": "Jus d'ananas, rare classique stirré/shaké à l'ananas, baptisé d'après l'hôtel new-yorkais et sa Round Table littéraire.", "s": "Difford's Guide, fiche « Algonquin »", "lv": 1}, {"id": "43f5774b61", "t": "p3", "q": "Par rapport au bourbon, le profil typique du rye est :", "o": ["Plus doux et vanillé", "Plus épicé, poivré et sec", "Plus fumé", "Plus floral"], "r": 1, "e": "Épicé, poivré, herbacé et sec, le seigle apporte du mordant là où le maïs apporte rondeur et sucrosité. C'est pourquoi les barmen le préfèrent souvent en Manhattan ou Sazerac.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rye whiskey »", "lv": 2}, {"id": "b4a9d73d56", "t": "p3", "q": "Qu'est-ce qui a provoqué la quasi-disparition du rye américain au 20e siècle ?", "o": ["Le phylloxéra", "La Prohibition", "La Seconde Guerre mondiale", "Une taxe fédérale de 1964"], "r": 1, "e": "La Prohibition (1920-1933) a détruit les distilleries de Pennsylvanie et du Maryland ; le goût américain a basculé vers le bourbon, plus doux. Renaissance dans les années 2000.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « rye whiskey »", "lv": 2}, {"id": "84f5b5e467", "t": "p4", "q": "Quelle norme officielle mexicaine régit la production de tequila ?", "o": ["NOM-006-SCFI", "AOC-2010", "DOP-Jalisco", "ISO-9001"], "r": 0, "e": "La NOM-006-SCFI fixe les spécifications de la tequila (catégories, types, agave autorisé, titrage).", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "c549f74d95", "t": "p4", "q": "En quelle année la catégorie « Extra Añejo » a-t-elle été créée ?", "o": ["1974", "1994", "2006", "2016"], "r": 2, "e": "L'Extra Añejo (plus de 3 ans en fûts ≤ 600 L) a été ajouté à la norme en 2006.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "4190733376", "t": "p4", "q": "Quelle est la seule variété d'agave autorisée pour la tequila ?", "o": ["Agave tequilana Weber, variété bleue", "Agave angustifolia, dit espadín", "Agave americana, dit maguey", "Agave salmiana, pour le pulque"], "r": 0, "e": "Seul l'Agave tequilana Weber variété bleue est admis ; le sucre fermenté doit en provenir.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "a44e793abd", "t": "p4", "q": "Qu'est-ce qu'une tequila « cristalino » ?", "o": ["Une tequila vieillie puis décolorée au charbon", "Une tequila blanco jamais vieillie", "Une tequila distillée trois fois", "Une tequila mixto filtrée sur quartz"], "r": 0, "e": "Le cristalino est une reposado/añejo filtrée sur charbon : on garde le profil boisé mais on efface la couleur. Ce n'est pas une catégorie officielle de la NOM.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "ba608311c2", "t": "p4", "q": "Que permet d'identifier le numéro « NOM » suivi de 4 chiffres sur une bouteille ?", "o": ["La distillerie qui a produit le liquide", "Le degré d'alcool exact du lot", "L'année de récolte des agaves", "Le nombre de distillations"], "r": 0, "e": "Le NOM renvoie à la distillerie productrice ; plusieurs marques peuvent partager un même NOM.", "s": "CRT, norme NOM-006-SCFI-2012", "lv": 2}, {"id": "9bdbbf62fa", "t": "p4", "q": "Que garantit la mention « 100% agave » sur une tequila ?", "o": ["Sucres 100 % agave, mise en bouteille au Mexique", "Un degré d'au moins 50 %", "Au moins trois ans de vieillissement", "Une production artisanale certifiée"], "r": 0, "e": "Une 100% agave n'admet aucun sucre d'appoint et doit être mise en bouteille au Mexique (contrairement au mixto, exportable en vrac).", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "06dbaf725d", "t": "p4", "q": "À quoi correspond une tequila « joven » (ou « gold/oro ») d'entrée de gamme ?", "o": ["Un blanco coloré ou assemblé", "Une tequila de trois ans", "Une tequila filtrée deux fois", "Une tequila sans agave"], "r": 0, "e": "La joven/gold est généralement un blanco coloré et adouci, ou un assemblage de blanco et de tequilas vieillies.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "a89679ca75", "t": "p4", "q": "En quelle année l'appellation d'origine Tequila a-t-elle été reconnue au Mexique ?", "o": ["1949", "1974", "1994", "2006"], "r": 1, "e": "La Denominación de Origen Tequila est officialisée en 1974 ; elle couvre Jalisco et des municipalités de 4 autres États.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "0437848aa9", "t": "p4", "q": "Pourquoi cuit-on le cœur d'agave (piña) avant la fermentation ?", "o": ["Changer l'inuline en sucres fermentescibles", "Stériliser simplement les piñas", "Donner sa couleur à la tequila", "Augmenter le degré final"], "r": 0, "e": "La cuisson (four en briques ou autoclave) hydrolyse l'inuline en sucres simples fermentescibles.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "6d2e0033a4", "t": "p4", "q": "Combien de fois la tequila est-elle généralement distillée ?", "o": ["Une fois", "Deux fois", "Trois fois", "Quatre fois"], "r": 1, "e": "La double distillation est la norme ; certaines maisons en font une troisième pour un profil plus neutre.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "bb66583368", "t": "p4", "q": "Comment nomme-t-on la meule de pierre traditionnelle servant à broyer l'agave cuit ?", "o": ["Tahona", "Alambic", "Coa", "Horno"], "r": 0, "e": "La tahona, lourde roue de pierre d'origine nahuatl, presse l'agave cuit en gardant les fibres ; méthode lente et qualitative.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "c0705459d7", "t": "p4", "q": "Comment appelle-t-on la méthode industrielle qui extrait les sucres de l'agave cru à l'eau chaude et à la vapeur ?", "o": ["Le diffuseur", "La tahona", "Le pot still", "Le horno"], "r": 0, "e": "Le diffuseur extrait les sucres très vite, parfois sans cuisson ; décrié car appauvrissant le profil aromatique.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "9c0dce111f", "t": "p4", "q": "Combien de temps l'agave bleu met-il environ à atteindre sa maturité ?", "o": ["Quelques mois", "1 à 2 ans", "6 à 8 ans", "30 ans"], "r": 2, "e": "L'agave tequilana mûrit en 6 à 8 ans environ (variable selon le terroir) avant la jima.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "add955e18d", "t": "p4", "q": "Quelle est la principale variété d'agave utilisée pour le mezcal ?", "o": ["Espadín", "Tequilana Weber bleu", "Americana", "Sisalana"], "r": 0, "e": "L'Espadín domine la production de mezcal, bien que des dizaines d'agaves sauvages soient aussi employés.", "s": "NOM-070-SCFI-2016 (mezcal)", "lv": 2}, {"id": "6ee5af8607", "t": "p4", "q": "Où trouve-t-on traditionnellement le ver (gusano) ?", "o": ["Dans certains mezcals, jamais en tequila", "Dans certains rhums agricoles", "Dans certains piscos du Pérou", "Dans certaines cachaças"], "r": 0, "e": "Le gusano accompagne certaines bouteilles de mezcal ; il n'a jamais existé dans la tequila.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « mezcal »", "lv": 2}, {"id": "ad45bac839", "t": "p4", "q": "D'où provient principalement le goût fumé du mezcal ?", "o": ["De la cuisson en fours enterrés", "D'un ajout de fumée liquide", "D'un vieillissement en fût brûlé", "D'une levure spécifique"], "r": 0, "e": "Les piñas cuisent dans des fosses chauffées aux pierres volcaniques, ce qui imprègne le mezcal de notes fumées.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « mezcal »", "lv": 2}, {"id": "5fbc961c5c", "t": "p4", "q": "Quel est le rôle du Consejo Regulador del Tequila (CRT) ?", "o": ["Certifier et contrôler la production", "Fixer les prix de vente", "Distiller une tequila officielle", "Détenir les marques de tequila"], "r": 0, "e": "Le CRT est l'organisme de certification qui vérifie le respect de la NOM-006 tout au long de la filière.", "s": "CRT, norme NOM-006-SCFI", "lv": 2}, {"id": "87c7e4f90f", "t": "p4", "q": "Outre les sucres d'agave, qu'autorise un « mixto » que n'autorise pas un 100% agave ?", "o": ["Jusqu'à 49 % d'autres sucres, vrac à l'export", "Un vieillissement plus long qu'ailleurs", "Un degré plus élevé que la normale", "Une seule distillation au lieu de deux"], "r": 0, "e": "Le mixto contient au minimum 51% de sucres d'agave, le reste pouvant venir d'autres sucres ; il peut être exporté en vrac.", "s": "CRT, norme NOM-006-SCFI", "lv": 3}, {"id": "1687168209", "t": "h5", "q": "Que signifie le sigle « PDT » du célèbre bar new-yorkais ?", "o": ["Please Don't Tell", "Prohibition Drinks Temple", "Premium Drink Tavern", "Public Drinking Tavern"], "r": 0, "e": "« Please Don't Tell » joue sur l'esprit speakeasy clandestin du lieu.", "s": "J. Meehan, The PDT Cocktail Book (2011)", "lv": 1}, {"id": "6c71c9991e", "t": "h5", "q": "Comment accède-t-on au bar PDT à New York ?", "o": ["Par une cabine téléphonique chez Crif Dogs", "Par une trappe dans une cave à vin", "Par l'arrière-boutique d'une librairie", "Par un ascenseur de service caché"], "r": 0, "e": "On entre par une vieille cabine téléphonique installée dans le Crif Dogs, dans l'East Village.", "s": "J. Meehan, The PDT Cocktail Book (2011)", "lv": 2}, {"id": "016fd580b3", "t": "h5", "q": "Qui a signé « The PDT Cocktail Book » (2011) ?", "o": ["Jim Meehan", "Dale DeGroff", "David Wondrich", "Jerry Thomas"], "r": 0, "e": "Jim Meehan, co-fondateur du PDT, en a tiré un livre de référence richement illustré.", "s": "J. Meehan, The PDT Cocktail Book (2011)", "lv": 2}, {"id": "fc5f54b722", "t": "h5", "q": "Sur quelle technique repose le « Benton's Old Fashioned », créé au PDT par Don Lee ?", "o": ["Bourbon lavé au gras de bacon (fat-washing)", "Bourbon vieilli en fût de jambon", "Bourbon clarifié au lait", "Bourbon fumé à froid au hickory"], "r": 0, "e": "Don Lee lave le bourbon au gras de bacon Benton's : l'arôme reste, le gras est retiré par le froid.", "s": "Difford's Guide, fiche « Benton's Old Fashioned »", "lv": 2}, {"id": "edaba033c3", "t": "h5", "q": "En quelle année le bar PDT a-t-il ouvert ses portes ?", "o": ["1999", "2007", "2012", "2015"], "r": 1, "e": "PDT ouvre en 2007 et devient une référence de la renaissance cocktail new-yorkaise.", "s": "J. Meehan, The PDT Cocktail Book (2011)", "lv": 3}, {"id": "5abcbca295", "t": "h5", "q": "Dans quel quartier de New York se trouve le PDT ?", "o": ["East Village", "Brooklyn Heights", "Upper East Side", "Harlem"], "r": 0, "e": "Le PDT est niché dans l'East Village, à Manhattan.", "s": "J. Meehan, The PDT Cocktail Book (2011)", "lv": 2}, {"id": "59cd978ef4", "t": "c4", "q": "Quel bar a remporté en 2012 le premier James Beard Award « Outstanding Bar Program » ?", "o": ["Le PDT", "Le Savoy", "Le Harry's New York Bar", "L'Artesian"], "r": 0, "e": "Le PDT décroche cette toute première distinction de la catégorie en 2012.", "s": "James Beard Foundation, palmarès 2012", "lv": 2}, {"id": "0e7b34cebd", "t": "h5", "q": "À quelle figure du bar américain l'ouvrage « Imbibe! » de David Wondrich rend-il hommage ?", "o": ["Jerry Thomas", "Harry Craddock", "Ada Coleman", "Harry Johnson"], "r": 0, "e": "« Imbibe! » (2007) ressuscite l'œuvre de Jerry Thomas, figure fondatrice du bar américain.", "s": "D. Wondrich, Imbibe! (Perigee, 2007)", "lv": 2}, {"id": "d004a1b0c9", "t": "h5", "q": "Quelle distinction « Imbibe! » de Wondrich a-t-il été le premier livre de cocktails à recevoir ?", "o": ["Un James Beard Award", "Un prix Pulitzer", "Une étoile Michelin", "Un Spirited Award"], "r": 0, "e": "« Imbibe! » est le premier ouvrage consacré aux cocktails primé d'un James Beard Award.", "s": "James Beard Foundation, palmarès 2008", "lv": 2}, {"id": "1e23c306bf", "t": "h5", "q": "« Imbibe! » se présente comme le prolongement de quel ouvrage de 1862 ?", "o": ["Le guide de Jerry Thomas (How to Mix Drinks)", "Le Savoy Cocktail Book de Craddock", "Le Café Royal Cocktail Book de Tarling", "The Fine Art of Mixing Drinks d'Embury"], "r": 0, "e": "Wondrich bâtit son livre autour du manuel de 1862 de Jerry Thomas, premier guide de bar américain.", "s": "D. Wondrich, Imbibe! (2007)", "lv": 2}, {"id": "f4a5ff0829", "t": "h1", "q": "Selon Wondrich, quelle boisson est antérieure à l'apparition même du mot « cocktail » ?", "o": ["Le Mint Julep", "Le Negroni", "Le Martini", "Le Daiquiri"], "r": 0, "e": "Le Mint Julep précède l'usage écrit du mot cocktail (1806) et remonte à l'époque coloniale.", "s": "D. Wondrich, Imbibe! (2007)", "lv": 2}, {"id": "d5c785af14", "t": "h1", "q": "Quel autre ouvrage majeur David Wondrich a-t-il publié en 2010 ?", "o": ["Punch", "Imbibe!", "The Joy of Mixology", "Liquid Intelligence"], "r": 0, "e": "« Punch » (2010) retrace l'histoire des punchs communautaires, ancêtres du cocktail.", "s": "D. Wondrich, Punch (Perigee, 2010)", "lv": 2}, {"id": "15e6abdf09", "t": "h5", "q": "Quel ouvrage de référence David Wondrich a-t-il dirigé en 2021 ?", "o": ["The Oxford Companion to Spirits and Cocktails", "The Flavor Bible, de Page et Dornenburg", "The Bar Book, de Jeffrey Morgenthaler", "Death & Co: Modern Classic Cocktails"], "r": 0, "e": "Wondrich est rédacteur en chef de cette encyclopédie de référence des spiritueux et cocktails.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021)", "lv": 2}, {"id": "5137f8d439", "t": "h5", "q": "En quelle année « Imbibe! » de David Wondrich a-t-il été publié pour la première fois ?", "o": ["1998", "2007", "2014", "2021"], "r": 1, "e": "La première édition d'« Imbibe! » paraît en 2007.", "s": "D. Wondrich, Imbibe! (Perigee, 2007)", "lv": 3}, {"id": "880aa2088b", "t": "c4", "q": "Comment se nomme la catégorie IBA regroupant les créations récentes ?", "o": ["New Era Drinks", "The Unforgettables", "Contemporary Classics", "Modern Mixes"], "r": 0, "e": "Les trois catégories IBA sont The Unforgettables, Contemporary Classics et New Era Drinks (créations récentes).", "s": "IBA, iba-world.com", "lv": 2}, {"id": "f9de6a1092", "t": "c3", "q": "Qu'est-ce qui caractérise la famille du « flip » ?", "o": ["Un œuf entier, sans agrume", "Un allongement à l'eau gazeuse", "Une base de vin chaud épicé", "Une absence totale d'alcool"], "r": 0, "e": "Le flip historique associe un spiritueux ou vin fortifié, du sucre et un œuf entier, donnant une texture nappante.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "69f38be360", "t": "c1", "q": "Quelles proportions définit un sirop simple par rapport à un sirop « riche » ?", "o": ["Simple 1:1, riche 2:1 (sucre:eau)", "Simple 2:1, riche 1:1 (sucre:eau)", "Les deux à 1:1 (sucre:eau)", "Les deux à 3:1 (sucre:eau)"], "r": 0, "e": "Le sirop simple est 1:1 ; le sirop riche (2:1) est plus dense et sucre davantage à volume égal.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 3}, {"id": "a107d15d68", "t": "c1", "q": "Pourquoi exprime-t-on un zeste (twist) au-dessus d'un cocktail ?", "o": ["Libérer les huiles de l'écorce", "Colorer légèrement la surface", "Apporter un peu de sucre", "Diluer le haut du verre"], "r": 0, "e": "La torsion du zeste projette les huiles essentielles d'agrume en surface, parfumant le nez du cocktail.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "a9dadaf037", "t": "c1", "q": "Pourquoi remue-t-on (stir) un cocktail tout-alcool plutôt que de le shaker ?", "o": ["Diluer sans aérer, pour une texture limpide", "Obtenir une texture mousseuse", "Gagner du temps au service", "Réchauffer légèrement le mélange"], "r": 0, "e": "Le verre à mélange refroidit et dilue sans incorporer d'air : on obtient une boisson cristalline et soyeuse.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "ae5b5638a7", "t": "c3", "q": "Qu'est-ce qui distingue un « fizz » d'un « sour » ?", "o": ["L'ajout d'eau gazeuse", "L'absence d'agrume", "L'usage de crème", "Le service chaud"], "r": 0, "e": "Le fizz est un sour allongé d'eau gazeuse (ex. Gin Fizz), souvent servi sans glace dans le verre.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "6a174eb38e", "t": "c2", "q": "À quoi sert un « muddler » (pilon) au bar ?", "o": ["Écraser fruits, herbes ou sucre", "Doser les liquides au trait", "Filtrer la glace pilée", "Trancher les zestes fins"], "r": 0, "e": "Le pilon presse les ingrédients (menthe du Mojito, agrumes) sans les déchiqueter pour extraire arômes et jus.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "dacc912384", "t": "c1", "q": "En quoi consiste la méthode « build » (montage au verre) ?", "o": ["Monter la boisson dans le verre de service", "Frapper au shaker puis transvaser", "Filtrer deux fois le mélange", "Flamber la surface du cocktail"], "r": 0, "e": "Le build se fait dans le verre final (ex. highball, Old Fashioned), sans shaker ni verre à mélange.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "ed9e5cd816", "t": "c1", "q": "Que signifie faire « flotter » (float) un ingrédient ?", "o": ["Le poser en surface, sans mélanger", "Le congeler avant de servir", "Le filtrer deux fois", "Le diluer fortement à l'eau"], "r": 0, "e": "On verse doucement (sur le dos d'une cuillère) un liquide pour qu'il reste en surface, par densité.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "4970099072", "t": "c2", "q": "À quoi sert un « jigger » ?", "o": ["Doser précisément les liquides", "Écraser les fruits et herbes", "Filtrer la glace pilée", "Tailler les zestes en spirale"], "r": 0, "e": "Le jigger (doseur double) garantit des dosages réguliers, clé de la reproductibilité au bar.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "f57a9e143c", "t": "c3", "q": "Qu'est-ce qu'un « smash » ?", "o": ["Un court aux fruits ou herbes écrasés", "Un long drink allongé au soda", "Un cocktail chaud à l'œuf", "Un cocktail clarifié au lait"], "r": 0, "e": "Le smash (ex. Whiskey Smash) est un julep court enrichi de fruits ou d'herbes fraîches pilées.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "8d1c07a59f", "t": "c3", "q": "Avec quel liquide prépare-t-on un « hot toddy » ?", "o": ["De l'eau chaude", "De l'eau gazeuse", "Du lait froid", "Du jus de tomate"], "r": 0, "e": "Le hot toddy associe un spiritueux, du sucre, du citron et de l'eau chaude, parfois des épices.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "c58a631467", "t": "c2", "q": "Outre le froid, quel rôle essentiel joue la glace lors du shake d'un cocktail ?", "o": ["La dilution", "La coloration", "La carbonatation", "La fermentation"], "r": 0, "e": "La fonte de la glace apporte l'eau de dilution qui équilibre l'alcool et le sucre : un cocktail sous-dilué est agressif.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "00fe0ae40d", "t": "p4", "q": "Depuis 2006, à quel titre le paysage agavier et les anciennes installations de Tequila sont-ils protégés ?", "o": ["Au patrimoine mondial de l'UNESCO", "Comme parc naturel national", "Au registre des sentinelles Slow Food", "Comme appellation viticole"], "r": 0, "e": "Le « paysage agavier et les anciennes installations industrielles de Tequila » sont inscrits à l'UNESCO depuis 2006.", "s": "UNESCO, Paysage d'agaves et anciennes installations industrielles de Tequila (2006)", "lv": 2}, {"id": "5c1ba47858", "t": "p4", "q": "Quel État mexicain concentre l'essentiel de la production de mezcal ?", "o": ["Oaxaca", "Jalisco", "Sonora", "Yucatán"], "r": 0, "e": "Oaxaca est le cœur historique du mezcal, même si la DO Mezcal couvre plusieurs autres États.", "s": "Consejo Regulador del Mezcal (crm.org.mx)", "lv": 2}, {"id": "be501262ca", "t": "c1", "q": "En quoi consiste le « throwing » (lancer) au bar ?", "o": ["Verser d'un récipient à l'autre, en hauteur", "Jeter la glace dans le verre de service", "Lancer le zeste au-dessus du verre", "Filtrer le mélange sous pression"], "r": 0, "e": "Le throwing oxygène et mélange en douceur (ex. Bloody Mary), avec une texture différente du shake.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "3f9e7c3fdd", "t": "c1", "q": "Sur quoi se réalise traditionnellement un « swizzle » à l'aide d'un bâton tournant ?", "o": ["De la glace pilée, jusqu'au givrage", "Un blanc d'œuf, jusqu'à la mousse", "Un sirop chaud, jusqu'à dissolution", "Une infusion froide, jusqu'à coloration"], "r": 0, "e": "Le swizzle stick (bâtonnet antillais) fait tourbillonner le cocktail sur glace pilée jusqu'à former du givre.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "f025b1dee4", "t": "c1", "q": "Sur quelle propriété physique repose un cocktail « étagé » (type pousse-café) ?", "o": ["La différence de densité", "La différence de température", "La différence de pH", "La différence de carbonatation"], "r": 0, "e": "On superpose les liqueurs de la plus dense (sucrée) à la plus légère, versées doucement.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "7fabc848a9", "t": "h1", "q": "Quel cocktail du XIXe siècle, ancêtre de la Margarita, se distingue par un bord givré de sucre et un long ruban de zeste ?", "o": ["Le Crusta", "Le Cobbler", "Le Flip", "Le Sling"], "r": 0, "e": "Le Brandy Crusta (Joseph Santini, La Nouvelle-Orléans, années 1850) inaugure le verre givré et le zeste décoratif.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "bc4ff1aba9", "t": "c1", "q": "Qu'est-ce qu'un oleo saccharum ?", "o": ["Un sucre chargé des huiles de zestes", "Un sirop à l'huile d'olive", "Un bitter à base d'agrumes", "Un sucre brûlé au chalumeau"], "r": 0, "e": "Le sucre, laissé au contact des zestes, en extrait les huiles aromatiques. C'est la base historique des punchs, remise à l'honneur par David Wondrich.", "s": "D. Wondrich, Punch (2010)", "lv": 1}, {"id": "27d896bcb7", "t": "c1", "q": "Quelle technique de clarification, popularisée au bar par Dave Arnold, utilise un gélifiant ?", "o": ["La clarification à l'agar-agar", "Le fat washing au beurre", "Le throwing à l'ancienne", "Le dry shake prolongé"], "r": 0, "e": "Le jus est gélifié à l'agar puis égoutté : le gel retient la pulpe et le liquide ressort limpide.", "s": "D. Arnold, Liquid Intelligence (W. W. Norton, 2014)", "lv": 1}, {"id": "a2f2801cfc", "t": "c1", "q": "Le « rolling » consiste à :", "o": ["Transvaser doucement d'une timbale à l'autre", "Rouler le bord du verre dans le sucre", "Faire tourner la glace au verre à mélange", "Rouler un zeste en spirale serrée"], "r": 0, "e": "Réservé aux mélanges épais comme le Bloody Mary : on refroidit et on mélange sans aérer ni faire mousser le jus de tomate.", "s": "Difford's Guide, glossaire « rolling »", "lv": 1}, {"id": "f359cbfadb", "t": "c3", "q": "Servir un spiritueux « on the rocks », c'est le servir :", "o": ["Sur glaçons", "Sans glace, à température ambiante", "Allongé d'eau gazeuse", "Frappé puis filtré"], "r": 0, "e": "Sur glaçons, dans un verre bas. À ne pas confondre avec « neat » (sec, sans glace) ni « up » (refroidi puis servi sans glace, dans un verre à pied).", "s": "Difford's Guide, glossaire des termes de bar", "lv": 1}, {"id": "b7ed448dbb", "t": "c3", "q": "Au bar, un « shrub » est :", "o": ["Un sirop de fruits acidifié au vinaigre", "Un arbuste aromatique pilé au fond du verre", "Un cocktail sans alcool à la crème", "Une liqueur de baies sauvages"], "r": 0, "e": "Fruit, sucre et vinaigre. Au XVIIIe siècle, le mot désignait aussi un mélange de spiritueux, d'agrumes et de sucre destiné à la conservation.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « shrub »", "lv": 1}, {"id": "14fbbf6b42", "t": "c3", "q": "Dans l'usage britannique, un « lime cordial » désigne :", "o": ["Un sirop de citron vert sucré, sans alcool", "Une liqueur de citron vert à 40 %", "Un jus de citron vert pressé minute", "Un bitter aromatique au citron vert"], "r": 0, "e": "Le Rose's Lime Juice (1867) en est l'archétype : c'est lui qui a donné le Gimlet.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « cordial »", "lv": 1}, {"id": "6d55ce2134", "t": "c3", "q": "Un « dash » (trait) correspond à environ :", "o": ["1 ml", "5 ml", "10 ml", "15 ml"], "r": 0, "e": "Quelques gouttes projetées par le bouchon verseur d'un flacon de bitters, soit à peu près 1 ml. La cuillère de bar, elle, fait environ 5 ml.", "s": "Difford's Guide, glossaire « dash »", "lv": 2}, {"id": "92e842f5ad", "t": "c3", "q": "Un Manhattan « perfect » se prépare avec :", "o": ["Vermouths rouge et dry, à parts égales", "Uniquement du vermouth dry", "Un mélange de rye et de bourbon", "Une double dose de bitters"], "r": 0, "e": "« Perfect » signale le partage de la dose de vermouth entre rouge et dry. Même logique pour le Perfect Martini.", "s": "Difford's Guide, fiche « Perfect Manhattan »", "lv": 1}, {"id": "618f8d2950", "t": "c3", "q": "La mention « Royale » (Kir Royale, Cassis Royale) signifie que la boisson est :", "o": ["Complétée au champagne", "Servie flambée", "Préparée avec une double dose d'alcool", "Servie dans une timbale en argent"], "r": 0, "e": "Le vin tranquille ou la base est remplacé ou complété par du champagne. Le Kir Royale prend du champagne à la place de l'aligoté.", "s": "Difford's Guide, fiche « Kir Royale »", "lv": 1}, {"id": "1ab17c9223", "t": "c3", "q": "Un « Rickey » se compose de :", "o": ["Spiritueux, citron vert, eau gazeuse", "Spiritueux, sucre, œuf entier", "Spiritueux, liqueur, crème", "Vin, sucre, épices chaudes"], "r": 0, "e": "Nommé d'après le colonel Joe Rickey, à Washington, dans les années 1880. L'absence de sucre le distingue du Collins.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Rickey »", "lv": 1}, {"id": "82eb34c722", "t": "c3", "q": "Le Moscow Mule appartient à la famille des « bucks », qui associent :", "o": ["Spiritueux, agrume et gingembre gazeux", "Spiritueux, lait chaud et muscade", "Vin blanc, sucre et eau gazeuse", "Spiritueux, crème et liqueur"], "r": 0, "e": "Spiritueux, agrume, gingembre gazeux : le Moscow Mule et le Dark 'n' Stormy en sont les représentants les plus connus.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « buck »", "lv": 1}, {"id": "160faa36ff", "t": "c3", "q": "À l'origine, un « sling » est :", "o": ["Spiritueux, sucre et eau, sans bitters", "Un cocktail frappé au blanc d'œuf", "Un punch chaud au lait", "Une liqueur de cerise"], "r": 0, "e": "Au début du XIXe siècle, le sling (spiritueux, sucre, eau) se distingue du cocktail par l'absence de bitters. Le Singapore Sling en garde le nom.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « sling »", "lv": 1}, {"id": "d0a0b11125", "t": "c3", "q": "Un « chaser » est :", "o": ["Une boisson bue après un spiritueux sec", "Un barman en première année", "Un verre à shot gradué", "Un bitter servi au dessert"], "r": 0, "e": "Bière, eau ou soda bu après une gorgée de spiritueux. On parle aussi de « back ».", "s": "Difford's Guide, glossaire des termes de bar", "lv": 1}, {"id": "283097cb18", "t": "c2", "q": "Dans les anciens livres américains, un « pony » correspond à :", "o": ["1 once, environ 30 ml", "2 onces, environ 60 ml", "Un demi-litre", "Un trait"], "r": 0, "e": "Le jigger standard fait 1,5 once (environ 45 ml) ; le pony, 1 once.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « jigger »", "lv": 2}, {"id": "2c3a50d518", "t": "c5", "q": "En France, le taux d'alcool maximal autorisé au volant (hors permis probatoire) est de :", "o": ["0,5 g/L de sang", "0,2 g/L de sang", "0,8 g/L de sang", "1 g/L de sang"], "r": 0, "e": "Soit 0,25 mg/L d'air expiré. Pour les permis probatoires et les conducteurs de transport en commun, le seuil tombe à 0,2 g/L.", "s": "Code de la route, art. R234-1 (Légifrance)", "lv": 3}, {"id": "6085b0e416", "t": "p1", "q": "Qui a breveté en 1830 la colonne de distillation continue à double colonne ?", "o": ["Aeneas Coffey", "Robert Stein", "Édouard Adam", "John Dore"], "r": 0, "e": "L'Irlandais Aeneas Coffey perfectionne le principe de Robert Stein : le « Coffey still » ou « patent still » permet de distiller en continu, à haut degré. Il rend possible le whisky de grain et le London dry gin.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Coffey still »", "lv": 2}, {"id": "9b0ac50a99", "t": "p1", "q": "À quoi sert le maltage des céréales ?", "o": ["À activer les enzymes qui changent l'amidon en sucres", "À griller le grain pour la couleur", "À retirer l'enveloppe du grain", "À stériliser le grain avant brassage"], "r": 0, "e": "On fait germer l'orge puis on stoppe la germination au séchage : les amylases développées transformeront l'amidon en sucres fermentescibles au brassage.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « malting »", "lv": 1}, {"id": "b3aa1dc060", "t": "p1", "q": "Face au chêne européen, le chêne américain (Quercus alba) apporte surtout :", "o": ["Vanille et noix de coco", "Tanins marqués et épices", "Notes fumées et iodées", "Fruits rouges et poivre"], "r": 0, "e": "Le chêne blanc américain est riche en lactones (noix de coco) et en vanilline ; le chêne européen, plus tannique, donne davantage d'épices et de structure.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « oak »", "lv": 2}, {"id": "4552e4e1ec", "t": "p1", "q": "Dans un alambic de type Carterhead, les botaniques d'un gin sont :", "o": ["Placés dans un panier traversé par les vapeurs", "Macérés directement dans la cuve", "Ajoutés sous forme d'essences après distillation", "Infusés à froid dans le gin fini"], "r": 0, "e": "C'est l'infusion vapeur : les vapeurs d'alcool traversent un panier de botaniques, pour un profil plus léger et floral.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Carterhead still »", "lv": 2}, {"id": "7c0c9bf2ad", "t": "p1", "q": "Le mot « proof » vient à l'origine :", "o": ["D'un test à la poudre qui devait encore s'enflammer", "D'un contrôle au densimètre des douanes", "D'une taxe royale sur les alcools forts", "D'un serment prêté par les distillateurs"], "r": 0, "e": "Selon la tradition britannique, un spiritueux « prouvé » laissait encore brûler la poudre qu'on en imbibait. Le proof américain vaut aujourd'hui le double du degré.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « proof »", "lv": 2}, {"id": "6d8340a72b", "t": "p1", "q": "Le titre alcoométrique volumique (% vol) se mesure à la température de :", "o": ["20 °C", "15 °C", "10 °C", "25 °C"], "r": 0, "e": "Le TAV est le volume d'alcool pur contenu dans 100 volumes du produit, mesuré à 20 °C.", "s": "Règlement (UE) 2019/787, art. 2 (définitions)", "lv": 3}, {"id": "165040b8da", "t": "p1", "q": "Qu'appelle-t-on les « congénères » d'un spiritueux ?", "o": ["Les composés autres que l'eau et l'éthanol", "Les spiritueux d'une même famille", "Les levures utilisées en fermentation", "Les résidus solides de distillation"], "r": 0, "e": "Esters, aldéhydes, alcools supérieurs, acides : ils portent l'essentiel du goût. Plus on distille haut, moins il en reste.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « congeners »", "lv": 2}, {"id": "c7999580d0", "t": "p1", "q": "Les « huiles de fusel » (alcools supérieurs) se concentrent surtout dans :", "o": ["Les queues de distillation", "Les têtes de distillation", "Le cœur de chauffe", "L'eau de réduction"], "r": 0, "e": "Lourdes et peu volatiles, elles passent en fin de distillation : c'est une des raisons de la coupe des queues.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « fusel oil »", "lv": 2}, {"id": "92b84cf57a", "t": "p1", "q": "En alambic charentais, le produit de la première chauffe s'appelle :", "o": ["Le brouillis", "La bonne chauffe", "Les secondes", "La repasse"], "r": 0, "e": "Le brouillis, autour de 28 à 32 % vol, est redistillé en bonne chauffe pour donner le cœur à 70 % environ.", "s": "BNIC, cahier des charges AOC Cognac (la distillation)", "lv": 2}, {"id": "82815a9906", "t": "p1", "q": "Qu'est-ce qu'un « finish » (affinage) sur un spiritueux ?", "o": ["Un court passage final dans un autre type de fût", "Une filtration juste avant l'embouteillage", "Une réduction lente à l'eau de source", "Un assemblage réalisé en fin de vieillissement"], "r": 0, "e": "Après son vieillissement principal, le spiritueux passe quelques mois dans un fût ayant contenu autre chose (sherry, porto, vin, cognac) pour prendre une touche aromatique.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « finish »", "lv": 1}, {"id": "d9513e7dcd", "t": "h4", "q": "Avant de s'appeler Trader Vic's, le bar de Victor Bergeron à Oakland s'appelait :", "o": ["Hinky Dink's", "Don the Beachcomber", "The Tiki Hut", "Polynesian Pub"], "r": 0, "e": "Ouvert en 1934 sous le nom de Hinky Dink's, le bar prend le nom de Trader Vic's à la fin des années 1930, avec son virage polynésien.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Trader Vic »", "lv": 1}, {"id": "40065ae72d", "t": "h4", "q": "Jeff « Beachbum » Berry est connu pour :", "o": ["Avoir décodé les recettes secrètes de Donn Beach", "Avoir inventé le Mai Tai", "Avoir fondé la marque de rhum Pusser's", "Avoir créé le premier tiki bar de Londres"], "r": 0, "e": "Historien du tiki, il a retrouvé et décrypté les recettes codées de Don the Beachcomber (livres « Sippin' Safari », « Beachbum Berry Remixed »). Il ouvre Latitude 29 à La Nouvelle-Orléans en 2014.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Berry, Jeff »", "lv": 1}, {"id": "d64beba7ac", "t": "h4", "q": "Le « Don's Mix », ingrédient codé de Donn Beach, associe :", "o": ["Sirop de cannelle et jus de pamplemousse", "Sirop d'orgeat et jus de citron vert", "Falernum et jus d'ananas", "Miel et jus d'orange"], "r": 0, "e": "Donn Beach codait ses ingrédients en flacons numérotés pour protéger ses recettes ; Jeff Berry a identifié ce mélange cannelle-pamplemousse.", "s": "J. Berry, Sippin' Safari (2007)", "lv": 1}, {"id": "3c378c998d", "t": "h4", "q": "Le Three Dots and a Dash de Donn Beach doit son nom :", "o": ["Au « V » de la victoire en morse", "À trois cerises et un bâtonnet d'ananas", "À une marque de rhum de la Martinique", "Au code d'une recette secrète"], "r": 0, "e": "Créé pendant la Seconde Guerre mondiale : trois points et un trait, c'est la lettre V en morse. La garniture reprend le code, trois cerises et un bâtonnet d'ananas.", "s": "Difford's Guide, fiche « Three Dots and a Dash »", "lv": 1}, {"id": "9643765228", "t": "h4", "q": "Selon Trader Vic, le Mai Tai original de 1944 était fait avec :", "o": ["Un rhum jamaïcain Wray & Nephew de 17 ans", "Un rhum agricole de la Martinique", "Un rhum blanc cubain", "Un rhum épicé des îles Vierges"], "r": 0, "e": "Un rhum jamaïcain de 17 ans de J. Wray & Nephew, citron vert, curaçao, orgeat et sirop de sucre candi. Le stock s'épuisant, Vic passe ensuite à des assemblages.", "s": "V. Bergeron, Trader Vic's Bartender's Guide (éd. révisée, 1972)", "lv": 2}, {"id": "14368d4652", "t": "h4", "q": "Quel bar de San Francisco, ouvert en 2009 par Martin Cate, est une figure du renouveau tiki ?", "o": ["Smuggler's Cove", "Latitude 29", "Pagan Idol", "Three Dots and a Dash"], "r": 0, "e": "Martin Cate y défend une approche rigoureuse du rhum ; son livre « Smuggler's Cove » (2016), coécrit avec Rebecca Cate, propose une classification des rhums par méthode de production.", "s": "M. et R. Cate, Smuggler's Cove: Exotic Cocktails, Rum, and the Cult of Tiki (2016)", "lv": 1}, {"id": "e38e148f57", "t": "h4", "q": "Le Painkiller vient du Soggy Dollar Bar, dont le nom s'explique par :", "o": ["Les clients arrivant à la nage, billets mouillés", "Une inondation qui ruina le premier patron", "La monnaie locale, le « soggy dollar »", "Un cocktail servi dans une noix de coco percée"], "r": 0, "e": "Faute de ponton à Jost Van Dyke, les clients nageaient depuis leur bateau et payaient avec des billets trempés.", "s": "Difford's Guide, fiche « Painkiller »", "lv": 1}, {"id": "6fedeb8b32", "t": "h4", "q": "Le Fog Cutter et le Scorpion Bowl sont des classiques de :", "o": ["Trader Vic", "Donn Beach", "Harry Craddock", "Constante Ribalaigua"], "r": 0, "e": "Deux drinks de partage emblématiques du répertoire de Victor Bergeron, publiés dans ses guides.", "s": "V. Bergeron, Trader Vic's Bartender's Guide (1947)", "lv": 1}, {"id": "1e32703a3c", "t": "h4", "q": "Le Navy Grog original, à trois rhums, est une création de :", "o": ["Donn Beach", "Trader Vic", "Ernest Hemingway", "Martin Cate"], "r": 0, "e": "Trois rhums, citron vert, pamplemousse et sirop de miel, vers 1941 chez Don the Beachcomber. Trader Vic en a ensuite proposé sa version, servie avec un cône de glace autour de la paille.", "s": "J. Berry, Sippin' Safari (2007)", "lv": 1}, {"id": "53df1e3ce4", "t": "h4", "q": "Dans les cultures polynésiennes, un « tiki » désigne :", "o": ["Une figure sculptée d'ancêtre ou de divinité", "Un cocktail rituel à base de noix de coco", "Une hutte de paille au bord de la plage", "Un tambour de cérémonie"], "r": 0, "e": "En maori, Tiki est aussi le premier homme. Les mugs sculptés du bar tiki reprennent ces figures, dans une lecture très fantasmée de la Polynésie.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « tiki »", "lv": 1}];
const FICHES=[{"p": "h", "t": "Histoire du bar : repères", "html": "\n  <p class=\"fiche-lead\">Les dates, les lieux et les noms qui structurent deux siècles de bar.</p>\n  <div class=\"fiche-grid\">\n   <div class=\"fiche-block\"><h4>Les livres fondateurs</h4><ul>\n    <li><b>1862</b> : Jerry Thomas, <i>How to Mix Drinks, or The Bon-Vivant's Companion</i> : le premier livre de cocktails. Surnommé « le Professeur », auteur du Blue Blazer. La 2e édition (1876) codifie les Fizz.</li>\n    <li><b>1882</b> : Harry Johnson, <i>New and Improved Bartender's Manual</i> : le premier à traiter la <b>gestion</b> d'un bar.</li>\n    <li><b>1895</b> : George J. Kappeler, <i>Modern American Drinks</i> : première trace du <b>Harvard</b>.</li>\n    <li><b>1922</b> : Robert Vermeire, <i>Cocktails: How to Mix Them</i> (Londres), traduit en <i>L'Art du Cocktail</i>.</li>\n    <li><b>1927</b> : Harry McElhone, <i>Barflies and Cocktails</i> : le <b>Boulevardier</b>.</li>\n    <li><b>1930</b> : Harry Craddock, <i>The Savoy Cocktail Book</i> : le <b>Yellow Daisy</b>.</li>\n    <li><b>1934-1948</b> : Boothby, Beebe, Embury : le <b>Frisco</b>, sans citron.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Les dates qui font basculer le métier</h4><ul>\n    <li><b>1860-1880</b> : le <b>phylloxéra</b> ravage le vignoble : le cognac se raréfie, le whisky et le gin le remplacent dans les cocktails. Le Sazerac passe du cognac au rye.</li>\n    <li><b>1915</b> : interdiction de l'absinthe en France (Belgique 1906, Suisse 1910, États-Unis 1912).</li>\n    <li><b>1920-1933</b> : <b>Prohibition</b> américaine : 18e amendement en vigueur le 17 janvier 1920, abrogation le 5 décembre 1933. Les barmen américains s'exilent à Londres, Paris et Cuba : c'est l'âge d'or du bar européen.</li>\n    <li><b>1951</b> : fondation de l'<b>IBA</b>. <b>1955</b> premier concours (Amsterdam), <b>1961</b> première liste officielle.</li>\n    <li><b>Années 1980</b> : renaissance du cocktail : Dick Bradsell à Londres, Dale DeGroff à New York.</li>\n    <li><b>2011</b> : la mention « absinthe » redevient légale en France.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Les bars et les figures</h4><ul>\n    <li><b>Harry's New York Bar</b>, Paris, 1911 (rue Daunou, par le jockey Tod Sloan ; McElhone propriétaire en 1923).</li>\n    <li><b>American Bar du Savoy</b> : <b>Ada Coleman</b> (1903-1926), créatrice du Hanky Panky ; puis <b>Harry Craddock</b>.</li>\n    <li><b>Ritz Paris</b> : Frank Meier, chef barman du Ritz dans l'entre-deux-guerres.</li>\n    <li><b>El Floridita</b>, La Havane : Constante Ribalaigua et le daiquiri frappé.</li>\n    <li><b>Tiki</b> : Donn Beach (Don the Beachcomber, Hollywood, début 1930) puis Trader Vic (Oakland), Mai Tai, 1944.</li>\n    <li><b>Renaissance</b> : Dick Bradsell (Espresso Martini, Bramble), Dale DeGroff, Audrey Saunders (Pegu Club, Gin-Gin Mule).</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Les familles de cocktails</h4><ul>\n    <li><b>SOUR</b> : spiritueux + acide + sucre. Enfants : <b>Fizz</b> (allongé au soda après passage au verre), <b>Collins</b> (construit au verre sur glace), <b>Daisy</b> (avec liqueur), Sidecar, Margarita, Daiquiri.</li>\n    <li><b>AROMATIQUE / spiritueux</b> : Old-Fashioned, Manhattan, Martini, Negroni, Boulevardier, Harvard, Yellow Daisy.</li>\n    <li><b>PUNCH</b> : one of sour, two of sweet, three of strong, four of weak. Ancêtre du bar, première recette publiée en Inde en <b>1638</b>. Descendance tiki.</li>\n    <li><b>Autres</b> : Julep, Smash, Flip (œuf entier), Sling, Cobbler, Toddy (chaud), Swizzle, Highball, Mule, Colada, Spritz.</li>\n   </ul></div>\n  </div>"}, {"p": "h", "t": "Naissance du cocktail", "html": "<p>La première définition écrite du mot <strong>cocktail</strong> paraît en <span class=\"date\">1806</span> dans un journal de l'État de New York, <em class=\"em\">The Balance and Columbian Repository</em> : un mélange d'<strong>alcool, sucre, eau et bitters</strong>. Cette formule est exactement celle de l'<strong>Old Fashioned</strong>, considéré comme la structure originelle du cocktail.</p>\n  <ul>\n   <li><strong>Jerry Thomas</strong>, surnommé « The Professor », publie en <span class=\"date\">1862</span> <em class=\"em\">How to Mix Drinks; or, The Bon Vivant's Companion</em> : le premier livre de recettes de cocktails. Il est considéré comme le père de la mixologie américaine.</li>\n   <li>L'âge d'or américain s'étend de la fin du 19e siècle jusqu'à la Prohibition.</li>\n  </ul>"}, {"p": "h", "t": "La Prohibition et l'exode", "html": "<p>Aux États-Unis, le <strong>18e amendement</strong> (Volstead Act) instaure la Prohibition de <span class=\"date\">1920 à 1933</span>. Elle est abrogée par le 21e amendement.</p>\n  <ul>\n   <li>L'alcool circule dans les <strong>speakeasies</strong>, bars clandestins. La qualité douteuse des spiritueux favorise les recettes très aromatiques pour masquer.</li>\n   <li>Les barmen américains émigrent : vers <strong>Cuba</strong> (La Havane devient une capitale du cocktail) et vers l'<strong>Europe</strong>, surtout Londres et Paris.</li>\n   <li><strong>Harry Craddock</strong>, barman au <strong>Savoy de Londres</strong>, publie en <span class=\"date\">1930</span> le <em class=\"em\">Savoy Cocktail Book</em>, bible de l'époque.</li>\n   <li><strong>Harry MacElhone</strong> tient le <strong>Harry's New York Bar</strong> à Paris (5 rue Daunou). Berceau de plusieurs classiques.</li>\n  </ul>"}, {"p": "h", "t": "Tiki et renaissance moderne", "html": "<ul>\n   <li><strong>Tiki</strong> : né dans les années 1930. <strong>Donn Beach</strong> (Don the Beachcomber) ouvre à Hollywood, suivi de <strong>Trader Vic</strong> (Victor Bergeron) à Oakland. Rhums, sirops exotiques, orgeat. Paternité disputée du <strong>Mai Tai</strong> (revendiqué par Trader Vic, 1944) et du <strong>Zombie</strong> (Donn Beach).</li>\n   <li><strong>Renaissance craft</strong> : à partir des années 1980-90, <strong>Dale DeGroff</stron
