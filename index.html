<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F46A8">
<title>Culture Bar, le cahier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Culture Bar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@300;400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="classement.css">
</head>

<body>
<div class="app">
<aside class="rail">
  <div class="label">
    <h1>Culture Bar</h1>
    <div class="row who-row" onclick="CB.rename()" title="Changer de prénom">Nom :<b id="who">…</b><button class="ed" aria-label="Changer de prénom">modifier</button></div>
    <div class="row">Cahier :<b id="brand-sub"></b></div>
  </div>
  <div class="ruler-wrap">
    <div class="top"><span class="pct" id="g-pct">0%</span><span class="lbl">de la matière acquise</span></div>
    <div class="ruler"><i id="g-fill"></i></div>
    <div class="det" id="g-det"></div>
  </div>
  <h2>Mes matières <small>(coche les chapitres)</small></h2>
  <div id="parts"></div>
  <div class="links">
    <button class="chip" onclick="allCats(true)">Tout cocher</button>
    <button class="chip" onclick="allCats(false)">Tout décocher</button>
    <button class="chip" onclick="weakCats()">Mes points faibles</button>
  </div>
  <h2>Niveau</h2>
  <div class="lvls" id="lvls"></div>
  <h2>L'interro</h2>
  <div class="seg" id="seg-len"></div>
  <div class="row-tog"><span class="t">Chrono de 20 s</span><button class="sw" id="sw-chrono" aria-label="Chrono" onclick="toggle('ch')"><i></i></button></div>
  <div class="row-tog"><span class="t">Seulement ce qui est à revoir</span><button class="sw" id="sw-due" aria-label="Seulement ce qui est à revoir" onclick="toggle('dueOnly')"><i></i></button></div>
  <div class="row-tog"><span class="t">Passer seul si c'est juste</span><button class="sw" id="sw-auto" aria-label="Avance automatique" onclick="toggle('an')"><i></i></button></div>
  <div class="nav-rail">
    <button class="chip" data-v="home" onclick="go('home')">Interro</button>
    <button class="chip" data-v="exo" onclick="go('exo')">Exercices</button>
    <button class="chip" data-v="bulletin" onclick="go('bulletin')">Bulletin</button>
    <button class="chip" data-v="fiches" onclick="go('fiches')">Cahier de cours</button>
    <button class="chip wide" data-v="classement" onclick="go('classement')">🏆 Classement</button>
    <button class="chip erase" onclick="reset()">Effacer le cahier</button>
  </div>
</aside>
<main class="main" id="stage"></main>
</div>
<div id="modal"></div>

<script src="data/meta.js"></script>
<script src="data/q-h1.js"></script>
<script src="data/q-h2.js"></script>
<script src="data/q-h3.js"></script>
<script src="data/q-h4.js"></script>
<script src="data/q-h5.js"></script>
<script src="data/q-c1.js"></script>
<script src="data/q-c2.js"></script>
<script src="data/q-c3.js"></script>
<script src="data/q-c4.js"></script>
<script src="data/q-c5.js"></script>
<script src="data/q-p1.js"></script>
<script src="data/q-p2.js"></script>
<script src="data/q-p3.js"></script>
<script src="data/q-p4.js"></script>
<script src="data/q-p5.js"></script>
<script src="data/q-p6.js"></script>
<script src="data/q-p7.js"></script>
<script src="data/q-p8.js"></script>
<script src="data/fiches-h.js"></script>
<script src="data/fiches-c.js"></script>
<script src="data/fiches-p.js"></script>
<script src="data/exos.js"></script>
<script src="app.js"></script>
<script src="config.js"></script>
<script src="classement.js"></script>
</body>
</html>
