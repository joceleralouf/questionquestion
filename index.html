document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <div class=\"sig\">\n<\/div>\n<\/footer>\n\n<\/div>\n\n<!-- ====================== PANNEAU TWEAKS ====================== -->\n<aside id=\"tweaks\" aria-label=\"Tweaks\">\n  <div class=\"tw-head\">\n    <h3>Tweaks<\/h3>\n    <button class=\"tw-x\" onclick=\"closeTweaks()\" aria-label=\"Fermer\">×<\/button>\n  <\/div>\n  <div class=\"tw-body\">\n    <div class=\"tw-sec\">\n      <label>Ambiance<\/label>\n      <div class=\"seg\" id=\"seg-ambiance\">\n        <button data-v=\"comptoir\">Comptoir<\/button>\n        <button data-v=\"carte\">Carte<\/button>\n        <button data-v=\"neon\">Néon<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"tw-sec\">\n      <label>Mouvement<\/label>\n      <div class=\"seg\" id=\"seg-motion\">\n        <button data-v=\"calme\">Calme<\/button>\n        <button data-v=\"fluide\">Fluide<\/button>\n        <button data-v=\"vif\">Vif<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"tw-sec\">\n      <label>Accent spiritueux<\/label>\n      <div class=\"swatch-row\" id=\"seg-accent\">\n        <div class=\"swatch\" data-v=\"auto\" title=\"Selon l'ambiance\" style=\"background:linear-gradient(135deg,#E8A33C,#B0612F,#FFB23E)\"><\/div>\n        <div class=\"swatch\" data-v=\"cuivre\" title=\"Cuivre\" style=\"background:#C07A3E\"><\/div>\n        <div class=\"swatch\" data-v=\"absinthe\" title=\"Absinthe\" style=\"background:#9DB23A\"><\/div>\n        <div class=\"swatch\" data-v=\"grenat\" title=\"Grenat\" style=\"background:#C24A3A\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"tw-toggle-hint\">Bascule l'ambiance pour explorer trois directions&nbsp;: chaud &amp; classique, papier éditorial, ou moderne lumineux.<\/div>\n  <\/div>\n<\/aside>\n\n<script src=\"a5ce0365-9c35-4c9d-b655-fa81682b1675\"><\/script>\n<script>\n/* ====================== TWEAKS : DÉFAUTS ====================== */\nconst TWEAKS = /*EDITMODE-BEGIN*/{\n  \"ambiance\": \"carte\",\n  \"motion\": \"vif\",\n  \"accent\": \"absinthe\"\n}/*EDITMODE-END*/;\n\nfunction applyTweaks(){\n  document.body.setAttribute('data-ambiance', TWEAKS.ambiance);\n  document.body.setAttribute('data-motion', TWEAKS.motion);\n  if(TWEAKS.accent && TWEAKS.accent!=='auto') document.body.setAttribute('data-accent', TWEAKS.accent);\n  else document.body.removeAttribute('data-accent');\n  // reflect active states in panel\n  syncSeg('seg-ambiance', TWEAKS.ambiance);\n  syncSeg('seg-motion', TWEAKS.motion);\n  document.querySelectorAll('#seg-accent .swatch').forEach(s=>s.classList.toggle('on', s.dataset.v===TWEAKS.accent));\n  requestAnimationFrame(positionTabIndicator);\n}\nfunction syncSeg(id,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===val)); }\nfunction setTweak(key,val){\n  TWEAKS[key]=val; applyTweaks();\n  try{ window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[key]:val}}, '*'); }catch(e){}\n}\ndocument.getElementById('seg-ambiance').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTweak('ambiance',b.dataset.v);});\ndocument.getElementById('seg-motion').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTweak('motion',b.dataset.v);});\ndocument.getElementById('seg-accent').addEventListener('click',e=>{const s=e.target.closest('.swatch');if(s)setTweak('accent',s.dataset.v);});\n\n/* host protocol */\nwindow.addEventListener('message',e=>{\n  const t=e.data&&e.data.type;\n  if(t==='__activate_edit_mode') document.getElementById('tweaks').classList.add('show');\n  else if(t==='__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('show');\n});\nfunction closeTweaks(){\n  document.getElementById('tweaks').classList.remove('show');\n  try{ window.parent.postMessage({type:'__edit_mode_dismissed'}, '*'); }catch(e){}\n}\ntry{ window.parent.postMessage({type:'__edit_mode_available'}, '*'); }catch(e){}\n\n/* ====================== ÉTAT & PERSISTANCE ====================== */\nconst CLE='tdb-progression-v1';\nlet mastered=new Set(), wrong=new Set();\nfunction charger(){\n  try{\n    const d=JSON.parse(localStorage.getItem(CLE)||'{}');\n    mastered=new Set((d.m||[]).filter(i=>i<QUESTIONS.length));\n    wrong=new Set((d.w||[]).filter(i=>i<QUESTIONS.length));\n  }catch(e){}\n}\nfunction sauver(){ try{localStorage.setItem(CLE,JSON.stringify({m:[...mastered],w:[...wrong]}));}catch(e){} }\n\n/* ====================== CATÉGORIES ====================== */\nconst CATS=(()=>{\n  const map=new Map();\n  QUESTIONS.forEach((q,i)=>{ if(!map.has(q.c)) map.set(q.c,[]); map.get(q.c).push(i); });\n  return [...map.entries()].sort((a,b)=>b[1].length-a[1].length);\n})();\nlet catsActives=new Set(CATS.map(c=>c[0]));\nlet catMenuOpen=false;\nlet tailleSession=25;\nlet chronoActif=(()=>{try{return localStorage.getItem('tdb-chrono-v1')!=='0';}catch(e){return true;}})();\n\n/* ====================== NAVIGATION ====================== */\nfunction positionTabIndicator(){\n  const active=document.querySelector('.tab.on');\n  const ind=document.getElementById('tab-ind');\n  if(!active||!ind)return;\n  ind.style.left=active.offsetLeft+'px';\n  ind.style.width=active.offsetWidth+'px';\n}\nfunction switchTab(v){\n  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));\n  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='view-'+v));\n  positionTabIndicator();\n  if(v!=='quiz') stopChrono();\n  if(v==='prog') renderProgression();\n  if(v==='quiz' && !enSession) renderSetup();\n}\n\n/* ====================== JAUGE GLOBALE ====================== */\nfunction majBouteille(){\n  const tot=QUESTIONS.length, mas=mastered.size;\n  const pct=Math.round(mas/tot*100);\n  document.getElementById('pct-global').textContent=pct+'%';\n  document.getElementById('detail-global').textContent=`${mas} / ${tot} maîtrisées`;\n  const h=148*(mas/tot);\n  document.getElementById('liquide').setAttribute('transform',`translate(0,${(148-h).toFixed(1)})`);\n}\n\n/* ====================== FICHES ====================== */\nfunction renderFicheUI(){\n  document.getElementById('intro-fiche').textContent=\n    `${FICHE.length} chapitres, l'essentiel pour un questionnaire de concours. Lis vite, puis passe au quiz pour ancrer en active recall.`;\n  const list=document.getElementById('acc-list');\n  list.innerHTML=FICHE.map((s,i)=>`\n   <div class=\"acc\" data-txt=\"${(s.t+' '+s.body).replace(/<[^>]+>/g,' ').toLowerCase().replace(/\"/g,'')}\">\n     <button class=\"acc-head\" onclick=\"this.parentElement.classList.toggle('open')\">\n       <span class=\"acc-num\">${String(i+1).padStart(2,'0')}<\/span>\n       <span class=\"acc-title\">${s.t}<\/span>\n       <span class=\"chev\">&#9654;<\/span>\n     <\/button>\n     <div class=\"acc-body\"><div class=\"acc-inner\">${s.body}<\/div><\/div>\n   <\/div>`).join('');\n}\nfunction filtrerFiches(q){\n  q=q.trim().toLowerCase();\n  document.querySelectorAll('#acc-list .acc').forEach(a=>{\n    a.style.display=(!q||a.dataset.txt.includes(q))?'':'none';\n  });\n}\n\n/* ====================== QUIZ : MISE EN PLACE ====================== */\nlet enSession=false;\nfunction statsCat(nom){\n  const idx=CATS.find(c=>c[0]===nom)[1];\n  const mas=idx.filter(i=>mastered.has(i)).length;\n  return {tot:idx.length,mas};\n}\nfunction renderSetup(){\n  const stage=document.getElementById('quiz-stage');\n  const dispoTotal=[...catsActives].reduce((n,c)=>{const s=statsCat(c);return n+(s.tot-s.mas);},0);\n  stage.innerHTML=`\n   <div class=\"setup-card\">\n     <div class=\"setup-titre\">Composer la session<\/div>\n     <div class=\"setup-sous\">Choisis tes terrains de jeu. Les questions ratées repassent en premier ; les maîtrisées sont écartées.<\/div>\n     <div class=\"cat-select ${catMenuOpen?'open':''}\">\n       <button class=\"cat-toggle\" onclick=\"toggleCatMenu()\">\n         <span class=\"cat-label\">Catégories<span class=\"cat-count\">${catsActives.size} / ${CATS.length}<\/span><\/span>\n         <span class=\"chev2\">&#9660;<\/span>\n       <\/button>\n       <div class=\"cat-menu\"><div class=\"cat-menu-inner\">\n         <div class=\"chips-actions\">\n           <button class=\"lien\" onclick=\"toutesCats(true)\">Tout sélectionner<\/button>\n           <button class=\"lien\" onclick=\"toutesCats(false)\">Tout retirer<\/button>\n           <button class=\"lien\" onclick=\"catsFaibles()\">Mes points faibles<\/button>\n         <\/div>\n         <div class=\"chips\">\n           ${CATS.map(([nom])=>{\n             const s=statsCat(nom);\n             return `<button class=\"chip ${catsActives.has(nom)?'on':''}\" onclick=\"toggleCat('${nom.replace(/'/g,\"\\\\'\")}')\">\n               ${nom}<span class=\"nb\">${s.mas}/${s.tot}<\/span>\n               <span class=\"fill\" style=\"width:${s.tot?Math.round(s.mas/s.tot*100):0}%\"><\/span>\n             <\/button>`;\n           }).join('')}\n         <\/div>\n       <\/div><\/div>\n     <\/div>\n     <div class=\"taille-row\">\n       ${[10,25,50,100].map(n=>`<button class=\"taille ${tailleSession===n?'on':''}\" onclick=\"setTaille(${n})\">${n}<small>questions<\/small><\/button>`).join('')}\n     <\/div>\n     <div class=\"opt-chrono\">\n       <div class=\"oc-txt\"><span class=\"oc-titre\">Chrono<\/span><span class=\"oc-sous\">15 secondes par question, décompte visible pendant la session<\/span><\/div>\n       <button type=\"button\" class=\"switch ${chronoActif?'on':''}\" role=\"switch\" aria-checked=\"${chronoActif}\" aria-label=\"Activer le chrono\" onclick=\"toggleChrono(this)\"><span class=\"knob\"><\/span><\/button>\n     <\/div>\n     <div class=\"setup-foot\">\n       <button class=\"btn\" id=\"btn-go\" onclick=\"startQuiz()\" ${dispoTotal===0?'disabled':''}>Commencer la session<\/button>\n       <button class=\"danger\" onclick=\"reinitialiser()\">Réinitialiser la progression<\/button>\n     <\/div>\n     <div class=\"setup-note\">${\n       dispoTotal===0\n       ? (catsActives.size===0 ? 'Sélectionne au moins une catégorie.' : 'Tout est maîtrisé dans cette sélection. Élargis, ou remets à zéro depuis Progression.')\n       : `${dispoTotal} question${dispoTotal>1?'s':''} disponible${dispoTotal>1?'s':''} dans cette sélection${wrong.size?` — dont ${[...wrong].filter(i=>catsActives.has(QUESTIONS[i].c)).length} à revoir en priorité`:''}.`\n     }<\/div>\n   <\/div>`;\n}\nfunction toggleCatMenu(){ catMenuOpen=!catMenuOpen; const el=document.querySelector('.cat-select'); if(el) el.classList.toggle('open', catMenuOpen); }\nfunction toggleCat(nom){ if(catsActives.has(nom)) catsActives.delete(nom); else catsActives.add(nom); renderSetup(); }\nfunction toutesCats(on){ catsActives = on? new Set(CATS.map(c=>c[0])) : new Set(); renderSetup(); }\nfunction catsFaibles(){\n  catsActives=new Set(CATS.filter(([nom])=>{const s=statsCat(nom);return s.mas/s.tot<.5;}).map(c=>c[0]));\n  if(catsActives.size===0) catsActives=new Set(CATS.map(c=>c[0]));\n  renderSetup();\n}\nfunction setTaille(n){ tailleSession=n; renderSetup(); }\nfunction toggleChrono(btn){ chronoActif=!chronoActif; try{localStorage.setItem('tdb-chrono-v1',chronoActif?'1':'0');}catch(e){} if(btn){btn.classList.toggle('on',chronoActif);btn.setAttribute('aria-checked',String(chronoActif));} }\n\n/* ====================== QUIZ : SESSION ====================== */\nlet pool=[], poolIdx=[], idx=0, score=0, answered=false, serie=0, meilleureSerie=0;\nlet sessionCats=new Map();\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\n\nfunction startQuiz(){\n  const dansSelection=i=>catsActives.has(QUESTIONS[i].c);\n  const rates=shuffle([...wrong].filter(i=>dansSelection(i)&&!mastered.has(i)));\n  const neuves=shuffle(QUESTIONS.map((_,i)=>i).filter(i=>dansSelection(i)&&!mastered.has(i)&&!wrong.has(i)));\n  poolIdx=[...rates,...neuves].slice(0,tailleSession);\n  if(poolIdx.length===0){renderSetup();return;}\n  poolIdx=shuffle(poolIdx);\n  pool=poolIdx.map(i=>QUESTIONS[i]);\n  idx=0;score=0;answered=false;serie=0;meilleureSerie=0;sessionCats=new Map();\n  enSession=true;\n  renderQuestion();\n}\n\nfunction renderQuestion(){\n  const q=pool[idx];\n  const pct=Math.round(idx/pool.length*100);\n  document.getElementById('quiz-stage').innerHTML=`\n   <div class=\"quiz-card${q.brille?' brille':''}\">\n     <div class=\"q-top\">\n       <span class=\"q-cat\">${q.c}<\/span>\n       <div class=\"q-compteurs\">\n         <span>${idx+1} / ${pool.length}<\/span>\n         <span class=\"serie\" id=\"serie\"><span class=\"fl\">&#9670;<\/span> série ${serie}<\/span>\n         ${chronoActif?`<span class=\"chrono\" id=\"chrono\" title=\"15 secondes par question\">\n           <svg viewBox=\"0 0 40 40\"><circle class=\"chrono-bg\" cx=\"20\" cy=\"20\" r=\"15.5\"/><circle class=\"chrono-arc\" id=\"chrono-arc\" cx=\"20\" cy=\"20\" r=\"15.5\"/><\/svg>\n           <span class=\"chrono-num\" id=\"chrono-num\">15<\/span>\n         <\/span>`:``}\n       <\/div>\n     <\/div>\n     <div class=\"bar\"><div class=\"bar-fill\" style=\"width:${pct}%\"><\/div><\/div>\n     <div class=\"q-text\">${q.q}<\/div>\n     <div class=\"opts\" id=\"opts\">\n       ${shuffle(q.o.map((_,i)=>i)).map((origI,pos)=>`<button class=\"opt\" data-i=\"${origI}\" onclick=\"choose(${origI})\"><span class=\"letter\">${\"ABCD\"[pos]}<\/span><span>${q.o[origI]}<\/span><\/button>`).join('')}\n     <\/div>\n     <div class=\"explain\" id=\"explain\"><b>Pour mémoire<\/b>${q.e}${q.src?`<span class='src'>Source : ${q.src}<\/span>`:''}<\/div>\n     <div class=\"q-nav\">\n       <span class=\"raccourci\"><kbd>1<\/kbd>–<kbd>4<\/kbd> répondre &nbsp; <kbd>Entrée<\/kbd> suivant<\/span>\n       <button class=\"btn\" id=\"next\" onclick=\"next()\" disabled>Suivant<\/button>\n     <\/div>\n   <\/div>`;\n  startChrono();\n}\n\n/* ---- chrono 15 s ---- */\nconst CHRONO_MS=15000, CHRONO_SEC=15, CHRONO_C=2*Math.PI*15.5;\nlet chronoRaf=null, chronoTO=null;\nfunction stopChrono(){ if(chronoRaf)cancelAnimationFrame(chronoRaf); if(chronoTO)clearTimeout(chronoTO); chronoRaf=chronoTO=null; }\nfunction startChrono(){\n  stopChrono();\n  if(!chronoActif) return;\n  const arc=document.getElementById('chrono-arc'), num=document.getElementById('chrono-num'), box=document.getElementById('chrono');\n  if(!arc) return;\n  const t0=performance.now();\n  (function frame(t){\n    const k=Math.min(1,(t-t0)/CHRONO_MS);\n    arc.style.strokeDasharray=`${(CHRONO_C*k).toFixed(2)} ${CHRONO_C.toFixed(2)}`;\n    const rem=Math.max(0,Math.ceil((1-k)*CHRONO_SEC));\n    if(num) num.textContent=rem;\n    if(box) box.classList.toggle('warn', rem<=3 && !answered);\n    if(k<1 && !answered) chronoRaf=requestAnimationFrame(frame);\n  })(t0);\n  chronoTO=setTimeout(tempsEcoule, CHRONO_MS);\n}\nfunction tempsEcoule(){\n  if(answered) return;\n  answered=true; stopChrono();\n  const q=pool[idx], real=poolIdx[idx];\n  if(!sessionCats.has(q.c)) sessionCats.set(q.c,{ok:0,tot:0});\n  sessionCats.get(q.c).tot++;\n  document.querySelectorAll('#opts .opt').forEach(b=>{\n    b.disabled=true; const bi=+b.dataset.i;\n    if(bi===q.a) b.classList.add('good','reveal'); else b.classList.add('estompe');\n  });\n  serie=0; wrong.add(real);\n  sauver(); majBouteille();\n  const box=document.getElementById('chrono'); if(box){ box.classList.remove('warn'); box.classList.add('out'); }\n  const num=document.getElementById('chrono-num'); if(num) num.textContent='0';\n  document.getElementById('explain').classList.add('show');\n  const nx=document.getElementById('next');\n  nx.disabled=false; nx.textContent = idx===pool.length-1 ? \"Voir le score\" : \"Suivant\"; nx.focus();\n}\n\nfunction choose(i){\n  if(answered)return;\n  answered=true; stopChrono();\n  const box=document.getElementById('chrono'); if(box){ box.classList.remove('warn'); box.classList.add('out'); }\n  const q=pool[idx], real=poolIdx[idx];\n  if(!sessionCats.has(q.c)) sessionCats.set(q.c,{ok:0,tot:0});\n  const sc=sessionCats.get(q.c); sc.tot++;\n  const opts=document.querySelectorAll('#opts .opt');\n  opts.forEach(b=>{\n    b.disabled=true;const bi=+b.dataset.i;\n    if(bi===q.a){b.classList.add('good','reveal');}\n    else if(bi===i){b.classList.add('bad','reveal');}\n    else b.classList.add('estompe');\n  });\n  if(i===q.a){\n    score++; sc.ok++; serie++; meilleureSerie=Math.max(meilleureSerie,serie);\n    mastered.add(real); wrong.delete(real);\n    const se=document.getElementById('serie');\n    if(se){ se.innerHTML=`<span class=\"fl\">&#9670;<\/span> série ${serie}`; se.classList.add('pop'); }\n  } else { serie=0; wrong.add(real); }\n  sauver(); majBouteille();\n  document.getElementById('explain').classList.add('show');\n  const nx=document.getElementById('next');\n  nx.disabled=false;\n  nx.textContent = idx===pool.length-1 ? \"Voir le score\" : \"Suivant\";\n  nx.focus();\n}\n\nfunction next(){\n  if(!answered)return;\n  stopChrono();\n  if(idx<pool.length-1){idx++;answered=false;renderQuestion();}\n  else showResult();\n}\n\nfunction showResult(){\n  enSession=false; stopChrono();\n  const pct=Math.round(score/pool.length*100);\n  let cls,verdict,detail;\n  if(pct>=85){cls=\"or\";verdict=\"Niveau finaliste\";detail=\"Tu tiens le comptoir. Garde le rythme et vise les catégories incomplètes.\";}\n  else if(pct>=60){cls=\"ok\";verdict=\"Solide, peaufine les détails\";detail=\"La base est là. Les ratées de cette session repasseront en premier au prochain tirage.\";}\n  else{cls=\"bas\";verdict=\"Reprends la fiche avant demain\";detail=\"Retourne lire les chapitres concernés, puis relance une session courte sur ces catégories.\";}\n  const C=2*Math.PI*76;\n  const ratees=[...wrong].filter(i=>catsActives.has(QUESTIONS[i].c)).length;\n  const arcColor = pct>=85?'var(--accent)':pct>=60?'var(--good)':'var(--bad)';\n  document.getElementById('quiz-stage').innerHTML=`\n   <div class=\"quiz-card result\">\n     <div class=\"score-ring\">\n       <svg width=\"176\" height=\"176\">\n         <circle cx=\"88\" cy=\"88\" r=\"76\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"10\"/>\n         <circle class=\"arc\" cx=\"88\" cy=\"88\" r=\"76\" fill=\"none\" stroke=\"${arcColor}\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"0 ${C.toFixed(1)}\"/>\n       <\/svg>\n       <div class=\"score-centre\"><b id=\"score-num\">0%<\/b><span>${score} / ${pool.length}<\/span><\/div>\n     <\/div>\n     <div class=\"verdict ${cls}\">${verdict}<\/div>\n     <p class=\"result-detail\">${detail} Meilleure série : <strong style=\"color:var(--accent-hi)\">${meilleureSerie}<\/strong>.\n        Maîtrise globale : ${mastered.size} / ${QUESTIONS.length}.<\/p>\n     <div class=\"cats-session\">\n       ${[...sessionCats.entries()].sort((a,b)=>b[1].tot-a[1].tot).map(([nom,s])=>`\n         <div class=\"cat-ligne\">\n           <span class=\"nom\">${nom}<\/span>\n           <span class=\"mini\"><i data-w=\"${Math.round(s.ok/s.tot*100)}\" style=\"width:0%\"><\/i><\/span>\n           <span class=\"sc\">${s.ok}/${s.tot}<\/span>\n         <\/div>`).join('')}\n     <\/div>\n     <div class=\"result-actions\">\n       <button class=\"btn\" onclick=\"startQuiz()\">Nouvelle session<\/button>\n       ${ratees>0?`<button class=\"btn ghost\" onclick=\"sessionRatees()\">Rejouer les ratées (${Math.min(ratees,tailleSession)})<\/button>`:''}\n       <button class=\"btn ghost\" onclick=\"renderSetup()\">Changer la sélection<\/button>\n     <\/div>\n   <\/div>`;\n  // animate ring + count + minibars\n  requestAnimationFrame(()=>{\n    const arc=document.querySelector('.score-ring .arc');\n    if(arc) arc.setAttribute('stroke-dasharray',`${(C*pct/100).toFixed(1)} ${C.toFixed(1)}`);\n    document.querySelectorAll('.cats-session .mini i').forEach(el=>el.style.width=el.dataset.w+'%');\n  });\n  countUp(document.getElementById('score-num'), pct);\n}\nfunction countUp(el,target){\n  if(!el)return;\n  const calme=document.body.getAttribute('data-motion')==='calme';\n  if(calme){el.textContent=target+'%';return;}\n  const start=performance.now(), dur=900;\n  function tick(t){\n    const k=Math.min(1,(t-start)/dur);\n    const e=1-Math.pow(1-k,3);\n    el.textContent=Math.round(target*e)+'%';\n    if(k<1)requestAnimationFrame(tick);\n  }\n  requestAnimationFrame(tick);\n}\nfunction sessionRatees(){\n  const dansSelection=i=>catsActives.has(QUESTIONS[i].c);\n  poolIdx=shuffle([...wrong].filter(dansSelection)).slice(0,tailleSession);\n  if(!poolIdx.length){renderSetup();return;}\n  pool=poolIdx.map(i=>QUESTIONS[i]);\n  idx=0;score=0;answered=false;serie=0;meilleureSerie=0;sessionCats=new Map();\n  enSession=true;renderQuestion();\n}\n\n/* ====================== PROGRESSION ====================== */\nfunction renderProgression(){\n  const grid=document.getElementById('prog-grid');\n  grid.innerHTML=CATS.map(([nom,idx])=>{\n    const mas=idx.filter(i=>mastered.has(i)).length;\n    const pct=Math.round(mas/idx.length*100);\n    return `<div class=\"prog-row ${pct===100?'complet':''}\">\n      <span class=\"nom\">${nom}<\/span>\n      <span class=\"jauge\"><i data-w=\"${pct}\" style=\"width:0%\"><\/i><\/span>\n      <span class=\"compte\">${mas} / ${idx.length}<\/span>\n    <\/div>`;\n  }).join('');\n  requestAnimationFrame(()=>document.querySelectorAll('#prog-grid .jauge i').forEach(el=>el.style.width=el.dataset.w+'%'));\n}\nfunction reinitialiser(){\n  if(!confirm('Remettre toute la progression à zéro ? Toutes les questions redeviendront disponibles.'))return;\n  mastered.clear();wrong.clear();sauver();majBouteille();renderProgression();\n  if(!enSession)renderSetup();\n}\n\n/* ====================== CLAVIER ====================== */\ndocument.addEventListener('keydown',e=>{\n  if(!document.getElementById('view-quiz').classList.contains('on'))return;\n  if(!enSession)return;\n  if(e.key==='Enter'){e.preventDefault();next();return;}\n  const n=parseInt(e.key,10);\n  if(n>=1&&n<=4&&!answered){const opts=document.querySelectorAll('#opts .opt');if(opts[n-1])opts[n-1].click();}\n});\n\n/* ====================== INIT ====================== */\napplyTweaks();\ncharger();\nmajBouteille();\nrenderFicheUI();\nrenderSetup();\nwindow.addEventListener('load',()=>requestAnimationFrame(positionTabIndicator));\nwindow.addEventListener('resize',positionTabIndicator);\nrequestAnimationFrame(positionTabIndicator);\n<\/script>\n\n\n\n<script src=\"185eced6-d39a-4c0a-bd45-f6b99f4fdb27\"><\/script>\n<script src=\"88bdb0d3-50ef-4e74-af3e-5970bf750e42\"><\/script>\n\n<style id=\"__om-edit-overrides\">\n<\/style>\n<\/body><\/html>"
  </script>
