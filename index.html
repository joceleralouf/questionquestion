 {cat:"Réglementation & production", q:"Quel pays est le premier producteur mondial de café ?", o:["Colombie","Brésil","Vietnam","Éthiopie"], r:1, e:"Le Brésil, loin devant le Vietnam (surtout robusta). <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Sous quelle pression environ s'extrait un espresso ?", o:["3 bars","6 bars","9 bars","15 bars"], r:2, e:"Environ 9 bars : c'est cette pression qui crée la crema. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce qu'un ristretto ?", o:["Un espresso allongé","Un espresso serré (moins d'eau)","Un café filtre","Un double espresso"], r:1, e:"Un espresso « serré », extrait avec moins d'eau ; le lungo est l'inverse. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"D'où vient le mot « moka » ?", o:["D'une variété d'arabica","Du port yéménite de Mocha","D'un torréfacteur italien","D'une ville éthiopienne"], r:1, e:"Du port de Mocha (Al-Makha) au Yémen, plaque tournante historique du café. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quel berger légendaire aurait découvert le café en Éthiopie ?", o:["Kaldi","Omar","Baba Budan","Sheridan"], r:0, e:"Kaldi, intrigué par l'excitation de ses chèvres après avoir mangé les cerises. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Combien de temps dure typiquement une extraction cold brew ?", o:["1 à 2 h","12 à 24 h","48 à 72 h","Une semaine"], r:1, e:"12 à 24 h à froid : résultat moins acide et moins amer qu'un café chaud refroidi. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce que la cascara ?", o:["Une liqueur de café","La pulpe séchée de la cerise de café","Une variété de robusta","Le marc de café"], r:1, e:"La pulpe séchée du fruit, infusée comme un thé ; utile en sirops. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quelle est la garniture canonique de l'Espresso Martini ?", o:["Un zeste d'orange","Trois grains de café","Une feuille de menthe","Un trait de cacao"], r:1, e:"Trois grains de café, symbolisant santé, richesse et bonheur. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Où et par qui le Black Russian a-t-il été créé ?", o:["À Moscou, par un barman russe","À Bruxelles, par Gustave Tops","À New York, par Dale DeGroff","À Londres, par Dick Bradsell"], r:1, e:"Par Gustave Tops à l'hôtel Métropole de Bruxelles en 1949. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quel cocktail chaud Joe Sheridan a-t-il créé en Irlande ?", o:["Le Tom & Jerry","L'Irish Coffee","Le Blue Blazer","Le Carajillo"], r:1, e:"L'Irish Coffee, à l'aérogare de Foynes vers 1943. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Un caffè corretto italien est un espresso « corrigé » avec :", o:["De la crème","De la grappa ou de la sambuca","Du sirop","Du lait chaud"], r:1, e:"Un alcool, le plus souvent grappa ou sambuca. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Le réseau d'arômes du café torréfié provient surtout :", o:["De la fermentation","De la réaction de Maillard","De l'oxydation","De la lyophilisation"], r:1, e:"De la réaction de Maillard et de la caramélisation pendant la torréfaction. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quels sont les trois cépages principaux du champagne ?", o:["Chardonnay, pinot noir, meunier","Chardonnay, riesling, gamay","Pinot noir, syrah, merlot","Chenin, chardonnay, pinot gris"], r:0, e:"Chardonnay (blanc), pinot noir et meunier (noirs). <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Que désigne un champagne « blanc de blancs » ?", o:["Sans dosage","Issu uniquement de cépages blancs","Vieilli plus longtemps","Sans bulles"], r:1, e:"Élaboré uniquement à partir de cépages blancs, soit le chardonnay en pratique. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Comment s'appelle la seconde fermentation en bouteille du champagne ?", o:["La prise de mousse","Le dégorgement","Le remuage","Le ouillage"], r:0, e:"La prise de mousse, déclenchée par la liqueur de tirage (sucre + levures). <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"À quelle maison attribue-t-on l'invention du pupitre de remuage ?", o:["Moët & Chandon","Veuve Clicquot","Krug","Ruinart"], r:1, e:"À la Veuve Clicquot, vers 1816, pour clarifier le vin. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Quelle pression règne environ dans une bouteille de champagne ?", o:["2 bars","6 bars","9 bars","15 bars"], r:1, e:"Environ 6 bars, d'où la nécessité du muselet. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Quelle est la durée minimale d'élevage sur lattes d'un champagne non millésimé ?", o:["6 mois","15 mois","3 ans","5 ans"], r:1, e:"15 mois minimum ; un millésimé exige au moins 3 ans. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Quel volume contient un magnum ?", o:["1 L","1,5 L","3 L","6 L"], r:1, e:"1,5 L, soit deux bouteilles. Le jéroboam fait 3 L. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Dom Pérignon était moine de quelle abbaye ?", o:["Cîteaux","Hautvillers","Cluny","Clairvaux"], r:1, e:"L'abbaye d'Hautvillers ; il a perfectionné l'assemblage, sans inventer les bulles. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Hors de la Champagne, la méthode traditionnelle donne :", o:["Un mousseux","Un crémant","Un perlant","Un pétillant naturel"], r:1, e:"Un crémant (Alsace, Bourgogne, Loire…), même méthode, autre appellation. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"En quelle année l'AOC Champagne a-t-elle été délimitée ?", o:["1908","1927","1936","1945"], r:2, e:"1936, parmi les premières AOC françaises. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Que contient un Champagne Cocktail (IBA) ?", o:["Sucre, Angostura, cognac, champagne","Cassis et champagne","Pêche et prosecco","Absinthe et champagne"], r:0, e:"Sucre imbibé d'Angostura, cognac, complété au champagne. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Le Death in the Afternoon associe le champagne à :", o:["L'absinthe","Le cognac","La chartreuse","Le cassis"], r:0, e:"De l'absinthe ; cocktail attribué à Hemingway en 1935. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Qui a créé l'Old Cuban (rhum, menthe, citron vert, champagne) ?", o:["Audrey Saunders","Dale DeGroff","Sasha Petraske","Dick Bradsell"], r:0, e:"Audrey Saunders, en 2001 au restaurant Beacon (New York), avant son Pegu Club. Un Mojito coiffé de champagne. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Le sabrage du champagne est traditionnellement attribué :", o:["Aux moines","Aux hussards napoléoniens","Aux vignerons champenois","Aux marins anglais"], r:1, e:"Aux hussards de Napoléon, ouvrant la bouteille au sabre. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"À quelle température sert-on idéalement le champagne ?", o:["2 à 4 °C","8 à 10 °C","12 à 14 °C","16 à 18 °C"], r:1, e:"8 à 10 °C : trop froid, les arômes se ferment. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Combien de communes, ou crus, compte l'aire AOC Champagne ?", o:["280","312","319","340"], r:2, e:"319 communes-crus, délimitées par la loi de 1927 (~34 300 ha). Certains supports de concours citent 312 : la valeur officielle du Comité Champagne est 319. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Combien de villages champenois sont classés grand cru ?", o:["7","17","44","51"], r:1, e:"17 grands crus (classés à 100 % sur l'ancienne échelle des crus), et 44 premiers crus. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Comment s'appelle le repas de fin de vendanges en Champagne ?", o:["La paulée","La gerbaude","Le cochelet","Le revole"], r:2, e:"Le cochelet. La paulée est bourguignonne, la gerbaude se dit dans le Sud-Ouest. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Quelle est la plus ancienne maison de champagne ?", o:["Ruinart","Moët & Chandon","Veuve Clicquot","Gosset"], r:0, e:"Ruinart, fondée en 1729. Piège : Gosset (1584) est plus ancienne, mais comme maison de vins tranquilles — pas de champagne. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Quelle maison commercialise la cuvée « R.D. » ?", o:["Mumm","Bollinger","Gosset","Ruinart"], r:1, e:"Bollinger. R.D. signifie « Récemment Dégorgé » : long vieillissement sur lies, dégorgement tardif. <span class='src'>Source : Comité Champagne</span>"},
 {cat:"Réglementation & production", q:"Comment appelle-t-on un collectionneur d'étiquettes de bière ?", o:["Un vitolphiliste","Un cervalobélophile","Un tégestophile","Un philuméniste"], r:1, e:"Le cervalobélophile. Le tégestophile collectionne les objets brassicoles (sous-bocks), le vitolphiliste les bagues de cigare. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Quel type de fermentation caractérise la gueuze ?", o:["Fermentation haute","Fermentation basse","Fermentation spontanée","Fermentation mixte"], r:2, e:"Fermentation spontanée par levures sauvages, puis assemblage de lambics d'âges différents. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Quelle est la substance jaune contenue dans les cônes de houblon ?", o:["La lupuline","La chlorophylle","L'humulone pure","La pectine"], r:0, e:"La lupuline, poudre résineuse qui porte les acides amers et les huiles aromatiques. <span class='src'>Source : Oxford Companion to Beer (Oxford UP)</span>"},
 {cat:"Réglementation & production", q:"Dans quelle ville française le premier lot de café est-il arrivé ?", o:["Paris","Marseille","Bordeaux","Nantes"], r:1, e:"Marseille, vers 1644, par le commerce levantin — avant la mode parisienne. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quel est le poids standard d'un sac de jute de café vert ?", o:["30 kg","60 kg","90 kg","100 kg"], r:1, e:"60 kg, l'unité de référence du négoce mondial du café. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Comment s'appelle la cueillette sélective du café à la main ?", o:["Le stripping","Le picking","Le pruning","Le sorting"], r:1, e:"Le picking : seules les cerises mûres sont cueillies, contre le stripping qui rafle toute la branche. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quel est le taux maximal de caféine d'un café torréfié décaféiné (UE) ?", o:["0,01 %","0,1 %","0,3 %","1 %"], r:1, e:"0,1 % pour le torréfié (0,3 % pour le soluble). Attention : un corrigé répandu indique 0,01 %, c'est faux. <span class='src'>Source : Specialty Coffee Association (SCA)</span>"},
 {cat:"Réglementation & production", q:"Quels cépages entrent dans le vermouth Noilly Prat ?", o:["Picpoul et clairette","Ugni blanc et colombard","Grenache et cinsault","Chardonnay et viognier"], r:0, e:"Picpoul et clairette, élevés en partie en plein air à Marseillan. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Le pineau des Charentes est-il une mistelle ?", o:["Oui","Non"], r:0, e:"Oui : moût de raisin muté à l'eau-de-vie de cognac, fermentation bloquée. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"De quelle ville la manzanilla est-elle originaire ?", o:["Jerez de la Frontera","Sanlúcar de Barrameda","El Puerto de Santa María","Cadix"], r:1, e:"Sanlúcar de Barrameda, dont l'air marin marque le style de cette manzanilla sous flor. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Le cépage palomino donne des xérès…", o:["Secs","Doux","Effervescents","Mutés au moût"], r:0, e:"Secs : fino, manzanilla, oloroso. Les doux viennent du pedro ximénez et du moscatel. Piège : un corrigé MOF en circulation répond « doux », c'est faux. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Comment s'appellent les bateaux à fond plat qui transportaient le porto ?", o:["Les gabares","Les rabelos","Les chalands","Les carrelets"], r:1, e:"Les rabelos (barcos rabelos), descendant le Douro jusqu'à Vila Nova de Gaia. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Quels bateaux à fond plat transportaient les fûts de cognac sur la Charente ?", o:["Les rabelos","Les barges","Les gabares","Les chalands"], r:2, e:"Les gabares, qui descendaient la Charente vers les ports d'expédition. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"L'appellation Entre-deux-Mers est comprise entre :", o:["La Garonne et la Dordogne","La Dordogne et la Gironde","La Gironde et la Garonne","La Garonne et le Ciron"], r:0, e:"Entre Garonne et Dordogne, dont la confluence forme la Gironde. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Quel est le taux de sucre minimum du moût pour élaborer un vin doux naturel ?", o:["150 g/L","210 g/L","252 g/L","300 g/L"], r:2, e:"252 g/L de sucres naturels minimum avant mutage : la signature réglementaire des VDN. <span class='src'>Source : Difford’s Guide ; cahiers des charges DO/AOC</span>"},
 {cat:"Réglementation & production", q:"Comment se nomme l'outil tranchant du jimador pour récolter la piña d'agave ?", o:["Le machete","La coa","La hoz","Le cuchillo"], r:1, e:"La coa (coa de jima), lame ronde au bout d'un long manche. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Quelle eau-de-vie provient de l'État de Chihuahua ?", o:["La tequila","Le mezcal","Le sotol","La charanda"], r:2, e:"Le sotol, distillé du Dasylirion — qui n'est d'ailleurs pas un agave. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Vieillissement minimum d'une tequila añejo ?", o:["6 mois","12 mois","18 mois","3 ans"], r:1, e:"12 mois minimum en fût (extra añejo : 3 ans). Piège : un corrigé MOF en circulation répond 6 mois, c'est faux — 2 mois, c'est le reposado. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Comment se nomme le résidu fibreux du broyage de la canne à sucre ?", o:["La mélasse","Le vesou","La bagasse","La vinasse"], r:2, e:"La bagasse, souvent brûlée comme combustible de distillerie. Le vesou est le jus. <span class='src'>Source : Règlement UE 2019/787 ; AOC Rhum agricole Martinique</span>"},
 {cat:"Réglementation & production", q:"De quel comté anglais le Plymouth gin est-il originaire ?", o:["Devon","Berkshire","Norfolk","Kent"], r:0, e:"Le Devon. Plymouth fut longtemps une appellation protégée, abandonnée en 2015. <span class='src'>Source : Scotch Whisky Regulations 2009 (UK)</span>"},
 {cat:"Réglementation & production", q:"Quelle distillerie est alimentée par la source Robbie Dhu ?", o:["The Dalmore","Glenfiddich","Macallan","Nikka"], r:1, e:"Glenfiddich, à Dufftown (Speyside). <span class='src'>Source : Scotch Whisky Regulations 2009 (UK)</span>"},
 {cat:"Réglementation & production", q:"Quelle distillerie détient la plus ancienne licence (1608) ?", o:["Old Bushmills","Glenturret","Midleton","Kilbeggan"], r:0, e:"Old Bushmills, Irlande du Nord : licence royale de distillation accordée en 1608. <span class='src'>Source : Scotch Whisky Regulations 2009 (UK)</span>"},
 {cat:"Réglementation & production", q:"À quelle dynastie le bourbon doit-il son nom ?", o:["Aux Stuart","Aux Bourbons","Aux Habsbourg","Aux Tudor"], r:1, e:"À la maison de Bourbon — hommage à la France de Louis XVI pour son aide pendant la guerre d'indépendance. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quand date le premier écrit mentionnant une distillation de cidre en Normandie ?", o:["28 mars 1453","28 mars 1553","28 mars 1653","28 mars 1753"], r:1, e:"Le 28 mars 1553, dans le journal du sire Gilles de Gouberville — acte de naissance documentaire du calvados. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Comment s'appelle l'opération qui consiste à brûler l'intérieur d'un fût ?", o:["Le rabotage","Le bousinage","Le fonçage","Le cintrage"], r:1, e:"Le bousinage, qui caramélise le bois et conditionne le profil aromatique. <span class='src'>Source : Règlement UE 2019/787 ; cahiers des charges</span>"},
 {cat:"Réglementation & production", q:"En quelle année le premier Gin Act a-t-il été promulgué à Londres ?", o:["1689","1736","1751","1820"], r:1, e:"1736, pour endiguer la Gin Craze — complété par celui de 1751. <span class='src'>Source : Règlement UE 2019/787 (catégories de spiritueux)</span>"},
 {cat:"Réglementation & production", q:"Depuis quand l'alambic charentais est-il autorisé pour l'Armagnac ?", o:["1872","1936","1972","2005"], r:2, e:"1972 : la double distillation à repasse rejoint l'alambic armagnacais à colonne continue. <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"Quels sont les quatre cépages principaux de l'Armagnac ?", o:["Ugni blanc, baco 22A, folle blanche, colombard","Ugni blanc, sémillon, sauvignon, merlot blanc","Folle blanche, chardonnay, picpoul, clairette","Baco 22A, tannat, gros manseng, colombard"], r:0, e:"Ugni blanc (majoritaire), baco 22A, folle blanche et colombard — dix cépages autorisés au total. <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"En quelle année est née l'AOC Blanche d'Armagnac ?", o:["2003","2005","2013","2015"], r:1, e:"2005 : eau-de-vie blanche, non boisée, de Gascogne. <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"Comment définit-on une Blanche d'Armagnac ?", o:["Aucune maturation","Repos minimum de 3 mois en contenants inertes","12 mois de fût minimum","Filtrée à froid uniquement"], r:1, e:"Un repos d'au moins 3 mois en récipients inertes : aucune coloration, fruit intact. <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"Quel rhum est élaboré à partir de miel vierge de canne ?", o:["Angostura","Barceló","Plantation","Zacapa"], r:3, e:"Zacapa (Guatemala) : la base est un miel vierge de canne concentré, pas une mélasse classique. <span class='src'>Source : Règlement UE 2019/787 ; AOC Rhum agricole Martinique</span>"},
 {cat:"Réglementation & production", q:"Quel pourcentage minimum de poires impose le calvados Domfrontais ?", o:["10 %","30 %","50 %","70 %"], r:1, e:"30 % minimum de poires à poiré — la signature du Domfrontais, distillé en colonne. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quel était le degré de la Chartreuse jaune entre 1973 et 2018 ?", o:["40 %","43 %","45 %","55 %"], r:0, e:"40 % — réponse attendue en concours. Les Jaunes « période Voiron » titrent 40°, avant le retour au degré d'origine de 43°. <span class='src'>Source : Règlement UE 2019/787 (catégories de spiritueux)</span>"},
 {cat:"Réglementation & production", q:"Quel matériau de filtration est le plus traditionnellement associé à la vodka ?", o:["Le charbon de bouleau","Le quartz","Le sable volcanique","La cellulose"], r:0, e:"Le charbon (classiquement de bouleau), qui neutralise les congénères. Chaque marque cultive ensuite sa variante marketing. <span class='src'>Source : Règlement UE 2019/787</span>"},
 {cat:"Réglementation & production", q:"Durée de fermentation minimale du cidre pour l'AOC calvados ?", o:["2 semaines","1 mois","6 semaines","8 semaines"], r:1, e:"1 mois minimum. Échelle à retenir : calvados 1 mois, Pays d'Auge 6 semaines, Domfrontais 8 semaines. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Durée de fermentation minimale pour le calvados Pays d'Auge ?", o:["1 mois","6 semaines","8 semaines","6 mois"], r:1, e:"6 semaines, avant double distillation à repasse — exigence supérieure à l'AOC calvados (1 mois). <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Durée de fermentation minimale pour le calvados Domfrontais ?", o:["1 mois","6 semaines","8 semaines","12 semaines"], r:2, e:"8 semaines, la plus longue des trois AOC — fruits à poiré obligent. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Teneur maximale en thuyone des boissons élaborées à partir d'Artemisia (UE) ?", o:["5 mg/kg","10 mg/kg","35 mg/kg","120 mg/kg"], r:2, e:"35 mg/kg pour les boissons aux armoises (absinthe) ; 10 mg/kg pour les autres boissons alcoolisées. <span class='src'>Source : Règlement (CE) 1334/2008 (arômes) ; OFDT</span>"},
 {cat:"Réglementation & production", q:"Quelle est la seule épice française protégée par une AOC ?", o:["Le safran du Quercy","Le piment d'Espelette","La vanille de Tahiti","Le poivre de Penja"], r:1, e:"Le piment d'Espelette, AOC depuis 2000 (AOP 2002). <span class='src'>Source : Règlement UE 2019/787 ; cahiers des charges</span>"},
 {cat:"Réglementation & production", q:"Quand l'INAO a-t-il été créé ?", o:["30 juillet 1935","1er mai 1936","30 juillet 1945","13 janvier 1938"], r:0, e:"Par le décret-loi du 30 juillet 1935, qui fonde aussi le système des AOC viticoles. <span class='src'>Source : Règlement UE 2019/787 ; cahiers des charges</span>"},
 {cat:"Histoire du bar", q:"Quel est le point commun entre Giuseppe Garibaldi et Gaspare Campari ?", o:["Nés la même année","Morts la même année","Tous deux Milanais","Associés en affaires"], r:1, e:"Morts tous deux en 1882 — clin d'œil du cocktail Garibaldi, Campari et jus d'orange. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Dans quel établissement Jean Jaurès a-t-il été assassiné le 31 juillet 1914 ?", o:["Le Café du Croissant","Le Café de Flore","Le Procope","Les Deux Magots"], r:0, e:"Le Café du Croissant, rue Montmartre à Paris. <span class='src'>Source : Fait historique documenté (presse, 1914)</span>"},
 {cat:"Histoire du bar", q:"Quel barman a ressuscité le Last Word dans les années 2000 ?", o:["Julien Escot","Murray Stenson","Maxime Hoerth","Colin Field"], r:1, e:"Murray Stenson, au Zig Zag Café de Seattle (2004), à partir du recueil de Ted Saucier. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Combien d'ingrédients liquides compte le Vesper ?", o:["2","3","4","5"], r:1, e:"Trois : gin, vodka, Kina Lillet — « shaken, not stirred ». <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"De quel bar parisien le Pick Me Up est-il un classique ?", o:["Le Bar Hemingway","Le Harry's New York Bar","Le Forvm","Le Little Red Door"], r:1, e:"Le Harry's New York Bar, comme le Blue Lagoon et tant d'autres. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Dans quelle ville se trouve le musée des Meilleurs Ouvriers de France ?", o:["Paris","Lyon","Bourges","Tours"], r:2, e:"À Bourges, dans l'ancien palais archiépiscopal. <span class='src'>Source : Comité d’organisation d’un concours MOF</span>"},
 {cat:"Histoire du bar", q:"Selon la doctrine classique, de combien d'ingrédients se compose un classic cocktail ?", o:["2","3","4","5"], r:1, e:"Trois — base, modificateur, trait d'équilibre. Doctrine d'école, à nuancer au comptoir. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Une eau minérale naturelle doit-elle avoir une composition stable en minéraux ?", o:["Oui, c'est une exigence légale","Non, elle varie librement"], r:0, e:"Oui : la stabilité de composition est précisément ce qui définit l'eau minérale naturelle face à l'eau de source. Piège : un corrigé répandu répond non. <span class='src'>Source : Directive 2009/54/CE (eaux minérales naturelles)</span>"},
 {cat:"Histoire du bar", q:"Le grade GFOP désigne-t-il le meilleur thé ?", o:["Oui","Non"], r:1, e:"Non : l'échelle monte jusqu'à SFTGFOP (Special Finest Tippy Golden Flowery Orange Pekoe). <span class='src'>Source : Classification internationale du thé (orthodoxe)</span>"},
 {cat:"Histoire du bar", q:"Quel est le principal pays producteur de réglisse en Europe ?", o:["La France","L'Allemagne","L'Espagne","L'Italie"], r:2, e:"L'Espagne, fournisseur historique des anisés français. <span class='src'>Source : Difford’s Guide</span>"},
 {cat:"Histoire du bar", q:"En 2026, qui a terminé deuxième aux Wizard Awards de Gabriel Boudier ?", o:["Romain Cattenoz","Etienne Henry","Lucas Weisgerber","Thibault Marchal"], r:1, e:"Etienne Henry, deuxième des Wizard Awards Gabriel Boudier 2026. <span class='src'>Source : Gabriel Boudier — Wizard Awards 2026</span>"},
 {cat:"Histoire du bar", q:"Dans quel pays se situe Pinar del Río ?", o:["Le Brésil","L'Espagne","Cuba","Le Portugal"], r:2, e:"Cuba : la province du tabac, terroir de la Vuelta Abajo. <span class='src'>Source : Habanos S.A.</span>"},
 {cat:"Histoire du bar", q:"Que mesure l'échelle de Scoville ?", o:["L'amertume du houblon","La force piquante des piments","L'acidité d'un agrume","Le degré de torréfaction"], r:1, e:"La pungence (capsaïcine) des piments, en unités Scoville. <span class='src'>Source : Échelle de Scoville (W. Scoville, 1912)</span>"},
 {cat:"Histoire du bar", q:"Que signifie le sigle D.O.M. sur la Bénédictine ?", o:["Deo Optimo Maximo","Domus Omnium Monachorum","Dominus Omnia Meum","Deo Optimo Mundi"], r:0, e:"« Deo Optimo Maximo » : à Dieu très bon, très grand — devise bénédictine. <span class='src'>Source : Bénédictine — Palais Bénédictine (Fécamp)</span>"},
 {cat:"Histoire du bar", q:"À quoi correspond le « 54 » de l'Izarra 54 ?", o:["Son département de production","Son nombre de plantes","Son degré d'alcool","Son année de création"], r:2, e:"54 % vol : la liqueur basque verte dans sa version au degré d'origine. <span class='src'>Source : Izarra (producteur, Bayonne)</span>"},
 {cat:"Histoire du bar", q:"Qui a remis aux Chartreux le manuscrit de l'élixir en 1605 ?", o:["Hannibal de Voiron","François Hannibal d'Estrées","Hannibal d'Isère","Le duc de Lesdiguières"], r:1, e:"Le maréchal François Hannibal d'Estrées — d'où la date fondatrice de 1605. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},
 {cat:"Histoire du bar", q:"Quelles sont les trois AOC du pommeau ?", o:["Normandie, Bretagne, Maine","Normandie, Anjou, Perche","Bretagne, Vendée, Maine","Normandie, Bretagne, Picardie"], r:0, e:"Pommeau de Normandie, de Bretagne et du Maine — moût de pomme muté au calvados ou à l'eau-de-vie de cidre locale. <span class='src'>Source : INAO</span>"},
 {cat:"Réglementation & production", q:"En quelle année le permis d'exploitation a-t-il été créé ?", o:["2002","2006","2008","2010"], r:1, e:"Par la loi du 31 mars 2006 — formation devenue obligatoire pour ouvrir ou reprendre un débit. <span class='src'>Source : Code de la santé publique / Légifrance</span>"},
 {cat:"Réglementation & production", q:"TAV maximal de distillation du cognac ?", o:["65 %","72,4 %","75 %","94,8 %"], r:1, e:"72,4 % au récipient journalier, sortie d'alambic charentais — pour préserver les volatils. Vente : 40 % minimum. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Entre quelles bornes se situe le TAV des eaux-de-vie d'Armagnac à la distillation ?", o:["40 et 65 %","52 et 72,4 %","65 et 75 %","70 et 85 %"], r:1, e:"52–72,4 % en colonne armagnacaise (65–72,4 % pour les bonnes chauffes à repasse). Le bas degré garde le gras du vin. <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"TAV de sortie de colonne du rhum AOC Martinique ?", o:["40–55 %","55–65 %","65–75 %","75–85 %"], r:2, e:"65–75 % en sortie de colonne : assez bas pour conserver 225 g/hL d'éléments volatils. Embouteillage : 40 % minimum. <span class='src'>Source : Règlement UE 2019/787 ; AOC Rhum agricole Martinique</span>"},
 {cat:"Réglementation & production", q:"TAV acquis du pineau des Charentes à la mise en marché ?", o:["15–17 %","16–22 %","17–25 %","18–20 %"], r:1, e:"Entre 16 et 22 % vol — un vrai cas de minimum ET maximum réglementaires (décret de 2009). <span class='src'>Source : INAO — AOC Pineau des Charentes</span>"},
 {cat:"Réglementation & production", q:"TAV du floc de Gascogne ?", o:["15–17 %","16–18 %","16–22 %","17–20 %"], r:1, e:"16–18 % vol : deux tiers de moût, un tiers d'armagnac. Fourchette plus serrée que le pineau (16–22). <span class='src'>Source : INAO / BNIAA — cahiers des charges Armagnac</span>"},
 {cat:"Réglementation & production", q:"TAV acquis d'un vin doux naturel ?", o:["12–15 %","15–18 %","16–22 %","18–21 %"], r:1, e:"15–18 % vol acquis après mutage à l'alcool neutre — Banyuls, Maury, Rivesaltes. <span class='src'>Source : INAO — AOC VDN</span>"},
 {cat:"Réglementation & production", q:"TAV maximal de distillation du whisky dans l'UE ?", o:["72,4 %","85 %","94,8 %","96 %"], r:2, e:"Moins de 94,8 % : au-dessus, le distillat perdrait l'arôme des matières premières. Vente : 40 % minimum. <span class='src'>Source : Cahiers des charges AOC/IG ; Règlement UE 2019/787</span>"},
 {cat:"Réglementation & production", q:"Entre quelles bornes une tequila doit-elle titrer ?", o:["35–55 %","38–48 %","36–50 %","40–55 %"], r:0, e:"35–55 % vol selon la norme mexicaine. Piège croisé : 38–48 %, c'est la cachaça. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Entre quelles bornes le porto doit-il titrer ?", o:["15–18 %","16–22 %","19–22 %","20–25 %"], r:2, e:"19–22 % vol pour l'essentiel des portos, mutés à l'aguardente à 77 %. <span class='src'>Source : IVDP — Instituto dos Vinhos do Douro e do Porto</span>"},
 {cat:"Réglementation & production", q:"À la commercialisation, le rhum AOC Martinique titre :", o:["Entre 37,5 et 65 %","Entre 40 et 75 %","Minimum 50 %","Maximum 62 %"], r:1, e:"Entre 40 % (minimum légal) et 75 % (plafond du brut de colonne) — les blancs 50°/55° vivent dans cette fourchette. <span class='src'>Source : Règlement UE 2019/787 ; AOC Rhum agricole Martinique</span>"},
 {cat:"Réglementation & production", q:"Quelle est la date limite de distillation des vins destinés au Cognac ?", o:["31 décembre de l'année de récolte","31 janvier suivant la récolte","31 mars de l'année qui suit la récolte","30 juin suivant la récolte"], r:2, e:"31 mars de l'année qui suit la récolte — pour limiter l'érosion aromatique des vins non sulfités. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Au moment de la distillation, les vins de Cognac doivent titrer :", o:["Entre 5 et 9 %","Entre 7 et 12 %","Entre 9 et 14 %","Entre 10 et 13 %"], r:1, e:"TAV entre 7 et 12 % vol — des vins peu alcoolisés pour concentrer les arômes, et acides pour se conserver sans SO2. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"TAV minimal du Cognac à la mise en marché vers le consommateur ?", o:["37,5 %","40 %","41 %","43 %"], r:1, e:"40 % vol minimum, avec au moins 200 g de substances volatiles par hl d'alcool pur. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce que l'« Esprit de Cognac » ?", o:["Un cognac hors d'âge","Une 3e distillation à 80–85 % destinée aux vins mousseux","Le cœur de la bonne chauffe","Un cognac non réduit"], r:1, e:"Distillation supplémentaire de la deuxième chauffe, 80–85 % vol, non vieillie — exclusivement pour l'élaboration des vins mousseux. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Quel cru du Cognac est réputé pour son parfum de violette ?", o:["Grande Champagne","Fins Bois","Borderies","Bons Bois"], r:2, e:"Les Borderies : eaux-de-vie rondes, bouquetées et douces, marquées par la violette. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Quel est le cru le plus vaste du vignoble de Cognac ?", o:["Grande Champagne","Petite Champagne","Fins Bois","Bois Ordinaires"], r:2, e:"Les Fins Bois — eaux-de-vie rondes et souples au bouquet de raisin pressé, vieillissant assez vite. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Quel géologue est à l'origine du classement des crus du Cognac vers 1860 ?", o:["Henri Coquand","Louis Pasteur","Jules Guyot","Victor Rendu"], r:0, e:"Henri Coquand, professeur de géologie, valide avec un dégustateur un classement selon les sols — base du décret de 1938. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Volume de charge maximal de l'alambic charentais en bonne chauffe ?", o:["12 hl","25 hl","30 hl","120 hl"], r:1, e:"25 hl de charge (chaudière de 30 hl max, tolérance 5 %). Les 120/140 hl ne valent que pour la première chauffe. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Vieillissement minimal pour qu'une mention « XXO » figure sur un Cognac ?", o:["10 ans","12 ans","14 ans","20 ans"], r:2, e:"XXO / Extra Extra Old : 14 ans minimum. Mention rattachée au compte 10 mais avec exigence propre de 14 ans. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"L'effet des méthodes de finition (caramel, sucre, boisé) sur l'obscuration du Cognac est limité à :", o:["1 % vol","2 % vol","4 % vol","8 % vol"], r:2, e:"4 % vol maximum — différence entre TAV réel et TAV brut. Seuls caramel E150a, édulcoration et infusion de copeaux de chêne sont autorisés. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"En quelle année le Cognac est-il reconnu en appellation d'origine contrôlée ?", o:["1909","1936","1938","1946"], r:1, e:"1936. La zone est délimitée dès 1909, les crus en 1938, et le BNIC naît en 1946. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Lequel n'est PAS un cépage principal du Cognac ?", o:["Colombard","Folle blanche","Montils","Chardonnay"], r:3, e:"Les cépages principaux : ugni blanc, colombard, folle blanche, montils et sémillon. Le chardonnay n'en fait pas partie. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Pourquoi le SO2 est-il interdit pendant les fermentations des vins de Cognac ?", o:["Il bloque la fermentation","Il génère un excès d'acétaldéhyde","Il colore le vin","Il attaque le cuivre de l'alambic"], r:1, e:"Le sulfitage en fermentation provoque une formation accrue d'acétaldéhyde — caractère oxydé rédhibitoire à la distillation. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Quel champignon noircit les pierres autour des chais de Cognac ?", o:["Botrytis cinerea","Torula compniacensis","Aspergillus niger","Penicillium roqueforti"], r:1, e:"Torula compniacensis, nourri par la part des anges — l'évaporation annuelle équivaut à plusieurs millions de bouteilles. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Quel autre nom officiel l'AOC Cognac peut-elle porter ?", o:["Eau-de-vie des Charentes","Fine de Saintonge","Brandy charentais","Eau-de-vie d'Aunis"], r:0, e:"« Cognac », « Eau-de-vie de Cognac » ou « Eau-de-vie des Charentes » — trois noms pour la même AOC. <span class='src'>Source : BNIC — cahier des charges AOC Cognac</span>"},
 {cat:"Réglementation & production", q:"Combien d'AOC de Calvados existe-t-il ?", o:["2","3","4","5"], r:1, e:"Trois : Calvados, Calvados Pays d'Auge et Calvados Domfrontais — anciennement scindées en partie en AOR. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quel mode de distillation est obligatoire pour le Calvados Pays d'Auge ?", o:["Colonne continue","Alambic à repasse","Hydrodistillation","Aucun mode imposé"], r:1, e:"L'alambic à repasse (double distillation) est obligatoire en Pays d'Auge. L'AOC Calvados, elle, n'impose rien. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Comment est distillé le Calvados Domfrontais ?", o:["Double distillation à repasse","Simple distillation en continu à l'alambic à colonne","Au choix du producteur","Triple distillation"], r:1, e:"Simple distillation en jet continu à l'alambic à colonne — à l'opposé du Pays d'Auge. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Vieillissement minimal du Calvados Domfrontais ?", o:["2 ans","3 ans","4 ans","6 ans"], r:1, e:"3 ans sous chêne — un an de plus que le Calvados et le Pays d'Auge (2 ans). <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Vieillissement minimal de l'AOC Calvados avant commercialisation ?", o:["1 an","2 ans","3 ans","30 mois"], r:1, e:"2 ans en fûts de chêne, comme le Pays d'Auge. Seul le Domfrontais exige 3 ans. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Proportion maximale de poires à poiré dans les cidres à distiller du Pays d'Auge ?", o:["10 %","20 %","30 %","50 %"], r:2, e:"30 % maximum en Pays d'Auge — alors que le Domfrontais en impose au minimum 30 %. Piège miroir classique. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quelle surface couvre le verger dédié au Calvados ?", o:["3 000 ha","8 000 ha","15 000 ha","25 000 ha"], r:1, e:"Environ 8 000 hectares répartis sur les trois aires d'appellation. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Combien de variétés de pommes à cidre sont sélectionnées pour le Calvados ?", o:["48","139","230","312"], r:2, e:"230 variétés de pommes à cidre et 139 variétés de poires à poiré, choisies pour leur richesse en polyphénols. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Les vergers de Calvados comportent au moins 70 % de variétés dites :", o:["Acidulées","Phénoliques (amères et douces-amères)","Douces","Tardives"], r:1, e:"Au moins 70 % de variétés phénoliques — pommes amères et douces-amères, riches en tanins. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Part minimale des surfaces en haute tige dans le verger du Calvados Domfrontais ?", o:["35 %","45 %","60 %","80 %"], r:3, e:"80 % minimum en Domfrontais, contre 45 % en Pays d'Auge et 35 % pour l'AOC Calvados. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Dans le Domfrontais, les poiriers représentent au minimum quelle part de la surface des vergers ?", o:["10 %","25 %","40 %","50 %"], r:1, e:"25 % minimum de la surface totale des vergers de l'exploitation — la signature du Domfrontais. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Densité maximale d'un verger haute tige en AOC Calvados ?", o:["150 arbres/ha","280 arbres/ha","500 arbres/ha","1 000 arbres/ha"], r:1, e:"280 arbres/ha maximum, écartement minimal de 5 m entre arbres, rendement plafonné à 25 t/ha. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quelle hauteur peuvent atteindre les poiriers haute tige du Domfrontais ?", o:["5 m","8 m","15 m","25 m"], r:2, e:"Jusqu'à 15 m — des arbres de plein vent, parfois tricentenaires, uniques en France. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quels sols dominent l'aire du Calvados Pays d'Auge ?", o:["Sables granitiques","Coteaux argilo-calcaires peu profonds","Schistes","Limons profonds"], r:1, e:"Coteaux argilo-calcaires peu profonds, sur la partie orientale du département du Calvados et quelques communes de l'Orne et de l'Eure. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Sur quels départements s'étend principalement le Calvados Domfrontais ?", o:["Calvados, Eure, Oise","Manche, Orne, Mayenne","Seine-Maritime, Eure","Sarthe, Mayenne, Loire-Atlantique"], r:1, e:"Sud du bocage normand : Manche, Orne et Mayenne principalement. <span class='src'>Source : INAO / IDAC — cahier des charges AOC Calvados</span>"},
 {cat:"Réglementation & production", q:"Quelle distillerie signe la première distillation d'un Whisky de France dans sa version actuelle, en 1983 ?", o:["Distillerie Monce","Warenghem","Rozelieures","Glann ar Mor"], r:1, e:"Warenghem, dans les Côtes-d'Armor (Bretagne), en 1983. Le whisky français moderne est né là. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Quelle est l'aire géographique de l'IG Whisky de France ?", o:["La France métropolitaine, Corse incluse","La France hexagonale sans la Corse","France + DROM","Bretagne et Alsace uniquement"], r:0, e:"Toute la France métropolitaine, y compris la Corse — du broyage des grains à la mise sous bois. IG en cours d'instruction à l'INAO (non homologuée début 2026). <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"TAV maximal au collecteur journalier pour un Whisky de France en distillation discontinue ?", o:["72 %","85 %","88 %","94,8 %"], r:2, e:"88 % vol à 20 °C en discontinu. Le 94,8 % est le plafond UE générique du whisky — piège classique. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"TAV maximal au collecteur pour un Whisky de France en distillation continue multi-étagée ?", o:["88 %","90 %","92 %","94,8 %"], r:2, e:"92 % vol en continu, contre 88 % en discontinu — deux plafonds distincts, tous deux sous le 94,8 % européen. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Capacité maximale de la chaudière d'un alambic discontinu pour le Whisky de France ?", o:["25 hl","30 hl","120 hl","250 hl"], r:2, e:"120 hl en discontinu. Les 25/30 hl, c'est le Cognac — ne pas croiser les cahiers des charges. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Capacité maximale d'un appareil de distillation continue pour le Whisky de France ?", o:["120 hl de moût par 24 h","250 hl de moût par 24 h","400 hl de moût par 24 h","Aucune limite"], r:1, e:"250 hl de moûts fermentés par période de 24 heures et par appareil. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"L'ajout de sucre dans le moût avant distillation d'un Whisky de France est :", o:["Autorisé jusqu'à 10 g/L","Autorisé en année déficitaire","Interdit","Autorisé sur dérogation"], r:2, e:"Interdit — garantie de l'origine naturelle de l'eau-de-vie, comme l'interdiction des céréales transgéniques. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Quelles céréales sont explicitement interdites pour le Whisky de France ?", o:["Le maïs","Les variétés transgéniques","Le seigle","Les céréales importées"], r:1, e:"Les variétés transgéniques. Aucune céréale n'est imposée ni exclue par nature — seuls les OGM sont bannis. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Pour la mention « Single Malt », un Whisky de France doit être distillé :", o:["En colonne continue","En distillation discontinue, orge maltée, une seule distillerie","Deux fois minimum","En alambic charentais"], r:1, e:"Moût d'orge maltée exclusivement, une seule distillerie, et distillation discontinue (simple ou multi-étagée) — la colonne continue est exclue du Single Malt. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Quel type de fût est interdit pour l'affinage (finishing) d'un Whisky de France ?", o:["Ex-fût de sherry","Ex-fût de cognac","Fût ayant contenu une boisson aromatisée","Fût neuf"], r:2, e:"Les fûts de boissons alcoolisées aromatisées sont interdits. Sherry, cognac, porto : autorisés et revendicables en étiquette. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Le changement de fût en cours de vieillissement d'un Whisky de France :", o:["Rompt le vieillissement","Est interdit","Est autorisé si le nouveau fût fait moins de 700 L","Est limité à un seul changement"], r:2, e:"Autorisé sans rompre le vieillissement, à condition que le nouveau fût fasse moins de 700 litres. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Comment un Whisky de France peut-il être expédié en vrac hors de l'aire géographique ?", o:["En barrique uniquement","En récipients inertes uniquement","Il ne peut pas quitter l'aire","En cuve bois de plus de 700 L"], r:1, e:"Récipients inertes obligatoires : le vieillissement sous bois hors de l'aire est interdit, donc pas de barrique au départ. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Quelles IG régionales de whisky préexistent à l'IG Whisky de France ?", o:["Whisky de Bretagne et Whisky d'Alsace","Whisky de Lorraine et Whisky de Corse","Whisky des Charentes","Whisky de Normandie"], r:0, e:"Whisky de Bretagne et Whisky d'Alsace — un produit peut être déclaré sous l'IG régionale puis replié en Whisky de France. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"En 2023, la filière du whisky français compte environ :", o:["20 distilleries","50 distilleries","100 distilleries","300 distilleries"], r:2, e:"Une centaine de distilleries et ~1,5 million de bouteilles vendues — contre 7 distilleries et 100 000 bouteilles en 2000. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"Quelle mention peut désigner l'assemblage de deux Single Malt français ?", o:["Pure Malt","Double Malt","Twin Malt","Blended Grain"], r:1, e:"« Double Malt » (ou Triple Malt pour trois, etc.) — variantes du Blended/Multiple Malt prévues par le cahier des charges. <span class='src'>Source : INAO — cahier des charges IG Whisky de France</span>"},
 {cat:"Réglementation & production", q:"TAV maximal de distillation du bourbon ?", o:["70 % (140 proof)","80 % (160 proof)","85 % (170 proof)","94,8 %"], r:1, e:"160 proof soit 80 % vol maximum — en dessous du plafond UE du whisky (94,8 %), pour préserver le caractère du grain. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"TAV maximal d'entrée en fût du bourbon ?", o:["55 % (110 proof)","62,5 % (125 proof)","70 % (140 proof)","80 % (160 proof)"], r:1, e:"125 proof soit 62,5 % vol maximum à la mise en fût — troisième chiffre du trio légal : 160 distillation, 125 entrée, 80 embouteillage. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Durée minimale de vieillissement d'un bourbon « tout court » ?", o:["Aucune durée minimale","6 mois","2 ans","4 ans"], r:0, e:"Aucune ! Le contact avec le chêne neuf carbonisé suffit. Seul le « straight bourbon » exige 2 ans minimum. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Que garantit la mention « straight » sur un bourbon ?", o:["Un seul fût","Minimum 2 ans de vieillissement","Aucune réduction à l'eau","Production au Kentucky"], r:1, e:"Straight = minimum 2 ans en chêne neuf carbonisé, sans additif. Sous 4 ans, l'âge doit figurer sur l'étiquette. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"En dessous de quel âge la mention d'âge est-elle obligatoire sur un straight bourbon ?", o:["2 ans","3 ans","4 ans","6 ans"], r:2, e:"Sous 4 ans, l'âge exact doit être indiqué. Au-delà, l'étiquette peut rester muette. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quels additifs sont autorisés dans le bourbon ?", o:["Caramel E150a","Caramel et arômes de chêne","Aucun, seulement l'eau de réduction","Sucre jusqu'à 2 g/L"], r:2, e:"Aucun additif — contrairement au Scotch (caramel autorisé) ou au Cognac. Seule l'eau de réduction est permise. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Qu'a déclaré le Congrès américain au sujet du bourbon en 1964 ?", o:["Boisson nationale officielle","« Distinctive product of the United States »","Monopole du Kentucky","Interdiction d'exportation"], r:1, e:"Résolution de 1964 : le bourbon est un « produit distinctif des États-Unis » — il ne peut être produit ailleurs. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce qui distingue le corn whiskey du bourbon ?", o:["Moins de maïs","≥ 80 % maïs et fût usagé ou neuf non carbonisé","Distillation en colonne interdite","Il est toujours non vieilli"], r:1, e:"Corn whiskey : minimum 80 % de maïs, et s'il est vieilli, c'est en fût usagé ou neuf NON carbonisé — l'inverse exact du bourbon. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Que désigne le « mashbill » ?", o:["Le registre de distillation","La composition céréalière du moût","La facture du malteur","Le niveau de chauffe du fût"], r:1, e:"La recette céréalière : ex. 75 % maïs, 13 % seigle, 12 % orge maltée. Elle signe le style de chaque maison. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Que signifie le procédé « sour mash » ?", o:["Fermentation lactique","Réensemencement avec une partie du moût de la distillation précédente","Ajout de citron","Moût non filtré"], r:1, e:"Une fraction du moût épuisé (backset, acide) ensemence le nouveau brassin : pH stabilisé, profil constant. Quasi universel dans le bourbon. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce qu'un « wheated bourbon » ?", o:["Un bourbon 51 % blé","Un bourbon où le blé remplace le seigle en céréale secondaire","Un whiskey de blé","Un bourbon non maltée"], r:1, e:"Le maïs reste majoritaire (≥51 %), mais le blé remplace le seigle : profil plus doux. Maker's Mark, Weller, Pappy Van Winkle. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Que garantit la mention « single barrel » ?", o:["Un assemblage de moins de 10 fûts","L'embouteillage d'un seul et unique fût","Un fût neuf","Un seul passage en alambic"], r:1, e:"Le contenu d'un seul fût, sans assemblage — chaque fût a donc son profil propre, contrairement au small batch. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Comment s'appelle le chai de vieillissement traditionnel du bourbon ?", o:["Dunnage","Rickhouse","Bodega","Paradis"], r:1, e:"Le rickhouse (ou rackhouse) : chai à étages où la position du fût (haut chaud, bas frais) modifie fortement le profil. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Comment surnomme-t-on le niveau de carbonisation n°4 des fûts ?", o:["Devil char","Alligator char","Black snake","Ember char"], r:1, e:"« Alligator char » (~55 s de flamme) : le bois craquelé évoque une peau d'alligator. Niveau le plus courant pour le bourbon. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Un « blended bourbon » doit contenir au minimum :", o:["20 % de straight bourbon","51 % de straight bourbon","75 % de straight bourbon","100 % de bourbon"], r:1, e:"51 % minimum de straight bourbon, le reste pouvant être d'autres whiskeys ou alcool neutre — d'où sa réputation inférieure. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Dans quel type de fût le rye whiskey américain doit-il vieillir ?", o:["Chêne usagé","Chêne neuf carbonisé","Tout chêne de moins de 700 L","Chêne français neuf"], r:1, e:"Chêne neuf carbonisé, comme le bourbon — mêmes plafonds aussi : 160 proof à la distillation, 125 à l'entrée en fût. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quelle teneur minimale en seigle exige le whisky canadien étiqueté « rye » ?", o:["51 %","40 %","25 %","Aucune"], r:3, e:"Aucune ! « Rye » est au Canada une appellation traditionnelle, pas réglementaire. Le piège transfrontalier classique. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quelles régions sont le berceau historique du rye américain ?", o:["Kentucky et Tennessee","Pennsylvanie et Maryland","New York et Boston","Virginie et Caroline"], r:1, e:"Pennsylvanie (style Monongahela, puissant) et Maryland (réputé plus souple) — bien avant la domination du Kentucky bourbon. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quel whiskey servait de base originelle au Manhattan ?", o:["Le bourbon","Le rye","Le Canadian whisky","L'Irish whiskey"], r:1, e:"Le rye, whiskey dominant à New York au 19e siècle. Le bourbon ne s'est imposé qu'après la Prohibition. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quelle est la plus ancienne marque de whiskey américain en activité continue ?", o:["Jim Beam","Old Overholt","Buffalo Trace","Old Forester"], r:1, e:"Old Overholt, rye de Pennsylvanie fondé en 1810 par Abraham Overholt — survivant de la Prohibition via le whiskey médicinal. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quel mashbill rye emblématique signe la distillerie MGP (Indiana) ?", o:["51 % seigle / 49 % maïs","75 % seigle / 25 % orge","95 % seigle / 5 % orge maltée","100 % seigle"], r:2, e:"95/5 — le profil aneth-épices derrière Bulleit Rye, Dickel Rye et une foule de marques « sourced ». <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce que le « Rock and Rye » ?", o:["Un rye sur glace pilée","Une liqueur historique de rye au sucre candi et agrumes","Un rye non filtré","Un cocktail tiki"], r:1, e:"Liqueur du 19e siècle : rye, sucre candi (rock candy) et souvent agrumes — vendue en pharmacie contre le rhume. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quel président américain exploitait une importante distillerie de rye ?", o:["Thomas Jefferson","George Washington","Abraham Lincoln","Andrew Jackson"], r:1, e:"George Washington, à Mount Vernon (1797) — l'une des plus grandes distilleries du pays à sa mort en 1799. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Que garantit la désignation « Empire Rye » ?", o:["Un rye de l'Empire britannique","≥ 75 % de seigle cultivé dans l'État de New York","Un rye 100 % malté","Un rye d'avant la Prohibition"], r:1, e:"Création de distillateurs new-yorkais (2015) : min 75 % de seigle de l'État de NY, entrée en fût ≤ 115 proof, 2 ans minimum, une seule distillerie. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Dans les recettes de cocktails d'avant la Prohibition, « whiskey » désignait par défaut :", o:["Le bourbon","Le rye","Le Scotch","Le corn whiskey"], r:1, e:"Le rye, roi des bars de la côte Est. Old Fashioned, Manhattan, Whiskey Sour : tous pensés au rye à l'origine. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Pourquoi le seigle est-il réputé difficile à brasser ?", o:["Il fermente trop vite","Moût visqueux et mousseux (bêta-glucanes et pentosanes)","Il ne contient pas d'amidon","Il exige un maltage à froid"], r:1, e:"Ses bêta-glucanes et pentosanes rendent le moût visqueux et très moussant — brassins capricieux, d'où la prime aux maisons qui le maîtrisent. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Le Ward Eight (Boston, 1898) associe rye, citron, orange et :", o:["Miel","Grenadine","Falernum","Marasquin"], r:1, e:"Grenadine — créé au Locke-Ober pour fêter l'élection du district Ward 8. Un rye sour fruité d'avant la Prohibition. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"L'Algonquin associe rye, vermouth dry et :", o:["Jus d'ananas","Jus de pamplemousse","Chartreuse","Bénédictine"], r:0, e:"Jus d'ananas — rare classique stirré/shaké à l'ananas, baptisé d'après l'hôtel new-yorkais et sa Round Table littéraire. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Par rapport au bourbon, le profil typique du rye est :", o:["Plus doux et vanillé","Plus épicé, poivré et sec","Plus fumé","Plus floral"], r:1, e:"Épicé, poivré, herbacé et sec — le seigle apporte du mordant là où le maïs apporte rondeur et sucrosité. C'est pourquoi les barmen le préfèrent souvent en Manhattan ou Sazerac. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce qui a provoqué la quasi-disparition du rye américain au 20e siècle ?", o:["Le phylloxéra","La Prohibition","La Seconde Guerre mondiale","Une taxe fédérale de 1964"], r:1, e:"La Prohibition (1920-1933) a détruit les distilleries de Pennsylvanie et du Maryland ; le goût américain a basculé vers le bourbon, plus doux. Renaissance dans les années 2000. <span class='src'>Source : US TTB — 27 CFR §5 (Standards of Identity)</span>"},
 {cat:"Réglementation & production", q:"Quelle norme officielle mexicaine régit la production de tequila ?", o:["NOM-006-SCFI","AOC-2010","DOP-Jalisco","ISO-9001"], r:0, e:"La NOM-006-SCFI fixe les spécifications de la tequila (catégories, types, agave autorisé, titrage). <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"En quelle année la catégorie « Extra Añejo » a-t-elle été créée ?", o:["1974","1994","2006","2016"], r:2, e:"L'Extra Añejo (plus de 3 ans en fûts ≤ 600 L) a été ajouté à la norme en 2006. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Quelle est la seule variété d'agave autorisée pour la tequila ?", o:["Agave tequilana Weber, dite agave bleu","Agave espadín","Agave americana","Agave salmiana"], r:0, e:"Seul l'Agave tequilana Weber variété bleue est admis ; le sucre fermenté doit en provenir. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Qu'est-ce qu'une tequila « cristalino » ?", o:["Une tequila vieillie puis filtrée au charbon pour retirer sa couleur","Une tequila non vieillie","Une tequila doublement distillée","Une tequila à base de mixto uniquement"], r:0, e:"Le cristalino est une reposado/añejo filtrée sur charbon : on garde le profil boisé mais on efface la couleur. Ce n'est pas une catégorie officielle de la NOM. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Que permet d'identifier le numéro « NOM » suivi de 4 chiffres sur une bouteille ?", o:["La distillerie qui a produit le liquide","Le degré d'alcool","L'année de récolte","Le nombre de distillations"], r:0, e:"Le NOM renvoie à la distillerie productrice ; plusieurs marques peuvent partager un même NOM. <span class='src'>Source : Règlement UE 2019/787 ; cahiers des charges</span>"},
 {cat:"Réglementation & production", q:"Que garantit la mention « 100% agave » sur une tequila ?", o:["Que les sucres viennent uniquement de l'agave et qu'elle est embouteillée à l'origine au Mexique","Qu'elle titre au moins 50%","Qu'elle est vieillie 3 ans minimum","Qu'elle est artisanale"], r:0, e:"Une 100% agave n'admet aucun sucre d'appoint et doit être mise en bouteille au Mexique (contrairement au mixto, exportable en vrac). <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"À quoi correspond une tequila « joven » (ou « gold/oro ») d'entrée de gamme ?", o:["Un blanco assemblé et/ou coloré (souvent au caramel)","Un vieillissement de 3 ans","Une double filtration","Une tequila sans agave"], r:0, e:"La joven/gold est généralement un blanco coloré et adouci, ou un assemblage de blanco et de tequilas vieillies. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"En quelle année l'appellation d'origine Tequila a-t-elle été reconnue au Mexique ?", o:["1949","1974","1994","2006"], r:1, e:"La Denominación de Origen Tequila est officialisée en 1974 ; elle couvre Jalisco et des municipalités de 4 autres États. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Pourquoi cuit-on le cœur d'agave (piña) avant la fermentation ?", o:["Pour convertir les glucides complexes en sucres fermentescibles","Pour le stériliser uniquement","Pour le colorer","Pour augmenter son degré"], r:0, e:"La cuisson (four en briques ou autoclave) hydrolyse l'inuline en sucres simples fermentescibles. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Combien de fois la tequila est-elle généralement distillée ?", o:["Une fois","Deux fois","Trois fois","Quatre fois"], r:1, e:"La double distillation est la norme ; certaines maisons en font une troisième pour un profil plus neutre. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Comment nomme-t-on la meule de pierre traditionnelle servant à broyer l'agave cuit ?", o:["Tahona","Alambic","Coa","Horno"], r:0, e:"La tahona, lourde roue de pierre d'origine nahuatl, presse l'agave cuit en gardant les fibres ; méthode lente et qualitative. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Comment appelle-t-on la méthode industrielle qui extrait les sucres de l'agave cru à l'eau chaude et à la vapeur ?", o:["Le diffuseur","La tahona","Le pot still","Le horno"], r:0, e:"Le diffuseur extrait les sucres très vite, parfois sans cuisson ; décrié car appauvrissant le profil aromatique. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Combien de temps l'agave bleu met-il environ à atteindre sa maturité ?", o:["Quelques mois","1 à 2 ans","6 à 8 ans","30 ans"], r:2, e:"L'agave tequilana mûrit en 6 à 8 ans environ (variable selon le terroir) avant la jima. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Quelle est la principale variété d'agave utilisée pour le mezcal ?", o:["Espadín","Tequilana Weber bleu","Americana","Sisalana"], r:0, e:"L'Espadín domine la production de mezcal, bien que des dizaines d'agaves sauvages soient aussi employés. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Où trouve-t-on traditionnellement le ver (gusano) ?", o:["Dans certains mezcals, jamais dans la tequila","Dans le rhum agricole","Dans le pisco","Dans la cachaça"], r:0, e:"Le gusano accompagne certaines bouteilles de mezcal ; il n'a jamais existé dans la tequila. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"D'où provient principalement le goût fumé du mezcal ?", o:["De la cuisson des agaves dans des fours enterrés (fosses)","D'un ajout de fumée liquide","Du vieillissement en fût brûlé","De la levure"], r:0, e:"Les piñas cuisent dans des fosses chauffées aux pierres volcaniques, ce qui imprègne le mezcal de notes fumées. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Quel est le rôle du Consejo Regulador del Tequila (CRT) ?", o:["Certifier et contrôler la conformité de la production à la norme","Fixer les prix de vente","Distiller la tequila officielle","Posséder les marques"], r:0, e:"Le CRT est l'organisme de certification qui vérifie le respect de la NOM-006 tout au long de la filière. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Réglementation & production", q:"Outre les sucres d'agave, qu'autorise un « mixto » que n'autorise pas un 100% agave ?", o:["Jusqu'à 49% de sucres d'autres origines et l'embouteillage en vrac à l'étranger","Un vieillissement plus long","Un degré plus élevé","Une seule distillation"], r:0, e:"Le mixto contient au minimum 51% de sucres d'agave, le reste pouvant venir d'autres sucres ; il peut être exporté en vrac. <span class='src'>Source : CRT — norme NOM-006-SCFI</span>"},
 {cat:"Histoire du bar", q:"Que signifie le sigle « PDT » du célèbre bar new-yorkais ?", o:["Please Don't Tell","Prohibition Drinks Temple","Premium Drink Tavern","Public Drinking Tavern"], r:0, e:"« Please Don't Tell » joue sur l'esprit speakeasy clandestin du lieu. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {cat:"Histoire du bar", q:"Sur quelle technique repose le « Benton's Old Fashioned », créé au PDT par Don Lee ?", o:["Un bourbon infusé au gras de bacon (fat-washing) puis figé au froid","Un vieillissement en fût de jambon","Une clarification au lait","Une fumée à froid"], r:0, e:"Don Lee lave le bourbon au gras de bacon Benton's : l'arôme reste, le gras est retiré par le froid. <span class='src'>Source : Difford’s Guide</span>"},

 {cat:"Techniques & matériel", q:"Pourquoi exprime-t-on un zeste (twist) au-dessus d'un cocktail ?", o:["Pour libérer les huiles essentielles aromatiques de l'écorce","Pour le colorer","Pour le sucrer","Pour le diluer"], r:0, e:"La torsion du zeste projette les huiles essentielles d'agrume en surface, parfumant le nez du cocktail. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {cat:"Techniques & matériel", q:"Que signifie faire « flotter » (float) un ingrédient ?", o:["Le déposer délicatement en surface sans le mélanger","Le congeler","Le filtrer deux fois","Le diluer fortement"], r:0, e:"On verse doucement (sur le dos d'une cuillère) un liquide pour qu'il reste en surface, par densité. <span class='src'>Source : Oxford Companion to Spirits & Cocktails (Wondrich, 2021)</span>"},

 {q:"Le Turf se sert avec une pelure de citron pressée dessus.", r:false, e:"FAUX : Vermeire précise de ne presser NI pelure de citron NI pelure d'orange. Juste une olive."},
 {q:"Le Glad Eye contient deux tiers d'absinthe.", r:true, e:"VRAI : 1/3 pipermenthe Get, 2/3 absinthe. C'est le plus chargé en absinthe de l'extrait."},

 {q:"Le Mai Tai a été créé à Hawaï.", r:false, e:"FAUX : à Oakland, en Californie, par Trader Vic en 1944. L'association avec Hawaï est une idée reçue."},
 {q:"Le New York Sour est né à Chicago.", r:true, e:"VRAI, dans les années 1880, sous le nom de « claret snap » notamment."},
 {q:"Le Yellow Daisy appartient à la famille des Daisy.", r:false, e:"FAUX : malgré son nom, c'est un Martini sucré et aromatisé. Savoy Cocktail Book, 1930."},
 {q:"Le Frisco contenait à l'origine du jus de citron.", r:false, e:"FAUX : whisky et Bénédictine seulement, remués. Le citron arrive plus tard et en fait un sour."},
 {q:"Le Tampico est une création française.", r:true, e:"VRAI : années 1960, attribué à Rudolf Slavik, barman de l'hôtel George V à Paris."},
 {q:"Le Harvard est apparu pour la première fois chez Robert Vermeire.", r:false, e:"FAUX : chez George J. Kappeler, « Modern American Drinks », 1895. Vermeire le reprend plus tard, sans le seltz de la version d'origine."},
 {q:"Le Jasmine a été nommé d'après la fleur.", r:false, e:"FAUX : d'après Matt Jasmin, l'ami de Paul Harrington — dont le nom fut longtemps mal orthographié avec un « e »."},
 {q:"Le Boulevardier figure dans la liste principale des recettes de Barflies and Cocktails.", r:false, e:"FAUX : il apparaît dans la section « Cocktails Round Town » d'Arthur Moss, pas dans la liste principale de McElhone."},

 {q:"Le premier livre de cocktails a été publié par Jerry Thomas en 1862.", r:true, e:"VRAI : « How to Mix Drinks, or The Bon-Vivant's Companion », aux États-Unis."},
 {q:"« London gin » signifie que le gin est produit à Londres.", r:false, e:"FAUX : c'est une catégorie réglementaire, pas une origine géographique — aromatisation par redistillation seule, sans colorant ni quasi sucre."},
 {q:"Dans l'UE, un whisky doit vieillir au minimum trois ans.", r:true, e:"VRAI, en fûts de 700 litres maximum, et titrer au moins 40 % vol."},
 {q:"L'orgeat est un sirop à base d'orge.", r:false, e:"FAUX : c'est un sirop d'AMANDE, souvent parfumé à la fleur d'oranger, malgré ce que son nom laisse croire."},
 {q:"Le vermouth est classé comme un spiritueux.", r:false, e:"FAUX : c'est un VIN AROMATISÉ — au moins 75 % de vin, 14,5 à 22 % vol, armoise obligatoire."},
 {q:"L'Association des Barmen de France est membre fondateur de l'IBA.", r:true, e:"VRAI : l'un des sept fondateurs en 1951 à Torquay."},
 {q:"L'IBA exprime ses recettes officielles en millilitres.", r:false, e:"FAUX : en CENTILITRES."},
 {q:"Un cognac XO doit aujourd'hui avoir au moins six ans.", r:false, e:"FAUX : dix ans depuis 2018. C'était six ans auparavant."},
 {q:"Le Sazerac était à l'origine fait au rye whiskey.", r:false, e:"FAUX : au cognac. Le passage au rye vient de la raréfaction du cognac après le phylloxéra."},
 {q:"On remue un Negroni et on frappe un Daiquiri.", r:true, e:"VRAI : on remue quand tout est limpide et alcoolisé, on frappe dès qu'il y a jus, purée, sirop épais ou œuf."},
 {q:"La dilution est un défaut qu'il faut chercher à éliminer.", r:false, e:"FAUX : elle fait partie intégrante de la recette. Un cocktail bien frappé gagne environ 20 à 25 % de volume en eau."},
 {q:"La passoire julep se pose sur le shaker.", r:false, e:"FAUX : sur le VERRE À MÉLANGE. C'est la hawthorne, à ressort, qui va sur le shaker."},
 {q:"Une crème de cassis doit contenir au moins 400 g de sucre par litre.", r:true, e:"VRAI, contre 250 g/L pour les autres « crème de » et 100 g/L pour une liqueur simple."},
 {q:"Le tiki a été inventé par Trader Vic.", r:false, e:"FAUX : Donn Beach ouvre Don the Beachcomber à Hollywood au début des années 1930, avant Trader Vic. Les deux maisons se disputeront la paternité du style."},
 {q:"Le Bramble et l'Espresso Martini sont tous deux attribués à Dick Bradsell.", r:true, e:"VRAI : le barman londonien de la renaissance du cocktail des années 1980."},

 {t:"Repères clés par marque", html:`
  <p class="fiche-lead">L'info à retenir absolument pour chaque partenaire. Une ligne = une marque.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Non alcool</h4><ul>
    <li><b>Adriatico Zero</b> — 2019, Pouilles, amande Filippo Cea, sel marin, 2× moins de sucre. Le seul amaretto 0,0 %.</li>
    <li><b>Giffard</b> — 1885 Angers, pharmacien, Menthe-Pastille. Gamme shrub (vinaigre de vin) vs Bases Cocktail (4 ans R&D, spiritueux miroirs).</li>
    <li><b>Fever-Tree</b> — 2004 Londres, Rolls & Warrillow. Fever tree = quinquina = quinine (RDC). 8 références.</li>
    <li><b>Ponthier</b> — 1946 Objat, ex-négoce de fruits, roi de la châtaigne, B Corp. Figue de Barbarie = fruit du cactus (→ Fiba).</li>
    <li><b>PCB Création</b> — 1992 Benfeld (Alsace), les Bach. Ingredium (2019) = 5 familles techniques.</li>
   </ul></div>
   <div class="fiche-block"><h4>Apéritifs & amers</h4><ul>
    <li><b>Combier</b> — 1834 Saumur, 1er triple sec, alambics Eiffel. Blanchette 60° (blanche) / L'Entêté 62° (verte, chlorophylle).</li>
    <li><b>Campari</b> — 1860 Novare, 25° en France, cochenille jusqu'en 2006. Negroni = 1919 Florence.</li>
    <li><b>La Ina</b> — soleras 1919 (Domecq), Lustau depuis 2008. Fino 15° (flor) / Oloroso 20° (oxydatif) / PX 17°.</li>
    <li><b>Noilly Prat</b> — 1813, Marseillan, Picpoul + Clairette, 1 an dans l'Enclos, dodinage. Dry 18° / Ambré 16°.</li>

   <div class="fiche-block"><h4>Eaux-de-vie & alcools</h4><ul>
    <li><b>BOWS Fiba</b> — 2016 Benoît Garcia, Montauban → Laure-Minervois. Fiba = FIgue de BArbarie, 45° : ce sont les <b>raquettes</b> du cactus, fumées au bois d'olivier.</li>

    <li><b>Isautier</b> — 1845, doyenne de La Réunion, Antoinette 1865. Fusion 55° (co-ferment. 36 h) / Barrik 40° / 5 ans 45°.</li>
    <li><b>Appleton</b> — 1749 Jamaïque, estate rum, Joy Spence (1re femme master blender, 1997). Âge = plus jeune rhum.</li>
    <li><b>Calle 23</b> — Sophie Decobecq, levures maison, Los Altos. Repo 8 mois / Añejo 16 mois, tous 40°.</li>
    <li><b>Nuestra Soledad</b> — Casa Cortés 1840, single village, espadín, 40°. Vierge de la Solitude.</li>
    <li><b>Cuatro Gallos</b> — pisco d'Ica : 1 distillation à degré, 0 eau, 0 bois. Quebranta / Italia 40°.</li>
    <li><b>Dartigalongue</b> — 1838 Nogaro, doyenne armagnac, millésime 1848. Un-Oaked (0 bois) / Single-Oaked (fûts <b>roux</b>) / Double-Oaked (2× fût neuf), tous 43°.</li>
    <li><b>Merlet</b> — 1850 Saint-Sauvant. VS / Brothers Blend (4 ans, Fins Bois + 1/5 GC) / Eau de Vigne, tous 40°.</li>
    <li><b>Sab's</b> — Pigneret (1941) rachetée en 2018, Beaune, bouilleur ambulant ; marque Sab's fin 2019. Marc = peaux/pépins. Le Blanc 43° / Le Marc 46° (finish cognac).</li>

   <div class="fiche-block"><h4>Liqueurs & spécialités</h4><ul>
