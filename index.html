 {c:"Histoire",q:"Le cocktail El Presidente est un classique de quel pays ?",o:["Le Mexique","Cuba","Le Pérou","Le Brésil"],a:1,e:"Cuba, à l'époque de l'âge d'or de La Havane."},
 {c:"Histoire",q:"Quel mouvement social a précédé la Prohibition américaine ?",o:["La tempérance","Le suffragisme","Le prohibitionnisme fiscal","La contre-culture"],a:0,e:"Le mouvement de tempérance, militant contre l'alcool."},
 {c:"Histoire",q:"Quel mot anglais désigne l'alcool distillé clandestinement ?",o:["Le moonshine","Le highball","Le jigger","Le punch"],a:0,e:"Le moonshine, distillé « au clair de lune » pour échapper au fisc."},

 {c:"Spiritueux",q:"Combien d'États mexicains sont autorisés à produire de la tequila ?",o:["Un seul","Cinq","Dix","Toute la nation"],a:1,e:"Cinq, dont le Jalisco qui en concentre l'essentiel."},

 {c:"Amers & liqueurs",q:"De quelle plante alpine est tiré le génépi ?",o:["L'armoise des montagnes","La gentiane","L'edelweiss","La verveine"],a:0,e:"D'armoises alpines (Artemisia), d'où son amertume herbacée."},

 {c:"Amers & liqueurs",q:"Le limoncello est une liqueur traditionnelle de quelle région d'Italie ?",o:["Le Piémont","La côte amalfitaine","La Toscane","La Vénétie"],a:1,e:"La côte amalfitaine et le golfe de Naples, à base de citrons."},
 {c:"Amers & liqueurs",q:"Que désigne « B&B » comme digestif ?",o:["Bénédictine et Brandy","Bourbon et Bitter","Bitter et Bénédictine","Brandy et Byrrh"],a:0,e:"Bénédictine additionnée de brandy."},
 {c:"Amers & liqueurs",q:"La couleur rouge historique du Campari provenait de :",o:["La cochenille (carmin)","La betterave","La grenade","Un colorant de synthèse"],a:0,e:"Du carmin de cochenille, aujourd'hui remplacé par un colorant."},
 {c:"Amers & liqueurs",q:"Le White Negroni remplace le Campari et le vermouth rouge par :",o:["Suze et Lillet blanc","Aperol et prosecco","Cynar et sherry","Fernet et vermouth dry"],a:0,e:"La Suze (gentiane) et le Lillet blanc, version plus pâle et amère."},
 {c:"Recettes",q:"La Tommy's Margarita remplace le triple sec par :",o:["Du sirop d'agave","Du miel","Du curaçao","Du sucre"],a:0,e:"Du sirop d'agave. Créée par Julio Bermejo à San Francisco."},

{c:"Appellations",q:"Quel est le taux de sucre minimum d'une liqueur dans l'Union européenne ?",o:["50 g/L","100 g/L","250 g/L","400 g/L"],a:1,e:"100 g/L de sucre minimum (exprimé en sucre inverti)."},

 {c:"Appellations",q:"La mention « crème de » signifie-t-elle que la liqueur contient de la crème laitière ?",o:["Oui, toujours","Non, c'est une question de teneur en sucre","Seulement pour le cacao","Seulement en France"],a:1,e:"Non : « crème » renvoie à la richesse en sucre, pas à un produit laitier."},
 {c:"Appellations",q:"Quel est le degré d'alcool minimum d'une « crème de » dans l'UE ?",o:["12 %","15 %","18 %","20 %"],a:1,e:"15 % vol, comme les liqueurs en général."},
 {c:"Appellations",q:"Quel titre alcoolique minimum impose la réglementation au maraschino (marasquin) ?",o:["15 %","20 %","24 %","30 %"],a:2,e:"24 % vol minimum, avec au moins 250 g/L de sucre."},
 {c:"Appellations",q:"Combien de plantes composent la recette de la Chartreuse ?",o:["72","100","130","200"],a:2,e:"130 plantes, fleurs, écorces, racines et épices."},

 {c:"Appellations",q:"Quel est le degré de la Chartreuse Jaune ?",o:["40 %","43 %","50 %","55 %"],a:1,e:"43 % vol, plus douce et miellée que la Verte."},
 {c:"Appellations",q:"À combien titre l'Élixir Végétal de la Grande Chartreuse ?",o:["55 %","60 %","69 %","80 %"],a:2,e:"69 % vol, l'ancêtre médicinal des Chartreuses, ramené de 71 % à 69 % en 2010."},
 {c:"Appellations",q:"En quelle année les Chartreuses Verte et Jaune ont-elles été créées ?",o:["1605","1764","1840","1903"],a:2,e:"1840, à partir de la recette de l'Élixir Végétal fixée en 1764."},

 {c:"Appellations",q:"Combien de plantes et épices composent le Fernet-Branca ?",o:["13","27","40","130"],a:1,e:"27 herbes et épices, selon une recette inchangée depuis 1845."},
 {c:"Appellations",q:"Quel est approximativement le degré du Cointreau ?",o:["25 %","30 %","40 %","50 %"],a:2,e:"40 % vol. C'est un triple sec, à base d'écorces d'oranges douces et amères."},
 {c:"Appellations",q:"Quel est approximativement le degré du Campari ?",o:["11 %","16 %","25 %","40 %"],a:2,e:"Autour de 25 % vol (24-25 % selon les marchés)."},

 {c:"Appellations",q:"Quel est approximativement le degré du Fernet-Branca ?",o:["20 %","30 %","39 %","50 %"],a:2,e:"Environ 39 % vol, nettement plus fort que la plupart des amari."},

 {c:"Appellations",q:"Quel est le degré d'alcool minimum d'un gin dans l'Union européenne ?",o:["30 %","37,5 %","40 %","45 %"],a:1,e:"37,5 % vol minimum."},

 {c:"Appellations",q:"Quel est le degré minimum d'embouteillage du bourbon aux États-Unis ?",o:["37,5 %","40 %","43 %","50 %"],a:1,e:"40 % vol (80 proof) minimum à la mise en bouteille."},
 {c:"Appellations",q:"Quelle est la durée minimale de vieillissement d'un rhum « vieux » ?",o:["1 an","3 ans","5 ans","8 ans"],a:1,e:"Trois ans minimum sous bois pour la mention « vieux »."},
 {c:"Appellations",q:"Quel degré d'alcool minimum exige le règlement européen pour un alcool éthylique d'origine agricole neutre ?",o:["90 %","94,8 %","96 %","99 %"],a:2,e:"96 % vol minimum : la base neutre des vodkas et gins."},

 {c:"Appellations",q:"Quel taux de sucre minimum spécifique l'UE fixe-t-elle aux liqueurs de cerise (type cherry brandy) ?",o:["70 g/L","100 g/L","250 g/L","400 g/L"],a:0,e:"70 g/L, une exception sous le seuil général de 100 g/L."},

 {c:"Appellations",q:"À combien de grammes de sucre par litre une crème de cassis correspond-elle, par rapport à un soda type cola (environ 100 g/L) ?",o:["Autant","Le double","Quatre fois plus","Moitié moins"],a:2,e:"400 g/L, soit environ quatre fois la teneur en sucre d'un cola."},

 {c:"Appellations",q:"Le pacharán, spiritueux à la prunelle, a une teneur en sucre comprise entre :",o:["80 et 250 g/L","100 et 400 g/L","250 et 400 g/L","0 et 80 g/L"],a:0,e:"Entre 80 et 250 g/L. Le nom « pacharán » est réservé à l'Espagne."},

 {c:"Appellations",q:"Le terme « VSOP » correspond à un vieillissement minimum de :",o:["2 ans","4 ans","6 ans","10 ans"],a:1,e:"4 ans minimum (le compte d'âge porte sur l'eau-de-vie la plus jeune)."},
 {c:"Appellations",q:"Le compte « VS » d'un cognac correspond à un vieillissement minimum de :",o:["2 ans","3 ans","4 ans","6 ans"],a:0,e:"2 ans minimum pour la mention VS (Very Special)."},
 {c:"Appellations",q:"Entre le VSOP et le XO, quelle mention de cognac s'intercale (min. 6 ans) ?",o:["Napoléon","Hors d'âge","Réserve","Sélection"],a:0,e:"La mention Napoléon, au minimum 6 ans."},
 {c:"Appellations",q:"Le sherry Fino se distingue par un vieillissement :",o:["Sous voile de levures (flor)","Oxydatif","En solera doux","Au soleil"],a:0,e:"Sous flor, un voile de levures qui le protège de l'oxydation."},

 {c:"Glace & matériel",q:"Vers quelle île Tudor expédie-t-il sa toute première cargaison de glace ?",o:["Cuba","La Martinique","La Jamaïque","Porto Rico"],a:1,e:"La Martinique, avec de la glace découpée en Nouvelle-Angleterre."},
 {c:"Glace & matériel",q:"Quel surnom portait Frederic Tudor ?",o:["The Ice King","The Cold Baron","The Frost Father","The Snow Man"],a:0,e:"« The Ice King » de Boston."},

 {c:"Glace & matériel",q:"Quelles pailles naturelles précédaient la paille en papier ?",o:["En seigle","En bambou","En verre","En jonc de mer"],a:0,e:"Des tiges de seigle, qui donnaient un goût herbacé aux boissons."},
 {c:"Bière",q:"De quel pays l'India Pale Ale (IPA) est-elle originaire ?",o:["L'Inde","L'Angleterre","Les États-Unis","La Belgique"],a:1,e:"L'Angleterre : brassée fortement houblonnée pour survivre au voyage vers les Indes."},
 {c:"Bière",q:"Pourquoi l'IPA était-elle si fortement houblonnée ?",o:["Pour le goût des soldats","Le houblon conservait la bière en mer","Le houblon était bon marché","Une mode londonienne"],a:1,e:"Le houblon, antiseptique naturel, protégeait la bière pendant les mois de traversée."},
 {c:"Bière",q:"Quel brasseur londonien est associé aux débuts de l'IPA ?",o:["George Hodgson","Arthur Guinness","Josef Groll","Gabriel Sedlmayr"],a:0,e:"George Hodgson, de la Bow Brewery, fournisseur de la Compagnie des Indes."},
 {c:"Bière",q:"Dans quelle ville la pilsner est-elle née en 1842 ?",o:["Munich","Plzeň","Vienne","Prague"],a:1,e:"À Plzeň (Pilsen), en Bohême, d'où son nom."},
 {c:"Bière",q:"Quel brasseur a créé la première pilsner ?",o:["Josef Groll","Anton Dreher","Arthur Guinness","Christian Moerlein"],a:0,e:"Josef Groll, brasseur bavarois appelé à Plzeň."},
 {c:"Bière",q:"En quelle année Arthur Guinness s'installe-t-il à St James's Gate à Dublin ?",o:["1759","1799","1842","1886"],a:0,e:"1759, avec un bail fameux de 9 000 ans."},
 {c:"Bière",q:"De quel style londonien du 18e siècle descend le stout ?",o:["Le porter","La pale ale","La lambic","La bitter"],a:0,e:"Du porter, bière brune des porteurs des marchés de Londres."},
 {c:"Bière",q:"Les ales relèvent de quel type de fermentation ?",o:["Fermentation haute","Fermentation basse","Fermentation spontanée","Fermentation mixte"],a:0,e:"Fermentation haute (températures plus chaudes). Les lagers : fermentation basse."},
 {c:"Bière",q:"Quel terme désigne les bières de fermentation basse ?",o:["Ales","Lagers","Lambics","Stouts"],a:1,e:"Les lagers, fermentées à froid puis stockées (« lagern » : entreposer)."},
 {c:"Sodas",q:"Dans quelle ville Jacob Schweppe a-t-il fondé Schweppes en 1783 ?",o:["Londres","Genève","Zurich","Paris"],a:1,e:"À Genève — piège classique, l'usine de Londres ne date que de 1792."},
 {c:"Sodas",q:"Quel était le métier d'origine de Jacob Schweppe ?",o:["Pharmacien","Horloger-joaillier","Brasseur","Médecin"],a:1,e:"Horloger et joaillier, installé à Genève en 1766."},
 {c:"Sodas",q:"Sur les travaux de quel chimiste Schweppe s'est-il appuyé pour gazéifier l'eau ?",o:["Joseph Priestley","Antoine Lavoisier","Louis Pasteur","Humphry Davy"],a:0,e:"Joseph Priestley, pionnier de la dissolution du CO2 dans l'eau."},
 {c:"Sodas",q:"Vers quelle décennie la quinine entre-t-elle dans l'Indian Tonic de Schweppes ?",o:["1790","1830","1870","1920"],a:2,e:"Vers 1870, donnant naissance à l'Indian Tonic Water."},
 {c:"Sodas",q:"Qui a créé le Coca-Cola en 1886 ?",o:["John Pemberton","Asa Candler","Caleb Bradham","Charles Hires"],a:0,e:"John Pemberton, pharmacien d'Atlanta, qui le vendait comme tonique."},
 {c:"Sodas",q:"Dans quelle ville le Coca-Cola a-t-il été inventé ?",o:["New York","Atlanta","La Nouvelle-Orléans","Chicago"],a:1,e:"Atlanta, Géorgie, à la pharmacie Jacobs."},
 {c:"Sodas",q:"Quel était le métier de John Pemberton ?",o:["Barman","Pharmacien","Médecin","Épicier"],a:1,e:"Pharmacien : le Coca-Cola est né comme remède de comptoir."},
 {c:"Histoires",q:"Dans quel établissement le Hurricane a-t-il été créé ?",o:["Pat O'Brien's","Le Carousel Bar","Antoine's","Commander's Palace"],a:0,e:"Chez Pat O'Brien's, dans le French Quarter de La Nouvelle-Orléans, années 1940."},
 {c:"Histoires",q:"Pourquoi Pat O'Brien's a-t-il créé le Hurricane ?",o:["Pour écouler des stocks de rhum","Pour un ouragan réel","Pour un concours","Pour Hemingway"],a:0,e:"Les grossistes imposaient l'achat de rhum, abondant, pour obtenir le whisky, rare."},
 {c:"Histoires",q:"À quoi le verre « hurricane » doit-il sa forme ?",o:["À une lampe-tempête","À un coquillage","À une vague","À un cyclone stylisé"],a:0,e:"À la lampe-ouragan (hurricane lamp), au verre galbé."},
 {c:"Glace & matériel",q:"Quel cocktail du 19e siècle a fait exploser la demande de paille et de glace pilée ?",o:["Le Sherry Cobbler","Le Sazerac","Le Manhattan","Le Flip"],a:0,e:"Le Sherry Cobbler, immense succès servi sur glace pilée avec paille."},
 {c:"Bière",q:"Que signifie le mot allemand « lagern », racine de « lager » ?",o:["Entreposer","Refroidir","Brasser","Filtrer"],a:0,e:"« Entreposer » : ces bières étaient stockées en cave froide."},
 {c:"Fausses évidences",q:"Dans quelle ville le Moscow Mule a-t-il été inventé ?",o:["Moscou","Los Angeles","New York","Londres"],a:1,e:"À Los Angeles (pub Cock'n'Bull), vers 1941, pour vendre la vodka Smirnoff. Rien de russe sinon la vodka."},
 {c:"Fausses évidences",q:"Dans quelle ville le Black Russian a-t-il été créé en 1949 ?",o:["Moscou","Bruxelles","Paris","New York"],a:1,e:"À l'Hôtel Métropole de Bruxelles, par le barman belge Gustave Tops."},
 {c:"Fausses évidences",q:"En l'honneur de qui Gustave Tops a-t-il créé le Black Russian ?",o:["Perle Mesta","Audrey Hepburn","Grace Kelly","Eleanor Roosevelt"],a:0,e:"Perle Mesta, ambassadrice des États-Unis au Luxembourg. Le « Russian » vient juste de la vodka."},
 {c:"Fausses évidences",q:"Malgré son nom tahitien, où le Mai Tai a-t-il été créé ?",o:["À Tahiti","À Oakland, Californie","À Honolulu","À Cuba"],a:1,e:"Chez Trader Vic's à Oakland (1944). « Maita'i » signifie « excellent » en tahitien."},
 {c:"Fausses évidences",q:"Où le Zombie a-t-il été inventé ?",o:["En Haïti","À Hollywood","À La Havane","En Jamaïque"],a:1,e:"À Hollywood, chez Don the Beachcomber, dans les années 1930."},
 {c:"Fausses évidences",q:"Que contient le Japanese Cocktail de Jerry Thomas ?",o:["Du saké","Aucun ingrédient japonais","Du thé matcha","Du yuzu"],a:1,e:"Cognac, orgeat, bitters : aucun ingrédient japonais. Nommé en hommage à une délégation japonaise à New York."},
 {c:"Fausses évidences",q:"D'où vient le nom du « grog » de la marine britannique ?",o:["Du surnom de l'amiral Vernon","D'un mot créole","D'une île","D'un tonneau"],a:0,e:"De l'amiral « Old Grog » Vernon, surnommé d'après son manteau de grogram, qui fit couper le rhum à l'eau en 1740."},
 {c:"Fausses évidences",q:"La coupe à champagne a-t-elle été moulée sur le sein de Marie-Antoinette ?",o:["Oui, c'est documenté","Non, c'est une légende","Oui, sur ordre de Louis XVI","Partiellement"],a:1,e:"Légende : la coupe existait en Angleterre dès les années 1660, un siècle avant elle."},
 {c:"Fausses évidences",q:"Dans quel pays le Bloody Caesar (clamato) a-t-il été créé en 1969 ?",o:["Les États-Unis","Le Canada","L'Italie","Le Mexique"],a:1,e:"Au Canada : Walter Chell, à Calgary. C'est le cocktail national canadien."},
 {c:"Fausses évidences",q:"Où sont produits les Angostura bitters ?",o:["Au Venezuela","À Trinidad","En Angleterre","À Cuba"],a:1,e:"À Trinidad. Le nom vient de la ville vénézuélienne d'Angostura, et ils ne contiennent pas d'écorce d'angostura."},
 {c:"Fausses évidences",q:"De quel pays vient le mot « spritz » ?",o:["D'Italie","D'Autriche","De Suisse","D'Allemagne"],a:1,e:"De l'autrichien « spritzen » (asperger) : les soldats autrichiens coupaient d'eau gazeuse les vins de Vénétie."},
 {c:"Fausses évidences",q:"Quelle particularité juridique a le Dark 'n' Stormy ?",o:["C'est une marque déposée par Gosling's","Il est interdit aux USA","Il est protégé par l'IBA","Aucune"],a:0,e:"Gosling's (Bermudes) a déposé le nom : un Dark 'n' Stormy « officiel » exige leur rhum Black Seal."},
 {c:"Fausses évidences",q:"Quel autre cocktail tiki est une marque déposée, liée au rhum Pusser's ?",o:["Le Painkiller","Le Mai Tai","Le Zombie","Le Jungle Bird"],a:0,e:"Le Painkiller, déposé par Pusser's, né au Soggy Dollar Bar (Îles Vierges britanniques)."},
 {c:"Fausses évidences",q:"D'où le Sidecar tirerait-il son nom ?",o:["D'un side-car de moto","D'un bar de Marseille","D'un wagon de train","D'un cheval"],a:0,e:"D'un client arrivant en side-car de moto, selon la légende parisienne des années 1920."},
 {c:"Taux de sucre",q:"Selon le règlement européen des vins aromatisés, un vermouth « dry » contient moins de :",o:["30 g/L de sucre","50 g/L de sucre","90 g/L de sucre","130 g/L de sucre"],a:1,e:"Moins de 50 g/L. « Extra-dry » : moins de 30 g/L."},
 {c:"Taux de sucre",q:"Un vermouth « extra-dry » contient moins de :",o:["10 g/L","30 g/L","50 g/L","90 g/L"],a:1,e:"Moins de 30 g/L de sucre, le plus sec de l'échelle."},
 {c:"Taux de sucre",q:"À partir de quel taux de sucre un vermouth est-il dit « doux » (sweet) ?",o:["50 g/L","90 g/L","130 g/L","250 g/L"],a:2,e:"Plus de 130 g/L : c'est le profil des vermouths rouges classiques."},
 {c:"Taux de sucre",q:"Un champagne « brut » contient au maximum :",o:["3 g/L","6 g/L","12 g/L","17 g/L"],a:2,e:"Moins de 12 g/L de sucre après dosage."},
 {c:"Taux de sucre",q:"Que signifie « brut nature » (ou « non dosé ») pour un champagne ?",o:["0 à 3 g/L, sans sucre ajouté","Moins de 12 g/L","6 à 12 g/L","Sans bulles"],a:0,e:"Aucune liqueur d'expédition ajoutée, 0 à 3 g/L de sucre résiduel."},
 {c:"Taux de sucre",q:"Quelle fourchette de sucre définit un champagne « demi-sec » ?",o:["12-17 g/L","17-32 g/L","32-50 g/L","50+ g/L"],a:2,e:"32 à 50 g/L : le compagnon classique des desserts."},
 {c:"Taux de sucre",q:"Piège : un champagne « extra-dry » est-il plus ou moins sucré qu'un « brut » ?",o:["Plus sucré","Moins sucré","Identique","Sans sucre"],a:0,e:"Plus sucré : extra-dry = 12 à 17 g/L, au-dessus du brut (moins de 12)."},
 {c:"Taux de sucre",q:"Au-delà de quel taux un champagne est-il dit « doux » ?",o:["32 g/L","50 g/L","100 g/L","130 g/L"],a:1,e:"Plus de 50 g/L, la catégorie la plus sucrée de l'échelle des dosages."},
 {c:"Taux de sucre",q:"Comment s'appelle le sucre ajouté au champagne juste avant le bouchage final ?",o:["La liqueur de tirage","La liqueur d'expédition","Le moût concentré","La chaptalisation"],a:1,e:"La liqueur d'expédition (le « dosage »). La liqueur de tirage sert, elle, à déclencher la prise de mousse."},
 {c:"Taux de sucre",q:"La liqueur aux œufs type advocaat doit contenir au minimum :",o:["150 g/L de sucre et 140 g/L de jaune d'œuf","100 g/L de sucre","250 g/L de sucre","70 g/L de jaune d'œuf seulement"],a:0,e:"150 g/L de sucre et 140 g/L de jaune d'œuf pur (règlement UE)."},
 {c:"Taux de sucre",q:"Quel sucre minimum la réglementation UE impose-t-elle au sloe gin ?",o:["70 g/L","100 g/L","250 g/L","Aucun"],a:1,e:"100 g/L, comme les liqueurs en général : le sloe gin est juridiquement une liqueur."},
 {c:"Taux de sucre",q:"Un London Dry gin tolère un édulcorant ajouté d'au maximum :",o:["0,1 g/L","1 g/L","10 g/L","100 g/L"],a:0,e:"0,1 g/L de produit édulcorant : autant dire rien."},
 {c:"Taux de sucre",q:"Le seuil de 100 g/L de sucre d'une liqueur correspond à peu près à la teneur en sucre :",o:["D'un cola","D'un jus d'orange","D'un tonic light","D'un sirop pur"],a:0,e:"D'un cola (environ 106 g/L) : repère pratique pour visualiser le seuil."},
 {c:"Législation FR",q:"Quels groupes de boissons la Licence III permet-elle de vendre sur place ?",o:["Groupes 1 et 3","Tous les groupes","Groupes 4 et 5","Groupe 1 seulement"],a:0,e:"Groupes 1 (sans alcool) et 3 (fermentées non distillées, vins doux naturels)."},
 {c:"Législation FR",q:"Quelle licence est nécessaire pour vendre des spiritueux à consommer sur place ?",o:["Licence II","Licence III","Licence IV","Petite licence"],a:2,e:"La Licence IV, qui couvre tous les groupes dont les alcools distillés."},
 {c:"Législation FR",q:"Combien de groupes de boissons existe-t-il depuis 2016 ?",o:["Trois","Quatre","Cinq","Six"],a:1,e:"Quatre : les anciens groupes 2 et 3 ont fusionné."},
 {c:"Législation FR",q:"Quelle est la durée de la formation au permis d'exploitation ?",o:["6 heures","14 heures","20 heures","35 heures"],a:2,e:"20 heures, réparties sur environ trois jours."},
 {c:"Législation FR",q:"Quelle est la durée de validité du permis d'exploitation ?",o:["5 ans","10 ans","15 ans","À vie"],a:1,e:"10 ans, renouvelable par une formation de mise à jour."},
 {c:"Législation FR",q:"Quelle est la durée de la formation de mise à jour pour renouveler le permis d'exploitation ?",o:["3 heures","6 heures","10 heures","20 heures"],a:1,e:"6 heures, à l'issue des 10 ans."},
 {c:"Législation FR",q:"Depuis la loi du 21 juillet 2009, la vente d'alcool est interdite aux moins de :",o:["16 ans","17 ans","18 ans","21 ans"],a:2,e:"18 ans, pour toutes les boissons alcooliques (avant : 16 ans pour certaines)."},
 {c:"Législation FR",q:"Quelle loi de 1991 encadre la publicité pour l'alcool en France ?",o:["La loi Évin","La loi Bachelot","La loi Veil","La loi Royer"],a:0,e:"La loi Évin, du nom du ministre Claude Évin."},
 {c:"Législation FR",q:"Combien de boissons sans alcool un débit doit-il au minimum mettre en évidence (étalage) ?",o:["5","10","15","20"],a:1,e:"Au moins 10 boissons sans alcool de catégories différentes."},
 {c:"Législation FR",q:"Servir une personne manifestement ivre est :",o:["Toléré en boîte de nuit","Interdit par la loi","Autorisé avant minuit","Une simple faute pro"],a:1,e:"Interdit : c'est la répression de l'ivresse publique et manifeste."},
 {c:"Législation FR",q:"Quels groupes la « petite licence à emporter » couvre-t-elle ?",o:["Le groupe 3","Tous les groupes","Les groupes 4 et 5","Le groupe 1"],a:0,e:"Le groupe 3 uniquement. La « licence à emporter » couvre tous les groupes."},
 {c:"Législation FR",q:"La « petite licence restaurant » permet de servir les groupes 1 et 3 :",o:["À toute heure","Seulement pendant les repas","Seulement en terrasse","Sans condition"],a:1,e:"Uniquement à l'occasion des principaux repas, comme accessoire de la nourriture."},
 {c:"Législation FR",q:"Au bout de combien d'années une licence III ou IV non exploitée devient-elle caduque ?",o:["2 ans","5 ans","10 ans","Jamais"],a:1,e:"5 ans sans exploitation, sauf exceptions prévues par le code de la santé publique."},
 {c:"Législation FR",q:"Où déclare-t-on l'ouverture ou la mutation d'un débit de boissons ?",o:["En mairie (préfecture de police à Paris)","Au tribunal de commerce","À la DGCCRF","À la chambre des métiers"],a:0,e:"En mairie, 15 jours à l'avance (préfecture de police pour Paris)."},
 {c:"Législation FR",q:"Pendant une happy hour, la loi impose de :",o:["Réduire aussi le prix de boissons sans alcool","Limiter à une heure","Fermer à 22h","Servir à table uniquement"],a:0,e:"Proposer également des boissons non alcooliques à prix réduit (loi de 2009)."},
 {c:"Législation FR",q:"Les « open bars » (alcool illimité contre forfait) sont :",o:["Autorisés","Interdits sauf exceptions","Réservés aux hôtels","Soumis à licence V"],a:1,e:"Interdits par la loi de 2009, sauf exceptions (dégustations, fêtes privées encadrées)."},
 {c:"Législation FR",q:"La vente d'alcool à emporter entre 22h et 8h (hors débits sur place) exige :",o:["Une formation spécifique","Une licence IV","Rien de particulier","Un agrément préfectoral annuel"],a:0,e:"Une formation spécifique à la vente nocturne, prévue par le code de la santé publique."},
 {c:"Café",q:"Quelles sont les deux espèces de caféier dominantes ?",o:["Arabica et robusta","Arabica et liberica","Robusta et excelsa","Moka et liberica"],a:0,e:"Coffea arabica (fin) et Coffea canephora dit robusta (corsé, plus caféiné)."},
 {c:"Café",q:"Le robusta contient environ combien de caféine par rapport à l'arabica ?",o:["Deux fois moins","La même quantité","Deux fois plus","Dix fois plus"],a:2,e:"Environ deux fois plus de caféine, d'où son amertume et son corps."},
 {c:"Café",q:"Quel pays est le premier producteur mondial de café ?",o:["Colombie","Brésil","Vietnam","Éthiopie"],a:1,e:"Le Brésil, loin devant le Vietnam (surtout robusta)."},
 {c:"Café",q:"Sous quelle pression environ s'extrait un espresso ?",o:["3 bars","6 bars","9 bars","15 bars"],a:2,e:"Environ 9 bars : c'est cette pression qui crée la crema."},
 {c:"Café",q:"Qu'est-ce qu'un ristretto ?",o:["Un espresso allongé","Un espresso serré (moins d'eau)","Un café filtre","Un double espresso"],a:1,e:"Un espresso « serré », extrait avec moins d'eau ; le lungo est l'inverse."},
 {c:"Café",q:"D'où vient le mot « moka » ?",o:["D'une variété d'arabica","Du port yéménite de Mocha","D'un torréfacteur italien","D'une ville éthiopienne"],a:1,e:"Du port de Mocha (Al-Makha) au Yémen, plaque tournante historique du café."},
 {c:"Café",q:"Quel berger légendaire aurait découvert le café en Éthiopie ?",o:["Kaldi","Omar","Baba Budan","Sheridan"],a:0,e:"Kaldi, intrigué par l'excitation de ses chèvres après avoir mangé les cerises."},
 {c:"Café",q:"Combien de temps dure typiquement une extraction cold brew ?",o:["1 à 2 h","12 à 24 h","48 à 72 h","Une semaine"],a:1,e:"12 à 24 h à froid : résultat moins acide et moins amer qu'un café chaud refroidi."},
 {c:"Café",q:"Qu'est-ce que la cascara ?",o:["Une liqueur de café","La pulpe séchée de la cerise de café","Une variété de robusta","Le marc de café"],a:1,e:"La pulpe séchée du fruit, infusée comme un thé ; utile en sirops."},
 {c:"Café",q:"Quelle est la garniture canonique de l'Espresso Martini ?",o:["Un zeste d'orange","Trois grains de café","Une feuille de menthe","Un trait de cacao"],a:1,e:"Trois grains de café, symbolisant santé, richesse et bonheur."},
 {c:"Café",q:"Où et par qui le Black Russian a-t-il été créé ?",o:["À Moscou, par un barman russe","À Bruxelles, par Gustave Tops","À New York, par Dale DeGroff","À Londres, par Dick Bradsell"],a:1,e:"Par Gustave Tops à l'hôtel Métropole de Bruxelles en 1949."},
 {c:"Café",q:"Quel cocktail chaud Joe Sheridan a-t-il créé en Irlande ?",o:["Le Tom & Jerry","L'Irish Coffee","Le Blue Blazer","Le Carajillo"],a:1,e:"L'Irish Coffee, à l'aérogare de Foynes vers 1943."},
 {c:"Café",q:"Un caffè corretto italien est un espresso « corrigé » avec :",o:["De la crème","De la grappa ou de la sambuca","Du sirop","Du lait chaud"],a:1,e:"Un alcool, le plus souvent grappa ou sambuca."},
 {c:"Café",q:"Le réseau d'arômes du café torréfié provient surtout :",o:["De la fermentation","De la réaction de Maillard","De l'oxydation","De la lyophilisation"],a:1,e:"De la réaction de Maillard et de la caramélisation pendant la torréfaction."},
 {c:"Champagne",q:"Quels sont les trois cépages principaux du champagne ?",o:["Chardonnay, pinot noir, meunier","Chardonnay, riesling, gamay","Pinot noir, syrah, merlot","Chenin, chardonnay, pinot gris"],a:0,e:"Chardonnay (blanc), pinot noir et meunier (noirs)."},
 {c:"Champagne",q:"Que désigne un champagne « blanc de blancs » ?",o:["Sans dosage","Issu uniquement de cépages blancs","Vieilli plus longtemps","Sans bulles"],a:1,e:"Élaboré uniquement à partir de cépages blancs, soit le chardonnay en pratique."},
 {c:"Champagne",q:"Comment s'appelle la seconde fermentation en bouteille du champagne ?",o:["La prise de mousse","Le dégorgement","Le remuage","Le ouillage"],a:0,e:"La prise de mousse, déclenchée par la liqueur de tirage (sucre + levures)."},
 {c:"Champagne",q:"À quelle maison attribue-t-on l'invention du pupitre de remuage ?",o:["Moët & Chandon","Veuve Clicquot","Krug","Ruinart"],a:1,e:"À la Veuve Clicquot, vers 1816, pour clarifier le vin."},
 {c:"Champagne",q:"Quelle pression règne environ dans une bouteille de champagne ?",o:["2 bars","6 bars","9 bars","15 bars"],a:1,e:"Environ 6 bars, d'où la nécessité du muselet."},
 {c:"Champagne",q:"Quelle est la durée minimale d'élevage sur lattes d'un champagne non millésimé ?",o:["6 mois","15 mois","3 ans","5 ans"],a:1,e:"15 mois minimum ; un millésimé exige au moins 3 ans."},
 {c:"Champagne",q:"Quel volume contient un magnum ?",o:["1 L","1,5 L","3 L","6 L"],a:1,e:"1,5 L, soit deux bouteilles. Le jéroboam fait 3 L."},
 {c:"Champagne",q:"Dom Pérignon était moine de quelle abbaye ?",o:["Cîteaux","Hautvillers","Cluny","Clairvaux"],a:1,e:"L'abbaye d'Hautvillers ; il a perfectionné l'assemblage, sans inventer les bulles."},
 {c:"Champagne",q:"Hors de la Champagne, la méthode traditionnelle donne :",o:["Un mousseux","Un crémant","Un perlant","Un pétillant naturel"],a:1,e:"Un crémant (Alsace, Bourgogne, Loire…), même méthode, autre appellation."},
 {c:"Champagne",q:"En quelle année l'AOC Champagne a-t-elle été délimitée ?",o:["1908","1927","1936","1945"],a:2,e:"1936, parmi les premières AOC françaises."},
 {c:"Champagne",q:"Que contient un Champagne Cocktail (IBA) ?",o:["Sucre, Angostura, cognac, champagne","Cassis et champagne","Pêche et prosecco","Absinthe et champagne"],a:0,e:"Sucre imbibé d'Angostura, cognac, complété au champagne."},
 {c:"Champagne",q:"Le Death in the Afternoon associe le champagne à :",o:["L'absinthe","Le cognac","La chartreuse","Le cassis"],a:0,e:"De l'absinthe ; cocktail attribué à Hemingway en 1935."},
 {c:"Champagne",q:"Qui a créé l'Old Cuban (rhum, menthe, citron vert, champagne) ?",o:["Audrey Saunders","Dale DeGroff","Sasha Petraske","Dick Bradsell"],a:0,e:"Audrey Saunders, en 2001 au restaurant Beacon (New York), avant son Pegu Club. Un Mojito coiffé de champagne."},
 {c:"Champagne",q:"Le sabrage du champagne est traditionnellement attribué :",o:["Aux moines","Aux hussards napoléoniens","Aux vignerons champenois","Aux marins anglais"],a:1,e:"Aux hussards de Napoléon, ouvrant la bouteille au sabre."},
 {c:"Champagne",q:"À quelle température sert-on idéalement le champagne ?",o:["2 à 4 °C","8 à 10 °C","12 à 14 °C","16 à 18 °C"],a:1,e:"8 à 10 °C : trop froid, les arômes se ferment."}
];

/* ----- état du quiz ----- */
let pool=[], poolIdx=[], idx=0, score=0, answered=false;
let mastered=new Set();   // réussies : définitivement écartées
let wrong=new Set();      // ratées : reproposées en priorité au tirage suivant
const TOTAL=25; // questions max par tirage

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(){
  // toutes les questions sauf celles déjà maîtrisées (réussies une fois)
  const avail=QUESTIONS.map((_,i)=>i).filter(i=>!mastered.has(i));
  if(avail.length===0){ showMastery(); return; }
  // on sert d'abord les questions ratées, puis les neuves
  const wrongList=shuffle(avail.filter(i=>wrong.has(i)));
  const freshList=shuffle(avail.filter(i=>!wrong.has(i)));
  poolIdx=wrongList.concat(freshList).slice(0,TOTAL);
  pool=poolIdx.map(i=>QUESTIONS[i]);
  idx=0;score=0;answered=false;
  renderQuestion();
}
function resetCycle(){ mastered=new Set(); wrong=new Set(); startQuiz(); }

function renderQuestion(){
  const stage=document.getElementById('quiz-stage');
  const q=pool[idx];
  const pct=Math.round((idx/pool.length)*100);
  stage.innerHTML=`
   <div class="quiz-card">
     <div class="q-meta"><span class="q-cat">${q.c}</span><span>Question ${idx+1} / ${pool.length}</span></div>
     <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
     <div class="q-text">${q.q}</div>
     <div class="opts" id="opts">
       ${q.o.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="choose(${i})"><span class="letter">${"ABCD"[i]}</span><span>${opt}</span></button>`).join('')}
     </div>
     <div class="explain" id="explain"><b>Pour mémoire</b>${q.e}</div>
     <div class="q-nav"><button class="btn" id="next" onclick="next()" disabled>Suivant</button></div>
   </div>`;
}

function choose(i){
  if(answered)return;
  answered=true;
  const q=pool[idx];
  const real=poolIdx[idx];
  const opts=document.querySelectorAll('#opts .opt');
  opts.forEach(b=>{b.disabled=true;const bi=+b.dataset.i;if(bi===q.a)b.classList.add('good');else if(bi===i)b.classList.add('bad');});
  if(i===q.a){ score++; mastered.add(real); wrong.delete(real); }
  else { wrong.add(real); }
  document.getElementById('explain').classList.add('show');
  const nx=document.getElementById('next');
  nx.disabled=false;
  nx.textContent = idx===pool.length-1 ? "Voir le score" : "Suivant";
}

function next(){
  if(idx<pool.length-1){idx++;answered=false;renderQuestion();}
  else showResult();
}

function showResult(){
  const stage=document.getElementById('quiz-stage');
  const pct=Math.round((score/pool.length)*100);
  let tier,verdict;
  if(pct>=85){tier="tier-gold";verdict="Niveau finaliste";}
  else if(pct>=60){tier="tier-ok";verdict="Solide, peaufine les détails";}
  else{tier="tier-low";verdict="Reprends la fiche avant demain";}
  const tot=QUESTIONS.length, mas=mastered.size, todo=wrong.size;
  const covLine=`Maîtrisées : ${mas} / ${tot}. À revoir : ${todo}. Le tirage suivant repropose d'abord les questions ratées.`;
  stage.innerHTML=`
   <div class="quiz-card result">
     <div class="score-num">${score}<span>/${pool.length}</span></div>
     <div class="verdict ${tier}">${verdict}</div>
     <p>${pct} % de bonnes réponses sur ce tirage.<br><span style="font-size:14px;color:var(--or)">${covLine}</span></p>
     <button class="btn" onclick="startQuiz()">Tirage suivant</button>
     <button class="btn ghost" style="margin-left:10px" onclick="resetCycle()">Repartir de zéro</button>
   </div>`;
}
function showMastery(){
  const stage=document.getElementById('quiz-stage');
  stage.innerHTML=`
   <div class="quiz-card result">
     <div class="score-num">★</div>
     <div class="verdict tier-gold">Banque maîtrisée</div>
     <p>Tu as répondu juste à l'ensemble des ${QUESTIONS.length} questions, aucune ne reste à revoir.</p>
     <button class="btn" onclick="resetCycle()">Tout recommencer</button>
     <button class="btn ghost" style="margin-left:10px" onclick="goView('fiche')">Relire la fiche</button>
   </div>`;
}

/* ----- navigation onglets ----- */
function goView(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(name).classList.add('on');
  if(name==='quiz' && !document.querySelector('#quiz .quiz-card')) startQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>goView(t.dataset.view)));

renderFiche();
</script>
