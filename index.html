ac et armagnac ?", "o": ["Cognac : double chauffe en charentais ; armagnac : surtout en colonne", "Cognac : colonne continue ; armagnac : double chauffe", "Les deux sont obligatoirement distillés en colonne", "Les deux sont obligatoirement distillés à repasse"], "r": 0, "e": "L'armagnac sort vers 58 % : plus de matière aromatique conservée. Trois zones : Bas-Armagnac, Ténarèze, Haut-Armagnac.", "s": "BNIC et BNIA, cahiers des charges Cognac et Armagnac", "lv": 2}, {"id": "ed815a401d", "t": "p6", "q": "Le vermouth est légalement :", "o": ["Un spiritueux", "Un vin aromatisé", "Une liqueur", "Un amer"], "r": 1, "e": "Au moins 75 % de vin, entre 14,5 et 22 % vol, et l'aromatisation doit faire intervenir de l'armoise (Wermut en allemand, d'où le nom).", "s": "Règlement (UE) 251/2014 (vins aromatisés), annexe II", "lv": 2}, {"id": "74b4c09e38", "t": "c2", "q": "Quelle passoire s'utilise sur un verre à mélange ?", "o": ["La hawthorne", "La julep", "Le chinois fin", "La passoire conique"], "r": 1, "e": "La hawthorne, à ressort, se pose sur le shaker ; le chinois fin sert au double filtrage.", "s": "Difford's Guide, glossaire « strainers »", "lv": 1}, {"id": "b7c7e18954", "t": "c2", "q": "Un shaker cobbler se compose de :", "o": ["Trois pièces, dont une passoire intégrée", "Deux timbales métalliques emboîtées", "Une timbale métallique et un verre", "Quatre pièces, dont un doseur intégré"], "r": 0, "e": "Timbale, couvercle avec passoire intégrée et bouchon. Le Boston et le shaker parisien en comptent deux.", "s": "Difford's Guide, glossaire « shakers »", "lv": 1}, {"id": "fc2a112c43", "t": "p1", "q": "Dans une distillation, on écarte :", "o": ["Les têtes et les queues", "Uniquement les têtes", "Uniquement les queues", "Le cœur"], "r": 0, "e": "Les têtes sont volatiles et toxiques, les queues lourdes et grasses. On ne garde que le cœur de chauffe.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « distillation »", "lv": 2}, {"id": "2f3261a01a", "t": "p6", "q": "Le système « solera y criaderas » consiste à :", "o": ["Ne soutirer qu'une partie, le vin plus jeune rafraîchissant l'ancien", "Vieillir chaque millésime dans un fût scellé", "Assembler chaque année des millésimes séparés", "Exposer les fûts au soleil pour oxyder le vin"], "r": 0, "e": "Système andalou par étages : on ne soutire qu'une partie de la solera, complétée par le vin de la criadera supérieure. La moyenne d'âge reste stable.", "s": "Consejo Regulador DO Jerez-Xérès-Sherry (sherry.wine), la solera", "lv": 2}, {"id": "b8953cf830", "t": "c3", "q": "Le sirop de gomme se distingue du sirop simple par :", "o": ["L'ajout de gomme arabique, pour la texture", "Un taux de sucre plus faible, à 1 pour 2", "Une cuisson longue jusqu'au caramel blond", "L'emploi de sucre roux non raffiné"], "r": 0, "e": "La gomme arabique donne de la texture. C'est le sucrant des cocktails du XIXe et du début du XXe siècle.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « gum syrup »", "lv": 1}, {"id": "fbc79cad7e", "t": "h3", "q": "Le Milano-Torino associe :", "o": ["Campari et vermouth rouge", "Campari et soda", "Gin et Campari", "Vermouth et prosecco"], "r": 0, "e": "Milan pour le Campari, Turin pour le vermouth. Avec du soda il devient l'Americano ; avec du gin, le Negroni.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Milano-Torino » ; Difford's Guide, fiche « Americano »", "lv": 1}, {"id": "1ac87a541a", "t": "h1", "q": "Quelle crise a fait basculer les cocktails du cognac vers le whisky ?", "o": ["La Prohibition", "Le phylloxéra", "La Première Guerre mondiale", "L'interdiction de l'absinthe"], "r": 1, "e": "Le puceron ravage le vignoble européen à partir des années 1860-1870 : le cognac se raréfie, le whisky et le gin prennent sa place au bar.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « phylloxera »", "lv": 2}, {"id": "5e57e691c4", "t": "p5", "q": "Le « louche » de l'absinthe s'explique par :", "o": ["Les huiles d'anis qui précipitent quand le degré baisse", "La chlorophylle qui réagit au contact de l'eau", "La thuyone qui s'oxyde à l'air libre", "Le sucre qui cristallise dans l'eau froide"], "r": 0, "e": "Solubles dans l'alcool, elles ne le sont plus dans l'eau : d'où le trouble laiteux.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « absinthe »", "lv": 2}, {"id": "41d08f5034", "t": "h3", "q": "Le Vieux Carré et le Singapore Sling ont en commun :", "o": ["La Bénédictine", "Le cognac", "Le gin", "Le vermouth français"], "r": 0, "e": "Vieux Carré : Hôtel Monteleone, La Nouvelle-Orléans, vers 1938. Singapore Sling : Raffles Hotel, vers 1915.", "s": "Difford's Guide, fiche « Vieux Carré » ; Difford's Guide, fiche « Singapore Sling »", "lv": 1}, {"id": "919004e2d8", "t": "h5", "q": "Qui a inventé le Breakfast Martini ?", "o": ["Dick Bradsell", "Salvatore Calabrese", "Dale DeGroff", "Peter Dorelli"], "r": 1, "e": "En 1996, au Library Bar du Lanesborough à Londres. L'idée lui vient de la marmelade d'orange que sa femme lui sert au petit-déjeuner. Craddock donnait déjà un « Marmalade Cocktail » en 1930.", "s": "Difford's Guide, fiche « Breakfast Martini »", "lv": 2}, {"id": "f2a88cf35f", "t": "h5", "q": "Dans quel bar le Breakfast Martini a-t-il été créé ?", "o": ["Le Dukes Bar", "Le Library Bar du Lanesborough", "Le American Bar du Savoy", "Le Connaught Bar"], "r": 1, "e": "Hôtel du quartier de Belgravia, à deux pas de Buckingham Palace. Calabrese est surnommé « The Maestro ».", "s": "Difford's Guide, fiche « Breakfast Martini »", "lv": 2}, {"id": "9e7e8ac21a", "t": "h5", "q": "Le Paper Plane a été créé par :", "o": ["Joaquín Simó, au Death & Co", "Sam Ross, au Violet Hour de Chicago", "Giuseppe Gonzalez, au Clover Club", "Vincenzo Errico, au Milk & Honey"], "r": 1, "e": "En 2007, à parts égales : bourbon, Aperol, Amaro Nonino, citron. Nommé d'après le morceau de M.I.A. sorti la même année. Ross utilisait du Campari au départ, remplacé ensuite par l'Aperol.", "s": "Difford's Guide, fiche « Paper Plane »", "lv": 2}, {"id": "8fededebf1", "t": "h5", "q": "Le Naked and Famous est une variation sur :", "o": ["Le Last Word", "Le Paper Plane", "Le Penicillin", "Le Bramble"], "r": 1, "e": "Joaquín Simó, Death & Co, New York, 2011 : mezcal, Chartreuse jaune, Aperol, citron vert, à parts égales, le Paper Plane transposé à l'agave.", "s": "Difford's Guide, fiche « Naked and Famous »", "lv": 2}, {"id": "846ade92d6", "t": "h5", "q": "Qui a créé l'Oaxaca Old-Fashioned ?", "o": ["Phil Ward, au Death & Co", "Sam Ross, au Milk & Honey", "Julio Bermejo", "Joaquín Simó"], "r": 0, "e": "New York, 2007. Tequila et mezcal, agave, bitters, l'un des drinks qui a lancé l'agave dans la mixologie américaine.", "s": "Difford's Guide, fiche « Oaxaca Old Fashioned »", "lv": 2}, {"id": "b673cdbb47", "t": "h5", "q": "Le Porn Star Martini a été créé par :", "o": ["Douglas Ankrah, au Townhouse de Londres", "Salvatore Calabrese, au Lanesborough", "Dick Bradsell, au Fred's Club", "Tony Conigliaro, au 69 Colebrooke Row"], "r": 0, "e": "En 2002, pour le Townhouse de Knightsbridge. Ankrah l'avait d'abord baptisé « Maverick Martini », d'après un club du Cap. Vodka vanille, fruit de la passion, shot de champagne à côté.", "s": "Difford's Guide, fiche « Pornstar Martini » ; The Drinks Business (nov. 2018)", "lv": 2}, {"id": "fd4950194e", "t": "h5", "q": "Le Red Hook, twist de Manhattan au Punt e Mes, a été créé par :", "o": ["Vincenzo Errico, au Milk & Honey", "Sam Ross, au Violet Hour", "Michael McIlroy, à l'Attaboy", "Phil Ward, au Death & Co"], "r": 0, "e": "New York, 2003. Rye, Punt e Mes et marasquin. Nommé d'après le quartier de Brooklyn, il a ouvert toute une famille de twists baptisés d'après des quartiers new-yorkais.", "s": "Difford's Guide, fiche « Red Hook »", "lv": 2}, {"id": "200ff12704", "t": "h5", "q": "Le Trinidad Sour se distingue par :", "o": ["Une dose massive d'angostura comme base", "Un float de rhum overproof en surface", "Une clarification au lait entier", "Un sirop de tabac fait maison"], "r": 0, "e": "Giuseppe González, Clover Club, Brooklyn, fin des années 2000 : environ 45 ml d'angostura, avec orgeat, rye et citron. Le bitter devient l'ingrédient principal.", "s": "Difford's Guide, fiche « Trinidad Sour »", "lv": 2}, {"id": "461157ca02", "t": "h5", "q": "Le Gin Basil Smash a été créé par :", "o": ["Jörg Meyer, à Hambourg", "Dick Bradsell, à Londres", "Simone Caporale", "Ago Perrone"], "r": 0, "e": "Au Le Lion de Hambourg, 2008. Gin, basilic frais, citron, sucre, un smash dont l'herbe devient le sujet.", "s": "Difford's Guide, fiche « Gin Basil Smash »", "lv": 2}, {"id": "89124c5823", "t": "h5", "q": "Dick Bradsell a créé le Bramble :", "o": ["Au Fred's Club de Londres, vers 1984", "Au Savoy de Londres, en 1990", "Au Match Bar de Londres, en 1996", "Au Soho Brasserie, en 1979"], "r": 0, "e": "Gin, citron, sucre, crème de mûre versée en cascade sur la glace pilée. Bradsell est aussi l'auteur de l'Espresso Martini, né au Soho Brasserie dans les années 80 sous le nom de Vodka Espresso.", "s": "Difford's Guide, fiche « Bramble » ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Bradsell, Dick »", "lv": 2}, {"id": "a681e7e3bc", "t": "h5", "q": "À l'origine, l'Espresso Martini s'appelait :", "o": ["Coffee Martini", "Vodka Espresso", "Black Russian Royale", "Café Bradsell"], "r": 1, "e": "Dick Bradsell, Soho Brasserie, Londres, années 1980. Le nom Espresso Martini est venu plus tard, à l'époque où tout ce qui se servait en verre à martini prenait ce nom.", "s": "Difford's Guide, fiche « Espresso Martini »", "lv": 2}, {"id": "87360d8ea0", "t": "h5", "q": "Le Milk & Honey de New York a été fondé par :", "o": ["Sasha Petraske", "Sam Ross", "Audrey Saunders", "Julie Reiner"], "r": 0, "e": "En 1999, sur Eldridge Street. Le modèle du néo-speakeasy : porte sans enseigne, règles de tenue, service sur réservation. C'est là que naissent le Penicillin, le Red Hook et toute une génération de barmen.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Petraske, Sasha »", "lv": 2}, {"id": "42470cf15e", "t": "h1", "q": "Le Sazerac doit son nom :", "o": ["À un barman de La Nouvelle-Orléans", "À la marque de cognac Sazerac-de-Forge", "À une rue du quartier français", "Au premier pharmacien de Louisiane"], "r": 1, "e": "Du cognac de la maison Sazerac-de-Forge et fils, vendu à la Sazerac Coffee House. Le bitter Peychaud's vient de l'apothicaire Antoine Amédée Peychaud.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Sazerac cocktail »", "lv": 2}, {"id": "743158b9ee", "t": "h1", "q": "Le mot « cocktail » et le coquetier de Peychaud : quelle est cette hypothèse ?", "o": ["Le coquetier servait à doser les bitters, d'où « cocktail »", "Peychaud élevait des coqs de combat dans sa cour", "Il servait ses toniques dans une coquille d'œuf", "« Coquetier » était le surnom de son officine"], "r": 0, "e": "L'apothicaire Peychaud aurait servi ses toniques dans un coquetier ; le mot, mal prononcé par les Anglophones, aurait donné « cocktail ». Une hypothèse séduisante, mais aucune source ne la confirme : à présenter comme légende.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « cocktail »", "lv": 2}, {"id": "390c75f889", "t": "h1", "q": "Jerry Thomas a exercé notamment :", "o": ["À l'Occidental Hotel (San Francisco) et à New York", "À l'American Bar du Savoy, à Londres", "Au Harry's New York Bar, à Paris", "Au Floridita, à La Havane"], "r": 0, "e": "Il a aussi parcouru l'Europe avec ses propres outils en argent. Son surnom : « le Professeur ». Son Blue Blazer, jet de whisky enflammé, est son numéro le plus célèbre.", "s": "D. Wondrich, Imbibe! (2e éd., 2015), biographie de Jerry Thomas", "lv": 2}, {"id": "cb37527eab", "t": "h1", "q": "Le Manhattan serait né, selon la légende la plus répandue :", "o": ["Au Manhattan Club de New York", "Au Waldorf-Astoria de New York", "Au restaurant Delmonico's de New York", "Au Hoffman House de New York"], "r": 0, "e": "Dans les années 1870, lors d'un banquet que la légende attribue à Jennie Jerome, mère de Winston Churchill, chronologiquement impossible, elle était alors en Angleterre. À raconter comme légende.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Manhattan cocktail »", "lv": 2}, {"id": "3c39bb77d8", "t": "h3", "q": "Le Mojito, le Daiquiri et le Cuba Libre partagent :", "o": ["Une origine cubaine", "Un même créateur", "Une origine portoricaine", "Une base de rhum vieux"], "r": 0, "e": "Le Cuba Libre naît vers 1900 avec l'arrivée du Coca-Cola à Cuba pendant la présence américaine ; le Mojito descend du Draque, mélange de tafia, citron vert, menthe et sucre attribué au XVIe siècle.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Cuba Libre » ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Mojito »", "lv": 1}, {"id": "8ebd45d36a", "t": "h3", "q": "Le Negroni Sbagliato a été créé :", "o": ["Au Bar Basso de Milan", "Au Caffè Camparino", "Au Caffè Casoni de Florence", "Au Harry's Bar de Venise"], "r": 0, "e": "« Sbagliato » veut dire raté : Mirko Stocchetto aurait saisi une bouteille de spumante à la place du gin. Bar Basso, Milan, années 1970.", "s": "Difford's Guide, fiche « Negroni Sbagliato »", "lv": 1}, {"id": "2d5059d686", "t": "h3", "q": "Le Bellini a été créé par :", "o": ["Giuseppe Cipriani, au Harry's Bar", "Arrigo Cipriani, au Hotel Cipriani", "Mirko Stocchetto, au Bar Basso", "Gaspare Campari, au Camparino"], "r": 0, "e": "Vers 1948, prosecco et purée de pêche blanche. Le nom vient du peintre Giovanni Bellini, dont une rétrospective avait lieu à Venise. Le Harry's Bar a ouvert en 1931.", "s": "Difford's Guide, fiche « Bellini »", "lv": 1}, {"id": "a5571c35e8", "t": "h2", "q": "Harry Craddock, avant d'arriver au Savoy, avait travaillé :", "o": ["Aux États-Unis, qu'il quitte à la Prohibition", "En Écosse, dans un hôtel d'Édimbourg", "À La Havane, au Sloppy Joe's", "En Australie, dans un hôtel de Sydney"], "r": 0, "e": "Il aurait servi le dernier cocktail légal avant l'entrée en vigueur du Volstead Act. Le Savoy Cocktail Book paraît en 1930, illustré dans le style art déco.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Craddock, Harry »", "lv": 2}, {"id": "ff6eb914e8", "t": "h2", "q": "Le Hanky Panky d'Ada Coleman doit son nom :", "o": ["À la réaction de l'acteur Charles Hawtrey", "À une chanson de music-hall de l'époque", "Au surnom d'un cheval de course du Derby", "À une rue mal famée du quartier de Soho"], "r": 0, "e": "Il aurait dit « by Jove, that is the real hanky panky ». Gin, vermouth rouge et deux traits de Fernet-Branca. Coleman a tenu l'American Bar de 1903 à 1926.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Coleman, Ada »", "lv": 2}, {"id": "6aa408fec7", "t": "h2", "q": "Le Bloody Mary est attribué à :", "o": ["Fernand Petiot", "Harry Craddock", "Harry McElhone", "Frank Meier"], "r": 0, "e": "Au New York Bar de Paris (futur Harry's) au début des années 1920, sous les ordres de MacElhone, puis développé au King Cole Bar du St. Regis à New York, où il fut rebaptisé Red Snapper. Attribution DISPUTÉE : l'acteur George Jessel revendiquait la paternité du simple vodka-tomate ; Petiot soutenait avoir ajouté les épices et les sauces qui en font un vrai Bloody Mary.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Bloody Mary »", "lv": 2}, {"id": "21ae1d0c85", "t": "h2", "q": "Le Vieux Carré a été créé :", "o": ["À l'Hôtel Monteleone de La Nouvelle-Orléans", "Au Napoleon House de La Nouvelle-Orléans", "Au restaurant Antoine's de La Nouvelle-Orléans", "Au Roosevelt Hotel de La Nouvelle-Orléans"], "r": 0, "e": "En 1938, par Walter Bergeron, chef barman de l'hôtel. Attention au piège : le Carousel Bar, le comptoir tournant qu'on associe au drink, n'ouvre qu'en 1949. Nuance de datation : la recette paraît dès 1937 dans « Famous New Orleans Drinks and How to Mix 'Em » de Stanley Clisby Arthur. Rye (les Américains), cognac et Bénédictine (les Français), vermouth rouge (les Italiens), Peychaud's et angostura (les Créoles) : chaque ingrédient représente une communauté du quartier.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Vieux Carré »", "lv": 2}, {"id": "1da60f869d", "t": "h3", "q": "Le Last Word est un cocktail à parts égales né :", "o": ["Au Detroit Athletic Club", "Au Pegu Club de Rangoon", "Au Savoy", "Au Harry's Bar"], "r": 0, "e": "Il figure à la carte du club dès 1916, c'est la plus ancienne trace. Son créateur reste INCONNU : le vaudevilliste Frank Fogarty l'a popularisé mais rien ne prouve qu'il l'ait inventé. Gin, Chartreuse verte, marasquin, citron vert à parts égales. Oublié pendant un demi-siècle, il ne survit que par une mention dans « Bottoms Up! » de Ted Saucier (1951), où Murray Stenson le retrouve pour le remettre à la carte du Zig Zag Café de Seattle en 2003-2004.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Last Word »", "lv": 1}, {"id": "5b16bacb43", "t": "p8", "q": "La Chartreuse est produite par :", "o": ["Les moines chartreux", "Les bénédictins de Fécamp", "Les trappistes", "Les jésuites de Grenoble"], "r": 0, "e": "Le manuscrit de l'« élixir de longue vie » est remis aux Chartreux en 1605. La Chartreuse verte titre 55 %, la jaune 43 %. Seuls deux moines connaissent la recette complète.", "s": "Chartreuse Diffusion (chartreuse.fr)", "lv": 2}, {"id": "3cf772a66e", "t": "h1", "q": "L'angostura bitter a été mis au point :", "o": ["Par un médecin allemand au Venezuela", "Par un pharmacien de Trinidad", "Par un botaniste anglais en Guyane", "Par un moine espagnol"], "r": 0, "e": "Johann Siegert, chirurgien de l'armée de Bolívar, à Angostura (aujourd'hui Ciudad Bolívar) en 1824, comme tonique digestif. La production est transférée à Trinidad en 1875. Sa grande étiquette dépasse de la bouteille par erreur jamais corrigée.", "s": "House of Angostura (angosturabitters.com) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Angostura bitters »", "lv": 2}, {"id": "6b2ec0999f", "t": "h1", "q": "Le Gimlet est lié historiquement :", "o": ["À la Royal Navy et au scorbut", "À la marine marchande portugaise", "Aux planteurs de Ceylan", "À la Compagnie des Indes"], "r": 0, "e": "Le Merchant Shipping Act de 1867 impose le jus d'agrumes à bord ; le Rose's Lime Juice, conservé sans alcool, s'impose. Le nom viendrait du chirurgien Gimlette ou de la vrille (gimlet) à percer les fûts.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Gimlet »", "lv": 2}, {"id": "4af162b0e7", "t": "h3", "q": "Le Pisco Sour a été créé :", "o": ["Au Morris' Bar de Lima, vers 1920", "Au Club de la Unión de Santiago, vers 1910", "Dans une bodega d'Ica, vers 1880", "Au Gran Hotel Bolívar de Lima, vers 1935"], "r": 0, "e": "Par l'Américain Victor Vaughen Morris. Le Pérou et le Chili se disputent l'appellation pisco ; le Pérou impose une distillation unique au degré, sans eau ni bois.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Pisco Sour »", "lv": 2}, {"id": "8c87e0daeb", "t": "h4", "q": "Le Mai Tai et le Zombie appartiennent :", "o": ["Au répertoire tiki", "Aux cocktails de la Prohibition", "Aux classiques du Savoy", "Aux drinks de la Belle Époque"], "r": 0, "e": "Le Zombie est de Donn Beach (1934), le Mai Tai de Trader Vic (1944). Les deux maisons se sont longtemps disputé la paternité du style polynésien.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Zombie » ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Mai Tai »", "lv": 1}, {"id": "e5cd4750a1", "t": "p3", "q": "Combien de catégories légales de Scotch whisky ?", "o": ["Trois", "Quatre", "Cinq", "Sept"], "r": 2, "e": "Single malt, single grain, blended malt, blended grain, blended Scotch. Définies par les Scotch Whisky Regulations 2009.", "s": "Scotch Whisky Regulations 2009 (UK)", "lv": 3}, {"id": "08b29f46e3", "t": "p3", "q": "Un « blended malt Scotch » est :", "o": ["Un assemblage de single malts de plusieurs distilleries", "Un assemblage de whiskies de malt et de grain", "Un single malt vieilli dans plusieurs types de fûts", "Un malt d'une seule distillerie, sur plusieurs âges"], "r": 0, "e": "Anciennement « vatted malt » ou « pure malt ». Le « blended Scotch » tout court, lui, mélange malt et grain, c'est près de 90 % du marché.", "s": "Scotch Whisky Regulations 2009 (UK)", "lv": 2}, {"id": "eb15ea843d", "t": "p4", "q": "L'AOC Rhum agricole de la Martinique date de :", "o": ["1975", "1986", "1996", "2005"], "r": 2, "e": "Première AOC rhumière au monde, révisée en 2005 et 2014. Canne fraîchement coupée, pur jus, rectification interdite, 40 % vol minimum.", "s": "INAO, cahier des charges AOC Rhum de la Martinique", "lv": 3}, {"id": "4a1c5e3ed8", "t": "p4", "q": "Dans l'AOC Martinique, la seconde distillation est :", "o": ["Obligatoire", "Interdite", "Facultative", "Réservée aux rhums vieux"], "r": 1, "e": "La rectification est proscrite : une seule passe en colonne créole, pour garder les composés volatils, le texte impose même un minimum de 225 g/hl pour le rhum blanc.", "s": "INAO, cahier des charges AOC Rhum de la Martinique", "lv": 2}, {"id": "f2bbe6a1b7", "t": "p1", "q": "L'âge affiché sur un assemblage, quelle que soit la catégorie, est :", "o": ["La moyenne des eaux-de-vie", "L'âge du plus jeune composant", "L'âge du plus vieux composant", "L'âge du fût"], "r": 1, "e": "Règle universelle : cognac, armagnac, whisky, rhum. C'est ce qui explique qu'un XO puisse contenir des eaux-de-vie bien plus vieilles que ses dix ans.", "s": "Règlement (UE) 2019/787, annexe I (mentions d'âge) ; BNIC, comptes d'âge", "lv": 2}, {"id": "4a6be34cc1", "t": "p3", "q": "Le « char » d'un fût de bourbon désigne :", "o": ["Le brûlage de la face interne du fût", "Le séchage des douelles à l'air libre", "L'essence de chêne utilisée pour le fût", "Le volume de contenance du fût"], "r": 0, "e": "Le char casse la lignine en vanilline et caramélise les sucres du bois, créant la « red layer ». Les niveaux 1 à 4 sont un usage professionnel, pas une obligation légale, le n°4 est dit « alligator ».", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « char »", "lv": 2}, {"id": "d2a4b1e0f9", "t": "p1", "q": "La différence entre macération et infusion tient :", "o": ["À la température : à froid contre à chaud", "À la durée : des jours contre des heures", "Au solvant : alcool contre eau", "À la plante : fraîche contre séchée"], "r": 0, "e": "Macération à froid, longue, dans l'alcool ; infusion dans un liquide chaud. La percolation, elle, fait circuler le liquide en continu à travers la matière.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « maceration »", "lv": 2}, {"id": "d66cfe8570", "t": "h1", "q": "L'Old Fashioned moderne est traditionnellement associé :", "o": ["Au Pendennis Club de Louisville", "Au Waldorf-Astoria de New York", "Au Manhattan Club de New York", "Au Seelbach Hotel de Louisville"], "r": 0, "e": "Club social de Louisville, Kentucky, vers 1880. L'attribution est traditionnelle et non prouvée : la formule spiritueux-sucre-eau-bitters est en réalité la définition même du cocktail de 1806. « Old Fashioned » était d'abord un argot de barman pour réclamer l'ancienne manière.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Old-Fashioned »", "lv": 2}, {"id": "e3a4570239", "t": "h1", "q": "Le Martinez figure pour la première fois dans une édition du guide de Jerry Thomas datée de :", "o": ["1862", "1876", "1887", "1900"], "r": 2, "e": "Édition posthume de 1887 (Thomas meurt en 1885) : Old Tom gin, vermouth, marasquin, Boker's bitters. O. H. Byron en imprimait déjà une version en 1884. Deux récits d'origine : Thomas à San Francisco, ou un barman de Martinez, en Californie.", "s": "J. Thomas, Bar-Tender's Guide (éd. 1887) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Martinez »", "lv": 2}, {"id": "7cdb575a18", "t": "h3", "q": "La Margarita a une origine :", "o": ["Disputée entre plusieurs revendications", "Documentée et incontestée", "Attribuée à Jerry Thomas en 1862", "Espagnole, du XIXe siècle"], "r": 0, "e": "Au moins trois prétendants : Carlos « Danny » Herrera au Rancho La Gloria de Tijuana (1938), le Kentucky Club de Ciudad Juárez, et la mondaine Margarita Sames à Acapulco (1948). Aucune n'est établie. Structure : c'est un Daisy à la tequila, « margarita » veut dire marguerite.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Margarita »", "lv": 1}, {"id": "7ec3199f1d", "t": "h4", "q": "La Piña Colada est traditionnellement attribuée à :", "o": ["Ramón « Monchito » Marrero, au Caribe Hilton en 1954", "Don Ramón Portas Mingot, chez Barrachina en 1963", "Ricardo García", "Les trois revendications coexistent"], "r": 3, "e": "Le Caribe Hilton de San Juan défend Marrero (1954), Barrachina affiche une plaque au nom de Portas Mingot (1963), et García revendique 1953. Un fait est sûr : la crème de coco Coco López, mise au point par le professeur Ramón López Irizarry en 1954, rend le drink possible. Boisson nationale de Porto Rico depuis 1978.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Piña Colada »", "lv": 1}, {"id": "60cff7586e", "t": "h3", "q": "Le Cuba Libre naît de :", "o": ["L'arrivée du Coca-Cola à Cuba vers 1900", "Un cocktail espagnol du XIXe siècle", "La révolution cubaine de 1959", "Un rhum arrangé des bars de La Havane"], "r": 0, "e": "Le Coca-Cola arrive à Cuba au tout début du XXe siècle, avec la présence américaine après la guerre hispano-américaine. Le toast « ¡Por Cuba libre! » donne son nom au rhum-cola.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Cuba Libre »", "lv": 2}, {"id": "7a6dc26b35", "t": "p3", "q": "Le Bottled-in-Bond Act, qui garantissait l'authenticité du whiskey américain, date de :", "o": ["1862", "1897", "1920", "1933"], "r": 1, "e": "L'une des premières lois de protection du consommateur aux États-Unis, bien avant la Prohibition : elle répondait aux whiskeys frelatés, coupés et colorés.", "s": "Bottled-in-Bond Act (1897) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « bottled in bond »", "lv": 3}, {"id": "9269db85bd", "t": "h2", "q": "Harry Craddock est crédité de la création :", "o": ["Du White Lady", "Du Manhattan", "Du Negroni", "Du Sidecar"], "r": 0, "e": "La version au gin du White Lady est attribuée à Craddock, au Savoy (fin des années 1920). MacElhone en donnait une version antérieure à la crème de menthe.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « White Lady »", "lv": 2}, {"id": "cd6a5bfe38", "t": "h2", "q": "Combien de recettes contient le Savoy Cocktail Book de 1930 ?", "o": ["Environ 250", "Environ 500", "Environ 750", "Environ 1 500"], "r": 2, "e": "Environ 750 recettes, dosées en « glasses » et « dashes », jamais en millilitres. Illustrations art déco de Gilbert Rumbold.", "s": "H. Craddock, The Savoy Cocktail Book (Londres, Constable, 1930)", "lv": 3}, {"id": "918153a1b2", "t": "h1", "q": "L'angostura bitter a été mis au point en :", "o": ["1806", "1824", "1850", "1875"], "r": 1, "e": "Par le chirurgien allemand Johann Siegert, médecin de l'armée de Bolívar, après quatre ans de recherches, comme tonique contre les maux d'estomac. Premier export en 1830 ; la production part pour Trinidad en 1875, fuyant l'instabilité vénézuélienne.", "s": "House of Angostura (angosturabitters.com) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Angostura bitters »", "lv": 2}, {"id": "a56f66804a", "t": "h2", "q": "Le Vieux Carré est né à l'hôtel Monteleone, mais attention :", "o": ["Le Carousel Bar n'ouvre qu'en 1949", "Bergeron n'y a jamais travaillé", "Il vient en réalité de Baton Rouge", "La recette est de Harry Craddock"], "r": 0, "e": "Le comptoir tournant qu'on associe au drink est postérieur. Autre nuance de datation : la recette paraît dès 1937 dans le livre de Stanley Clisby Arthur, un an avant la date de création communément retenue.", "s": "S. C. Arthur, Famous New Orleans Drinks and How to Mix 'Em (1937) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Vieux Carré »", "lv": 2}, {"id": "1d05596a53", "t": "h2", "q": "Le Last Word a été créé par :", "o": ["Un barman resté inconnu, à Detroit", "Frank Fogarty, artiste de vaudeville", "Ted Saucier, auteur de Bottoms Up!", "Murray Stenson, au Zig Zag Café"], "r": 0, "e": "PIÈGE. Le vaudevilliste Fogarty l'a popularisé, Saucier l'a publié en 1951, Stenson l'a ressuscité en 2003-2004, mais le créateur reste inconnu. Le drink figure à la carte du club dès 1916, où il était le plus cher : 35 cents.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Last Word »", "lv": 2}, {"id": "7aa676e946", "t": "h2", "q": "Le Bloody Mary est attribué à Fernand Petiot, mais :", "o": ["L'acteur George Jessel en revendiquait aussi la paternité", "Il n'a jamais travaillé au Harry's de Paris", "Il ne l'aurait créé qu'après 1950 à New York", "Il en a toujours nié la paternité"], "r": 0, "e": "Jessel revendiquait le simple vodka-tomate ; Petiot soutenait avoir ajouté les épices et les sauces qui en font un vrai Bloody Mary. Il commence garçon de cuisine au New York Bar de Paris à 16 ans, sous MacElhone, puis passe au King Cole Bar du St. Regis, où le drink devient le Red Snapper.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Bloody Mary »", "lv": 2}, {"id": "0a3c26b2f2", "t": "h3", "q": "Selon une lecture souvent avancée, les ingrédients du Vieux Carré représentent :", "o": ["Les quatre saisons", "Les communautés du quartier français", "Les quatre familles de cocktails", "Les états du Sud"], "r": 1, "e": "Rye pour les Américains, cognac et Bénédictine pour les Français, vermouth pour les Italiens, bitters pour les Créoles. Une interprétation séduisante, pas un fait documenté.", "s": "Difford's Guide, fiche « Vieux Carré »", "lv": 1}, {"id": "7606692939", "t": "h2", "q": "Le premier « cocktail party » documenté est attribué à :", "o": ["Mrs Julius S. Walsh Jr, à Saint-Louis, 1917", "Harry MacElhone, à Paris, en 1923", "Harry Craddock, au Savoy, en 1930", "Trader Vic, à Oakland, en 1944"], "r": 0, "e": "Missouri, 1917. Le format s'impose ensuite pendant la Prohibition, où recevoir chez soi devient la seule manière légale de boire en société.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « cocktail party » (E. Felten)", "lv": 2}, {"id": "eb63ab3b84", "t": "h5", "q": "Le Gold Rush, dont dérive le Penicillin, a été créé par :", "o": ["T.J. Siegal, au Milk & Honey", "Sam Ross, au Milk & Honey", "Sasha Petraske, au Milk & Honey", "Michael McIlroy, au Milk & Honey"], "r": 0, "e": "Vers 2001 : bourbon, citron, sirop de miel, un Whiskey Sour dont le sucre devient du miel. Sam Ross en tirera le Penicillin en changeant la base pour du scotch et en ajoutant le gingembre.", "s": "Difford's Guide, fiche « Gold Rush »", "lv": 2}, {"id": "76bbffc5f5", "t": "h5", "q": "Le Penicillin se termine par :", "o": ["Un float de scotch tourbé d'Islay", "Un rinçage d'absinthe verte", "Un float de vin rouge", "Une mousse de gingembre frais"], "r": 0, "e": "La base est un blended scotch, le float un single malt tourbé. Miel-gingembre et citron complètent. Sam Ross, Milk & Honey, 2005.", "s": "Difford's Guide, fiche « Penicillin »", "lv": 2}, {"id": "e139a52c37", "t": "c3", "q": "Le Red Hook, le Greenpoint ou le Bensonhurst forment une famille de twists nommés d'après :", "o": ["Des quartiers de Brooklyn", "Des barmen new-yorkais", "Des rues de Manhattan", "Des marques de rye"], "r": 0, "e": "Tous partent du Manhattan en remplaçant le vermouth ou en y ajoutant un amer. Le Red Hook de Vincenzo Errico (Milk & Honey, 2003), au Punt e Mes et marasquin, a ouvert la série.", "s": "Difford's Guide, fiche « Red Hook »", "lv": 1}, {"id": "3cb79ee8f1", "t": "h5", "q": "Le Porn Star Martini s'appelait d'abord :", "o": ["Maverick Martini", "Passion Martini", "Star Martini", "Townhouse Martini"], "r": 0, "e": "Douglas Ankrah, au Townhouse de Londres, 2001. Vodka vanille et fruit de la passion, servi avec un shot de champagne à part. C'est aujourd'hui l'un des cocktails les plus vendus au Royaume-Uni.", "s": "Difford's Guide, fiche « Pornstar Martini » ; The Drinks Business (nov. 2018)", "lv": 2}, {"id": "c011ccad70", "t": "h5", "q": "L'Old Cuban d'Audrey Saunders est essentiellement :", "o": ["Un mojito couronné de champagne", "Un daiquiri allongé au soda", "Un French 75 au rhum blanc", "Un Cuba Libre version premium"], "r": 0, "e": "Rhum vieux, menthe, citron vert, angostura et champagne, en 2001. Saunders, formée auprès de Dale DeGroff, ouvrira le Pegu Club en 2005, d'où sortira aussi le Gin-Gin Mule.", "s": "Difford's Guide, fiche « Old Cuban »", "lv": 2}, {"id": "f922b02790", "t": "h5", "q": "Le Jasmine de Paul Harrington part du :", "o": ["Pegu Club", "Negroni", "White Lady", "Bronx"], "r": 0, "e": "Il remplace l'angostura du Pegu Club par du Campari et le citron vert par du citron jaune. Emeryville, Californie, 1993. Nommé d'après son ami Matt Jasmin, dont il a mal orthographié le nom.", "s": "Difford's Guide, fiche « Jasmine »", "lv": 2}, {"id": "e18ce39e5b", "t": "h5", "q": "Dale DeGroff est aussi l'auteur :", "o": ["Du French Martini", "Du Cosmopolitan", "Du Bramble", "Du Penicillin"], "r": 0, "e": "Créé au Balthazar de Keith McNally à New York. DeGroff, surnommé « King Cocktail », officiait au Rainbow Room depuis 1987 : c'est lui qui remet les jus frais et les recettes historiques au centre du métier américain.", "s": "Difford's Guide, fiche « French Martini »", "lv": 2}, {"id": "d060ebf606", "t": "h5", "q": "Salvatore Calabrese est surnommé :", "o": ["The Maestro", "King Cocktail", "The Professor", "The Dean"], "r": 0, "e": "« The Professor », c'est Jerry Thomas ; « King Cocktail », Dale DeGroff. Calabrese, né sur la côte amalfitaine, a créé le Breakfast Martini au Library Bar du Lanesborough en 1996.", "s": "Difford's Guide, profil « Salvatore Calabrese »", "lv": 2}, {"id": "e883c63739", "t": "h1", "q": "Le punch est arrivé en Europe par :", "o": ["Les marins de la Compagnie anglaise des Indes", "Les corsaires français des Antilles", "Les conquistadors espagnols du Mexique", "Les colons portugais du Brésil"], "r": 0, "e": "Le mot viendrait du hindi « pāñč », cinq, pour ses cinq composants. Les premières mentions écrites datent des années 1630, chez les marins et marchands de la Compagnie des Indes.", "s": "D. Wondrich, Punch: The Delights (and Dangers) of the Flowing Bowl (2010)", "lv": 2}, {"id": "26935134f9", "t": "h1", "q": "Le mot « toddy » désigne à l'origine :", "o": ["La sève fermentée de palmier, en Inde", "Une boisson chaude au whisky", "Un grog de marin britannique", "Un punch de Noël anglais"], "r": 0, "e": "De l'hindi « tāṛī ». Le sens glisse ensuite vers le mélange chaud spiritueux-sucre-eau, servi en hiver.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « toddy »", "lv": 2}, {"id": "fb8ca868f3", "t": "h1", "q": "Le julep tire son nom :", "o": ["Du persan « gulab », eau de rose", "D'un barman de Virginie", "Du latin « julius »", "D'une plante de Louisiane"], "r": 0, "e": "Via l'arabe « julāb ». À l'origine une préparation médicinale sucrée servant de véhicule aux remèdes, comme beaucoup de cocktails, il descend de la pharmacopée.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « julep »", "lv": 2}, {"id": "394a3147d9", "t": "h1", "q": "Le « swizzle stick » antillais est à l'origine :", "o": ["Une branche de Quararibea turbinata", "Une tige de canne à sucre séchée", "Un os de poisson taillé en étoile", "Une racine de gingembre sauvage"], "r": 0, "e": "Le « bois lélé », dont les branches en étoile s'utilisent en le roulant entre les paumes dans la glace pilée, jusqu'au givrage du verre.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « swizzle »", "lv": 2}, {"id": "502df63754", "t": "h1", "q": "Le Sazerac est la boisson officielle :", "o": ["De La Nouvelle-Orléans", "De l'État de Louisiane", "De l'État du Mississippi", "De l'État d'Alabama"], "r": 0, "e": "Cocktail officiel de la ville depuis 2008. Rinçage à l'absinthe, Peychaud's, sucre, rye, et un zeste de citron qu'on ne laisse traditionnellement pas tomber dans le verre.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Sazerac cocktail »", "lv": 2}, {"id": "47d82b3d4f", "t": "h1", "q": "Le Brandy Crusta, ancêtre du Sidecar, est né :", "o": ["À La Nouvelle-Orléans, vers 1850", "À Paris, vers 1920", "À Londres, vers 1880", "À New York, vers 1900"], "r": 0, "e": "Attribué à Joseph Santini. Il introduit deux gestes majeurs : le sucre sur le bord du verre et le long ruban de zeste tapissant l'intérieur. C'est le premier cocktail à intégrer un agrume de façon structurelle.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « crusta »", "lv": 2}, {"id": "247aae53d3", "t": "c3", "q": "La famille « Daisy » se caractérise par :", "o": ["Un sour où une liqueur remplace une partie du sucre", "Un cocktail servi sur glace pilée à la paille", "Un drink allongé au champagne brut", "Un cocktail à l'œuf entier et à la crème"], "r": 0, "e": "La Margarita est un Daisy à la tequila, « margarita » veut d'ailleurs dire marguerite en espagnol. Le Yellow Daisy, lui, porte le nom sans appartenir à la famille.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « daisy »", "lv": 1}, {"id": "a99c77e90c", "t": "h2", "q": "Le cocktail arrive en Europe massivement :", "o": ["Avec les expositions universelles et les barmen américains", "Avec les soldats américains de 1918", "Uniquement avec l'exil de la Prohibition", "Avec le plan Marshall, après 1945"], "r": 0, "e": "Dès la fin du XIXe siècle, les hôtels de luxe européens recrutent des barmen américains. La Prohibition accélérera ce mouvement déjà lancé.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « American bar »", "lv": 2}, {"id": "3a4fe105c6", "t": "h2", "q": "Le Harry's New York Bar de Paris doit son existence à :", "o": ["Tod Sloan, jockey américain", "Harry MacElhone, barman écossais", "Frank Meier, barman autrichien", "Fernand Petiot, barman français"], "r": 0, "e": "Il fait démonter un bar new-yorkais et le remonter rue Daunou en 1911. MacElhone, barman écossais, en devient propriétaire en 1923 et lui donne son nom.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Harry's New York Bar »", "lv": 2}, {"id": "e11a883d85", "t": "h2", "q": "Le Ritz de Paris est associé au barman :", "o": ["Frank Meier", "Harry Craddock", "Constante Ribalaigua", "Joe Gilmore"], "r": 0, "e": "Frank Meier, chef barman du Ritz dans l'entre-deux-guerres, auteur de « The Artistry of Mixing Drinks ». Le bar du Ritz porte aujourd'hui le nom d'Hemingway.", "s": "Ritz Paris, Bar Hemingway (ritzparis.com) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Meier, Frank »", "lv": 2}, {"id": "401f7b099f", "t": "h2", "q": "Constante Ribalaigua, du Floridita, est célèbre pour :", "o": ["Le daiquiri frappé", "Le mojito de la Bodeguita", "Le Cuba Libre", "L'El Presidente"], "r": 0, "e": "Il passe le daiquiri au blender et met au point le Daiquiri n°3, sans sucre et au marasquin, que réclamait Hemingway. Le Floridita se surnomme « la cathédrale du daiquiri ».", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Floridita »", "lv": 2}, {"id": "0fa04a802b", "t": "h4", "q": "Le Jungle Bird est né :", "o": ["Au Hilton de Kuala Lumpur, en 1978", "Au Raffles de Singapour, en 1915", "Au Royal Hawaiian de Honolulu, en 1955", "Au Myrtle Bank de Kingston, en 1960"], "r": 0, "e": "Malaisie. C'est l'un des rares tiki à intégrer un amer italien : rhum noir, Campari, ananas, citron vert, sucre. Redécouvert dans les années 2010.", "s": "Difford's Guide, fiche « Jungle Bird »", "lv": 2}, {"id": "c9601efe46", "t": "h3", "q": "Le Vesper apparaît :", "o": ["Dans « Casino Royale » de Ian Fleming, 1953", "Au bar du Savoy, dans les années 1930", "Au Duke's Bar de Londres, en 1962", "Dans le film « Dr. No », en 1962"], "r": 0, "e": "Gin, vodka, Kina Lillet, ce dernier n'existe plus sous cette forme, ce qui rend la recette d'origine irreproduisible. Bond le nomme d'après Vesper Lynd.", "s": "I. Fleming, Casino Royale (1953), chap. 7", "lv": 2}, {"id": "234ebe3710", "t": "h2", "q": "Le Bee's Knees est typiquement :", "o": ["Un cocktail de la Prohibition", "Un drink victorien", "Un tiki", "Une création des années 1980"], "r": 0, "e": "Gin, miel, citron. Le miel masquait la rudesse du bathtub gin. L'expression « the bee's knees » signifiait alors « le nec plus ultra ».", "s": "Difford's Guide, fiche « Bee's Knees »", "lv": 2}, {"id": "be86b1baea", "t": "h2", "q": "Le Southside est associé :", "o": ["À Chicago et à la Prohibition", "À La Havane et au Floridita", "À Boston et au Ward Eight", "À Philadelphie et au Clover Club"], "r": 0, "e": "Gin, citron, sucre, menthe. La légende le rattache au gang du South Side de Chicago, dont le gin médiocre appelait la menthe. Attribution invérifiable, à présenter comme légende.", "s": "Difford's Guide, fiche « Southside »", "lv": 2}, {"id": "f825f62560", "t": "h2", "q": "Le Aviation contient, dans sa version d'origine :", "o": ["De la crème de violette", "De la Chartreuse jaune", "Du curaçao bleu", "De l'absinthe verte"], "r": 0, "e": "Gin, citron, marasquin et crème de violette, chez Hugo Ensslin en 1916. Le Savoy en 1930 omet la violette, devenue introuvable, d'où deux versions coexistantes.", "s": "H. Ensslin, Recipes for Mixed Drinks (1916) ; Difford's Guide, fiche « Aviation »", "lv": 1}, {"id": "f836eb9ac3", "t": "h2", "q": "Le Corpse Reviver n°2 est accompagné chez Craddock d'un avertissement :", "o": ["Quatre d'affilée raniment le mort, puis le retuent", "À ne boire que le matin, jamais après midi", "À déconseiller formellement aux dames", "À servir tiède, jamais frappé"], "r": 0, "e": "La famille des « Corpse Reviver » regroupe les remontants du matin. Le n°2, gin, Lillet, Cointreau, citron, rinçage d'absinthe, a survécu ; le n°1, au cognac et calvados, beaucoup moins.", "s": "H. Craddock, The Savoy Cocktail Book (1930), « Corpse Reviver (No. 2) »", "lv": 2}, {"id": "af63f638b0", "t": "h3", "q": "Le Pimm's Cup repose sur :", "o": ["Un gin-sling aromatisé de bar à huîtres", "Un vermouth anglais au quinquina", "Un punch colonial au rhum", "Une bière aromatisée aux herbes"], "r": 0, "e": "James Pimm, tenancier d'un bar à huîtres londonien, au XIXe siècle. Le Pimm's n°1 est à base de gin ; d'autres numéros ont existé à base de whisky, brandy, rhum, rye et vodka.", "s": "Difford's Guide, fiche « Pimm's Cup »", "lv": 1}, {"id": "832b6f7d23", "t": "h2", "q": "David Embury, auteur de « The Fine Art of Mixing Drinks » (1948), était :", "o": ["Avocat fiscaliste et amateur", "Barman du Waldorf-Astoria", "Journaliste gastronomique", "Distillateur de rye"], "r": 0, "e": "Un amateur éclairé. Il formalise les ratios, notamment le sour en 8:2:1, et classe les cocktails en apéritifs et digestifs. Son approche par proportions reste une référence.", "s": "D. Embury, The Fine Art of Mixing Drinks (1948)", "lv": 2}, {"id": "2f732a27b5", "t": "h2", "q": "Charles H. Baker Jr. est l'auteur de :", "o": ["« The Gentleman's Companion »", "« Imbibe! »", "« Bottoms Up! »", "« Café Royal Cocktail Book »"], "r": 0, "e": "Récit de voyage autant que recueil : il collecte les recettes autour du monde dans les années 1930. Une source précieuse pour les drinks exotiques d'avant-guerre.", "s": "C. H. Baker Jr., The Gentleman's Companion (1939)", "lv": 2}, {"id": "8b356167cf", "t": "h1", "q": "Quelle est l'origine du nom « Gimlet » ?", "o": ["Incertaine : chirurgien Gimlette ou vrille (gimlet)", "Un officier britannique de Singapour", "Un pub historique de Portsmouth", "Un navire de la Royal Navy"], "r": 0, "e": "Ni l'une ni l'autre n'est établie. Ce qui est documenté : le Merchant Shipping Act de 1867 impose les agrumes à bord, et le Rose's Lime Juice, conservé sans alcool, s'impose dans la Royal Navy.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Gimlet »", "lv": 2}, {"id": "8833a7d7de", "t": "h1", "q": "Le vermouth devient central au bar :", "o": ["Dans les années 1880-1890", "Dès 1786, à la cour de Turin", "Après 1945, avec le Spritz", "Pendant la Prohibition"], "r": 0, "e": "Son arrivée aux États-Unis fait basculer le cocktail du modèle « spiritueux-sucre-bitters » vers un modèle à deux alcools. C'est la naissance de la famille Martini-Manhattan.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « vermouth »", "lv": 2}, {"id": "dcee24e782", "t": "h3", "q": "L'Americano tire son nom :", "o": ["Probablement des Américains de passage à Milan", "D'un barman milanais nommé Americo", "De l'Amérique du Sud, où il serait né", "D'une marque de vermouth disparue"], "r": 0, "e": "Anciennement Milano-Torino. Le nom se fixe au début du XXe siècle. C'est le premier cocktail commandé par James Bond dans l'œuvre de Fleming.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Americano » ; I. Fleming, Casino Royale (1953)", "lv": 1}, {"id": "135b114c4d", "t": "h5", "q": "Le Boulevardier a été redécouvert :", "o": ["Dans les années 2000, avec le mouvement craft", "Dès les années 1950, à Paris", "En 1961, avec la première liste IBA", "En 1987, au Rainbow Room"], "r": 0, "e": "Oublié pendant des décennies après sa parution chez MacElhone en 1927, il revient avec le mouvement craft des années 2000.", "s": "Difford's Guide, fiche « Boulevardier »", "lv": 2}, {"id": "b45859a700", "t": "h5", "q": "Le Chartreuse Swizzle a été créé par :", "o": ["Marco Dionysos, à San Francisco", "Jeffrey Morgenthaler, à Portland", "Giuseppe González, à Brooklyn", "Joaquín Simó, à New York"], "r": 0, "e": "Vers 2003. Chartreuse verte, falernum, ananas, citron vert, sur glace pilée au bâton lélé. L'un des premiers modern classics à faire d'une liqueur de plantes la base du verre.", "s": "Difford's Guide, fiche « Chartreuse Swizzle »", "lv": 2}, {"id": "fcc411874d", "t": "h5", "q": "Le Siesta, twist de Hemingway Daiquiri à la tequila, est de :", "o": ["Katie Stipe", "Audrey Saunders", "Julie Reiner", "Ivy Mix"], "r": 0, "e": "Au Flatiron Lounge de New York, vers 2006. Tequila, Campari, pamplemousse, citron vert. Un pont direct entre l'agave et l'amer italien.", "s": "Difford's Guide, fiche « Siesta »", "lv": 2}, {"id": "b929f5732d", "t": "h5", "q": "Jeffrey Morgenthaler est surtout connu pour :", "o": ["Sa réhabilitation de l'Amaretto Sour", "Sa création du Penicillin", "Sa création du Paper Plane", "Sa création du Bramble"], "r": 0, "e": "Barman de Portland, Oregon. Sa version ajoute du bourbon overproof et un blanc d'œuf à un drink jusque-là méprisé. Il a aussi théorisé les cocktails en bouteille et la carbonatation.", "s": "J. Morgenthaler, jeffreymorgenthaler.com (Amaretto Sour, 2012)", "lv": 2}, {"id": "747f9763c0", "t": "h5", "q": "Le Benton's Old Fashioned, emblème du fat-washing, est de :", "o": ["Don Lee, au PDT", "Eben Freeman", "Tony Conigliaro", "Dave Arnold"], "r": 0, "e": "New York, 2007 : bourbon lavé au gras de bacon Benton's, sirop d'érable, bitters. La technique du fat-washing est due à Eben Freeman ; Don Lee en signe l'application la plus célèbre.", "s": "Difford's Guide, fiche « Benton's Old Fashioned » ; J. Meehan, The PDT Cocktail Book (2011)", "lv": 2}, {"id": "72eca620c1", "t": "h5", "q": "Dave Arnold est l'auteur de :", "o": ["« Liquid Intelligence »", "« Imbibe! »", "« The Craft of the Cocktail »", "« Death & Co »"], "r": 0, "e": "Il applique la physique et la chimie au bar : clarification à la centrifugeuse, carbonatation, contrôle de la dilution et de la température. Fondateur du Booker and Dax à New York.", "s": "D. Arnold, Liquid Intelligence (W. W. Norton, 2014)", "lv": 2}, {"id": "df55537417", "t": "h5", "q": "Tony Conigliaro est associé :", "o": ["Au 69 Colebrooke Row, à Londres", "Au Death & Co, à New York", "Au Pegu Club, à New York", "Au Dead Rabbit, à New York"], "r": 0, "e": "Il travaille la distillation, le vieillissement et les arômes de synthèse au bar. Son Drinks Factory a essaimé dans toute la scène londonienne.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Conigliaro, Tony »", "lv": 2}, {"id": "d6258e6f3c", "t": "h5", "q": "Le Dead Rabbit, à New York, est associé :", "o": ["Sean Muldoon et Jack McGarry", "Sasha Petraske et Michael McIlroy", "Julie Reiner et Susan Fedroff", "Dale DeGroff et Audrey Saunders"], "r": 0, "e": "Ouvert en 2013, il remet au goût du jour le punch et le style irlando-américain du XIXe, avec un menu illustré en bande dessinée.", "s": "The Dead Rabbit (deadrabbitnyc.com)", "lv": 2}, {"id": "caa9f32ecc", "t": "h5", "q": "Julie Reiner a fondé :", "o": ["Le Flatiron Lounge et le Clover Club", "Le Milk & Honey et l'Attaboy", "Le PDT et le Crif Dogs", "L'Employees Only et le Macao"], "r": 0, "e": "Figure majeure de la scène new-yorkaise, elle a formé une génération de barmen, c'est au Clover Club que Giuseppe González crée le Trinidad Sour.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Reiner, Julie »", "lv": 2}, {"id": "12969c3d3d", "t": "h5", "q": "Kazuo Uyeda est connu pour :", "o": ["Le hard shake japonais", "Le throwing", "Le swizzle", "La clarification au lait"], "r": 0, "e": "Barman de Ginza, il a codifié un geste de shake très précis censé aérer sans sur-diluer. Son efficacité réelle est débattue, mais son influence sur la discipline japonaise est incontestable.", "s": "K. Uyeda, Cocktail Techniques (2010)", "lv": 2}, {"id": "9c6f2a81de", "t": "h5", "q": "Hidetsugu Ueno est associé :", "o": ["Au Bar High Five de Ginza", "Au Le Lion de Hambourg", "Au Connaught de Londres", "À l'Artesian de Londres"], "r": 0, "e": "Sa taille du diamant à la pique à glace est devenue un emblème de l'école japonaise, où le geste et le produit priment sur la créativité affichée.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Japanese bartending »", "lv": 2}, {"id": "ee4c3c977f", "t": "c4", "q": "Le Connaught Bar de Londres est dirigé par :", "o": ["Ago Perrone", "Salvatore Calabrese", "Peter Dorelli", "Alex Kratena"], "r": 0, "e": "Son Martini servi au chariot, avec une sélection de bitters maison, est devenu un rituel de référence. Le bar a plusieurs fois été classé premier mondial.", "s": "The World's 50 Best Bars (palmarès 2020 et 2021)", "lv": 2}, {"id": "81608e2b54", "t": "c4", "q": "Le Paradiso de Barcelone, classé meilleur bar du monde, est dirigé par :", "o": ["Giacomo Giannotti", "Simone Caporale", "Ago Perrone", "Marian Beke"], "r": 0, "e": "Bar caché derrière une devanture de pastrami. Il incarne la vague de la mixologie « expérientielle » : scénographie, récit et technique de laboratoire.", "s": "The World's 50 Best Bars (palmarès 2022)", "lv": 2}, {"id": "e0c4171d61", "t": "h5", "q": "Le Gin-Gin Mule est une création :", "o": ["D'Audrey Saunders", "De Dick Bradsell", "De Sam Ross", "De Dale DeGroff"], "r": 0, "e": "Elle croise le Mojito et le Moscow Mule sur une base de gin : menthe, citron vert, sirop de gingembre, ginger beer. Créé avant l'ouverture du Pegu Club, qu'elle fonde en 2005.", "s": "Difford's Guide, fiche « Gin-Gin Mule »", "lv": 2}, {"id": "9781b8a987", "t": "h5", "q": "Le Division Bell, twist du Last Word, est de :", "o": ["Phil Ward", "Joaquín Simó", "Sam Ross", "Giuseppe González"], "r": 0, "e": "Mezcal, Aperol, marasquin, citron vert, comme le Naked and Famous, il démontre que la structure à parts égales du Last Word accepte presque toutes les bases.", "s": "Difford's Guide, fiche « Division Bell »", "lv": 2}, {"id": "0eb9e8219e", "t": "h5", "q": "Le Death & Co, à New York, a ouvert en :", "o": ["2006", "2010", "2013", "2001"], "r": 0, "e": "Dans l'East Village. Phil Ward y crée l'Oaxaca Old-Fashioned, Joaquín Simó le Naked and Famous. Son livre de 2014 est devenu une référence de méthode.", "s": "A. Day, N. Fauchald, D. Kaplan, Death & Co: Modern Classic Cocktails (2014)", "lv": 2}, {"id": "a0ee63780d", "t": "h5", "q": "Le terme « craft cocktail » désigne :", "o": ["Le retour aux jus frais et aux recettes historiques", "Les cocktails de moins de trois ingrédients", "Les cocktails à base de bière artisanale", "Les cocktails servis sans aucune glace"], "r": 0, "e": "Né aux États-Unis dans les années 1990-2000 autour de DeGroff, Petraske et Saunders, en réaction aux sirops industriels et aux mélanges tout prêts des années 70-80.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « craft cocktail movement »", "lv": 2}, {"id": "a73c2a266a", "t": "c4", "q": "Simone Caporale et Alex Kratena ont marqué :", "o": ["L'Artesian, au Langham de Londres", "L'American Bar du Savoy", "Le Connaught Bar", "Le Dandelyan, au Mondrian"], "r": 0, "e": "Quatre années consécutives en tête du classement mondial. Ils ont poussé la présentation et la scénographie du service à un niveau spectaculaire.", "s": "The World's 50 Best Bars (palmarès 2012 à 2015)", "lv": 2}, {"id": "c6938cf7c3", "t": "h5", "q": "Ryan Chetiyawardana, dit Mr Lyan, est connu pour :", "o": ["Un bar sans glace ni produits frais", "La codification du hard shake", "La création du Trinidad Sour", "L'ouverture du Dead Rabbit"], "r": 0, "e": "White Lyan, à Londres, en 2013 : ni glace, ni agrumes, ni périssables, ni marques. Tout est préparé à l'avance. Une provocation devenue une référence sur la durabilité au bar.", "s": "Australian Bartender (sept. 2014) ; Time Out London, fiche « White Lyan »", "lv": 2}, {"id": "96c850e915", "t": "h5", "q": "L'Espresso Martini connaît sa seconde vie :", "o": ["Dans les années 2010-2020", "Dans les années 1990", "Jamais, il n'a pas disparu", "Après 2023"], "r": 0, "e": "Devenu l'un des cocktails les plus commandés au monde, quarante ans après sa création par Bradsell. Sa renaissance tient beaucoup aux liqueurs de café de nouvelle génération.", "s": "Difford's Guide, fiche « Espresso Martini »", "lv": 2}, {"id": "7b56c45f75", "t": "p4", "q": "Le mezcal peut être produit à partir :", "o": ["De nombreuses variétés d'agave", "Uniquement d'agave bleu Weber", "Uniquement d'espadín", "D'agave et de canne"], "r": 0, "e": "Espadín, tobalá, tepeztate, madrecuishe… La tequila, elle, impose l'agave bleu Weber. L'appellation mezcal couvre plusieurs États mexicains, Oaxaca en tête.", "s": "NOM-070-SCFI-2016 (mezcal)", "lv": 2}, {"id": "ef27e47599", "t": "p4", "q": "La tequila est produite principalement dans l'État :", "o": ["De Jalisco", "D'Oaxaca", "De Guerrero", "Du Michoacán"], "r": 0, "e": "Plus quelques communes de quatre autres États. Deux grandes zones : Los Altos, aux sols rouges et agaves plus fruités, et la vallée de Tequila, plus terreuse.", "s": "CRT, norme NOM-006-SCFI-2012 (zone d'appellation)", "lv": 2}, {"id": "ee0e84e8ec", "t": "p6", "q": "Le champagne impose une seconde fermentation :", "o": ["En bouteille", "En cuve close", "En fût", "En amphore"], "r": 0, "e": "C'est la méthode traditionnelle. La méthode Charmat, en cuve close, donne le prosecco. Une différence qui explique la finesse des bulles et le prix.", "s": "Comité Champagne ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Charmat method »", "lv": 2}, {"id": "c95503c8d5", "t": "p5", "q": "Le genièvre belge et néerlandais (jenever) se distingue du gin par :", "o": ["Sa base de moutwijn, un distillat de grain", "Son degré minimum plus élevé", "L'absence totale de genièvre", "Un vieillissement obligatoire en fût"], "r": 0, "e": "Le gin part d'un alcool neutre ; le jenever conserve un vin de grain maltée. C'est l'ancêtre du gin, ramené en Angleterre au XVIIe siècle.", "s": "Règlement (UE) 2019/787, annexe I (IG Genièvre / Jenever) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « genever »", "lv": 2}, {"id": "ff886caeb0", "t": "p5", "q": "Le triple sec et le curaçao se distinguent :", "o": ["Par l'usage commercial, sans frontière légale", "Par un degré minimum différent", "Par une couleur imposée par la loi", "Par une origine géographique protégée"], "r": 0, "e": "Tous deux sont des liqueurs d'écorces d'orange. Le curaçao renvoie à l'orange laraha de l'île du même nom ; « triple sec » désigne un style sec et limpide, sans définition juridique stricte.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « curaçao » ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « triple sec »", "lv": 2}, {"id": "4d285db814", "t": "p5", "q": "Le marasquin (maraschino) est :", "o": ["Une liqueur de cerises marasques", "Une eau-de-vie de cerises noires", "Une liqueur de prunelles sauvages", "Un sirop de griottes sans alcool"], "r": 0, "e": "Une liqueur, élaborée à partir d'un distillat de cerises marasques (noyaux compris). Originaire de Zadar, en Dalmatie.", "s": "Règlement (UE) 2019/787, annexe I, cat. 38 (Maraschino) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « maraschino »", "lv": 2}, {"id": "2d760630c1", "t": "p5", "q": "Le falernum est originaire :", "o": ["De la Barbade", "De la Jamaïque", "De Cuba", "De Trinidad"], "r": 0, "e": "Sirop ou liqueur au citron vert, gingembre, clou de girofle et amande. Indispensable au tiki et au Chartreuse Swizzle. Existe en version alcoolisée et non alcoolisée.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « falernum »", "lv": 2}, {"id": "8f6c5dff8a", "t": "p5", "q": "La thuyone, longtemps accusée dans l'absinthe, est aujourd'hui :", "o": ["Limitée, et innocentée de ses effets supposés", "Totalement interdite dans l'Union", "Autorisée sans aucune limite", "Obligatoire pour l'appellation absinthe"], "r": 0, "e": "Les analyses d'absinthes d'époque ont montré des taux très inférieurs à ce qu'on croyait. Les effets attribués relevaient surtout du degré élevé et des adultérations.", "s": "Règlement (CE) 1334/2008 (arômes) ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « thujone »", "lv": 2}, {"id": "668b5bdd5a", "t": "p6", "q": "La fermentation malolactique concerne :", "o": ["Le vin, pas les spiritueux", "La bière, lors du houblonnage", "Le whisky, lors du maltage", "La tequila, lors de la cuisson"], "r": 0, "e": "Elle transforme l'acide malique en acide lactique, adoucissant le vin. Utile à connaître pour parler des vins de base du vermouth et du cognac.", "s": "Oxford Companion to Wine (J. Robinson, 4e éd., 2015), « malolactic conversion »", "lv": 2}, {"id": "392e566e07", "t": "p4", "q": "Les esters, responsables du « funk » jamaïcain, naissent :", "o": ["De la fermentation, longue et avec dunder", "De la distillation, sans autre facteur", "Du seul vieillissement en fût", "D'un ajout d'arômes autorisé"], "r": 0, "e": "Le dunder, résidu de distillation réintroduit dans la cuve, pousse la fermentation. Hampden et Worthy Park en ont fait leur signature ; la mesure se fait en g/hlAP.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « dunder » ; Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « Jamaican rum »", "lv": 2}, {"id": "925d1758ce", "t": "p1", "q": "Le « angel's share » est plus élevé :", "o": ["En climat tropical", "En climat froid", "En cave enterrée", "En fût neuf uniquement"], "r": 0, "e": "Jusqu'à 6-8 % par an aux Caraïbes contre 2 % environ en Écosse. C'est ce qui rend un rhum de huit ans tropical comparable à un whisky bien plus vieux.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « angel's share »", "lv": 2}, {"id": "1a6092ee43", "t": "p1", "q": "La filtration à froid d'un spiritueux vise :", "o": ["Éviter le trouble à basse température", "Augmenter le degré d'alcool", "Accélérer le vieillissement", "Retirer la couleur du fût"], "r": 0, "e": "Elle retire des acides gras et esters qui précipitent au froid, au prix d'une perte de texture. D'où les mentions « non chill-filtered » revendiquées par certains producteurs.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « chill filtration »", "lv": 2}, {"id": "ea83efcf8f", "t": "p3", "q": "Le caramel E150a est autorisé :", "o": ["Dans le Scotch, pour ajuster la couleur", "Dans aucun spiritueux européen", "Uniquement dans les liqueurs", "Uniquement dans le rhum"], "r": 0, "e": "Les Scotch Whisky Regulations l'autorisent explicitement. Le bourbon, lui, n'admet aucun additif hormis l'eau, une différence de philosophie entre les deux traditions.", "s": "Scotch Whisky Regulations 2009 ; US TTB, 27 CFR §5.22", "lv": 2}, {"id": "2f4f5c1346", "t": "p3", "q": "La mention « single cask » signifie :", "o": ["Embouteillé depuis un seul fût", "Produit par une seule distillerie", "Vieilli une seule fois", "Issu d'une seule récolte"], "r": 0, "e": "À ne pas confondre avec « single malt », où « single » désigne la distillerie. Un single cask est souvent embouteillé brut de fût, en série limitée numérotée.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « single cask »", "lv": 2}, {"id": "51bba29b5e", "t": "p1", "q": "Le « brut de fût » (cask strength) signifie :", "o": ["Embouteillé sans réduction à l'eau", "Embouteillé à 40 % tout rond", "Vieilli en fût neuf uniquement", "Embouteillé sans filtration"], "r": 0, "e": "Le degré varie selon le fût et la durée : souvent entre 50 et 65 %.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « cask strength »", "lv": 2}, {"id": "cfee79bd0e", "t": "p6", "q": "Le vin muté à l'alcool, base des mistelles, se nomme :", "o": ["Mistelle ou vin de liqueur", "Vin cuit", "Vin doux naturel uniquement", "Vermouth"], "r": 0, "e": "Le moût est muté avant fermentation complète, gardant son sucre. Pineau des Charentes, Floc de Gascogne, Macvin du Jura, et la mistelle de muscat qui entre dans le Noilly Prat.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich & Rothbaum, 2021), entrée « mistelle » ; INAO (Pineau des Charentes, Floc de Gascogne)", "lv": 2}, {"id": "b6196b7cc9", "t": "h1", "q": "En quelle année paraît la première définition écrite du mot « cocktail » ?", "o": ["1762", "1806", "1862", "1920"], "r": 1, "e": "1806, dans le journal The Balance and Columbian Repository, État de New York.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 3}, {"id": "36764aeb99", "t": "h1", "q": "Que contient la définition originelle du cocktail de 1806 ?", "o": ["Alcool, sucre, eau, bitters", "Gin, vermouth, bitters, citron", "Rhum, citron, sucre, eau", "Vin, eau-de-vie, sucre, épices"], "r": 0, "e": "Alcool, sucre, eau et bitters : c'est exactement la structure de l'Old Fashioned.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "a24a1141be", "t": "h1", "q": "Qui publie en 1862 le premier livre de recettes de cocktails ?", "o": ["Harry Craddock", "Dale DeGroff", "Jerry Thomas", "Harry MacElhone"], "r": 2, "e": "Jerry Thomas, « The Professor », avec How to Mix Drinks.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "d85dcc9e0f", "t": "h1", "q": "Quel surnom porte Jerry Thomas ?", "o": ["The King", "The Professor", "The Beachcomber", "The Doctor"], "r": 1, "e": "« The Professor », père de la mixologie américaine.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "aa0cf951de", "t": "h2", "q": "Sur quelle période s'étend la Prohibition aux États-Unis ?", "o": ["1900-1913", "1914-1918", "1920-1933", "1933-1945"], "r": 2, "e": "De 1920 (Volstead Act) à 1933, abrogée par le 21e amendement.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "54122e392e", "t": "h2", "q": "Comment appelle-t-on les bars clandestins de la Prohibition ?", "o": ["Speakeasies", "Saloons", "Taverns", "Honky-tonks"], "r": 0, "e": "Les speakeasies, où l'on commandait à voix basse.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "c7a60fa3c8", "t": "h2", "q": "Dans quel hôtel londonien officiait Harry Craddock, auteur du Savoy Cocktail Book (1930) ?", "o": ["Le Ritz", "Le Savoy", "Le Claridge's", "Le Connaught"], "r": 1, "e": "Au Savoy de Londres, dont il a rédigé la bible de 1930.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "f7db938608", "t": "h2", "q": "Quelle ville devient une grande capitale du cocktail pendant la Prohibition grâce à l'exode des barmen ?", "o": ["Mexico", "La Havane", "Montréal", "Lisbonne"], "r": 1, "e": "La Havane, à Cuba, toute proche de la Floride.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "94b3851278", "t": "h2", "q": "Quel bar parisien est lié au Bloody Mary et au French 75 ?", "o": ["Le Bar Hemingway", "Harry's New York Bar", "Le Forvm", "La Closerie"], "r": 1, "e": "Le Harry's New York Bar d'Harry MacElhone, rue Daunou.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "4edca2a09e", "t": "h4", "q": "À qui attribue-t-on, de façon disputée, la création du Mai Tai en 1944 ?", "o": ["Donn Beach", "Trader Vic", "Dale DeGroff", "Sasha Petraske"], "r": 1, "e": "Trader Vic (Victor Bergeron), mais Donn Beach l'a aussi revendiqué.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "5e3351aec4", "t": "h4", "q": "Quel est l'esprit de base de la quasi-totalité des cocktails tiki ?", "o": ["Le gin", "La tequila", "Le rhum", "Le whisky"], "r": 2, "e": "Le rhum, accompagné de sirops exotiques et d'orgeat.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "d5b66c0191", "t": "h5", "q": "Quel barman est surnommé « King Cocktail » et relance les jus frais dès les années 1980 ?", "o": ["Sasha Petraske", "Dale DeGroff", "Harry Craddock", "Jerry Thomas"], "r": 1, "e": "Dale DeGroff, au Rainbow Room de New York.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "4a50e9d725", "t": "h5", "q": "Dans quelle décennie Milk & Honey a-t-il ouvert à New York ?", "o": ["Les années 1980", "Les années 1990", "Les années 2000"], "r": 1, "e": "Ouvert le 31 décembre 1999 : techniquement les années 90.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "5c910088a9", "t": "c3", "q": "Quelle est la structure mère, dite « forme originelle » du cocktail ?", "o": ["Le Sour", "L'Old Fashioned", "Le Highball", "Le Flip"], "r": 1, "e": "L'Old Fashioned : spiritueux, sucre, bitters, glace.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "c468306076", "t": "c3", "q": "De quelle famille fait partie le Whiskey Sour ?", "o": ["Highball", "Sour", "Julep", "Flip"], "r": 1, "e": "Le Sour : spiritueux, agrume, sucre.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "bff49ff69b", "t": "c3", "q": "Quel cocktail définit la famille du Julep ?", "o": ["Mojito", "Mint Julep", "Tom Collins", "Caipirinha"], "r": 1, "e": "Le Mint Julep : bourbon, sucre, menthe, glace pilée.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "56030a8eb4", "t": "h1", "q": "Le mot « punch » vient du hindi panch. Que signifie-t-il ?", "o": ["Trois", "Cinq", "Sept", "Mélange"], "r": 1, "e": "Cinq, pour les cinq ingrédients du punch d'origine.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "0628d1cbff", "t": "c3", "q": "Que signifie « Margarita » en espagnol, en référence à la famille des Daisy ?", "o": ["Marguerite", "Perle fine", "Citron vert", "Fleur de sel"], "r": 0, "e": "Marguerite, soit « daisy » en anglais : la Margarita est une daisy à la tequila.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "77977789ce", "t": "h3", "q": "Le Negroni naît à Florence vers 1919 quand un comte demande de renforcer quel cocktail au gin ?", "o": ["Le Spritz", "L'Americano", "Le Martini", "Le Boulevardier"], "r": 1, "e": "L'Americano (Campari, vermouth rouge, soda), renforcé au gin par le comte Negroni.", "s": "Difford’s Guide", "lv": 1}, {"id": "2d19185d96", "t": "h3", "q": "Quelles sont les proportions classiques du Negroni ?", "o": ["Parts égales", "Double dose de gin", "Double dose de vermouth", "Triple dose de Campari"], "r": 0, "e": "Parts égales : gin, Campari, vermouth rouge.", "s": "Difford’s Guide", "lv": 1}, {"id": "9e6fd0c85a", "t": "h3", "q": "Quel cocktail associe whiskey, vermouth rouge et Angostura, au verre à mélange ?", "o": ["Le Manhattan", "Le Sazerac", "Le Boulevardier", "Le Rob Roy"], "r": 0, "e": "Le Manhattan, originaire de New York.", "s": "Difford’s Guide", "lv": 1}, {"id": "efbc2ddf85", "t": "h3", "q": "Le Daiquiri est attribué à Jennings Cox près d'une mine de quel pays ?", "o": ["Mexique", "Cuba", "Porto Rico", "Jamaïque"], "r": 1, "e": "Cuba, près de la mine de Daiquirí.", "s": "Difford’s Guide", "lv": 1}, {"id": "70818d50c9", " Gabriel Sedlmayr"], "r": 0, "e": "George Hodgson, de la Bow Brewery, fournisseur de la Compagnie des Indes.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "abdc7b15c1", "t": "p7", "q": "Dans quelle ville la pilsner est-elle née en 1842 ?", "o": ["Munich", "Plzeň", "Vienne", "Prague"], "r": 1, "e": "À Plzeň (Pilsen), en Bohême, d'où son nom.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "cfd5cd3b00", "t": "p7", "q": "Quel brasseur a créé la première pilsner ?", "o": ["Josef Groll", "Anton Dreher", "Arthur Guinness", "Christian Moerlein"], "r": 0, "e": "Josef Groll, brasseur bavarois appelé à Plzeň.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "7aca1a6f2e", "t": "p7", "q": "En quelle année Arthur Guinness s'installe-t-il à St James's Gate à Dublin ?", "o": ["1759", "1799", "1842", "1886"], "r": 0, "e": "1759, avec un bail fameux de 9 000 ans.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 3}, {"id": "4566b2ee61", "t": "p7", "q": "De quel style londonien du 18e siècle descend le stout ?", "o": ["Le porter", "La pale ale", "La lambic", "La bitter"], "r": 0, "e": "Du porter, bière brune des porteurs des marchés de Londres.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "d3adf00e91", "t": "p7", "q": "Les ales relèvent de quel type de fermentation ?", "o": ["Fermentation haute", "Fermentation basse", "Fermentation spontanée", "Fermentation mixte"], "r": 0, "e": "Fermentation haute (températures plus chaudes). Les lagers : fermentation basse.", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "594b2a9193", "t": "p7", "q": "Quel terme désigne les bières de fermentation basse ?", "o": ["Ales", "Lagers", "Lambics", "Stouts"], "r": 1, "e": "Les lagers, fermentées à froid puis stockées (« lagern » : entreposer).", "s": "Oxford Companion to Beer (Oxford UP)", "lv": 1}, {"id": "40e7a1ec34", "t": "p7", "q": "Dans quelle ville Jacob Schweppe a-t-il fondé Schweppes en 1783 ?", "o": ["Londres", " b7", "t": "h3", "q": "Dans quelle ville le Black Russian a-t-il été créé en 1949 ?", "o": ["Moscou", "Bruxelles", "Paris", "New York"], "r": 1, "e": "À l'Hôtel Métropole de Bruxelles, par le barman belge Gustave Tops.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "d914d02029", "t": "h3", "q": "En l'honneur de qui Gustave Tops a-t-il créé le Black Russian ?", "o": ["Perle Mesta", "Audrey Hepburn", "Grace Kelly", "Eleanor Roosevelt"], "r": 0, "e": "Perle Mesta, ambassadrice des États-Unis au Luxembourg. Le « Russian » vient juste de la vodka.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "da0f3ed9d8", "t": "h4", "q": "Malgré son nom tahitien, où le Mai Tai a-t-il été créé ?", "o": ["À Oakland, Californie", "À Papeete, Tahiti", "À Honolulu, Hawaï", "À La Havane, Cuba"], "r": 0, "e": "Chez Trader Vic's à Oakland (1944). « Maita'i » signifie « excellent » en tahitien.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "c2732bd9a8", "t": "h4", "q": "Où le Zombie a-t-il été inventé ?", "o": ["En Haïti", "À Hollywood", "À La Havane", "En Jamaïque"], "r": 1, "e": "À Hollywood, chez Don the Beachcomber, dans les années 1930.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "4604ff716f", "t": "h1", "q": "Que contient le Japanese Cocktail de Jerry Thomas ?", "o": ["Aucun ingrédient japonais", "Du saké de riz", "Du thé matcha", "Du zeste de yuzu"], "r": 0, "e": "Cognac, orgeat, bitters : aucun ingrédient japonais. Nommé en hommage à une délégation japonaise à New York.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 1}, {"id": "0e26ea4a7e", "t": "h1", "q": "D'où vient le nom du « grog » de la marine britannique ?", "o": ["Du surnom de l'amiral Vernon", "D'un mot créole de Jamaïque", "D'une île des Caraïbes", "D'un type de tonneau naval"], "r": 0, "e": "De l'amiral « Old Grog » Vernon, surnommé d'après son manteau ampagne", "lv": 2}, {"id": "4de192849f", "t": "p6", "q": "En quelle année l'AOC Champagne a-t-elle été délimitée ?", "o": ["1908", "1927", "1936", "1945"], "r": 2, "e": "1936, parmi les premières AOC françaises.", "s": "Comité Champagne", "lv": 3}, {"id": "c68ef9859d", "t": "h3", "q": "Que contient un Champagne Cocktail (IBA) ?", "o": ["Sucre, Angostura, cognac, champagne", "Crème de cassis et champagne", "Purée de pêche et prosecco", "Absinthe et champagne"], "r": 0, "e": "Sucre imbibé d'Angostura, cognac, complété au champagne.", "s": "IBA, iba-world.com, fiche « Champagne Cocktail »", "lv": 1}, {"id": "143589f578", "t": "h2", "q": "Le Death in the Afternoon associe le champagne à :", "o": ["L'absinthe", "Le cognac", "La chartreuse", "Le cassis"], "r": 0, "e": "De l'absinthe ; cocktail attribué à Hemingway en 1935.", "s": "Difford's Guide, fiche « Death in the Afternoon »", "lv": 1}, {"id": "a8370b61f5", "t": "h5", "q": "Qui a créé l'Old Cuban (rhum, menthe, citron vert, champagne) ?", "o": ["Audrey Saunders", "Dale DeGroff", "Sasha Petraske", "Dick Bradsell"], "r": 0, "e": "Audrey Saunders, en 2001 au restaurant Beacon (New York), avant son Pegu Club. Un Mojito coiffé de champagne.", "s": "Difford's Guide, fiche « Old Cuban »", "lv": 2}, {"id": "2bb1258e57", "t": "p6", "q": "Le sabrage du champagne est traditionnellement attribué :", "o": ["Aux moines", "Aux hussards napoléoniens", "Aux vignerons champenois", "Aux marins anglais"], "r": 1, "e": "Aux hussards de Napoléon, ouvrant la bouteille au sabre.", "s": "Comité Champagne", "lv": 2}, {"id": "5581619195", "t": "p6", "q": "À quelle température sert-on idéalement le champagne ?", "o": ["2 à 4 °C", "8 à 10 °C", "12 à 14 °C", "16 à 18 °C"], "r": 1, "e": "8 à 10 °C : trop froid, les arômes se ferment.", "s": "Comité Champagne", "lv": 3}, {"id": "77423062ed", "t": "p6", "q": "Combien de communes, ou crus, compte l'aire AOC Champagne ?", "o": ["280", "312", "319", "340"], "r": 2, "e": "319 communes-crus, délimitées p ir à Marseillan.", "s": "Noilly Prat (noillyprat.com)", "lv": 2}, {"id": "4ae9056f69", "t": "p6", "q": "Le pineau des Charentes est-il une mistelle ?", "o": ["Oui", "Non"], "r": 0, "e": "Oui : moût de raisin muté à l'eau-de-vie de cognac, fermentation bloquée.", "s": "INAO, cahier des charges AOC Pineau des Charentes", "lv": 2}, {"id": "54a2a93f4e", "t": "p6", "q": "De quelle ville la manzanilla est-elle originaire ?", "o": ["Jerez de la Frontera", "Sanlúcar de Barrameda", "El Puerto de Santa María", "Cadix"], "r": 1, "e": "Sanlúcar de Barrameda, dont l'air marin marque le style de cette manzanilla sous flor.", "s": "Consejo Regulador DO Manzanilla-Sanlúcar de Barrameda", "lv": 2}, {"id": "51cfffffba", "t": "p6", "q": "Le cépage palomino donne des xérès…", "o": ["Secs", "Doux", "Effervescents", "Mutés au moût"], "r": 0, "e": "Secs : fino, manzanilla, oloroso. Les doux viennent du pedro ximénez et du moscatel. Piège : un corrigé MOF en circulation répond « doux », c'est faux.", "s": "Difford’s Guide ; cahiers des charges DO/AOC", "lv": 2}, {"id": "8df380fe46", "t": "p6", "q": "Comment s'appellent les bateaux à fond plat qui transportaient le porto ?", "o": ["Les gabares", "Les rabelos", "Les chalands", "Les carrelets"], "r": 1, "e": "Les rabelos (barcos rabelos), descendant le Douro jusqu'à Vila Nova de Gaia.", "s": "IVDP (ivdp.pt)", "lv": 2}, {"id": "f07badd635", "t": "p2", "q": "Quels bateaux à fond plat transportaient les fûts de cognac sur la Charente ?", "o": ["Les rabelos", "Les barges", "Les gabares", "Les chalands"], "r": 2, "e": "Les gabares, qui descendaient la Charente vers les ports d'expédition.", "s": "BNIC, histoire du cognac", "lv": 2}, {"id": "0fee55d68f", "t": "p6", "q": "L'appellation Entre-deux-Mers est comprise entre :", "o": ["La Garonne et la Dordogne", "La Dordogne et la Gironde", "La Gironde et la Garonne", "La Garonne et le Ciron"], "r": 0, "e": "Entre Garonne et Dordogne, dont la confluence forme la Gironde.", "s": "INAO, cahier des charges  10 mg/kg pour les autres boissons alcoolisées.", "s": "Règlement (CE) 1334/2008 (arômes) ; OFDT", "lv": 3}, {"id": "23555f597f", "t": "p1", "q": "Quelle est la seule épice française protégée par une AOC ?", "o": ["Le safran du Quercy", "Le piment d'Espelette", "La vanille de Tahiti", "Le poivre de Penja"], "r": 1, "e": "Le piment d'Espelette, AOC depuis 2000 (AOP 2002).", "s": "INAO, AOP Piment d'Espelette", "lv": 2}, {"id": "4ec35d67e5", "t": "p1", "q": "Quand l'INAO a-t-il été créé ?", "o": ["30 juillet 1935", "1er mai 1936", "30 juillet 1945", "13 janvier 1938"], "r": 0, "e": "Par le décret-loi du 30 juillet 1935, qui fonde aussi le système des AOC viticoles.", "s": "INAO (inao.gouv.fr) ; décret-loi du 30 juillet 1935", "lv": 3}, {"id": "842f97beb5", "t": "h1", "q": "Quel est le point commun entre Giuseppe Garibaldi et Gaspare Campari ?", "o": ["Nés la même année", "Morts la même année", "Tous deux Milanais", "Associés en affaires"], "r": 1, "e": "Morts tous deux en 1882, clin d'œil du cocktail Garibaldi, Campari et jus d'orange.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "4b9d44f711", "t": "c5", "q": "Dans quel établissement Jean Jaurès a-t-il été assassiné le 31 juillet 1914 ?", "o": ["Le Café du Croissant", "Le Café de Flore", "Le Procope", "Les Deux Magots"], "r": 0, "e": "Le Café du Croissant, rue Montmartre à Paris.", "s": "Fait historique documenté (presse, 1914)", "lv": 2}, {"id": "08d9122780", "t": "h5", "q": "Quel barman a ressuscité le Last Word dans les années 2000 ?", "o": ["Julien Escot", "Murray Stenson", "Maxime Hoerth", "Colin Field"], "r": 1, "e": "Murray Stenson, au Zig Zag Café de Seattle (2004), à partir du recueil de Ted Saucier.", "s": "Oxford Companion to Spirits & Cocktails (Wondrich, 2021)", "lv": 2}, {"id": "d30261f5f1", "t": "h3", "q": "Combien d'ingrédients liquides compte le Vesper ?", "o": ["2", "3", "4", "5"], "r": 1, "e": "Trois : gin, vodka, Kina Lillet, « shaken, not stirred ».", "s": "O
