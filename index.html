 {t:"Socle : catégories, familles, méthodes", html:`
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Catégories (= contenance)</h4><ul>
    <li><b>Short drink</b> — plutôt puissant, ≤ 100 ml (moins de 10 cl).</li>
    <li><b>Long drink</b> — plutôt allongé, à partir de 100 ml (10 cl).</li>
   </ul>
   <h4>Types (= temps)</h4><ul>
    <li><b>Before dinner</b> — apéritif, plus ou moins amer/sec.</li>
    <li><b>After dinner</b> — digestif, plus ou moins liquoreux/puissant.</li>
    <li><b>All day cocktail</b> — tout moment, fruité, désaltérant.</li>
   </ul></div>
   <div class="fiche-block"><h4>Familles du socle</h4><ul>
    <li><b>Colada</b> — eau-de-vie + crème de coco + jus (Piña Colada).</li>
    <li><b>Fizz</b> — eau-de-vie + sucre + citron + eau gazeuse (Gin Fizz).</li>
    <li><b>Julep</b> — eau-de-vie vieillie + sucre + menthe (Mint Julep).</li>
    <li><b>Old-Fashioned</b> — eau-de-vie vieillie + sucre + bitters.</li>
    <li><b>Smash</b> — eau-de-vie + herbe + sucre + agrume (Gin Basil Smash).</li>
    <li><b>Sour</b> — spiritueux + sucre + agrume (+ souvent blanc d'œuf).</li>
    <li><b>Tiki</b> — rhum(s) + sucre + agrume + jus de fruits (Mai Tai).</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 3 méthodes</h4><ul>
    <li><b>Shaker</b> — mélanger, émulsionner, rafraîchir en limitant la fonte (jus, crème, œuf).</li>
    <li><b>Verre à mélange</b> — mélanger + rafraîchir avec dilution (produits alcooliques ; pas de jus/soda).</li>
    <li><b>Direct au verre</b> — quand les ingrédients se mélangent facilement.</li>
   </ul></div>
   <div class="fiche-block"><h4>Règle des « 3 S » (créations)</h4><ul>
    <li><b>Sweet</b> — le sucré : liqueur, crème, fruit, sirop, sucre.</li>
    <li><b>Sour</b> — l'acidité, le lien : agrume, verjus, solution acide.</li>
    <li><b>Strong</b> — la puissance, le corps : l'eau-de-vie / le spiritueux.</li>
    <li>Max 6 ingrédients · verser du moins cher au plus cher · doses en ml.</li>
   </ul></div>
  </div>`},
 {t:"Socle : calcul du TAV", html:`
  <p class="fiche-lead">La méthode officielle, illustrée sur l'Americano.</p>
  <div class="tav-demo">
   <div class="tav-line"><span>20 ml vermouth rouge à 14,5 %</span><b>20 × 14,5 = 290</b></div>
   <div class="tav-line"><span>50 ml bitter à 25 %</span><b>50 × 25 = 1250</b></div>
   <div class="tav-line"><span>50 ml eau gazeuse à 0 %</span><b>50 × 0 = 0</b></div>
   <div class="tav-tot"><span>Contenance = 120 ml</span><b>Total = 1540</b></div>
   <div class="tav-res">1540 ÷ 120 = 12,83 → <b>TAV de 13 %</b></div>
  </div>
  <p class="fiche-note">Formule : (Σ des volumes × degrés) ÷ contenance totale = TAV du cocktail.</p>`},
 {t:"Lexique pro (extraits socle)", html:`
  <p class="fiche-lead">Les termes du référentiel qui peuvent tomber.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><ul>
    <li><b>Albédo</b> — partie blanche de l'écorce d'un agrume (le « ziste »).</li>
    <li><b>Aquafaba</b> — jus de pois chiche, émulsifiant.</li>
    <li><b>Cuban roll</b> — transvaser d'une timbale à l'autre pour oxygéner (ex-« throwing »).</li>
    <li><b>Collins</b> — long drink, même composition qu'un Fizz mais direct au verre.</li>
    <li><b>Dry shake</b> — frapper une 1re fois sans glace, avec émulsifiant.</li>
    <li><b>Reverse dry shake</b> — frapper une 2de fois sans glace, avec émulsifiant.</li>
    <li><b>Exprimer</b> — libérer les essences d'un zeste.</li>
    <li><b>Float</b> — verser un filet de liquide sur le cocktail sans mélanger.</li>
   </ul></div>
   <div class="fiche-block"><ul>
    <li><b>Givrer (rim)</b> — décorer les parois d'un verre (ex. Margarita).</li>
    <li><b>Macération</b> — extraction d'arômes à froid ; <b>infusion</b> — à chaud.</li>
    <li><b>Muter</b> — stopper la fermentation par ajout d'alcool (garde les sucres).</li>
    <li><b>Mesure</b> — 40 ml (standard français).</li>
    <li><b>Trait (dash)</b> — environ 3 à 5 gouttes.</li>
    <li><b>Shaker Boston</b> — 2 timbales, axe décalé · <b>Continental</b> — emboîtement parfait · <b>3 pièces</b> — passoire intégrée.</li>
    <li><b>Mocktail / No Low</b> — sans alcool / faible degré (consommation responsable).</li>
    <li><b>Swizzle stick</b> — le « bois lélé » des Antilles.</li>
   </ul></div>
  </div>`},
 {t:"Expert — procédés décortiqués", html:`
  <p class="fiche-lead">Le cran au-dessus : ce qui se passe vraiment dans la cuve, l'alambic ou le fût. C'est là que se gagnent les questions de jury.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Non alcool</h4><ul>
    <li><b>Giffard Sans Alcool</b> — macération dans du <b>vinaigre de vin blanc</b> français (technique du shrub), puis un procédé maison efface les notes de vinaigre. Pasteurisé : ~4 à 5 mois après ouverture, sans réfrigération. Sucre calé sur celui d'une liqueur (100-200 g/L).</li>
    <li><b>Giffard Bases Cocktail</b> — 4 ans de R&D, chaque base est le miroir d'un spiritueux : Aperitif Bitter, Woody Malt (whisky), Smoky Agave (mezcal), Herbal + Juniper (gin), Cold Cane (rhum), Ruby Grape (vermouth).</li>
    <li><b>Fever-Tree</b> — 15 à 18 mois de mise au point : British Library (sources sur la quinine remontant à 1620), sourcing de l'écorce à la frontière Rwanda / RD Congo, 5 versions de recette. Zéro saccharine, zéro benzoate de sodium, zéro décanal.</li>
    <li><b>Ponthier</b> — min. 90 % de fruit, max. 10 % de sucre de canne, aucun additif. Une seule origine + une seule variété par parfum (label Pure Trace). Contrôle pesticides par un labo indépendant allemand.</li>
    <li><b>PCB / Ingredium</b> — 5 familles : Texturants &amp; Amidons · Acides &amp; Sels · Émulsifiants &amp; Stabilisants · Sucres &amp; Dérivés · Clean Label. Formulée avec des chefs (Hermé, Grolet, Michalak, Brys…).</li>
   </ul></div>
   <div class="fiche-block"><h4>Apéritifs &amp; amers</h4><ul>
    <li><b>Combier</b> — triple sec : oranges d'Haïti macérées ~48 h, triple distillation, alambics de cuivre centenaires. Absinthes distillées dans deux alambics <b>Pernod Fils</b> d'époque (ceux des Jade de Ted Breaux). Royal Combier (1920) = triple sec + Élixir + cognac Delamain.</li>
    <li><b>Campari</b> — 60 à 68 plantes, écorces et fruits ; seul ingrédient confirmé : l'écorce d'orange amère. Le <b>concentré</b> est assemblé dans une salle unique à Milan puis expédié aux usines. Nom d'origine : « Bitter all'uso d'Hollanda ».</li>
    <li><b>La Ina</b> — Fino ≈ 6 ans sous flor (solera 1919) · Rio Viejo ≈ 10 ans en oxydatif (solera <b>1918</b>, nom d'un domaine de Macharnudo) · Viña 25 PX passerillé. 4 000 botas reprises à Domecq en 2008 par Lustau (fondée 1896, Grupo Caballero).</li>
    <li><b>Noilly Prat</b> — 8 mois en foudres → <b>1 an dehors dans l'Enclos</b> en demi-muids (part des anges ≈ 6 %) → assemblage + mistelle + alcoolats de citron et framboise → 21 jours de macération (~20 plantes) avec dodinage 2×/jour → repos ~6 semaines. <b>Seuls l'Original Dry et l'Extra Dry passent par l'Enclos.</b></li>
    <li><b>Carpano</b> — Antica Formula : extraction à chaud ET à froid d'environ <b>130 botaniques</b>, sucre + sucre brûlé. Vanilles de Madagascar, Tahiti, Papouasie ; safran d'Iran ; armoise du Piémont et du Val d'Aoste. Recette connue de 3 personnes.</li>
   </ul></div>
   <div class="fiche-block"><h4>Eaux-de-vie &amp; alcools</h4><ul>
    <li><b>Fiba</b> — <b>raquettes</b> d'Opuntia ficus-indica, coupées, <b>fumées au bois d'olivier</b>, macérées, distillées ; réduction lente sur 1 mois à l'eau de la Montagne Noire. Chez BOWS, les céréales sont émondées puis <b>cuites à la vapeur</b>.</li>
    <li><b>Oli'Still</b> — l'olive n'a <b>pas de sucre fermentescible</b> : on ne peut pas la fermenter. Macération des olives dans l'alcool, puis alambic charentais à repasse et sélection des cœurs. Exactement la logique d'un gin.</li>
    <li><b>Roku</b> — printemps : sakura (fleur + feuille) · été : sencha + gyokuro · automne : sanshō · hiver : yuzu. 4 types d'alambics au Liquor Atelier, chaque famille distillée séparément. + 8 classiques : genièvre, coriandre, angélique (racine et graine), cardamome, cannelle, orange amère, citron.</li>
    <li><b>Wild Turkey</b> — mash bill ~75 / 13 / 12. Entrée en fût volontairement basse (107 puis 115 proof, contre 125 max légal). Char n°4 « alligator » ≈ 55 s de flamme. Eau de la Kentucky River filtrée par le calcaire.</li>
    <li><b>Isautier Fusion</b> — co-fermentation de 36 h mélasse + pur jus (50/50), colonne, 2,5 ans de repos en cuve. IGP « Rhum de La Réunion » depuis le 22 janvier 2015 ; 3 distilleries sur l'île (Isautier, Savanna, Rivière du Mât).</li>
    <li><b>Appleton</b> — 1655 le domaine, <b>1749</b> la première trace de distillation, <b>1944</b> la marque. Source River Head filtrée par le calcaire, pot stills à double retort, ~200 000 fûts sur place, vieillissement 100 % tropical.</li>
    <li><b>Calle 23</b> — agaves de 7 à 9 ans, autoclave <b>basse pression</b>, fermentation inox sans fibres avec des levures sauvages isolées dans les champs, double distillation, sortie à 55 % puis réduction à 40°.</li>
    <li><b>Nuestra Soledad</b> — four conique de terre (mesquite et chêne), tahona, fermentation sauvage en tinas, double distillation en cuivre. Casa Cortés : Agave de Cortés / Nuestra Soledad / El Jolgorio.</li>
    <li><b>Cuatro Gallos</b> — distillation unique <b>au degré</b>, zéro eau, zéro bois, repos min. 3 mois en cuve inerte. Fundo El Carmen, San Juan Bautista, sol argileux, vieilles vignes de Quebranta.</li>
    <li><b>Dartigalongue</b> — colonne armagnacaise à 58° · Un-Oaked : ≥ 3 mois en inox, réduction à <b>43,2°</b> · Single-Oaked : fûts de chêne <b>roux</b> (usagés) à chauffes moyennes et fortes · Double-Oaked : <b>double</b> passage en fûts <b>neufs</b> gascons à chauffe forte. 90 % chêne de Gascogne.</li>
    <li><b>Merlet</b> — Brothers Blend : eaux-de-vie de 4 à 12 ans, majorité Fins Bois + ~1/5 Grande Champagne. 40 ha entre Saint-Sauvant et Chérac. La maison a créé <b>Hpnotiq</b> en 2001.</li>
    <li><b>Sab's</b> — alambic à vapeur <b>Müller</b> ambulant (le type utilisé pour la grappa), coupe des cœurs au nez. Le Blanc : 100 % pinot noir, 1 an en inox. Le Marc : 4 ans en fûts de 228 L + 6 mois de finish en fût de cognac.</li>
   </ul></div>
   <div class="fiche-block"><h4>Liqueurs &amp; spécialités</h4><ul>
    <li><b>Adriatico</b> — amandes Filippo Cea cueillies à la main autour d'<b>Alberobello</b>, séchées au soleil, longuement torréfiées (Classico) ou concassées et infusées à cru (Bianco). Sel de la saline de Margherita di Savoia. 2 ans de mise au point ; fondée en septembre 2019 par Jean-Robert Bellanger et Thomas Benoit.</li>
    <li><b>Algebra</b> — extraction à froid fractionnée au laboratoire londonien, café Has Bean torréfié dans le <b>Staffordshire</b>, rhum des Caraïbes, sucre de canne, embouteillage chez Thames Distillers. <b>100 g/L = minimum légal UE</b> — seules exceptions : cerise (70 g/L) et gentiane (80 g/L).</li>
    <li><b>Chinola</b> — ferme « El Valle de Chinola », péninsule de Samaná ; fruits transformés dans les 24 h, alcool neutre de canne, zéro arôme ni colorant. Première liqueur de fruits frais vine-to-bottle stable à température ambiante.</li>
    <li><b>Kota</b> — feuilles fraîches de pandan de Thaïlande macérées plusieurs jours dans un alcool neutre, puis distillées à Dijon chez Boudier. Idée dès 2020, échantillonnage mars 2024, lancement été 2024. Florent Beuchet (Compagnie des Indes) est l'entremetteur et dirige la marque.</li>
    <li><b>Gabriel Boudier</b> — ~75 personnes, DG Claire Battault, groupe Famille Piffaut. Produit en propre <b>et pour des tiers</b> : Kota, Saffron Gin.</li>
    <li><b>Bénédictine</b> — 27 plantes travaillées en plusieurs fractions distillées séparément, assemblées puis vieillies. D.O.M. = Deo Optimo Maximo.</li>
   </ul></div>
  </div>`},
 {t:"Pièges avancés", html:`
  <p class="fiche-lead">Les confusions les plus probables. Si tu ne dois relire qu'une fiche la veille, c'est celle-là.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Matière première &amp; procédé</h4><ul>
    <li><b>Fiba</b> : les <b>raquettes</b> du cactus, pas le fruit. Fumage au <b>bois d'olivier</b>, pas dans un four enterré.</li>
    <li><b>Oli'Still</b> : l'olive ne se fermente pas (pas de sucre). Macération dans l'alcool puis distillation.</li>
    <li><b>Marc vs Fine</b> : le marc distille les peaux, pépins et rafles ; la fine distille le vin ou les lies.</li>
    <li><b>Pisco</b> : une seule distillation, directement au degré, jamais d'eau après, jamais de bois.</li>
    <li><b>Giffard</b> : vinaigre de vin <b>blanc</b>, pas de cidre.</li>
   </ul></div>
   <div class="fiche-block"><h4>Bois &amp; élevage</h4><ul>
    <li><b>Single-Oaked</b> (Dartigalongue) = fûts de chêne <b>roux</b>, déjà utilisés — pas un fût neuf. Le <b>Double-Oaked</b> = deux passages en fûts <b>neufs</b>.</li>
    <li><b>Noilly Prat</b> : seuls l'<b>Original Dry</b> et l'<b>Extra Dry</b> vieillissent dehors dans l'Enclos.</li>
    <li><b>Calle 23</b> : Reposado = 8 mois, Añejo = 16 mois. Ne pas inverser.</li>
    <li><b>Appleton</b> : l'âge affiché est celui du rhum le <b>plus jeune</b> de l'assemblage.</li>
    <li><b>Sab's Le Marc</b> : 4 ans en fûts bourguignons de 228 L <b>puis</b> 6 mois de finish en fût de cognac.</li>
   </ul></div>
   <div class="fiche-block"><h4>Dates qui se ressemblent</h4><ul>
    <li><b>Appleton</b> : 1655 le domaine · 1749 la distillation · 1944 la marque.</li>
    <li><b>La Ina</b> : solera du fino en <b>1919</b>, solera de Rio Viejo en <b>1918</b>, reprise par Lustau en 2008.</li>
    <li><b>Wild Turkey</b> : site 1869 · marque 1940 (Austin Nichols) · rachat de la distillerie Ripy 1972 · Campari 2009.</li>
    <li><b>Combier</b> : maison 1834 · distillerie construite 1848 · absinthe 1899 · interdiction 1915 · rachat Choisne 2000 · relance 2004 · Blanchette 2006 · mention légale 2011 · L'Entêté 2012.</li>
    <li><b>Sab's</b> : Pigneret fondée 1941 · rachat 2018 · marque Sab's fin 2019.</li>
    <li><b>Manguin</b> : vergers années 40 · alambics 1957 · Hanquiez 2011 · olive distillée 2014.</li>
   </ul></div>
   <div class="fiche-block"><h4>Noms &amp; propriétaires</h4><ul>
    <li><b>Kota</b> = « la ville », pas « pandan ».</li>
    <li><b>Sab's</b> = Société Alambic Bourguignon <b>et</b> Sabbagh.</li>
    <li><b>Antoinette Isautier</b> = l'<b>épouse</b> de Charles, pas sa fille.</li>
    <li><b>Virginie Dartigalongue</b> a été convaincue par sa <b>tante</b> Françoise en 2010.</li>
    <li>Distributeur ≠ propriétaire : Dugas <b>distribue</b> Carpano, mais Carpano <b>appartient</b> à Fratelli Branca.</li>
    <li><b>Boudier</b> produit Kota, <b>Combier</b> produit les Jade, <b>Merlet</b> a créé Hpnotiq, <b>Lustau</b> élève La Ina.</li>
   </ul></div>
  </div>`},
 {t:"Le jour J — format des épreuves", html:`
  <p class="fiche-lead">Bastille Design Center, 74 boulevard Richard Lenoir, Paris 11e — dimanche 13 septembre 2026. Douze finalistes.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les coefficients (total 13)</h4><ul>
    <li><b>Mixologie — coefficient 5</b> : création + imposé. À elle seule ~38 % de la note.</li>
    <li><b>Dégustation à l'aveugle — coefficient 3</b> : 5 spiritueux + 2 cocktails.</li>
    <li><b>Rétro-assemblage — coefficient 3</b> : par équipe de 3.</li>
    <li><b>QCM — coefficient 2</b> : 50 questions.</li>
    <li class="mini">Priorité de révision : la pratique d'abord, mais dégustation + rétro pèsent ensemble autant que la mixologie.</li>
   </ul></div>
   <div class="fiche-block"><h4>Déroulé de la journée</h4><ul>
    <li>10h30 accueil et installation · 11h00 briefing · 12h30 déjeuner</li>
    <li>13h45 ouverture au public · 14h00 présentation du concours</li>
    <li><b>14h15 → 18h15</b> passage sur les différentes épreuves</li>
    <li>18h30 remise des prix · 19h30 fin</li>
    <li class="mini">Salle de préparation dédiée : table de travail, réfrigérateur, congélateur, point d'eau.</li>
   </ul></div>
   <div class="fiche-block"><h4>QCM — la répartition exacte</h4><ul>
    <li><b>50 questions</b>, une seule bonne réponse par question.</li>
    <li><b>30 %</b> marques partenaires — les questions sortent des <b>sites internet officiels</b> des fournisseurs.</li>
    <li><b>20 %</b> extrait de livre — sur <b>l'ensemble</b> du contenu de l'annexe.</li>
    <li><b>50 %</b> historiques et générales : recettes, spiritueux, historique du bar.</li>
    <li class="mini">QCM et dégustation en <b>même temps</b>, 30 minutes au total.</li>
   </ul></div>
   <div class="fiche-block"><h4>Dégustation — la stratégie</h4><ul>
    <li>5 spiritueux : donner la <b>marque partenaire</b>. 2 cocktails : le <b>nom</b> seulement.</li>
    <li>Bonne réponse <b>+1</b> · mauvaise réponse <b>0</b> · pas de réponse <b>0</b>.</li>
    <li><b>Conséquence : ne jamais laisser une case vide.</b> Une intuition vaut mieux qu'un blanc, le risque est nul.</li>
    <li>Un package de mignonettes est envoyé un mois avant : s'entraîner à l'aveugle, en série, plutôt qu'échantillon par échantillon.</li>
   </ul></div>
   <div class="fiche-block"><h4>Mixologie — les contraintes</h4><ul>
    <li>Création en <b>2 exemplaires</b> (thèmes Local ou Technique) ou <b>4</b> (concept/miroir) + imposé en <b>1</b> = 3 verres jury.</li>
    <li><b>8 minutes</b> de la mise en place à la fin de l'élaboration. Pénalité au-delà, <b>arrêt total à 10 minutes</b>.</li>
    <li>Modifications possibles : ajouter un ingrédient · en retirer un <b>sauf fournisseur officiel</b> · faire évoluer méthode et service. Nom et dosages ajustables.</li>
    <li><b>À communiquer 10 jours avant</b> : modifications ET morceaux de musique.</li>
    <li><b>Pre-batch de 1 litre</b> à préparer sur place pour le public — prévoir les ingrédients maison en quantité.</li>
   </ul></div>
   <div class="fiche-block"><h4>Rétro-assemblage</h4><ul>
    <li><b>Équipe de 3</b>, tirée au sort en début de journée. 30 minutes.</li>
    <li>Retrouver les <b>proportions</b> d'un assemblage finalisé à partir de <b>5 échantillons</b> d'eaux-de-vie.</li>
    <li>À rendre : la <b>composition écrite</b> ET un <b>échantillon</b>.</li>
    <li class="mini">Méthode : identifier d'abord les marqueurs les plus saillants (bois, fumé, floral), puis procéder par ajouts croissants en gardant un témoin. Toujours réserver un fond de chaque eau-de-vie pure pour recaler le nez.</li>
   </ul></div>
  </div>`},
 {t:"Les 13 cocktails imposés", html:`
  <p class="fiche-lead">Tirés au sort <b>juste avant</b> ton passage. Histoires vérifiées sur sources primaires quand elles existent — quelques recettes de la liste sont des déclinaisons modernes sans paternité établie, c'est signalé. Tous les produits sont déjà en place dans la station. Composition officielle de l'annexe #2 — la verrerie et la méthode proposées ici sont des <i>suggestions de travail</i> à valider au briefing.</p>
  <div class="fiche-grid">
   ${IMP_GROUPES.map(g=>'<div class="fiche-block" style="grid-column:1/-1"><h4>'+g+'</h4>'+IMPOSES.filter(c=>c.grp===g).map(c=>'<p style="margin:10px 0 2px"><b style="color:var(--copper-2);font-size:1.05rem">'+c.n+'</b> — <span class="mini">'+c.verre+' · '+c.met+'</span></p><p style="margin:2px 0">'+c.dose.map(d=>d[0]+' <b>'+d[1]+'</b>').join(' · ')+'</p>'+(c.alerte?'<p class="mini" style="color:var(--campari);margin:2px 0">⚠ '+c.alerte+'</p>':'')+'<p class="mini" style="margin:2px 0 0">'+c.tip+'</p>').join('')+'</div>').join('')}
   ${IMPOSES.map(c=>'<div class="fiche-block"><h4>'+c.n+'</h4><ul><li>'+c.ing.map(i=>'<b>'+i+'</b>').join('</li><li>')+'</li><li class="mini">Base : '+c.base+' · Famille : '+c.fam+' · Verre suggéré : '+c.verre+' · '+c.met+'</li></ul><p style="margin:8px 0 0;font-size:.93rem">'+c.hist+'</p><p class="mini" style="margin:6px 0 0;font-size:.88rem;font-style:italic;opacity:.85">'+c.note+'</p></div>').join('')}
  </div>
  <p class="fiche-lead" style="margin-top:18px"><b>Les repères qui font gagner du temps sous pression.</b> Base Roku : Gin Fizz, Raspberry Mule, Yellow Daisy, Jasmine (4 sur 13). Base Wild Turkey : Boulevardier, Frisco Sour, New York Sour. Base Appleton : Mai Tai, Planter's Punch, Banana Daiquiri. Un seul cognac (Harvard), un seul mezcal (Mezcal Mule), un seul Campari en base (Tampico). Deux mules seulement, et elles ne prennent pas le même agrume.</p>`},
 {t:"Le livre — Robert Vermeire", html:`
  <p class="fiche-lead">20 % du QCM porte sur cet extrait, et les questions peuvent tomber sur <b>l'ensemble</b> du contenu : préface, verres, matériel, termes, recettes et anecdotes.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>La fiche d'identité</h4><ul>
    <li><b>« L'Art du Cocktail »</b>, par <b>Robert Vermeire</b>, dit « Robert's ».</li>
    <li>Imprimerie de l'Office de Publicité, <b>16 rue Marcq, Bruxelles</b>.</li>
    <li>Traduction revue de <b>« Cocktails : How to Mix Them »</b>, Londres, <b>1922</b>, Herbert Jenkins &amp; Co.</li>
    <li><b>11 éditions, 68 317 exemplaires.</b> Préface reprise dans le <b>Querschnitt</b> de Berlin en <b>1925</b>. Édition japonaise : <b>K. Katayama</b>, Nishinomiya, <b>1930</b>.</li>
    <li>Vermeire a été six ans Head Barman au <b>Criterion</b> et à l'<b>Embassy</b> de Londres, sous les ordres de <b>Luigi Naintré</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les origines du mot « cocktail »</h4><ul>
    <li><b>1.</b> Un historien américain : mot aztèque, <b>xocti</b>, venu d'<b>oxochiti</b>, du nom d'une jeune noble qui aurait offert la boisson à un roi.</li>
    <li><b>2.</b> <b>Thackeray</b> (1811-1863) et le dernier verre après les combats de coqs : « to the cocks tail ».</li>
    <li><b>3.</b> Une femme de lettres française : un mélange de liqueurs secoué à la glace, aux reflets variés comme la queue du coq.</li>
    <li><b>4. La version que Vermeire privilégie</b> : vers <b>1776</b>, l'aubergiste <b>Flanagan</b> (Elmsford ou Yorktown) perd son coq <b>Maître Chante-Clair</b> et promet la main de sa fille <b>Betsy</b> à qui le ramènera. Un officier de l'Indépendance le rapporte sans sa queue ; Betsy, troublée, se trompe de bouteilles.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 5 termes usuels</h4><ul>
    <li><b>REMUER</b> (stir up) — verre à mélange, glace en morceaux de préférence.</li>
    <li><b>FRAPPER</b> (shake) — au shaker, timbale à moitié pleine de glace en morceaux.</li>
    <li><b>PASSER</b> (strain) — transvaser à la passoire.</li>
    <li><b>PRESSER</b> (squeeze) — le jus, ou l'essence d'une pelure au-dessus du verre.</li>
    <li><b>TRAIT</b> (dash) ou tombée — une ou plusieurs gouttes au stilligoutte.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 5 verres</h4><ul>
    <li><b>N°1</b> verre à cocktail — rempli à <b>un demi-centimètre du bord</b> ; à moitié = liqueur ou pousse-café ; plein de glace pilée = liqueurs frappées.</li>
    <li><b>N°2</b> verre à porto — aux deux tiers.</li>
    <li><b>N°3</b> verre à sherry, <b>forme flûte</b> — aux deux tiers ; aussi vermouth, quinquina, amer.</li>
    <li><b>N°4</b> verre tulipe, <b>deux grandeurs</b> — moyen : vins, sours, crustas, juleps ; grand : longs drinks et champagne (à moitié).</li>
    <li><b>N°5</b> tumbler, <b>trois dimensions</b> — petit : flips, jus, champagne cocktail ; moyen : whisky et brandy soda, fizzes, collins ; grand : bières, cobblers, coolers, squashes.</li>
    <li class="mini">Règle absolue : <b>ne jamais remplir jusqu'au bord</b>. Et six verres par bouteille de champagne.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le nécessaire (13 objets)</h4><ul>
    <li>Verre à mélange solide · shaker (deux timbales en argent, ou une timbale à couvercle-passoire, « très peu pratique ») · pelle à glace (ice scoop) · longue cuiller · cuiller-pilon · passoire à ressort</li>
    <li>4 à 6 flacons stilligouttes · presse-citron · pic à glace · tire-bouchon avec ouvre-bouteilles · couteau à fruits · râpe à muscade · cuiller et fourchette à fruits</li>
    <li class="mini">Épices citées : sel, poivre en grains, tabasco, poivre de Cayenne, muscade, cannelle, clous de girofle, sauce Worcestershire, vinaigre, ketchup.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 8 bouteilles du « cocktail chez soi »</h4><ul>
    <li>1 dry gin de première qualité · 2 fine champagne de choix · 3 scotch whisky de marque · 4 vermouth français</li>
    <li>5 vermouth italien · 6 grenadine ou framboise · 7 Cointreau ou curaçao brun · 8 une petite bouteille d'angostura</li>
    <li class="mini">Son seul conseil : impossible de faire un bon cocktail avec de mauvaises liqueurs.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le concours du Daily Mail — 1er mars 1937</h4><ul>
    <li><b>1600</b> barmen professionnels et amateurs · <b>3 prix</b> + <b>15 prix de consolation</b> · le jury n'a retenu que <b>25 recettes</b>.</li>
    <li><b>LIZZIE'S OWN</b> (shaker) : 1/2 Gordon's dry gin · 1/4 Courvoisier trois étoiles · 1/4 curaçao brun Fockink. Verre à cocktail, pelure de citron pressée. <b>15e et 17e prix</b>.</li>
    <li><b>RIKIKI</b> (shaker) : 1/3 armagnac · 1/3 calvados du Bon Roy d'Yvetot · 1/3 mandarine Candac.</li>
    <li><b>Vermeire est le seul concurrent à avoir remporté deux prix.</b></li>
   </ul></div>
   <div class="fiche-block"><h4>Les ponts avec les partenaires</h4><ul>
    <li><b>Grand Marnier</b> → cocktail <b>Handicap</b> : 1/3 Grand-Marnier, 2/3 Fruchtschaumwein (limonade gazeuse aux fruits, très bue à Dresde).</li>
    <li><b>Marie Brizard</b> → <b>Le Paradis du Zoute</b>, recette de Vermeire : 1/3 jus d'orange, 1/3 apry Marie Brizard, 1/3 Gordon's.</li>
    <li><b>Noilly Prat</b> → son <b>Dry Martini</b> personnel et le <b>Gloom Raiser</b>.</li>
    <li><b>Bénédictine</b> → cocktail <b>Fioupe</b> (une cuillerée, avec fine et cinzano).</li>
    <li><b>Harvard</b> → présent dans le livre <b>et</b> dans la liste des imposés : le pont parfait à citer devant le jury.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ce que Vermeire revendique</h4><ul>
    <li>A <b>introduit</b> le Clover Club à Londres (R.A.C., <b>1915</b>) et le Cooperstown (via Lord Victor Paget).</li>
    <li>A <b>créé</b> le Gloom Raiser (R.A.C., 1915), le Silver Streak (1915), le <b>Dubonnet spécial / « Robert's Special »</b> après la <b>loi Vandervelde de 1919</b> (interdiction en Belgique des spiritueux &gt; 18°), le Rose Cocktail belge.</li>
    <li>A <b>lancé</b> le May Fair à l'Embassy de Londres en <b>1921</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les équivalences à réciter</h4><ul>
    <li><b>Midnight</b> = Bronx + trait d'absinthe frappé ensemble · <b>Minnehaha</b> = le même, absinthe versée dans le verre (« eau riante », Shanghaï)</li>
    <li><b>East India</b> = Derby sans champagne · <b>White Lady</b> = Side-Car au gin · <b>Olivette</b> = London au Plymouth</li>
    <li><b>Ping-Pong</b> = Manhattan au sloe gin · <b>Star</b> = Klondyke + 2 traits de curaçao · <b>X.Y.Z.</b> = Bronx au citron</li>
    <li><b>Thistle</b> = York Cocktail · <b>Bamboo</b> = Reform Cocktail · <b>Mikado</b> = Japanese · <b>Chicago</b> = Fancy Brandy Cocktail</li>
    <li><b>Diabolo</b> = Young Man en France, <b>Oldman</b> au whisky · <b>Coffee</b> = Law's Cocktail · <b>Tuxedo</b> = Silver au Burnett gin + absinthe</li>
   </ul></div>
   <div class="fiche-block"><h4>Les noms décodés</h4><ul>
    <li><b>Bronx</b> = le parc et le zoo de New York · <b>Manhattan</b> = l'île · <b>Daïquiri</b> = une mine de fer à Cuba</li>
    <li><b>Ward Eight</b> = le 8e district de Boston · <b>May Fair</b> = la foire de mai sous Charles II · <b>Soixante-Quinze</b> = le canon de 14-18</li>
    <li><b>Meehoulong</b> = « diable qui mange le feu » (chinois) · <b>H.P.W.</b> = Harry Payne Whitney (par Charlie, du Racket Club)</li>
    <li><b>Depth Bomb</b> = la bombe des aviateurs anglais de 1914 · <b>Diki-Diki</b> = monarque de l'île d'Ubian, mort en 1922</li>
   </ul></div>
  </div>`},
 {t:"Écarts entre les documents", html:`
  <p class="fiche-lead">Le dossier finaliste et le règlement ne disent pas exactement la même chose. Ces écarts sont à vérifier au briefing — et ce sont typiquement les points où un candidat se trompe.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Giffard</h4><ul>
    <li>Le règlement listait <b>deux gammes</b> : les liqueurs sans alcool façon shrub (Ananas, Spritz, Triple Sec, Gingembre, Fleur de Sureau, Pamplemousse) <b>et</b> les Bases Cocktail.</li>
    <li>L'annexe #1 du dossier finaliste ne retient que la catégorie <b>« Base sans alcool »</b> avec <b>6 références</b> : Aperitif Bitter, Cold Cane, <b>Herbal Juniper</b>, Ruby Grape, Smoky Agave, Woody Malt.</li>
    <li class="mini">Deux différences : la gamme shrub n'apparaît plus, et <b>Herbal</b> + <b>Juniper</b> semblent fusionnés en une seule référence. À confirmer sur place.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ponthier</h4><ul>
    <li>L'annexe #1 liste <b>4 purées</b> : Fruit de la Passion, Abricot, Figue de Barbarie, Framboise.</li>
    <li>Mais l'annexe #2 fait entrer la <b>purée de banane Ponthier</b> dans le Banana Daiquiri.</li>
    <li class="mini">Elle est donc fournie spécifiquement pour ce cocktail imposé, sans figurer dans la gamme générale. Ne pas la compter dans « les 4 purées » si la question tombe.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ce qui ne bouge pas</h4><ul>
    <li>Tous les degrés de l'annexe #1 sont identiques à ceux du règlement — les fiches « Degrés pièges » restent valables telles quelles.</li>
    <li>Adriatico apparaît <b>deux fois</b> : en Zero (non alcool) et en spécialité (Bianco 16° / Classico 28°). Une seule maison, deux catégories.</li>
    <li>Même chose pour <b>BOWS</b> : eau-de-vie de cactus (Fiba) <b>et</b> whisky français (Benleioc). Et pour <b>Bacardi-Martini</b> : Noilly Prat <b>et</b> Bénédictine.</li>
   </ul></div>
   <div class="fiche-block"><h4>Rappel de la règle d'exclusivité</h4><ul>
    <li>Quand un secteur de produit est représenté par un fournisseur officiel, <b>seul ce produit ou cette gamme</b> peut être utilisé dans ta recette.</li>
    <li>Concrètement : un seul gin possible (Roku), un seul cognac (Merlet), un seul armagnac (Dartigalongue), un seul mixer (Fever-Tree), un seul bitter rouge (Campari)…</li>
    <li class="mini">Cette phrase figure deux fois dans le dossier : c'est un point que le jury connaît par cœur.</li>
   </ul></div>
  </div>`},
 {t:"Histoire du bar", html:`
  <p class="fiche-lead">50 % du QCM porte sur l'historique du bar, les spiritueux et les recettes. C'est le plus gros bloc de l'épreuve écrite.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les livres fondateurs</h4><ul>
    <li><b>1862</b> — Jerry Thomas, <i>How to Mix Drinks, or The Bon-Vivant's Companion</i> : le premier livre de cocktails. Surnommé « le Professeur », auteur du Blue Blazer. La 2e édition (1876) codifie les Fizz.</li>
    <li><b>1882</b> — Harry Johnson, <i>New and Improved Bartender's Manual</i> : le premier à traiter la <b>gestion</b> d'un bar.</li>
    <li><b>1895</b> — George J. Kappeler, <i>Modern American Drinks</i> : première trace du <b>Harvard</b>.</li>
    <li><b>1922</b> — Robert Vermeire, <i>Cocktails: How to Mix Them</i> (Londres), traduit en <i>L'Art du Cocktail</i>.</li>
    <li><b>1927</b> — Harry McElhone, <i>Barflies and Cocktails</i> : le <b>Boulevardier</b>.</li>
    <li><b>1930</b> — Harry Craddock, <i>The Savoy Cocktail Book</i> : le <b>Yellow Daisy</b>.</li>
    <li><b>1934-1948</b> — Boothby, Beebe, Embury : le <b>Frisco</b>, sans citron.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les dates qui font basculer le métier</h4><ul>
    <li><b>1860-1880</b> — le <b>phylloxéra</b> ravage le vignoble : le cognac se raréfie, le whisky et le gin le remplacent dans les cocktails. Le Sazerac passe du cognac au rye.</li>
    <li><b>1915</b> — interdiction de l'absinthe en France (Belgique 1906, Suisse 1910, États-Unis 1912).</li>
    <li><b>1920-1933</b> — <b>Prohibition</b> américaine : 18e amendement en vigueur le 17 janvier 1920, abrogation le 5 décembre 1933. Les barmen américains s'exilent à Londres, Paris et Cuba : c'est l'âge d'or du bar européen.</li>
    <li><b>1951</b> — fondation de l'<b>IBA</b>. <b>1955</b> premier concours (Amsterdam), <b>1961</b> première liste officielle.</li>
    <li><b>Années 1980</b> — renaissance du cocktail : Dick Bradsell à Londres, Dale DeGroff à New York.</li>
    <li><b>2011</b> — la mention « absinthe » redevient légale en France.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les bars et les figures</h4><ul>
    <li><b>Harry's New York Bar</b>, Paris, 1911 (rue Daunou, par le jockey Tod Sloan ; McElhone propriétaire en 1923).</li>
    <li><b>American Bar du Savoy</b> : <b>Ada Coleman</b> (1903-1926), créatrice du Hanky Panky ; puis <b>Harry Craddock</b>.</li>
    <li><b>Ritz Paris</b> : Frank Meier, cité par Vermeire pour ses Paradise et Rosslyn.</li>
    <li><b>El Floridita</b>, La Havane : Constante Ribalaigua et le daiquiri frappé.</li>
    <li><b>Tiki</b> : Donn Beach (Don the Beachcomber, Hollywood, début 1930) puis Trader Vic (Oakland) — Mai Tai, 1944.</li>
    <li><b>Renaissance</b> : Dick Bradsell (Espresso Martini, Bramble), Dale DeGroff, Audrey Saunders (Pegu Club, Gin-Gin Mule).</li>
   </ul></div>
   <div class="fiche-block"><h4>Les familles de cocktails</h4><ul>
    <li><b>SOUR</b> : spiritueux + acide + sucre. Enfants : <b>Fizz</b> (allongé au soda après passage au verre), <b>Collins</b> (construit au verre sur glace), <b>Daisy</b> (avec liqueur), Sidecar, Margarita, Daiquiri.</li>
    <li><b>AROMATIQUE / spiritueux</b> : Old-Fashioned, Manhattan, Martini, Negroni, Boulevardier, Harvard, Yellow Daisy.</li>
    <li><b>PUNCH</b> : one of sour, two of sweet, three of strong, four of weak. Ancêtre du bar, première recette publiée en Inde en <b>1638</b>. Descendance tiki.</li>
    <li><b>Autres</b> : Julep, Smash, Flip (œuf entier), Sling, Cobbler, Toddy (chaud), Swizzle, Highball, Mule, Colada, Spritz.</li>
   </ul></div>
  </div>`},
 {t:"Spiritueux — la règle", html:`
  <p class="fiche-lead">Les définitions légales tombent souvent en QCM parce qu'elles ont une réponse unique et vérifiable. Base : règlement européen 2019/787.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les seuils à connaître par cœur</h4><ul>
    <li><b>Liqueur</b> : min. 15 % vol et <b>100 g/L</b> de sucre. Exceptions : cerise <b>70 g/L</b>, gentiane <b>80 g/L</b>.</li>
    <li><b>Crème de…</b> : min. <b>250 g/L</b> · <b>Crème de cassis</b> : min. <b>400 g/L</b>.</li>
    <li><b>Whisky</b> : min. <b>3 ans</b> en fûts ≤ 700 L, min. 40 % vol, distillé sous 94,8 % vol, aucune édulcoration.</li>
    <li><b>Gin</b> : genièvre <b>dominant</b>, min. <b>37,5 %</b> vol. <b>London gin</b> : aromatisation par redistillation seule, pas de colorant — ce n'est pas une origine géographique.</li>
    <li><b>Vodka</b> : min. 37,5 % vol.</li>
    <li><b>Rhum</b> : min. 37,5 % vol, sucrage plafonné à <b>20 g/L</b> ; un rhum « traditionnel » ne peut pas être édulcoré.</li>
    <li><b>Vermouth</b> : vin aromatisé, min. <b>75 % de vin</b>, 14,5 à 22 % vol, <b>armoise obligatoire</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Cognac</h4><ul>
    <li><b>VS</b> 2 ans · <b>VSOP</b> 4 ans · <b>Napoléon</b> 6 ans · <b>XO</b> 10 ans (depuis 2018, contre 6 avant) · <b>XXO</b> 14 ans (créé en 2018).</li>
    <li>L'âge est toujours celui de la <b>plus jeune</b> eau-de-vie de l'assemblage.</li>
    <li><b>6 crus</b> : Grande Champagne, Petite Champagne, Borderies, Fins Bois, Bons Bois, Bois Ordinaires.</li>
    <li><b>Fine Champagne</b> = Grande + Petite Champagne, avec au moins 50 % de Grande.</li>
    <li>Double distillation en <b>alambic charentais</b>. Le sigle XO serait dû à Hennessy, vers 1870.</li>
   </ul></div>
   <div class="fiche-block"><h4>Armagnac, agave, sherry</h4><ul>
    <li><b>Armagnac</b> : distillation <b>continue</b> en colonne armagnacaise à bas degré (~58 %). Trois zones : <b>Bas-Armagnac</b>, <b>Ténarèze</b>, <b>Haut-Armagnac</b>. Tradition du millésime. La <b>Blanche d'Armagnac</b> est une AOC à part entière.</li>
    <li><b>Tequila</b> : Blanco · Reposado <b>2 mois à 1 an</b> · Añejo <b>1 à 3 ans</b> · Extra Añejo <b>+ de 3 ans</b>. « 100 % agave » contre « mixto » (min. 51 %). Numéro <b>NOM</b>, organisme <b>CRT</b>.</li>
    <li><b>Sherry</b> : <b>solera y criaderas</b>. Élevage <b>biologique</b> sous voile de flor (fino, manzanilla) contre élevage <b>oxydatif</b> (oloroso). L'amontillado commence sous flor et finit à l'oxydation.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le vocabulaire de production</h4><ul>
    <li><b>Macération</b> à froid · <b>Infusion</b> à chaud · <b>Percolation</b> en continu · <b>Distillation</b> par point d'ébullition.</li>
    <li><b>Têtes / cœur / queues</b> : on n'embouteille que le cœur de chauffe.</li>
    <li><b>Alambic à repasse</b> (par lots, plus aromatique) contre <b>colonne</b> (continue, plus pure). Plus le degré de sortie est haut, plus le distillat est neutre.</li>
    <li><b>Part des anges</b> : 0,5 à 3 % évaporés par an — bien plus sous les tropiques.</li>
    <li><b>Mistelle</b> : moût de raisin muté à l'alcool, non fermenté (Noilly Prat, pineau, floc).</li>
   </ul></div>
  </div>`},
 /* ===== CHAPITRES DU RÉFÉRENTIEL ===== */
 {t:"Naissance du cocktail", html:`<p>La première définition écrite du mot <strong>cocktail</strong> paraît en <span class="date">1806</span> dans un journal de l'État de New York, <em class="em">The Balance and Columbian Repository</em> : un mélange d'<strong>alcool, sucre, eau et bitters</strong>. Cette formule est exactement celle de l'<strong>Old Fashioned</strong>, considéré comme la structure originelle du cocktail.</p>
  <ul>
   <li><strong>Jerry Thomas</strong>, surnommé « The Professor », publie en <span class="date">1862</span> <em class="em">How to Mix Drinks; or, The Bon Vivant's Companion</em> : le premier livre de recettes de cocktails. Il est considéré comme le père de la mixologie américaine.</li>
   <li>L'âge d'or américain s'étend de la fin du 19e siècle jusqu'à la Prohibition.</li>
  </ul>`},
 {t:"La Prohibition et l'exode", html:`<p>Aux États-Unis, le <strong>18e amendement</strong> (Volstead Act) instaure la Prohibition de <span class="date">1920 à 1933</span>. Elle est abrogée par le 21e amendement.</p>
  <ul>
   <li>L'alcool circule dans les <strong>speakeasies</strong>, bars clandestins. La qualité douteuse des spiritueux favorise les recettes très aromatiques pour masquer.</li>
   <li>Les barmen américains émigrent : vers <strong>Cuba</strong> (La Havane devient une capitale du cocktail) et vers l'<strong>Europe</strong>, surtout Londres et Paris.</li>
   <li><strong>Harry Craddock</strong>, barman au <strong>Savoy de Londres</strong>, publie en <span class="date">1930</span> le <em class="em">Savoy Cocktail Book</em>, bible de l'époque.</li>
   <li><strong>Harry MacElhone</strong> tient le <strong>Harry's New York Bar</strong> à Paris (5 rue Daunou). Berceau de plusieurs classiques.</li>
  </ul>`},
 {t:"Tiki et renaissance moderne", html:`<ul>
   <li><strong>Tiki</strong> : né dans les années 1930. <strong>Donn Beach</strong> (Don the Beachcomber) ouvre à Hollywood, suivi de <strong>Trader Vic</strong> (Victor Bergeron) à Oakland. Rhums, sirops exotiques, orgeat. Paternité disputée du <strong>Mai Tai</strong> (revendiqué par Trader Vic, 1944) et du <strong>Zombie</strong> (Donn Beach).</li>
   <li><strong>Renaissance craft</strong> : à partir des années 1980-90, <strong>Dale DeGroff</strong> (« King Cocktail ») réhabilite les jus frais et la rigueur au Rainbow Room de New York.</li>
   <li><strong>Sasha Petraske</strong> ouvre <strong>Milk &amp; Honey</strong> à New York le <span class="date">31 décembre 1999</span> (donc, piège classique : les années 1990, pas 2000) : retour du speakeasy, glace travaillée, exécution précise. Point de départ du mouvement moderne.</li>
  </ul>`},
 {t:"Les familles de cocktails", html:`<ul>
   <li><strong>Old Fashioned</strong> : spiritueux, sucre, bitters, glace. La forme mère.</li>
   <li><strong>Sour</strong> : spiritueux + agrume + sucre, parfois blanc d'œuf. <em class="em">Whiskey Sour, Daiquiri, Margarita, Sidecar.</em></li>
   <li><strong>Highball</strong> : spiritueux + long drink gazeux. <em class="em">Gin Tonic, Cuba Libre.</em></li>
   <li><strong>Collins / Fizz</strong> : un sour allongé au soda. Le Fizz se secoue, le Collins se construit au verre.</li>
   <li><strong>Julep</strong> : spiritueux + sucre + menthe + glace pilée. <em class="em">Mint Julep au bourbon.</em></li>
   <li><strong>Smash</strong> : un julep enrichi de fruits.</li>
   <li><strong>Flip</strong> : spiritueux + œuf entier + sucre.</li>
   <li><strong>Punch</strong> : ancêtre de tous, du hindi <em class="em">panch</em> (cinq), pour cinq ingrédients.</li>
   <li><strong>Daisy</strong> : sour avec liqueur et soda. <em class="em">Margarita</em> signifie « marguerite » (daisy) en espagnol.</li>
   <li><strong>Swizzle, Sling, Cobbler</strong> : familles historiques. Le Sherry Cobbler a popularisé la paille au 19e siècle.</li>
  </ul>`},
 {t:"Les grands classiques et leurs origines", html:`<ul>
   <li><strong>Negroni</strong> : Florence, vers 1919. Le comte <strong>Camillo Negroni</strong> demande de renforcer son Americano au gin. <span class="recipe"><b>Recette</b>1/3 gin, 1/3 Campari, 1/3 vermouth rouge, à parts égales.</span></li>
   <li><strong>Manhattan</strong> : New York. <span class="recipe"><b>Recette</b>Whiskey (rye), vermouth rouge, Angostura. Au verre à mélange.</span></li>
   <li><strong>Martini</strong> : gin + vermouth dry, ancêtre probable le Martinez.</li>
   <li><strong>Daiquiri</strong> : Cuba, attribué à <strong>Jennings Cox</strong>, près de la mine de Daiquirí. Rhum, citron vert, sucre.</li>
   <li><strong>Mojito</strong> : La Havane, La Bodeguita del Medio. Rhum, citron vert, sucre, menthe, soda.</li>
   <li><strong>Sazerac</strong> : La Nouvelle-Orléans, souvent cité comme l'un des plus anciens. À l'origine au cognac, puis au rye. <strong>Peychaud's bitters</strong>, rinçage d'absinthe.</li>
   <li><strong>Margarita</strong> : tequila, triple sec, citron vert. Plusieurs revendications mexicaines et américaines.</li>
   <li><strong>Bloody Mary</strong> : Harry's New York Bar à Paris, <strong>Fernand Petiot</strong>. Vodka, jus de tomate, épices.</li>
   <li><strong>French 75</strong> : gin (ou cognac), citron, sucre, champagne. Nommé d'après le canon de 75 mm.</li>
   <li><strong>Sidecar</strong> : cognac, triple sec, citron. Années 1920, Paris-Londres.</li>
   <li><strong>Bellini</strong> : <strong>Harry's Bar de Venise</strong>, Giuseppe Cipriani. Prosecco et purée de pêche blanche.</li>
   <li><strong>Singapore Sling</strong> : <strong>Raffles Hotel</strong>, Singapour, Ngiam Tong Boon, vers 1915.</li>
   <li><strong>Piña Colada</strong> : Porto Rico, son cocktail national. Rhum, coco, ananas.</li>
   <li><strong>Caipirinha</strong> : Brésil. Cachaça, citron vert, sucre.</li>
   <li><strong>Pisco Sour</strong> : Pérou et Chili se le disputent. Pisco, citron vert, sucre, blanc d'œuf, Angostura.</li>
   <li><strong>Cosmopolitan</strong> : New York, fin des années 1980. Vodka citron, triple sec, cranberry, citron vert.</li>
  </ul>`},
 {t:"Les spiritueux : définitions clés", html:`<ul>
   <li><strong>Gin</strong> : alcool neutre aromatisé, le <strong>genièvre</strong> doit dominer. <em class="em">London Dry</em> = sans ajout de sucre ni arôme après distillation. Minimum 37,5 % vol. dans l'UE.</li>
   <li><strong>Whisky</strong> : céréales, vieilli sous bois. <strong>Scotch</strong> min. 3 ans ; <strong>Bourbon</strong> min. 51 % maïs, fût de chêne neuf carbonisé, USA ; <strong>Rye</strong> min. 51 % seigle ; <em class="em">single malt</em> = orge maltée, une seule distillerie.</li>
   <li><strong>Rhum</strong> : de canne. <em class="em">Agricole</em> = jus de canne (AOC Martinique) ; <em class="em">traditionnel</em> = mélasse.</li>
   <li><strong>Tequila</strong> : <strong>agave bleu Weber</strong>, région de Jalisco. 100 % agave ou mixto (min. 51 %). Mentions : Blanco, Reposado, Añejo, Extra Añejo.</li>
   <li><strong>Mezcal</strong> : agaves divers, cuisson en four enterré qui donne le <strong>fumé</strong>. Oaxaca surtout.</li>
   <li><strong>Cognac</strong> : eau-de-vie de vin de la région de Cognac, <strong>double distillation</strong> en alambic charentais, fût de chêne. Comptes d'âge : <strong>VS, VSOP, XO</strong>.</li>
   <li><strong>Armagnac</strong> : Gascogne, le plus souvent distillation continue.</li>
   <li><strong>Vermouth</strong> : vin aromatisé à l'<strong>armoise</strong> (wermut). Rouge, blanc, dry. <em class="em">Noilly Prat</em> pour le dry français, <em class="em">Carpano</em> pour l'italien.</li>
  </ul>`},
 {t:"Amers, liqueurs et modificateurs", html:`<ul>
   <li><strong>Bitters</strong> : <strong>Angostura</strong> (Trinidad) et <strong>Peychaud's</strong> (Nouvelle-Orléans) sont les deux références.</li>
   <li><strong>Amari italiens</strong> : Campari et Aperol (aperitivo), <strong>Fernet-Branca</strong> (digestif très amer, le « shot des barmen »), Averna, Montenegro.</li>
   <li><strong>Chartreuse</strong> : liqueur des moines chartreux, près de Voiron. <strong>Verte</strong> à 55 %, <strong>Jaune</strong> plus douce, à base de 130 plantes.</li>
   <li><strong>Triple sec / Curaçao</strong> : <strong>Cointreau</strong>, <strong>Grand Marnier</strong> (à base de cognac), Combier.</li>
   <li><strong>Vermouths et quinquinas</strong> servent de modificateurs aromatiques et de base aux aperitivi.</li>
  </ul>`},
 {t:"Techniques, outils et institutions", html:`<ul>
   <li><strong>Build</strong> : montage direct au verre.</li>
   <li><strong>Stir</strong> (mélanger) : au <strong>verre à mélange</strong>, pour les cocktails tout-alcool (Martini, Manhattan, Negroni). Limpidité, dilution maîtrisée.</li>
   <li><strong>Shake</strong> (frapper) : pour agrumes, sucre, œuf, laitages. Froid, aération, dilution rapide.</li>
   <li><strong>Dry shake</strong> : sans glace, pour émulsionner le blanc d'œuf, puis on refrappe avec glace.</li>
   <li><strong>Throwing</strong> : transvasement entre deux récipients pour oxygéner sans trop diluer.</li>
   <li><strong>Double strain</strong> : double filtration avec passette fine pour retenir glace et pulpe.</li>
   <li><strong>Outils</strong> : <strong>jigger</strong> (doseur), shaker Boston (2 pièces) ou cobbler (3 pièces), passette <strong>Hawthorne</strong> (à ressort), passette Julep, cuillère à mélange (bar spoon), muddler (pilon).</li>
   <li><strong>IBA</strong> : International Bartenders Association, fondée en 1951. Classe les cocktails officiels en trois catégories : <em class="em">The Unforgettables, Contemporary Classics, New Era Drinks</em>. Organise le World Cocktail Championship.</li>
   <li><strong>ABF</strong> : Association des Barmen de France.</li>
  </ul>`},
 {t:"Histoires des grands classiques", html:`<p>Anecdotes d'origine, en gardant l'esprit critique : beaucoup sont des légendes embellies par le marketing. Les cas contestés sont signalés.</p>
  <ul>
   <li><strong>Martinez &amp; Martini</strong> : le <strong>Martinez</strong> des années 1880 (gin Old Tom, vermouth doux, marasquin, bitters) est l'ancêtre direct du Martini. Avec le temps, le Martini s'assèche : toujours plus de gin, toujours moins de vermouth. <span class="em">Origine du nom débattue.</span></li>
   <li><strong>Tom Collins</strong> : le nom est popularisé par le <strong>canular de 1874</strong>, où l'on faisait croire aux gens qu'un certain Tom Collins les calomniait au bar voisin. Filiation avec le John Collins du Limmer's Hotel à Londres.</li>
   <li><strong>Daiquiri &amp; Hemingway</strong> : à La Havane, au bar <strong>El Floridita</strong>, le barman Constantino Ribalaigua perfectionne le Daiquiri. Hemingway y buvait son <strong>Papa Doble</strong> : double dose de rhum, sans sucre, pamplemousse et marasquin.</li>
   <li><strong>Mojito</strong> : la phrase « mon mojito à La Bodeguita, mon daiquiri à El Floridita » attribuée à Hemingway est <span class="em">probablement apocryphe</span>, mais elle a forgé la légende des deux bars.</li>
   <li><strong>Moscow Mule</strong> : vers 1941, pour écouler la vodka <strong>Smirnoff</strong> aux États-Unis, on l'associe à de la ginger beer dans un <strong>mug en cuivre</strong>. Ce cocktail marketing a lancé la vodka en Amérique.</li>
   <li><strong>Cuba Libre</strong> : né à Cuba vers 1900, rhum et <strong>Coca-Cola</strong>, sur le toast « Por Cuba Libre ! » après la guerre hispano-américaine.</li>
   <li><strong>Gimlet</strong> : gin et cordial de citron vert <strong>Rose's</strong>. Lié à la Royal Navy, qui embarquait du jus de citron vert contre le scorbut. L'attribution au chirurgien Gimlette reste une légende.</li>
   <li><strong>Espresso Martini</strong> : créé par <strong>Dick Bradsell</strong> à Londres à la fin des années 1980, d'abord nommé « Vodka Espresso », pour une cliente qui voulait être réveillée puis grisée. Vodka, espresso, liqueur de café.</li>
   <li><strong>Penicillin</strong> : classique moderne de <strong>Sam Ross</strong> (Milk &amp; Honey, 2005). Scotch, miel-gingembre, citron, float de scotch tourbé.</li>
   <li><strong>Hanky Panky</strong> : créé par <strong>Ada Coleman</strong>, barmaid de l'American Bar du Savoy. Gin, vermouth doux, trait de <strong>Fernet-Branca</strong>.</li>
   <li><strong>Ramos Gin Fizz</strong> : inventé par Henry Ramos à La Nouvelle-Orléans en 1888. Réputé pour son <strong>shake interminable</strong> (la légende parle d'une chaîne de « shaker boys »). Gin, agrumes, blanc d'œuf, crème, fleur d'oranger, soda.</li>
   <li><strong>Last Word</strong> : né au Detroit Athletic Club avant la Prohibition, oublié, puis ressuscité à Seattle dans les années 2000. Gin, <strong>Chartreuse verte</strong>, marasquin, citron vert, à parts égales.</li>
   <li><strong>Negroni Sbagliato</strong> : le Negroni « raté » du Bar Basso à Milan, où le gin est remplacé par du <strong>spumante</strong>.</li>
  </ul>`},
 {t:"L'IBA en détail", html:`<p>L'<strong>International Bartenders Association</strong> est l'autorité mondiale de référence de la profession. À connaître par cœur pour un concours.</p>
  <ul>
   <li><strong>Fondation</strong> : le <span class="date">24 février 1951</span>, au saloon du <strong>Grand Hotel de Torquay</strong> (Angleterre).</li>
   <li><strong>7 guildes fondatrices</strong> : Danemark, France, Italie, Pays-Bas, Suède, Suisse, Royaume-Uni. Moyen mnémotechnique : six pays d'Europe continentale plus le Royaume-Uni, hôte.</li>
   <li><strong>Premier président</strong> : W. J. « Billy » Tarling (Royaume-Uni, UKBG), aussi auteur du <em class="em">Café Royal Cocktail Book</em>. Siège initial à Londres.</li>
   <li><strong>World Cocktail Championship</strong> (WCC) : compétition annuelle, première édition en <span class="date">1955</span> à Amsterdam, dans un pays différent chaque année. Couplée à la <strong>World Flairtending Competition</strong> (WFC).</li>
   <li><strong>Membres aujourd'hui</strong> : environ <strong>67 pays</strong> (plus des pays observateurs).</li>
  </ul>
  <p style="margin-top:18px"><strong>La liste officielle des cocktails IBA</strong></p>
  <ul>
   <li>Initiée par le président <strong>Angelo Zola</strong> en 1960, première version approuvée en <span class="date">1961 à Oslo</span> avec 50 cocktails. Révisée environ tous les dix ans.</li>
   <li>Depuis la mise à jour de <span class="date">2024</span> : <strong>102 cocktails</strong>, répartis en <strong>3 catégories</strong> d'environ 34 chacune. Les versions antérieures en comptaient 77 puis 89.</li>
   <li><strong>The Unforgettables</strong> : les classiques intemporels, socle des origines. <em class="em">Old Fashioned, Negroni, Manhattan, Daiquiri, Martini, Alexander, Sazerac, Martinez.</em></li>
   <li><strong>Contemporary Classics</strong> : modernes solidement installés. <em class="em">Mojito, Cosmopolitan, Margarita.</em></li>
   <li><strong>New Era Drinks</strong> : créations récentes, revues selon les tendances. <em class="em">Paper Plane, Naked and Famous, Spicy Fifty, Ve.n.to.</em> L'Espresso Martini fait partie des ajouts récents.</li>
  </ul>`},
 {t:"Les plus anciens cocktails &amp; les grands noms", html:`<p><strong>Les plus anciens cocktails documentés</strong></p>
  <ul>
   <li><strong>Old Fashioned</strong> : sa structure (alcool, sucre, eau, bitters) est la définition même de 1806. Le nom « Old Fashioned » s'impose à la fin du 19e siècle pour réclamer un cocktail « à l'ancienne ».</li>
   <li><strong>Sazerac</strong> : La Nouvelle-Orléans, milieu du 19e siècle. Souvent présenté comme l'un des plus anciens cocktails américains, d'abord au cognac.</li>
   <li><strong>Mint Julep</strong> : début du 19e siècle dans le Sud, ancêtre rafraîchissant à base d'alcool, sucre et menthe.</li>
   <li><strong>Sherry Cobbler</strong> : années 1830-40, immense succès qui a popularisé l'usage de la <strong>paille</strong>.</li>
   <li><strong>Martinez et Manhattan</strong> : années 1870-80, charnière vers les cocktails au vermouth.</li>
  </ul>
  <p style="margin-top:18px"><strong>Les grands noms du bar</strong></p>
  <ul>
   <li><strong>Jerry Thomas</strong> (1830-1885) : père de la mixologie américaine, premier livre (1862), inventeur du Blue Blazer flambé.</li>
   <li><strong>Harry Johnson</strong> : auteur du <em class="em">Bartender's Manual</em> (1882), pionnier de l'organisation et du service au bar.</li>
   <li><strong>Ada « Coley » Coleman</strong> : barmaid star de l'American Bar du Savoy, créatrice du Hanky Panky, figure féminine majeure.</li>
   <li><strong>Harry Craddock</strong> : Savoy de Londres, <em class="em">Savoy Cocktail Book</em> (1930).</li>
   <li><strong>Harry MacElhone</strong> : Harry's New York Bar, Paris. Associé au Sidecar, au White Lady et au Monkey Gland.</li>
   <li><strong>Constantino Ribalaigua</strong> : « cantinero » d'El Floridita à La Havane, maître du Daiquiri.</li>
   <li><strong>Donn Beach &amp; Trader Vic</strong> : inventeurs de la culture tiki dans les années 1930.</li>
   <li><strong>Dale DeGroff</strong> : « King Cocktail », artisan de la renaissance moderne aux États-Unis.</li>
   <li><strong>Dick Bradsell</strong> : parrain du cocktail britannique moderne, créateur de l'Espresso Martini.</li>
   <li><strong>Sasha Petraske</strong> : Milk &amp; Honey, retour de l'exigence et du speakeasy.</li>
   <li><strong>Colin Field</strong> : longtemps chef barman du Bar Hemingway au Ritz Paris, régulièrement cité parmi les meilleurs du monde.</li>
  </ul>`},
 {t:"Histoire matérielle : glace, bière, sodas", html:`<p>L'angle que les concours adorent : tout ce qui entoure le cocktail sans être un cocktail.</p>
  <p style="margin-top:14px"><strong>La glace</strong></p>
  <ul>
   <li><strong>Frederic Tudor</strong>, « The Ice King » de Boston, lance le commerce de la glace en <span class="date">1806</span> : première cargaison de Nouvelle-Angleterre vers la Martinique. Il offrait la glace aux bartenders pour créer l'habitude du drink froid. Même année que la définition du cocktail : 1806, double date à retenir.</li>
   <li><strong>John Gorrie</strong> dépose en <span class="date">1851</span> le premier brevet américain d'une machine à fabriquer de la glace, à l'origine pour rafraîchir les malades de fièvre en Floride.</li>
   <li>La glace mécanique supplante la glace naturelle à la fin du 19e siècle et permet la généralisation des cocktails frappés.</li>
  </ul>
  <p style="margin-top:14px"><strong>La bière</strong></p>
  <ul>
   <li><strong>IPA (India Pale Ale)</strong> : née en <strong>Angleterre</strong> (pas en Inde !), bière fortement houblonnée pour survivre au voyage vers les Indes britanniques. Associée au brasseur <strong>George Hodgson</strong> (Bow Brewery, Londres) à la fin du 18e siècle.</li>
   <li><strong>Pilsner</strong> : créée en <span class="date">1842</span> à <strong>Plzeň</strong> (Bohême, actuelle Tchéquie) par le brasseur bavarois <strong>Josef Groll</strong> — la première blonde dorée limpide, matrice des lagers mondiales.</li>
   <li><strong>Guinness</strong> : Arthur Guinness s'installe à <strong>St James's Gate, Dublin</strong>, en <span class="date">1759</span>, avec un bail légendaire de 9 000 ans. Le stout descend du <strong>porter</strong>, né à Londres au 18e siècle.</li>
   <li><strong>Fermentation haute</strong> = ales (température plus chaude) ; <strong>fermentation basse</strong> = lagers (froide, garde). Question de base en concours.</li>
  </ul>
  <p style="margin-top:14px"><strong>Sodas et softs</strong></p>
  <ul>
   <li><strong>Schweppes</strong> : fondé à <strong>Genève</strong> en <span class="date">1783</span> par l'horloger-joaillier <strong>Jacob Schweppe</strong>, d'après les travaux du chimiste Joseph Priestley. Usine à Londres en 1792 ; la quinine n'entre dans l'Indian Tonic que vers <span class="date">1870</span>.</li>
   <li><strong>Coca-Cola</strong> : créé en <span class="date">1886</span> à <strong>Atlanta</strong> par le pharmacien <strong>John Pemberton</strong>, d'abord vendu comme tonique en pharmacie.</li>
   <li><strong>La paille</strong> : popularisée par le Sherry Cobbler au 19e ; <strong>Marvin Stone</strong> brevette la paille en papier en <span class="date">1888</span>, remplaçant les pailles en seigle qui donnaient du goût.</li>
   <li><strong>Hurricane</strong> : créé chez <strong>Pat O'Brien's</strong>, French Quarter de La Nouvelle-Orléans, dans les années 1940, pour écouler des stocks de rhum ; servi dans le verre « ouragan » en forme de lampe-tempête.</li>
  </ul>`},
 {t:"Législation française des débits de boissons", html:`<p>Le terrain le plus probable d'un concours français, et du factuel pur.</p>
  <ul>
   <li><strong>Groupes de boissons</strong> : depuis <span class="date">2016</span>, il n'y a plus que <strong>4 groupes</strong> (les anciens groupes 2 et 3 ont fusionné). Groupe 1 : sans alcool. Groupe 3 : fermentées non distillées et vins doux naturels. Groupes 4 et 5 : spiritueux et liqueurs fortes.</li>
   <li><strong>Licence III</strong> (« restreinte ») : vente sur place des groupes <strong>1 et 3</strong>. <strong>Licence IV</strong> : <strong>tous les groupes</strong>, donc les alcools distillés.</li>
   <li><strong>Permis d'exploitation</strong> : formation obligatoire de <strong>20 heures</strong> (environ 3 jours), valable <strong>10 ans</strong>, renouvelée par une mise à jour de <strong>6 heures</strong>.</li>
   <li><strong>Déclaration</strong> : en mairie (préfecture de police à Paris), <strong>15 jours</strong> avant ouverture ou mutation (CERFA 11542).</li>
   <li><strong>Mineurs</strong> : vente et offre d'alcool interdites aux <strong>moins de 18 ans</strong> depuis la loi du <span class="date">21 juillet 2009</span> (auparavant 16 ans pour certaines boissons). Affichage obligatoire.</li>
   <li><strong>Loi Évin</strong> (<span class="date">1991</span>) : encadre strictement la publicité pour l'alcool.</li>
   <li><strong>Étalage obligatoire</strong> : au moins <strong>10 boissons sans alcool</strong> mises en évidence à la vente.</li>
   <li>Interdiction de servir une personne <strong>manifestement ivre</strong> (répression de l'ivresse publique).</li>
   <li><strong>Happy hours</strong> : légales, mais des boissons sans alcool doivent aussi être proposées à prix réduit ; les <strong>open bars</strong> (boisson illimitée forfaitaire) sont interdits sauf exceptions (loi 2009).</li>
   <li><strong>Vente à emporter</strong> : petite licence à emporter = groupe 3 ; licence à emporter = tous groupes. Vente nocturne (22h-8h) hors débits sur place : formation spécifique.</li>
   <li>Une licence III ou IV <strong>non exploitée pendant 5 ans</strong> devient caduque.</li>
  </ul>`},
 {t:"Le café : du grain au cocktail", html:`<p>Angle de plus en plus présent en concours avec la vague Espresso Martini.</p>
  <ul>
   <li><strong>Deux espèces dominantes</strong> : <strong>Coffea arabica</strong> (arômes fins, ~60 % de la production mondiale) et <strong>Coffea canephora</strong> dit <strong>robusta</strong> (plus amer, plus corsé, environ <strong>deux fois plus de caféine</strong> que l'arabica).</li>
   <li><strong>Origine légendaire</strong> : l'<strong>Éthiopie</strong>, avec le berger <strong>Kaldi</strong> remarquant l'excitation de ses chèvres. Le mot « moka » vient du port yéménite de <strong>Mocha (Al-Makha)</strong>, plaque tournante historique du commerce du café.</li>
   <li><strong>Premier producteur mondial</strong> : le <strong>Brésil</strong>, loin devant le Vietnam (robusta).</li>
   <li><strong>Espresso</strong> : extraction sous environ <span class="date">9 bars</span> de pression. La <strong>crema</strong> est une émulsion d'huiles et de CO₂. Un <strong>ristretto</strong> est un espresso « serré » (moins d'eau), un <strong>lungo</strong> est allongé pendant l'extraction.</li>
   <li><strong>Torréfaction</strong> : les arômes naissent de la <strong>réaction de Maillard</strong> et de la caramélisation — même chimie que la croûte du pain.</li>
   <li><strong>Cold brew</strong> : extraction à froid longue (<strong>12 à 24 h</strong>), moins acide et moins amère qu'un café chaud refroidi.</li>
   <li><strong>Cascara</strong> : la pulpe séchée de la cerise de café, infusée comme un thé — intéressant en sirops et cordials.</li>
   <li><strong>Espresso Martini</strong> : créé par <strong>Dick Bradsell</strong> à Londres fin des années 1980 sous le nom « Vodka Espresso ». Recette IBA : vodka, liqueur de café, espresso, sirop de sucre. Garniture canonique : <strong>3 grains de café</strong> (santé, richesse, bonheur).</li>
   <li><strong>Black Russian</strong> : vodka + liqueur de café, créé par <strong>Gustave Tops</strong> à l'hôtel Métropole de <strong>Bruxelles</strong> en <span class="date">1949</span>. Avec de la crème, il devient <strong>White Russian</strong>.</li>
   <li><strong>Irish Coffee</strong> : <strong>Joe Sheridan</strong>, aérogare d'hydravions de <strong>Foynes</strong> (Irlande), vers <span class="date">1943</span> ; popularisé au <strong>Buena Vista</strong> de San Francisco par le journaliste Stanton Delaplane en <span class="date">1952</span>.</li>
   <li><strong>Caffè corretto</strong> : espresso « corrigé » à la grappa ou à la sambuca (Italie). <strong>Carajillo</strong> : café + brandy en Espagne, café + <strong>Licor 43</strong> au Mexique. <strong>Café Brûlot</strong> : café flambé au cognac et aux épices, né chez <strong>Antoine's</strong> à La Nouvelle-Orléans.</li>
  </ul>`},
 {t:"Le champagne : méthode, appellation, cocktails", html:`<p>Avec les dosages déjà vus côté taux de sucre, voici le reste du terrain champenois.</p>
  <ul>
   <li><strong>Trois cépages principaux</strong> : <strong>chardonnay</strong> (blanc), <strong>pinot noir</strong> et <strong>meunier</strong> (noirs). <strong>Blanc de blancs</strong> = uniquement cépages blancs (chardonnay en pratique) ; <strong>blanc de noirs</strong> = raisins noirs vinifiés en blanc.</li>
   <li><strong>Méthode traditionnelle (champenoise)</strong> : une <strong>seconde fermentation en bouteille</strong> déclenchée par la <strong>liqueur de tirage</strong> (sucre + levures) — c'est la <strong>prise de mousse</strong>.</li>
   <li><strong>Remuage</strong> : rassembler le dépôt de levures dans le col. Le <strong>pupitre de remuage</strong> est attribué à la maison <strong>Veuve Clicquot</strong> (vers <span class="date">1816</span>). <strong>Dégorgement</strong> : expulsion du dépôt avant l'ajout de la liqueur d'expédition.</li>
   <li><strong>Élevage minimal sur lattes</strong> : <strong>15 mois</strong> pour un non-millésimé, <strong>3 ans</strong> pour un millésimé.</li>
   <li><strong>Pression dans la bouteille</strong> : environ <span class="date">6 bars</span> — d'où le muselet, obligatoire.</li>
   <li><strong>AOC Champagne</strong> : délimitée en <span class="date">1936</span>. Hors Champagne, la même méthode donne un <strong>crémant</strong> (Alsace, Bourgogne, Loire…).</li>
   <li><strong>Dom Pérignon</strong> : moine bénédictin de l'abbaye d'<strong>Hautvillers</strong>, perfectionneur de l'assemblage — il n'a pas « inventé » les bulles, légende classique de concours.</li>
   <li><strong>Formats</strong> : magnum = <strong>1,5 L</strong>, jéroboam = <strong>3 L</strong>, mathusalem = <strong>6 L</strong>, salmanazar = 9 L, balthazar = 12 L, nabuchodonosor = 15 L.</li>
   <li><strong>Sabrage</strong> : tradition d'ouverture au sabre attribuée aux <strong>hussards napoléoniens</strong>.</li>
   <li><strong>Service</strong> : <strong>8 à 10 °C</strong> ; le verre tulipe est aujourd'hui préféré à la flûte étroite pour l'expression aromatique.</li>
   <li><strong>Champagne Cocktail</strong> (IBA) : sucre imbibé d'<strong>Angostura</strong>, cognac, champagne. <strong>Death in the Afternoon</strong> : absinthe + champagne, attribué à <strong>Hemingway</strong> (<span class="date">1935</span>).</li>
   <li><strong>Old Cuban</strong> : créé par <strong>Audrey Saunders</strong> en <span class="date">2001</span> au restaurant Beacon (New York), avant l'ouverture du Pegu Club — rhum ambré, menthe, citron vert, sucre, Angostura, champagne : un Mojito habillé. <strong>Air Mail</strong> : rhum, miel, citron vert, champagne, classique cubain des années 1930.</li>
   <li><strong>Ratafia de Champagne</strong> : mistelle régionale (moût + eau-de-vie), IGP depuis <span class="date">2015</span>.</li>
  </ul>`},
 {t:"Degrés &amp; TAV : minima ET maxima réglementaires", html:`<p>Réflexe de concours : beaucoup d'appellations imposent un plancher <strong>et</strong> un plafond de titre alcoométrique. Voici la carte des bornes, sourcée aux cahiers des charges.</p>
  <ul>
   <li><strong>Cognac</strong> : distillation à <span class="date">72,4 %</span> maximum au récipient journalier (alambic charentais) ; commercialisation à <strong>40 % minimum</strong>. Le plafond bas préserve les substances volatiles.</li>
   <li><strong>Armagnac</strong> : eaux-de-vie entre <span class="date">52 et 72,4 %</span> en colonne armagnacaise ; les bonnes chauffes de l'alambic à repasse (autorisé depuis <span class="date">1972</span>) sortent entre 65 et 72,4 %. C'est le bas degré (52–60 %) qui donne le gras gascon.</li>
   <li><strong>Rhum AOC Martinique</strong> : sortie de colonne entre <span class="date">65 et 75 %</span>, commercialisation entre <strong>40 et 75 %</strong>, avec au moins <strong>225 g/hL AP</strong> d'éléments volatils (250 pour le vieux).</li>
   <li><strong>Whisky (UE)</strong> : distillation sous <span class="date">94,8 %</span> pour conserver l'arôme des matières premières ; vente à 40 % minimum, fûts de 700 L maximum, 3 ans minimum.</li>
   <li><strong>Tequila</strong> : <span class="date">35–55 %</span> vol (norme NOM). <strong>Cachaça</strong> : <span class="date">38–48 %</span>. <strong>Mezcal</strong> : 36–55 %. Trois fourchettes voisines, piège croisé garanti.</li>
   <li><strong>Pineau des Charentes</strong> : TAV acquis entre <span class="date">16 et 22 %</span> à la mise en marché (décret 2009). <strong>Floc de Gascogne</strong> : <span class="date">16–18 %</span>. <strong>Vins doux naturels</strong> : <span class="date">15–18 %</span> acquis, moût initial à <strong>252 g/L</strong> de sucres minimum. <strong>Porto</strong> : <span class="date">19–22 %</span>.</li>
   <li><strong>Planchers sans plafond</strong> : gin et vodka 37,5 %, whisky et rhum 40 %, liqueurs 15 %, alcool neutre agricole 96 % minimum.</li>
   <li class="em">Logique d'ensemble : plus le distillat sort bas en degré, plus il garde de congénères aromatiques (armagnac, rhum agricole) ; les plafonds des mistelles et VDN garantissent, eux, l'équilibre sucre-alcool du produit fini.</li>
  </ul>`},
 {t:"Cognac : le cahier des charges", html:`<p>AOC reconnue en <span class="date">1936</span> (zone délimitée en <span class="date">1909</span>, crus en <span class="date">1938</span> d'après les travaux du géologue <strong>Henri Coquand</strong> vers 1860). Trois noms officiels : <strong>Cognac</strong>, <strong>Eau-de-vie de Cognac</strong>, <strong>Eau-de-vie des Charentes</strong>. Géré par le <strong>BNIC</strong> depuis 1946.</p>
  <ul>
   <li><strong>Vins de base</strong> : 7–12 % vol, acides, non sulfités en fermentation (le SO2 génère de l'acétaldéhyde), sans enrichissement. Distillation au plus tard le <span class="date">31 mars</span> suivant la récolte.</li>
   <li><strong>Distillation</strong> : double chauffe (à repasse) en alambic charentais 100 % cuivre, charge max <strong>25 hl</strong> en bonne chauffe, TAV max <strong>73,7 %</strong>. L'<strong>Esprit de Cognac</strong> (80–85 %) est une distillation supplémentaire réservée aux vins mousseux.</li>
   <li><strong>Crus</strong> : Grande Champagne (finesse, maturation lente), Petite Champagne, Borderies (<strong>violette</strong>, le plus petit), Fins Bois (<strong>le plus vaste</strong>, raisin pressé), Bons Bois, Bois Ordinaires. <strong>Fine Champagne</strong> = assemblage GC+PC avec min 50 % GC.</li>
   <li><strong>Vieillissement</strong> : min <span class="date">2 ans</span> sous chêne. Comptes : VS=2, VSOP=4, Napoléon=6, XO=10, <strong>XXO=14 ans</strong>. Finition : caramel E150a, sucre, boisé — obscuration max <strong>4 % vol</strong>. La part des anges nourrit le champignon <em class="em">Torula compniacensis</em>.</li>
  </ul>`},
 {t:"Calvados : les trois AOC", html:`<p>Trois appellations normandes sur un verger de <strong>8 000 ha</strong> : <strong>230</strong> variétés de pommes à cidre, <strong>139</strong> variétés de poires à poiré, avec au moins <strong>70 %</strong> de variétés phénoliques (amères et douces-amères).</p>
  <ul>
   <li><strong>Calvados AOC</strong> : Basse-Normandie élargie (Eure, Seine-Maritime, Mayenne, Sarthe, Oise). Pas de mode de distillation imposé (colonne en pratique). Vergers haute tige ≥ <strong>35 %</strong>. Vieillissement min <span class="date">2 ans</span>.</li>
   <li><strong>Pays d'Auge</strong> : est du département du Calvados, coteaux argilo-calcaires. <strong>Alambic à repasse obligatoire</strong>. Poires à poiré max <strong>30 %</strong> du cidre à distiller. Haute tige ≥ 45 %. Min 2 ans.</li>
   <li><strong>Domfrontais</strong> : sud du bocage (Manche, Orne, Mayenne). <strong>Colonne obligatoire</strong> (simple distillation continue). Poires à poiré min <strong>30 %</strong> — miroir exact du Pays d'Auge. Poiriers ≥ 25 % des surfaces, haute tige ≥ 80 %, arbres jusqu'à 15 m. Vieillissement min <span class="date">3 ans</span>.</li>
  </ul>`},
 {t:"Whisky de France (IG)", html:`<p><strong>Projet d'IG</strong> porté par la Fédération du Whisky de France — dossier en cours d'instruction à l'INAO, <strong>non homologué début 2026</strong> (catégorie 2 « Whisky », règlement UE 2019/787). Aire prévue : <strong>France métropolitaine, Corse incluse</strong> — brassage, fermentation, distillation et vieillissement intégralement dans l'aire. Première distillation de la version actuelle : <span class="date">1983</span>, distillerie <strong>Warenghem</strong> (Côtes-d'Armor). Filière : ~100 distilleries et 1,5 M de bouteilles en 2023, près de 2 M en 2024.</p>
  <ul>
   <li><strong>Garanties d'origine</strong> : ajout de sucre au moût <strong>interdit</strong>, céréales transgéniques <strong>interdites</strong>.</li>
   <li><strong>Distillation</strong> : discontinue (simple ou multi-étagée, chaudière max <strong>120 hl</strong>) → TAV max <strong>88 %</strong> au collecteur journalier ; continue multi-étagée (max <strong>250 hl</strong> de moût/24 h) → TAV max <strong>92 %</strong>. À comparer au plafond UE générique de 94,8 %.</li>
   <li><strong>Single Malt</strong> français : orge maltée uniquement, une seule distillerie, distillation <strong>discontinue obligatoire</strong>. Assemblages : Blended/Multiple Malt, voire Double ou Triple Malt.</li>
   <li><strong>Fûts</strong> : changement de fût autorisé sans rompre le vieillissement si &lt; <strong>700 L</strong>. Finishing autorisé (ex-sherry, cognac, porto…) mais fûts de boissons <strong>aromatisées interdits</strong>. Aucune expédition en vrac hors de l'aire en barrique : récipients inertes uniquement. IG régionales préexistantes : Whisky d'<strong>Alsace</strong> et de <strong>Bretagne</strong>.</li>
  </ul>`},
 {t:"Bourbon & Rye : le droit américain", html:`<p>Standards of Identity fédéraux (27 CFR 5). <strong>Bourbon</strong> : min <strong>51 % de maïs</strong>, distillé à max <strong>160 proof (80 %)</strong>, entrée en fût à max <strong>125 proof (62,5 %)</strong>, chêne neuf carbonisé, embouteillé à min 80 proof (40 %). <strong>Aucun additif</strong> autorisé (ni caramel ni arôme — seulement l'eau de réduction). Produit partout aux USA ; déclaré « distinctive product of the United States » par le Congrès en <span class="date">1964</span>.</p>
  <ul>
   <li><strong>Pièges de durée</strong> : le bourbon simple n'a <strong>aucune durée minimale</strong> de vieillissement. « Straight » = min <span class="date">2 ans</span> ; mention d'âge obligatoire sous 4 ans. <em class="em">Corn whiskey</em> : ≥ 80 % maïs et fût usagé ou neuf NON carbonisé — ce n'est pas un bourbon.</li>
   <li><strong>Vocabulaire</strong> : mashbill (composition céréalière), sour mash (réensemencement au backset), wheated (blé en céréale secondaire — Maker's Mark, Weller), single barrel, rickhouse (chai à barriques), char niveau 4 dit « alligator ».</li>
   <li><strong>Rye américain</strong> : min 51 % de seigle, mêmes règles de distillation et de fût que le bourbon. Profil épicé, poivré, sec. Berceau : Pennsylvanie (style <strong>Monongahela</strong>) et Maryland ; whiskey par défaut des recettes pré-Prohibition (Manhattan, Sazerac), quasi disparu après 1920, ressuscité dans les années 2000.</li>
   <li><strong>Attention</strong> : le « rye » canadien n'exige <strong>aucune teneur minimale en seigle</strong> — appellation traditionnelle, pas réglementaire. <em class="em">Empire Rye</em> (New York, 2015) : ≥ 75 % de seigle cultivé dans l'État, entrée en fût ≤ 115 proof, 2 ans min.</li>
  </ul>`},
];

function catDe(q){
  if(q.cat) return q.cat;
  const t=(q.q||"")+" "+(q.e||"")+" "+((q.o&&q.o.join(" "))||"");
  for(const [nom,rx] of CAT_RX) if(rx.test(t)) return nom;
  return "Marques partenaires";
}
