g> (« King Cocktail ») réhabilite les jus frais et la rigueur au Rainbow Room de New York.</li>\n   <li><strong>Sasha Petraske</strong> ouvre <strong>Milk &amp; Honey</strong> à New York le <span class=\"date\">31 décembre 1999</span> (donc, piège classique : les années 1990, pas 2000) : retour du speakeasy, glace travaillée, exécution précise. Point de départ du mouvement moderne.</li>\n  </ul>"}, {"p": "h", "t": "Les grands classiques et leurs origines", "html": "<ul>\n   <li><strong>Negroni</strong> : Florence, vers 1919. Le comte <strong>Camillo Negroni</strong> demande de renforcer son Americano au gin. <span class=\"recipe\"><b>Recette</b>1/3 gin, 1/3 Campari, 1/3 vermouth rouge, à parts égales.</span></li>\n   <li><strong>Manhattan</strong> : New York. <span class=\"recipe\"><b>Recette</b>Whiskey (rye), vermouth rouge, Angostura. Au verre à mélange.</span></li>\n   <li><strong>Martini</strong> : gin + vermouth dry, ancêtre probable le Martinez.</li>\n   <li><strong>Daiquiri</strong> : Cuba, attribué à <strong>Jennings Cox</strong>, près de la mine de Daiquirí. Rhum, citron vert, sucre.</li>\n   <li><strong>Mojito</strong> : La Havane, La Bodeguita del Medio. Rhum, citron vert, sucre, menthe, soda.</li>\n   <li><strong>Sazerac</strong> : La Nouvelle-Orléans, souvent cité comme l'un des plus anciens. À l'origine au cognac, puis au rye. <strong>Peychaud's bitters</strong>, rinçage d'absinthe.</li>\n   <li><strong>Margarita</strong> : tequila, triple sec, citron vert. Plusieurs revendications mexicaines et américaines.</li>\n   <li><strong>Bloody Mary</strong> : Harry's New York Bar à Paris, <strong>Fernand Petiot</strong>. Vodka, jus de tomate, épices.</li>\n   <li><strong>French 75</strong> : gin (ou cognac), citron, sucre, champagne. Nommé d'après le canon de 75 mm.</li>\n   <li><strong>Sidecar</strong> : cognac, triple sec, citron. Années 1920, Paris-Londres.</li>\n   <li><strong>Bellini</strong> : <strong>Harry's Bar de Venise</strong>, Giuseppe Cipriani. Prosecco et purée de pêche blanche.</li>\n   <li><strong>Singapore Sling</strong> : <strong>Raffles Hotel</strong>, Singapour, Ngiam Tong Boon, vers 1915.</li>\n   <li><strong>Piña Colada</strong> : Porto Rico, son cocktail national. Rhum, coco, ananas.</li>\n   <li><strong>Caipirinha</strong> : Brésil. Cachaça, citron vert, sucre.</li>\n   <li><strong>Pisco Sour</strong> : Pérou et Chili se le disputent. Pisco, citron vert, sucre, blanc d'œuf, Angostura.</li>\n   <li><strong>Cosmopolitan</strong> : New York, fin des années 1980. Vodka citron, triple sec, cranberry, citron vert.</li>\n  </ul>"}, {"p": "h", "t": "Histoires des grands classiques", "html": "<p>Anecdotes d'origine, en gardant l'esprit critique : beaucoup sont des légendes embellies par le marketing. Les cas contestés sont signalés.</p>\n  <ul>\n   <li><strong>Martinez &amp; Martini</strong> : le <strong>Martinez</strong> des années 1880 (gin Old Tom, vermouth doux, marasquin, bitters) est l'ancêtre direct du Martini. Avec le temps, le Martini s'assèche : toujours plus de gin, toujours moins de vermouth. <span class=\"em\">Origine du nom débattue.</span></li>\n   <li><strong>Tom Collins</strong> : le nom est popularisé par le <strong>canular de 1874</strong>, où l'on faisait croire aux gens qu'un certain Tom Collins les calomniait au bar voisin. Filiation avec le John Collins du Limmer's Hotel à Londres.</li>\n   <li><strong>Daiquiri &amp; Hemingway</strong> : à La Havane, au bar <strong>El Floridita</strong>, le barman Constantino Ribalaigua perfectionne le Daiquiri. Hemingway y buvait son <strong>Papa Doble</strong> : double dose de rhum, sans sucre, pamplemousse et marasquin.</li>\n   <li><strong>Mojito</strong> : la phrase « mon mojito à La Bodeguita, mon daiquiri à El Floridita » attribuée à Hemingway est <span class=\"em\">probablement apocryphe</span>, mais elle a forgé la légende des deux bars.</li>\n   <li><strong>Moscow Mule</strong> : vers 1941, pour écouler la vodka <strong>Smirnoff</strong> aux États-Unis, on l'associe à de la ginger beer dans un <strong>mug en cuivre</strong>. Ce cocktail marketing a lancé la vodka en Amérique.</li>\n   <li><strong>Cuba Libre</strong> : né à Cuba vers 1900, rhum et <strong>Coca-Cola</strong>, sur le toast « Por Cuba Libre ! » après la guerre hispano-américaine.</li>\n   <li><strong>Gimlet</strong> : gin et cordial de citron vert <strong>Rose's</strong>. Lié à la Royal Navy, qui embarquait du jus de citron vert contre le scorbut. L'attribution au chirurgien Gimlette reste une légende.</li>\n   <li><strong>Espresso Martini</strong> : créé par <strong>Dick Bradsell</strong> à Londres à la fin des années 1980, d'abord nommé « Vodka Espresso », pour une cliente qui voulait être réveillée puis grisée. Vodka, espresso, liqueur de café.</li>\n   <li><strong>Penicillin</strong> : classique moderne de <strong>Sam Ross</strong> (Milk &amp; Honey, 2005). Scotch, miel-gingembre, citron, float de scotch tourbé.</li>\n   <li><strong>Hanky Panky</strong> : créé par <strong>Ada Coleman</strong>, barmaid de l'American Bar du Savoy. Gin, vermouth doux, trait de <strong>Fernet-Branca</strong>.</li>\n   <li><strong>Ramos Gin Fizz</strong> : inventé par Henry Ramos à La Nouvelle-Orléans en 1888. Réputé pour son <strong>shake interminable</strong> (la légende parle d'une chaîne de « shaker boys »). Gin, agrumes, blanc d'œuf, crème, fleur d'oranger, soda.</li>\n   <li><strong>Last Word</strong> : né au Detroit Athletic Club avant la Prohibition, oublié, puis ressuscité à Seattle dans les années 2000. Gin, <strong>Chartreuse verte</strong>, marasquin, citron vert, à parts égales.</li>\n   <li><strong>Negroni Sbagliato</strong> : le Negroni « raté » du Bar Basso à Milan, où le gin est remplacé par du <strong>spumante</strong>.</li>\n  </ul>"}, {"p": "h", "t": "Les plus anciens cocktails et les grands noms", "html": "<p><strong>Les plus anciens cocktails documentés</strong></p>\n  <ul>\n   <li><strong>Old Fashioned</strong> : sa structure (alcool, sucre, eau, bitters) est la définition même de 1806. Le nom « Old Fashioned » s'impose à la fin du 19e siècle pour réclamer un cocktail « à l'ancienne ».</li>\n   <li><strong>Sazerac</strong> : La Nouvelle-Orléans, milieu du 19e siècle. Souvent présenté comme l'un des plus anciens cocktails américains, d'abord au cognac.</li>\n   <li><strong>Mint Julep</strong> : début du 19e siècle dans le Sud, ancêtre rafraîchissant à base d'alcool, sucre et menthe.</li>\n   <li><strong>Sherry Cobbler</strong> : années 1830-40, immense succès qui a popularisé l'usage de la <strong>paille</strong>.</li>\n   <li><strong>Martinez et Manhattan</strong> : années 1870-80, charnière vers les cocktails au vermouth.</li>\n  </ul>\n  <p style=\"margin-top:18px\"><strong>Les grands noms du bar</strong></p>\n  <ul>\n   <li><strong>Jerry Thomas</strong> (1830-1885) : père de la mixologie américaine, premier livre (1862), inventeur du Blue Blazer flambé.</li>\n   <li><strong>Harry Johnson</strong> : auteur du <em class=\"em\">Bartender's Manual</em> (1882), pionnier de l'organisation et du service au bar.</li>\n   <li><strong>Ada « Coley » Coleman</strong> : barmaid star de l'American Bar du Savoy, créatrice du Hanky Panky, figure féminine majeure.</li>\n   <li><strong>Harry Craddock</strong> : Savoy de Londres, <em class=\"em\">Savoy Cocktail Book</em> (1930).</li>\n   <li><strong>Harry MacElhone</strong> : Harry's New York Bar, Paris. Associé au Sidecar, au White Lady et au Monkey Gland.</li>\n   <li><strong>Constantino Ribalaigua</strong> : « cantinero » d'El Floridita à La Havane, maître du Daiquiri.</li>\n   <li><strong>Donn Beach &amp; Trader Vic</strong> : inventeurs de la culture tiki dans les années 1930.</li>\n   <li><strong>Dale DeGroff</strong> : « King Cocktail », artisan de la renaissance moderne aux États-Unis.</li>\n   <li><strong>Dick Bradsell</strong> : parrain du cocktail britannique moderne, créateur de l'Espresso Martini.</li>\n   <li><strong>Sasha Petraske</strong> : Milk &amp; Honey, retour de l'exigence et du speakeasy.</li>\n   <li><strong>Colin Field</strong> : longtemps chef barman du Bar Hemingway au Ritz Paris, régulièrement cité parmi les meilleurs du monde.</li>\n  </ul>"}, {"p": "h", "t": "Histoire matérielle : glace, bière, sodas", "html": "<p>Tout ce qui entoure le cocktail sans être un cocktail.</p>\n  <p style=\"margin-top:14px\"><strong>La glace</strong></p>\n  <ul>\n   <li><strong>Frederic Tudor</strong>, « The Ice King » de Boston, lance le commerce de la glace en <span class=\"date\">1806</span> : première cargaison de Nouvelle-Angleterre vers la Martinique. Il offrait la glace aux bartenders pour créer l'habitude du drink froid. Même année que la définition du cocktail : 1806, double date à retenir.</li>\n   <li><strong>John Gorrie</strong> dépose en <span class=\"date\">1851</span> le premier brevet américain d'une machine à fabriquer de la glace, à l'origine pour rafraîchir les malades de fièvre en Floride.</li>\n   <li>La glace mécanique supplante la glace naturelle à la fin du 19e siècle et permet la généralisation des cocktails frappés.</li>\n  </ul>\n  <p style=\"margin-top:14px\"><strong>La bière</strong></p>\n  <ul>\n   <li><strong>IPA (India Pale Ale)</strong> : née en <strong>Angleterre</strong> (pas en Inde !), bière fortement houblonnée pour survivre au voyage vers les Indes britanniques. Associée au brasseur <strong>George Hodgson</strong> (Bow Brewery, Londres) à la fin du 18e siècle.</li>\n   <li><strong>Pilsner</strong> : créée en <span class=\"date\">1842</span> à <strong>Plzeň</strong> (Bohême, actuelle Tchéquie) par le brasseur bavarois <strong>Josef Groll</strong> : la première blonde dorée limpide, matrice des lagers mondiales.</li>\n   <li><strong>Guinness</strong> : Arthur Guinness s'installe à <strong>St James's Gate, Dublin</strong>, en <span class=\"date\">1759</span>, avec un bail légendaire de 9 000 ans. Le stout descend du <strong>porter</strong>, né à Londres au 18e siècle.</li>\n   <li><strong>Fermentation haute</strong> = ales (température plus chaude) ; <strong>fermentation basse</strong> = lagers (froide, garde).</li>\n  </ul>\n  <p style=\"margin-top:14px\"><strong>Sodas et softs</strong></p>\n  <ul>\n   <li><strong>Schweppes</strong> : fondé à <strong>Genève</strong> en <span class=\"date\">1783</span> par l'horloger-joaillier <strong>Jacob Schweppe</strong>, d'après les travaux du chimiste Joseph Priestley. Usine à Londres en 1792 ; la quinine n'entre dans l'Indian Tonic que vers <span class=\"date\">1870</span>.</li>\n   <li><strong>Coca-Cola</strong> : créé en <span class=\"date\">1886</span> à <strong>Atlanta</strong> par le pharmacien <strong>John Pemberton</strong>, d'abord vendu comme tonique en pharmacie.</li>\n   <li><strong>La paille</strong> : popularisée par le Sherry Cobbler au 19e ; <strong>Marvin Stone</strong> brevette la paille en papier en <span class=\"date\">1888</span>, remplaçant les pailles en seigle qui donnaient du goût.</li>\n   <li><strong>Hurricane</strong> : créé chez <strong>Pat O'Brien's</strong>, French Quarter de La Nouvelle-Orléans, dans les années 1940, pour écouler des stocks de rhum ; servi dans le verre « ouragan » en forme de lampe-tempête.</li>\n  </ul>"}, {"p": "c", "t": "Catégories, familles et méthodes", "html": "\n  <div class=\"fiche-grid\">\n   <div class=\"fiche-block\"><h4>Catégories (= contenance)</h4><ul>\n    <li><b>Short drink</b> : plutôt puissant, ≤ 100 ml (moins de 10 cl).</li>\n    <li><b>Long drink</b> : plutôt allongé, à partir de 100 ml (10 cl).</li>\n   </ul>\n   <h4>Types (= temps)</h4><ul>\n    <li><b>Before dinner</b> : apéritif, plus ou moins amer/sec.</li>\n    <li><b>After dinner</b> : digestif, plus ou moins liquoreux/puissant.</li>\n    <li><b>All day cocktail</b> : tout moment, fruité, désaltérant.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Familles</h4><ul>\n    <li><b>Colada</b> : eau-de-vie + crème de coco + jus (Piña Colada).</li>\n    <li><b>Fizz</b> : eau-de-vie + sucre + citron + eau gazeuse (Gin Fizz).</li>\n    <li><b>Julep</b> : eau-de-vie vieillie + sucre + menthe (Mint Julep).</li>\n    <li><b>Old-Fashioned</b> : eau-de-vie vieillie + sucre + bitters.</li>\n    <li><b>Smash</b> : eau-de-vie + herbe + sucre + agrume (Gin Basil Smash).</li>\n    <li><b>Sour</b> : spiritueux + sucre + agrume (+ souvent blanc d'œuf).</li>\n    <li><b>Tiki</b> : rhum(s) + sucre + agrume + jus de fruits (Mai Tai).</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Les 3 méthodes</h4><ul>\n    <li><b>Shaker</b> : mélanger, émulsionner, rafraîchir en limitant la fonte (jus, crème, œuf).</li>\n    <li><b>Verre à mélange</b> : mélanger + rafraîchir avec dilution (produits alcooliques ; pas de jus/soda).</li>\n    <li><b>Direct au verre</b> : quand les ingrédients se mélangent facilement.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Règle des « 3 S » (créations)</h4><ul>\n    <li><b>Sweet</b> : le sucré : liqueur, crème, fruit, sirop, sucre.</li>\n    <li><b>Sour</b> : l'acidité, le lien : agrume, verjus, solution acide.</li>\n    <li><b>Strong</b> : la puissance, le corps : l'eau-de-vie / le spiritueux.</li>\n    <li>Max 6 ingrédients · verser du moins cher au plus cher · doses en ml.</li>\n   </ul></div>\n  </div>"}, {"p": "c", "t": "Les familles de cocktails", "html": "<ul>\n   <li><strong>Old Fashioned</strong> : spiritueux, sucre, bitters, glace. La forme mère.</li>\n   <li><strong>Sour</strong> : spiritueux + agrume + sucre, parfois blanc d'œuf. <em class=\"em\">Whiskey Sour, Daiquiri, Margarita, Sidecar.</em></li>\n   <li><strong>Highball</strong> : spiritueux + long drink gazeux. <em class=\"em\">Gin Tonic, Cuba Libre.</em></li>\n   <li><strong>Collins / Fizz</strong> : un sour allongé au soda. Le Fizz se secoue, le Collins se construit au verre.</li>\n   <li><strong>Julep</strong> : spiritueux + sucre + menthe + glace pilée. <em class=\"em\">Mint Julep au bourbon.</em></li>\n   <li><strong>Smash</strong> : un julep enrichi de fruits.</li>\n   <li><strong>Flip</strong> : spiritueux + œuf entier + sucre.</li>\n   <li><strong>Punch</strong> : ancêtre de tous, du hindi <em class=\"em\">panch</em> (cinq), pour cinq ingrédients.</li>\n   <li><strong>Daisy</strong> : sour avec liqueur et soda. <em class=\"em\">Margarita</em> signifie « marguerite » (daisy) en espagnol.</li>\n   <li><strong>Swizzle, Sling, Cobbler</strong> : familles historiques. Le Sherry Cobbler a popularisé la paille au 19e siècle.</li>\n  </ul>"}, {"p": "c", "t": "Lexique du bar", "html": "\n  <p class=\"fiche-lead\">Les termes du métier à connaître.</p>\n  <div class=\"fiche-grid\">\n   <div class=\"fiche-block\"><ul>\n    <li><b>Albédo</b> : partie blanche de l'écorce d'un agrume (le « ziste »).</li>\n    <li><b>Aquafaba</b> : jus de pois chiche, émulsifiant.</li>\n    <li><b>Cuban roll</b> : transvaser d'une timbale à l'autre pour oxygéner (ex-« throwing »).</li>\n    <li><b>Collins</b> : long drink, même composition qu'un Fizz mais direct au verre.</li>\n    <li><b>Dry shake</b> : frapper une 1re fois sans glace, avec émulsifiant.</li>\n    <li><b>Reverse dry shake</b> : frapper une 2de fois sans glace, avec émulsifiant.</li>\n    <li><b>Exprimer</b> : libérer les essences d'un zeste.</li>\n    <li><b>Float</b> : verser un filet de liquide sur le cocktail sans mélanger.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><ul>\n    <li><b>Givrer (rim)</b> : décorer les parois d'un verre (ex. Margarita).</li>\n    <li><b>Macération</b> : extraction d'arômes à froid ; <b>infusion</b> : à chaud.</li>\n    <li><b>Muter</b> : stopper la fermentation par ajout d'alcool (garde les sucres).</li>\n    <li><b>Mesure</b> : 40 ml (standard français).</li>\n    <li><b>Trait (dash)</b> : environ 3 à 5 gouttes.</li>\n    <li><b>Shaker Boston</b> : 2 timbales, axe décalé · <b>Continental</b> : emboîtement parfait · <b>3 pièces</b> : passoire intégrée.</li>\n    <li><b>Mocktail / No Low</b> : sans alcool / faible degré (consommation responsable).</li>\n    <li><b>Swizzle stick</b> : le « bois lélé » des Antilles.</li>\n   </ul></div>\n  </div>"}, {"p": "c", "t": "Techniques, outils et institutions", "html": "<ul>\n   <li><strong>Build</strong> : montage direct au verre.</li>\n   <li><strong>Stir</strong> (mélanger) : au <strong>verre à mélange</strong>, pour les cocktails tout-alcool (Martini, Manhattan, Negroni). Limpidité, dilution maîtrisée.</li>\n   <li><strong>Shake</strong> (frapper) : pour agrumes, sucre, œuf, laitages. Froid, aération, dilution rapide.</li>\n   <li><strong>Dry shake</strong> : sans glace, pour émulsionner le blanc d'œuf, puis on refrappe avec glace.</li>\n   <li><strong>Throwing</strong> : transvasement entre deux récipients pour oxygéner sans trop diluer.</li>\n   <li><strong>Double strain</strong> : double filtration avec passette fine pour retenir glace et pulpe.</li>\n   <li><strong>Outils</strong> : <strong>jigger</strong> (doseur), shaker Boston (2 pièces) ou cobbler (3 pièces), passette <strong>Hawthorne</strong> (à ressort), passette Julep, cuillère à mélange (bar spoon), muddler (pilon).</li>\n   <li><strong>IBA</strong> : International Bartenders Association, fondée en 1951. Classe les cocktails officiels en trois catégories : <em class=\"em\">The Unforgettables, Contemporary Classics, New Era Drinks</em>. Organise le World Cocktail Championship.</li>\n   <li><strong>ABF</strong> : Association des Barmen de France.</li>\n  </ul>"}, {"p": "c", "t": "L'IBA en détail", "html": "<p>L'<strong>International Bartenders Association</strong> est l'autorité mondiale de référence de la profession.</p>\n  <ul>\n   <li><strong>Fondation</strong> : le <span class=\"date\">24 février 1951</span>, au saloon du <strong>Grand Hotel de Torquay</strong> (Angleterre).</li>\n   <li><strong>7 guildes fondatrices</strong> : Danemark, France, Italie, Pays-Bas, Suède, Suisse, Royaume-Uni. Moyen mnémotechnique : six pays d'Europe continentale plus le Royaume-Uni, hôte.</li>\n   <li><strong>Premier président</strong> : W. J. « Billy » Tarling (Royaume-Uni, UKBG), aussi auteur du <em class=\"em\">Café Royal Cocktail Book</em>. Siège initial à Londres.</li>\n   <li><strong>World Cocktail Championship</strong> (WCC) : compétition annuelle, première édition en <span class=\"date\">1955</span> à Amsterdam, dans un pays différent chaque année. Couplée à la <strong>World Flairtending Competition</strong> (WFC).</li>\n   <li><strong>Membres aujourd'hui</strong> : environ <strong>67 pays</strong> (plus des pays observateurs).</li>\n  </ul>\n  <p style=\"margin-top:18px\"><strong>La liste officielle des cocktails IBA</strong></p>\n  <ul>\n   <li>Initiée par le président <strong>Angelo Zola</strong> en 1960, première version approuvée en <span class=\"date\">1961 à Oslo</span> avec 50 cocktails. Révisée environ tous les dix ans.</li>\n   <li>Depuis la mise à jour de <span class=\"date\">2024</span> : <strong>102 cocktails</strong>, répartis en <strong>3 catégories</strong> d'environ 34 chacune. Les versions antérieures en comptaient 77 puis 89.</li>\n   <li><strong>The Unforgettables</strong> : les classiques intemporels, socle des origines. <em class=\"em\">Old Fashioned, Negroni, Manhattan, Daiquiri, Martini, Alexander, Sazerac, Martinez.</em></li>\n   <li><strong>Contemporary Classics</strong> : modernes solidement installés. <em class=\"em\">Mojito, Cosmopolitan, Margarita.</em></li>\n   <li><strong>New Era Drinks</strong> : créations récentes, revues selon les tendances. <em class=\"em\">Paper Plane, Naked and Famous, Spicy Fifty, Ve.n.to.</em> L'Espresso Martini fait partie des ajouts récents.</li>\n  </ul>"}, {"p": "c", "t": "Calcul du TAV d'un cocktail", "html": "\n  <p class=\"fiche-lead\">La méthode, illustrée sur un Americano (hors dilution de la glace).</p>\n  <div class=\"tav-demo\">\n   <div class=\"tav-line\"><span>30 ml bitter à 25 %</span><b>30 × 25 = 750</b></div>\n   <div class=\"tav-line\"><span>30 ml vermouth rouge à 16 %</span><b>30 × 16 = 480</b></div>\n   <div class=\"tav-line\"><span>60 ml eau gazeuse à 0 %</span><b>60 × 0 = 0</b></div>\n   <div class=\"tav-tot\"><span>Contenance = 120 ml</span><b>Total = 1230</b></div>\n   <div class=\"tav-res\">1230 ÷ 120 = 10,25, soit <b>un TAV d'environ 10 %</b></div>\n  </div>\n  <p class=\"fiche-note\">Formule : (somme des volumes × degrés) ÷ contenance totale = TAV du cocktail. La fonte de la glace fait ensuite baisser ce chiffre.</p>"}, {"p": "c", "t": "Législation française des débits de boissons", "html": "\n  <ul>\n   <li><strong>Groupes de boissons</strong> : depuis <span class=\"date\">2016</span>, il n'y a plus que <strong>4 groupes</strong> (les anciens groupes 2 et 3 ont fusionné). Groupe 1 : sans alcool. Groupe 3 : fermentées non distillées et vins doux naturels. Groupes 4 et 5 : spiritueux et liqueurs fortes.</li>\n   <li><strong>Licence III</strong> (« restreinte ») : vente sur place des groupes <strong>1 et 3</strong>. <strong>Licence IV</strong> : <strong>tous les groupes</strong>, donc les alcools distillés.</li>\n   <li><strong>Permis d'exploitation</strong> : formation obligatoire de <strong>20 heures</strong> (environ 3 jours), valable <strong>10 ans</strong>, renouvelée par une mise à jour de <strong>6 heures</strong>.</li>\n   <li><strong>Déclaration</strong> : en mairie (préfecture de police à Paris), <strong>15 jours</strong> avant ouverture ou mutation (CERFA 11542).</li>\n   <li><strong>Mineurs</strong> : vente et offre d'alcool interdites aux <strong>moins de 18 ans</strong> depuis la loi du <span class=\"date\">21 juillet 2009</span> (auparavant 16 ans pour certaines boissons). Affichage obligatoire.</li>\n   <li><strong>Loi Évin</strong> (<span class=\"date\">1991</span>) : encadre strictement la publicité pour l'alcool.</li>\n   <li><strong>Étalage obligatoire</strong> : au moins <strong>10 boissons sans alcool</strong> mises en évidence à la vente.</li>\n   <li>Interdiction de servir une personne <strong>manifestement ivre</strong> (répression de l'ivresse publique).</li>\n   <li><strong>Happy hours</strong> : légales, mais des boissons sans alcool doivent aussi être proposées à prix réduit ; les <strong>open bars</strong> (boisson illimitée forfaitaire) sont interdits sauf exceptions (loi 2009).</li>\n   <li><strong>Vente à emporter</strong> : petite licence à emporter = groupe 3 ; licence à emporter = tous groupes. Vente nocturne (22h-8h) hors débits sur place : formation spécifique.</li>\n   <li>Une licence III ou IV <strong>non exploitée pendant 5 ans</strong> devient caduque.</li>\n  </ul>"}, {"p": "p", "t": "Spiritueux : la règle", "html": "\n  <p class=\"fiche-lead\">Les définitions légales ont une réponse unique et vérifiable. Base : règlement européen 2019/787.</p>\n  <div class=\"fiche-grid\">\n   <div class=\"fiche-block\"><h4>Les seuils à connaître par cœur</h4><ul>\n    <li><b>Liqueur</b> : min. 15 % vol et <b>100 g/L</b> de sucre. Exceptions : cerise <b>70 g/L</b>, gentiane <b>80 g/L</b>.</li>\n    <li><b>Crème de…</b> : min. <b>250 g/L</b> · <b>Crème de cassis</b> : min. <b>400 g/L</b>.</li>\n    <li><b>Whisky</b> : min. <b>3 ans</b> en fûts ≤ 700 L, min. 40 % vol, distillé sous 94,8 % vol, aucune édulcoration.</li>\n    <li><b>Gin</b> : genièvre <b>dominant</b>, min. <b>37,5 %</b> vol. <b>London gin</b> : aromatisation par redistillation seule, pas de colorant, ce n'est pas une origine géographique.</li>\n    <li><b>Vodka</b> : min. 37,5 % vol.</li>\n    <li><b>Rhum</b> : min. 37,5 % vol, sucrage plafonné à <b>20 g/L</b> ; un rhum « traditionnel » ne peut pas être édulcoré.</li>\n    <li><b>Vermouth</b> : vin aromatisé, min. <b>75 % de vin</b>, 14,5 à 22 % vol, <b>armoise obligatoire</b>.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Cognac</h4><ul>\n    <li><b>VS</b> 2 ans · <b>VSOP</b> 4 ans · <b>Napoléon</b> 6 ans · <b>XO</b> 10 ans (depuis 2018, contre 6 avant) · <b>XXO</b> 14 ans (créé en 2018).</li>\n    <li>L'âge est toujours celui de la <b>plus jeune</b> eau-de-vie de l'assemblage.</li>\n    <li><b>6 crus</b> : Grande Champagne, Petite Champagne, Borderies, Fins Bois, Bons Bois, Bois Ordinaires.</li>\n    <li><b>Fine Champagne</b> = Grande + Petite Champagne, avec au moins 50 % de Grande.</li>\n    <li>Double distillation en <b>alambic charentais</b>. Le sigle XO serait dû à Hennessy, vers 1870.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Armagnac, agave, sherry</h4><ul>\n    <li><b>Armagnac</b> : distillation <b>continue</b> en colonne armagnacaise à bas degré (~58 %). Trois zones : <b>Bas-Armagnac</b>, <b>Ténarèze</b>, <b>Haut-Armagnac</b>. Tradition du millésime. La <b>Blanche d'Armagnac</b> est une AOC à part entière.</li>\n    <li><b>Tequila</b> : Blanco · Reposado <b>2 mois à 1 an</b> · Añejo <b>1 à 3 ans</b> · Extra Añejo <b>+ de 3 ans</b>. « 100 % agave » contre « mixto » (min. 51 %). Numéro <b>NOM</b>, organisme <b>CRT</b>.</li>\n    <li><b>Sherry</b> : <b>solera y criaderas</b>. Élevage <b>biologique</b> sous voile de flor (fino, manzanilla) contre élevage <b>oxydatif</b> (oloroso). L'amontillado commence sous flor et finit à l'oxydation.</li>\n   </ul></div>\n   <div class=\"fiche-block\"><h4>Le vocabulaire de production</h4><ul>\n    <li><b>Macération</b> à froid · <b>Infusion</b> à chaud · <b>Percolation</b> en continu · <b>Distillation</b> par point d'ébullition.</li>\n    <li><b>Têtes / cœur / queues</b> : on n'embouteille que le cœur de chauffe.</li>\n    <li><b>Alambic à repasse</b> (par lots, plus aromatique) contre <b>colonne</b> (continue, plus pure). Plus le degré de sortie est haut, plus le distillat est neutre.</li>\n    <li><b>Part des anges</b> : 0,5 à 3 % évaporés par an, bien plus sous les tropiques.</li>\n    <li><b>Mistelle</b> : moût de raisin muté à l'alcool, non fermenté (Noilly Prat, pineau, floc).</li>\n   </ul></div>\n  </div>"}, {"p": "p", "t": "Les spiritueux : définitions clés", "html": "<ul>\n   <li><strong>Gin</strong> : alcool neutre aromatisé, le <strong>genièvre</strong> doit dominer. <em class=\"em\">London Dry</em> = sans ajout de sucre ni arôme après distillation. Minimum 37,5 % vol. dans l'UE.</li>\n   <li><strong>Whisky</strong> : céréales, vieilli sous bois. <strong>Scotch</strong> min. 3 ans ; <strong>Bourbon</strong> min. 51 % maïs, fût de chêne neuf carbonisé, USA ; <strong>Rye</strong> min. 51 % seigle ; <em class=\"em\">single malt</em> = orge maltée, une seule distillerie.</li>\n   <li><strong>Rhum</strong> : de canne. <em class=\"em\">Agricole</em> = jus de canne (AOC Martinique) ; <em class=\"em\">traditionnel</em> = mélasse.</li>\n   <li><strong>Tequila</strong> : <strong>agave bleu Weber</strong>, région de Jalisco. 100 % agave ou mixto (min. 51 %). Mentions : Blanco, Reposado, Añejo, Extra Añejo.</li>\n   <li><strong>Mezcal</strong> : agaves divers, cuisson en four enterré qui donne le <strong>fumé</strong>. Oaxaca surtout.</li>\n   <li><strong>Cognac</strong> : eau-de-vie de vin de la région de Cognac, <strong>double distillation</strong> en alambic charentais, fût de chêne. Comptes d'âge : <strong>VS, VSOP, XO</strong>.</li>\n   <li><strong>Armagnac</strong> : Gascogne, le plus souvent distillation continue.</li>\n   <li><strong>Vermouth</strong> : vin aromatisé à l'<strong>armoise</strong> (wermut). Rouge, blanc, dry. <em class=\"em\">Noilly Prat</em> pour le dry français, <em class=\"em\">Carpano</em> pour l'italien.</li>\n  </ul>"}, {"p": "p", "t": "Degrés et TAV : minima et maxima", "html": "<p>Beaucoup d'appellations imposent un plancher <strong>et</strong> un plafond de titre alcoométrique. Voici la carte des bornes, sourcée aux cahiers des charges.</p>\n  <ul>\n   <li><strong>Cognac</strong> : distillation à <span class=\"date\">72,4 %</span> maximum au récipient journalier (alambic charentais) ; commercialisation à <strong>40 % minimum</strong>. Le plafond bas préserve les substances volatiles.</li>\n   <li><strong>Armagnac</strong> : eaux-de-vie entre <span class=\"date\">52 et 72,4 %</span> en colonne armagnacaise ; les bonnes chauffes de l'alambic à repasse (autorisé depuis <span class=\"date\">1972</span>) sortent entre 65 et 72,4 %. C'est le bas degré (52–60 %) qui donne le gras gascon.</li>\n   <li><strong>Rhum AOC Martinique</strong> : sortie de colonne entre <span class=\"date\">65 et 75 %</span>, commercialisation entre <strong>40 et 75 %</strong>, avec au moins <strong>225 g/hL AP</strong> d'éléments volatils (250 pour le vieux).</li>\n   <li><strong>Whisky (UE)</strong> : distillation sous <span class=\"date\">94,8 %</span> pour conserver l'arôme des matières premières ; vente à 40 % minimum, fûts de 700 L maximum, 3 ans minimum.</li>\n   <li><strong>Tequila</strong> : <span class=\"date\">35–55 %</span> vol (norme NOM). <strong>Cachaça</strong> : <span class=\"date\">38–48 %</span>. <strong>Mezcal</strong> : 36–55 %. Trois fourchettes voisines, piège croisé garanti.</li>\n   <li><strong>Pineau des Charentes</strong> : TAV acquis entre <span class=\"date\">16 et 22 %</span> à la mise en marché (décret 2009). <strong>Floc de Gascogne</strong> : <span class=\"date\">16–18 %</span>. <strong>Vins doux naturels</strong> : <span class=\"date\">15–18 %</span> acquis, moût initial à <strong>252 g/L</strong> de sucres minimum. <strong>Porto</strong> : <span class=\"date\">19–22 %</span>.</li>\n   <li><strong>Planchers sans plafond</strong> : gin et vodka 37,5 %, whisky et rhum 40 %, liqueurs 15 %, alcool neutre agricole 96 % minimum.</li>\n   <li class=\"em\">Logique d'ensemble : plus le distillat sort bas en degré, plus il garde de congénères aromatiques (armagnac, rhum agricole) ; les plafonds des mistelles et VDN garantissent, eux, l'équilibre sucre-alcool du produit fini.</li>\n  </ul>"}, {"p": "p", "t": "Cognac : le cahier des charges", "html": "<p>AOC reconnue en <span class=\"date\">1936</span> (zone délimitée en <span class=\"date\">1909</span>, crus en <span class=\"date\">1938</span> d'après les travaux du géologue <strong>Henri Coquand</strong> vers 1860). Trois noms officiels : <strong>Cognac</strong>, <strong>Eau-de-vie de Cognac</strong>, <strong>Eau-de-vie des Charentes</strong>. Géré par le <strong>BNIC</strong> depuis 1946.</p>\n  <ul>\n   <li><strong>Vins de base</strong> : 7–12 % vol, acides, non sulfités en fermentation (le SO2 génère de l'acétaldéhyde), sans enrichissement. Distillation au plus tard le <span class=\"date\">31 mars</span> suivant la récolte.</li>\n   <li><strong>Distillation</strong> : double chauffe (à repasse) en alambic charentais 100 % cuivre, charge max <strong>25 hl</strong> en bonne chauffe, TAV max <strong>73,7 %</strong>. L'<strong>Esprit de Cognac</strong> (80–85 %) est une distillation supplémentaire réservée aux vins mousseux.</li>\n   <li><strong>Crus</strong> : Grande Champagne (finesse, maturation lente), Petite Champagne, Borderies (<strong>violette</strong>, le plus petit), Fins Bois (<strong>le plus vaste</strong>, raisin pressé), Bons Bois, Bois Ordinaires. <strong>Fine Champagne</strong> = assemblage GC+PC avec min 50 % GC.</li>\n   <li><strong>Vieillissement</strong> : min <span class=\"date\">2 ans</span> sous chêne. Comptes : VS=2, VSOP=4, Napoléon=6, XO=10, <strong>XXO=14 ans</strong>. Finition : caramel E150a, sucre, boisé, obscuration max <strong>4 % vol</strong>. La part des anges nourrit le champignon <em class=\"em\">Torula compniacensis</em>.</li>\n  </ul>"}, {"p": "p", "t": "Calvados : les trois AOC", "html": "<p>Trois appellations normandes sur un verger de <strong>8 000 ha</strong> : <strong>230</strong> variétés de pommes à cidre, <strong>139</strong> variétés de poires à poiré, avec au moins <strong>70 %</strong> de variétés phénoliques (amères et douces-amères).</p>\n  <ul>\n   <li><strong>Calvados AOC</strong> : Basse-Normandie élargie (Eure, Seine-Maritime, Mayenne, Sarthe, Oise). Pas de mode de distillation imposé (colonne en pratique). Vergers haute tige ≥ <strong>35 %</strong>. Vieillissement min <span class=\"date\">2 ans</span>.</li>\n   <li><strong>Pays d'Auge</strong> : est du département du Calvados, coteaux argilo-calcaires. <strong>Alambic à repasse obligatoire</strong>. Poires à poiré max <strong>30 %</strong> du cidre à distiller. Haute tige ≥ 45 %. Min 2 ans.</li>\n   <li><strong>Domfrontais</strong> : sud du bocage (Manche, Orne, Mayenne). <strong>Colonne obligatoire</strong> (simple distillation continue). Poires à poiré min <strong>30 %</strong> : miroir exact du Pays d'Auge. Poiriers ≥ 25 % des surfaces, haute tige ≥ 80 %, arbres jusqu'à 15 m. Vieillissement min <span class=\"date\">3 ans</span>.</li>\n  </ul>"}, {"p": "p", "t": "Whisky de France (IG)", "html": "<p><strong>Projet d'IG</strong> porté par la Fédération du Whisky de France, dossier en cours d'instruction à l'INAO, <strong>non homologué début 2026</strong> (catégorie 2 « Whisky », règlement UE 2019/787). Aire prévue : <strong>France métropolitaine, Corse incluse</strong> : brassage, fermentation, distillation et vieillissement intégralement dans l'aire. Première distillation de la version actuelle : <span class=\"date\">1983</span>, distillerie <strong>Warenghem</strong> (Côtes-d'Armor). Filière : ~100 distilleries et 1,5 M de bouteilles en 2023, près de 2 M en 2024.</p>\n  <ul>\n   <li><strong>Garanties d'origine</strong> : ajout de sucre au moût <strong>interdit</strong>, céréales transgéniques <strong>interdites</strong>.</li>\n   <li><strong>Distillation</strong> : discontinue (simple ou multi-étagée, chaudière max <strong>120 hl</strong>) → TAV max <strong>88 %</strong> au collecteur journalier ; continue multi-étagée (max <strong>250 hl</strong> de moût/24 h) → TAV max <strong>92 %</strong>. À comparer au plafond UE générique de 94,8 %.</li>\n   <li><strong>Single Malt</strong> français : orge maltée uniquement, une seule distillerie, distillation <strong>discontinue obligatoire</strong>. Assemblages : Blended/Multiple Malt, voire Double ou Triple Malt.</li>\n   <li><strong>Fûts</strong> : changement de fût autorisé sans rompre le vieillissement si &lt; <strong>700 L</strong>. Finishing autorisé (ex-sherry, cognac, porto…) mais fûts de boissons <strong>aromatisées interdits</strong>. Aucune expédition en vrac hors de l'aire en barrique : récipients inertes uniquement. IG régionales préexistantes : Whisky d'<strong>Alsace</strong> et de <strong>Bretagne</strong>.</li>\n  </ul>"}, {"p": "p", "t": "Bourbon et rye : le droit américain", "html": "<p>Standards of Identity fédéraux (27 CFR 5). <strong>Bourbon</strong> : min <strong>51 % de maïs</strong>, distillé à max <strong>160 proof (80 %)</strong>, entrée en fût à max <strong>125 proof (62,5 %)</strong>, chêne neuf carbonisé, embouteillé à min 80 proof (40 %). <strong>Aucun additif</strong> autorisé (ni caramel ni arôme, seulement l'eau de réduction). Produit partout aux USA ; déclaré « distinctive product of the United States » par le Congrès en <span class=\"date\">1964</span>.</p>\n  <ul>\n   <li><strong>Pièges de durée</strong> : le bourbon simple n'a <strong>aucune durée minimale</strong> de vieillissement. « Straight » = min <span class=\"date\">2 ans</span> ; mention d'âge obligatoire sous 4 ans. <em class=\"em\">Corn whiskey</em> : ≥ 80 % maïs et fût usagé ou neuf NON carbonisé, ce n'est pas un bourbon.</li>\n   <li><strong>Vocabulaire</strong> : mashbill (composition céréalière), sour mash (réensemencement au backset), wheated (blé en céréale secondaire, Maker's Mark, Weller), single barrel, rickhouse (chai à barriques), char niveau 4 dit « alligator ».</li>\n   <li><strong>Rye américain</strong> : min 51 % de seigle, mêmes règles de distillation et de fût que le bourbon. Profil épicé, poivré, sec. Berceau : Pennsylvanie (style <strong>Monongahela</strong>) et Maryland ; whiskey par défaut des recettes pré-Prohibition (Manhattan, Sazerac), quasi disparu après 1920, ressuscité dans les années 2000.</li>\n   <li><strong>Attention</strong> : le « rye » canadien n'exige <strong>aucune teneur minimale en seigle</strong> : appellation traditionnelle, pas réglementaire. <em class=\"em\">Empire Rye</em> (New York, 2015) : ≥ 75 % de seigle cultivé dans l'État, entrée en fût ≤ 115 proof, 2 ans min.</li>\n  </ul>"}, {"p": "p", "t": "Amers, liqueurs et modificateurs", "html": "<ul>\n   <li><strong>Bitters</strong> : <strong>Angostura</strong> (Trinidad) et <strong>Peychaud's</strong> (Nouvelle-Orléans) sont les deux références.</li>\n   <li><strong>Amari italiens</strong> : Campari et Aperol (aperitivo), <strong>Fernet-Branca</strong> (digestif très amer, le « shot des barmen »), Averna, Montenegro.</li>\n   <li><strong>Chartreuse</strong> : liqueur des moines chartreux, près de Voiron. <strong>Verte</strong> à 55 %, <strong>Jaune</strong> plus douce, à base de 130 plantes.</li>\n   <li><strong>Triple sec / Curaçao</strong> : <strong>Cointreau</strong>, <strong>Grand Marnier</strong> (à base de cognac), Combier.</li>\n   <li><strong>Vermouths et quinquinas</strong> servent de modificateurs aromatiques et de base aux aperitivi.</li>\n  </ul>"}, {"p": "p", "t": "Le champagne : méthode, appellation, cocktails", "html": "<p>Avec les dosages déjà vus côté taux de sucre, voici le reste du terrain champenois.</p>\n  <ul>\n   <li><strong>Trois cépages principaux</strong> : <strong>chardonnay</strong> (blanc), <strong>pinot noir</strong> et <strong>meunier</strong> (noirs). <strong>Blanc de blancs</strong> = uniquement cépages blancs (chardonnay en pratique) ; <strong>blanc de noirs</strong> = raisins noirs vinifiés en blanc.</li>\n   <li><strong>Méthode traditionnelle (champenoise)</strong> : une <strong>seconde fermentation en bouteille</strong> déclenchée par la <strong>liqueur de tirage</strong> (sucre + levures), c'est la <strong>prise de mousse</strong>.</li>\n   <li><strong>Remuage</strong> : rassembler le dépôt de levures dans le col. Le <strong>pupitre de remuage</strong> est attribué à la maison <strong>Veuve Clicquot</strong> (vers <span class=\"date\">1816</span>). <strong>Dégorgement</strong> : expulsion du dépôt avant l'ajout de la liqueur d'expédition.</li>\n   <li><strong>Élevage minimal sur lattes</strong> : <strong>15 mois</strong> pour un non-millésimé, <strong>3 ans</strong> pour un millésimé.</li>\n   <li><strong>Pression dans la bouteille</strong> : environ <span class=\"date\">6 bars</span>, d'où le muselet, obligatoire.</li>\n   <li><strong>AOC Champagne</strong> : délimitée en <span class=\"date\">1936</span>. Hors Champagne, la même méthode donne un <strong>crémant</strong> (Alsace, Bourgogne, Loire…).</li>\n   <li><strong>Dom Pérignon</strong> : moine bénédictin de l'abbaye d'<strong>Hautvillers</strong>, perfectionneur de l'assemblage, il n'a pas « inventé » les bulles, légende tenace.</li>\n   <li><strong>Formats</strong> : magnum = <strong>1,5 L</strong>, jéroboam = <strong>3 L</strong>, mathusalem = <strong>6 L</strong>, salmanazar = 9 L, balthazar = 12 L, nabuchodonosor = 15 L.</li>\n   <li><strong>Sabrage</strong> : tradition d'ouverture au sabre attribuée aux <strong>hussards napoléoniens</strong>.</li>\n   <li><strong>Service</strong> : <strong>8 à 10 °C</strong> ; le verre tulipe est aujourd'hui préféré à la flûte étroite pour l'expression aromatique.</li>\n   <li><strong>Champagne Cocktail</strong> (IBA) : sucre imbibé d'<strong>Angostura</strong>, cognac, champagne. <strong>Death in the Afternoon</strong> : absinthe + champagne, attribué à <strong>Hemingway</strong> (<span class=\"date\">1935</span>).</li>\n   <li><strong>Old Cuban</strong> : créé par <strong>Audrey Saunders</strong> en <span class=\"date\">2001</span> au restaurant Beacon (New York), avant l'ouverture du Pegu Club, rhum ambré, menthe, citron vert, sucre, Angostura, champagne : un Mojito habillé. <strong>Air Mail</strong> : rhum, miel, citron vert, champagne, classique cubain des années 1930.</li>\n   <li><strong>Ratafia de Champagne</strong> : mistelle régionale (moût + eau-de-vie), IGP depuis <span class=\"date\">2015</span>.</li>\n  </ul>"}, {"p": "p", "t": "Le café : du grain au cocktail", "html": "<p>Un sujet devenu central avec la vague Espresso Martini.</p>\n  <ul>\n   <li><strong>Deux espèces dominantes</strong> : <strong>Coffea arabica</strong> (arômes fins, ~60 % de la production mondiale) et <strong>Coffea canephora</strong> dit <strong>robusta</strong> (plus amer, plus corsé, environ <strong>deux fois plus de caféine</strong> que l'arabica).</li>\n   <li><strong>Origine légendaire</strong> : l'<strong>Éthiopie</strong>, avec le berger <strong>Kaldi</strong> remarquant l'excitation de ses chèvres. Le mot « moka » vient du port yéménite de <strong>Mocha (Al-Makha)</strong>, plaque tournante historique du commerce du café.</li>\n   <li><strong>Premier producteur mondial</strong> : le <strong>Brésil</strong>, loin devant le Vietnam (robusta).</li>\n   <li><strong>Espresso</strong> : extraction sous environ <span class=\"date\">9 bars</span> de pression. La <strong>crema</strong> est une émulsion d'huiles et de CO₂. Un <strong>ristretto</strong> est un espresso « serré » (moins d'eau), un <strong>lungo</strong> est allongé pendant l'extraction.</li>\n   <li><strong>Torréfaction</strong> : les arômes naissent de la <strong>réaction de Maillard</strong> et de la caramélisation, même chimie que la croûte du pain.</li>\n   <li><strong>Cold brew</strong> : extraction à froid longue (<strong>12 à 24 h</strong>), moins acide et moins amère qu'un café chaud refroidi.</li>\n   <li><strong>Cascara</strong> : la pulpe séchée de la cerise de café, infusée comme un thé, intéressant en sirops et cordials.</li>\n   <li><strong>Espresso Martini</strong> : créé par <strong>Dick Bradsell</strong> à Londres fin des années 1980 sous le nom « Vodka Espresso ». Recette IBA : vodka, liqueur de café, espresso, sirop de sucre. Garniture canonique : <strong>3 grains de café</strong> (santé, richesse, bonheur).</li>\n   <li><strong>Black Russian</strong> : vodka + liqueur de café, créé par <strong>Gustave Tops</strong> à l'hôtel Métropole de <strong>Bruxelles</strong> en <span class=\"date\">1949</span>. Avec de la crème, il devient <strong>White Russian</strong>.</li>\n   <li><strong>Irish Coffee</strong> : <strong>Joe Sheridan</strong>, aérogare d'hydravions de <strong>Foynes</strong> (Irlande), vers <span class=\"date\">1943</span> ; popularisé au <strong>Buena Vista</strong> de San Francisco par le journaliste Stanton Delaplane en <span class=\"date\">1952</span>.</li>\n   <li><strong>Caffè corretto</strong> : espresso « corrigé » à la grappa ou à la sambuca (Italie). <strong>Carajillo</strong> : café + brandy en Espagne, café + <strong>Licor 43</strong> au Mexique. <strong>Café Brûlot</strong> : café flambé au cognac et aux épices, né chez <strong>Antoine's</strong> à La Nouvelle-Orléans.</li>\n  </ul>"}];

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fr(n){return String(n).replace(".",",");}
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return dayKey(Date.now());}
function yesterday(){return dayKey(Date.now()-DAY);}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;};}
function fmtDate(t){return new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});}

/* ================= RÉPÉTITION ESPACÉE ================= */
function isNew(id){return !S.L[id];}
function isDue(id){const e=S.L[id];return !e||e[1]<=Date.now();}
function isMastered(id){const e=S.L[id];return !!e&&e[0]>=3;}
function grade(id,good){
  const e=S.L[id], b=e?e[0]:0;
  if(good){ const nb=Math.min(b+1,5); S.L[id]=[nb,Date.now()+INT[nb]*DAY]; }
  else S.L[id]=[0,Date.now()];
}
function nextLabel(id){const e=S.L[id]; if(!e) return ""; if(e[0]===0) return "revient à la prochaine interro";
  const d=INT[e[0]]; return "revient dans "+d+" jour"+(d>1?"s":"")+(e[0]>=3?" (question sue)":"");}

/* ================= FILTRES ================= */
const BY_SUB=new Map(SUBS.map(s=>[s,[]]));
BANK.forEach(q=>BY_SUB.get(q.t).push(q.id));
function stat(ids){return {tot:ids.length, mas:ids.filter(isMastered).length};}
function subsOf(k){return SUBS.filter(s=>s[0]===k);}
function idsOfPart(k){return subsOf(k).flatMap(s=>BY_SUB.get(s));}
function filtered(){const a=new Set(S.c), l=new Set(S.lv);return BANK.filter(q=>a.has(q.t)&&l.has(q.lv));}
function pool(){const f=filtered();return S.dueOnly?f.filter(q=>isDue(q.id)):f;}
function order(list){
  const seen=list.filter(q=>!isNew(q.id)).sort((a,b)=>S.L[a.id][0]-S.L[b.id][0]||S.L[a.id][1]-S.L[b.id][1]);
  const due=seen.filter(q=>isDue(q.id)), later=seen.filter(q=>!isDue(q.id));
  return [...due, ...shuffle(list.filter(q=>isNew(q.id))), ...shuffle(later)];
}

function togglePart(k){ const subs=subsOf(k), allOn=subs.every(x=>S.c.includes(x)); S.c=S.c.filter(x=>!subs.includes(x)); if(!allOn) S.c.push(...subs); refresh(); }
function onlyPart(k){ S.c=subsOf(k); refresh(); }
function allCats(on){ S.c=on?[...SUBS]:[]; refresh(); }
function weakCats(){ S.c=SUBS.filter(x=>{const s=stat(BY_SUB.get(x));return s.tot&&s.mas/s.tot<.6;}); if(!S.c.length) S.c=[...SUBS]; refresh(); }
function toggleLv(l){ const i=S.lv.indexOf(l); i>=0?S.lv.splice(i,1):S.lv.push(l); if(!S.lv.length) S.lv=[l]; refresh(); }
function setLen(n){ S.len=n; refresh(); }
function toggle(k){ S[k]=!S[k]; refresh(); }

/* ================= SESSIONS ================= */
let session=null, tick=null;
/* Placement de la bonne réponse : jamais au même endroit que la question précédente,
   jamais au même endroit que la dernière fois qu'on a vu cette question, et réparti à parts égales sur la série. */
function mk(list){
  S.pos=S.pos||{};
  const counts={}; let prev=-1;
  const out=list.map(q=>{
    const n=q.o.length, all=[...Array(n).keys()];
    let cand=all.filter(p=>p!==prev&&p!==S.pos[q.id]);
    if(!cand.length) cand=all.filter(p=>p!==prev);
    if(!cand.length) cand=all;
    const minc=Math.min(...cand.map(p=>counts[p]||0));
    const best=cand.filter(p=>(counts[p]||0)<=minc+1);
    const pos=best[Math.floor(Math.random()*best.length)];
    counts[pos]=(counts[pos]||0)+1; prev=pos; S.pos[q.id]=pos;
    const opts=shuffle(q.o.filter((t,i)=>i!==q.r)).map(t=>({t,ok:false}));
    opts.splice(pos,0,{t:q.o[q.r],ok:true});
    return {...q,opts};
  });
  save(); return out;
}
function start(mode){
  let list;
  if(mode==="defi"){ const r=seeded("defi-"+today()); list=shuffle(BANK,r).slice(0,10); }
  else { const p=pool(); if(!p.length){ home(); return; } list=order(p).slice(0,S.len); list=shuffle(list); }
  session={mode,qs:mk(list),i:0,ok:0,streak:0,best:0,done:[],by:{},left:20};
  view="quiz"; renderRail();
  mode==="libre"?askLibre():ask();
}
function startMissed(){
  const ids=Object.keys(S.L).filter(id=>S.L[id][0]===0);
  if(!ids.length){ home(); return; }
  session={mode:"interro",qs:mk(shuffle(ids.map(i=>BYID[i])).slice(0,S.len)),i:0,ok:0,streak:0,best:0,done:[],by:{},left:20};
  view="quiz"; ask();
}
function head(q){
  const st=session, k=q.t[0];
  const lab=st.mode==="defi"?"Défi du jour, ":"";
  return '<div class="q-top"><span class="tag">'+lab+PNAME[k]+', '+esc(SUB[q.t])+'<span class="lv">'+STARS[q.lv]+'</span></span>'+
   '<div class="meters"><span>Question '+(st.i+1)+' sur '+st.qs.length+'</span><span class="bons" id="bons">'+bpText(st.ok)+'</span>'+
   (S.ch&&st.mode!=="libre"?'<span class="clock" id="clk">20</span>':'')+'</div></div>'+
   '<div class="bar"><i style="width:'+(100*st.i/st.qs.length)+'%"></i></div>'+
   '<div class="q">'+esc(q.q)+'</div>';
}
function bpText(n){return n+" bon"+(n>1?"s":"")+" point"+(n>1?"s":"");}
function srcLine(q){return '<span class="src"><b>Réf. :</b> '+esc(q.s)+'</span>';}
function tools(q){
  const fl=S.fl[q.id];
  return '<div class="tools"><button class="tool" onclick="openLesson(\''+q.id+'\')">📖 Revoir la leçon</button>'+
    '<button class="tool'+(fl?' done':'')+'" id="flagbtn" onclick="flagQ(\''+q.id+'\')">'+(fl?'🚩 Signalée':'🚩 Signaler une erreur')+'</button></div>';
}
function ask(){
  const st=session, q=st.qs[st.i];
  clearInterval(tick); st.left=20; st.answered=false;
  document.getElementById("stage").innerHTML=
   '<div class="sheet seyes" id="card" style="--pc:'+PC[q.t[0]]+'">'+head(q)+'<div class="opts" id="opts">'+
   q.opts.map((o,j)=>'<button class="opt" data-k="'+j+'" onclick="answer('+j+')"><span class="ltr">'+"ABCD"[j]+'</span><span>'+esc(o.t)+'</span></button>').join("")+
   '</div><div class="exp" id="exp"><span class="h">La correction</span>'+esc(q.e)+srcLine(q)+'<div class="hint" id="nextl"></div></div>'+
   '<div class="nav"><span class="kb"><kbd>1</kbd> à <kbd>4</kbd> pour répondre, <kbd>Entrée</kbd> pour avancer</span>'+
   '<button class="btn" id="nx" onclick="next()" disabled>Suivante</button></div>'+
   '<div id="tl" style="margin-top:14px;display:none">'+tools(q)+'</div></div>';
  if(S.ch) startClock();
}
function startClock(){
  const el=document.getElementById("clk"); if(!el) return;
  tick=setInterval(()=>{
    if(!session||session.answered) return;
    session.left--; el.textContent=session.left;
    el.className="clock"+(session.left<=5?" hot":session.left<=10?" warn":"");
    if(session.left<=0){ clearInterval(tick); answer(-1); }
  },1000);
}
const BRAVO=["Bravo !","Très bien !","Parfait !","Bien vu !","Excellent !"], OUPS=["Raté !","Oups !","À revoir !","Presque !"];
function record(q,good){
  const st=session;
  st.by[q.t]=st.by[q.t]||[0,0]; st.by[q.t][1]++;
  if(good){ st.ok++; st.by[q.t][0]++; st.streak++; st.best=Math.max(st.best,st.streak); } else st.streak=0;
  grade(q.id,good); st.done.push({q,good}); save(); renderRail();
  const b=document.getElementById("bons"); if(b) b.textContent=bpText(st.ok);
}
function answer(k){
  const st=session; if(!st||st.answered) return;
  st.answered=true; clearInterval(tick);
  const q=st.qs[st.i], good=k>=0&&q.opts[k].ok;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.disabled=true; const j=+b.dataset.k;
    if(q.opts[j].ok){ b.classList.add("good"); b.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>'); }
    else if(j===k){ b.classList.add("bad"); b.insertAdjacentHTML("beforeend",'<span class="mark">✗</span>'); }
    else b.classList.add("dim");
  });
  document.getElementById("card").insertAdjacentHTML("beforeend",'<span class="stamp '+(good?"ok":"ko")+'">'+(good?pick(BRAVO):(k<0?"Temps écoulé !":pick(OUPS)))+'</span>');
  record(q,good);
  document.getElementById("nextl").textContent="Cette question "+nextLabel(q.id)+".";
  document.getElementById("exp").classList.add("show");
  document.getElementById("tl").style.display="";
  const nx=document.getElementById("nx");
  nx.disabled=false; nx.textContent=st.i===st.qs.length-1?"Rendre la copie":"Suivante"; nx.focus({preventScroll:true});
  if(good&&S.an){ const cur=st.i; setTimeout(()=>{ if(session===st&&st.i===cur&&st.answered&&!modalOpen()) next(); },1400); }
}
function next(){
  const st=session; if(!st||!st.answered) return;
  if(st.i<st.qs.length-1){ st.i++; st.mode==="libre"?askLibre():ask(); window.scrollTo({top:0}); } else result();
}

/* Réponse libre */
function askLibre(){
  const st=session, q=st.qs[st.i]; st.answered=false; st.revealed=false;
  const good=q.o[q.r];
  document.getElementById("stage").innerHTML=
   '<div class="sheet seyes" id="card" style="--pc:'+PC[q.t[0]]+'">'+head(q)+

   '<div class="answer" id="ans"><div class="big">'+esc(good)+'</div><div style="margin-top:8px">'+esc(q.e)+'</div>'+srcLine(q)+'</div>'+
   '<div class="self" id="self"><button class="btn ok" onclick="selfGrade(true)">Je savais ✓</button><button class="btn ghost ko" onclick="selfGrade(false)">Je ne savais pas ✗</button>'+
   '<span class="kb"><kbd>1</kbd> je savais, <kbd>2</kbd> je ne savais pas</span></div>'+
   '<div class="hint" id="nextl"></div>'+
   '<div id="tl" style="margin-top:14px">'+tools(q)+'</div></div>';

function reveal(){ const st=session; if(!st||st.revealed) return; st.revealed=true;
  document.getElementById("rv").style.display="none"; document.getElementById("ans").classList.add("show"); document.getElementById("self").classList.add("show"); }
function selfGrade(good){
  const st=session; if(!st||!st.revealed||st.answered) return; st.answered=true;
  const q=st.qs[st.i]; record(q,good);
  document.getElementById("self").innerHTML='<span class="stamp '+(good?"ok":"ko")+'" style="position:static;display:inline-block">'+(good?pick(BRAVO):"À revoir !")+'</span>'+
    '<button class="btn" id="nx" onclick="next()">'+(st.i===st.qs.length-1?"Rendre la copie":"Suivante")+'</button>';
  document.getElementById("nextl").textContent="Cette question "+nextLabel(q.id)+".";
  if(good&&S.an){ const cur=st.i; setTimeout(()=>{ if(session===st&&st.i===cur&&!modalOpen()) next(); },1100); }
}

/* Copie rendue */
function appreciation(note){
  if(note>=18) return ["top","Excellent !"]; if(note>=16) return ["top","Très bien"]; if(note>=14) return ["mid","Bien"];
  if(note>=12) return ["mid","Assez bien"]; if(note>=10) return ["low","Peut mieux faire"]; return ["low","Au travail !"];
}
function addBP(n){ const before=Math.floor(S.bp/10); S.bp+=n; const after=Math.min(Math.floor(S.bp/10),IMAGES.length); return IMAGES.slice(before,after); }
function result(){
  const st=session; clearInterval(tick);
  const note=Math.round(st.ok/st.qs.length*40)/2;
  const [cls,appr]=appreciation(note);
  const rows=Object.entries(st.by).map(([n,s])=>({n,ok:s[0],tot:s[1],r:s[0]/s[1]})).sort((a,b)=>a.r-b.r||b.tot-a.tot);
  const faible=rows.find(x=>x.r<1);
  const comment=note>=18?"Rien à redire, copie modèle.":faible?"Revois le chapitre « "+SUB[faible.n]+" ».":"Du bon travail, continue comme ça.";
  S.hist.push({d:Date.now(),m:st.mode,ok:st.ok,tot:st.qs.length,n:note,by:st.by});
  if(S.hist.length>400) S.hist=S.hist.slice(-400);
  let defiMsg="";
  if(st.mode==="defi"&&!defiDone()){
    S.dj.streak=(S.dj.last===yesterday()?S.dj.streak:0)+1; S.dj.last=today(); S.dj.note=note; S.dj.best=Math.max(S.dj.best,S.dj.streak);
    defiMsg='<div class="gain">Défi du jour réussi ! Série : '+S.dj.streak+' jour'+(S.dj.streak>1?'s':'')+'.</div>';
  }
  const imgs=addBP(st.ok); save();
  document.getElementById("stage").innerHTML=
   '<div class="sheet seyes result">'+
   '<div class="grade"><svg class="circle" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true"><path d="M30 64 C 26 20, 170 8, 182 52 C 194 98, 60 118, 22 80 C 8 62, 40 30, 96 22" fill="none" stroke="var(--ko)" stroke-width="3" stroke-linecap="round"/></svg>'+
   '<span class="n">'+fr(note)+'<small>/20</small></span></div><br>'+
   '<span class="appr '+cls+'">'+appr+'</span>'+
   '<div class="comment">'+esc(comment)+'</div>'+
   '<div class="meta">'+st.ok+' bonnes réponses sur '+st.qs.length+', meilleure série : '+st.best+'.</div>'+
   '<div class="gain">+'+st.ok+' bons points, '+S.bp+' au total.</div>'+defiMsg+
   (imgs.length?'<div class="gain">Nouvelle image'+(imgs.length>1?'s':'')+' !</div><div class="gal" style="max-width:420px;margin:8px auto 0">'+imgs.map(i=>'<div class="img new"><span class="e">'+i[0]+'</span>'+esc(i[1])+'</div>').join("")+'</div>':'')+
   '<div class="recap">'+rows.slice().sort((a,b)=>b.tot-a.tot).map(x=>
     '<div class="l"><span class="n">'+esc(SUB[x.n])+'</span><span class="m"><i data-w="'+Math.round(x.r*100)+'" style="width:0;background:'+PC[x.n[0]]+'"></i></span><span class="s">'+x.ok+'/'+x.tot+'</span></div>').join("")+'</div>'+
   '<div class="acts"><button class="btn" onclick="start(\'interro\')">Nouvelle interro</button>'+
   (Object.values(S.L).some(e=>e[0]===0)?'<button class="btn ghost" onclick="startMissed()">Refaire les erreurs</button>':'')+
   '<button class="btn ghost" onclick="go(\'home\')">Retour au cahier</button></div>'+
   '<div class="rev"><h3>Ma copie corrigée</h3>'+st.done.map(d=>{
      return '<div class="rv '+(d.good?"ok":"ko")+'"><span class="st">'+(d.good?"✓":"✗")+'</span>'+esc(d.q.q)+
        '<br><span class="an">'+esc(d.q.o[d.q.r])+'</span><span class="ex">'+esc(d.q.e)+'</span>'+srcLine(d.q)+'</div>';
   }).join("")+'</div></div>';
  requestAnimationFrame(()=>document.querySelectorAll(".recap .m i").forEach(el=>el.style.width=el.dataset.w+"%"));
  session=null; view="home"; renderRail(); window.scrollTo({top:0});
}

/* ================= SIGNALEMENTS ================= */
function flagQ(id){
  if(S.fl[id]) return;
  const c=prompt("Qu'est-ce qui cloche dans cette question ? (réponse fausse, source douteuse, formulation…)");
  if(c===null) return;
  S.fl[id]={c:c.trim()||"(sans commentaire)",d:Date.now()}; save();
  const b=document.getElementById("flagbtn"); if(b){ b.classList.add("done"); b.textContent="🚩 Signalée"; }
}
function flagText(){
  return Object.entries(S.fl).map(([id,f],i)=>{const q=BYID[id]; if(!q) return "";
    return (i+1)+". ["+id+"] "+q.q+"\n   Réponse enregistrée : "+q.o[q.r]+"\n   Réf. : "+q.s+"\n   Remarque : "+f.c;}).join("\n\n");
}
function copyText(t,btn){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{btn.textContent="Copié !";},()=>{prompt("Copie ce texte :",t);}); }
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function unflag(id){ delete S.fl[id]; save(); renderBulletin(); }

/* ================= LEÇON ================= */
const STOP=new Set("quelle quelles quels lequel laquelle cette celle celui entre comme depuis avant après encore aussi toujours selon notamment environ minimum maximum combien dans pour avec leurs était étaient sont avait d'un d'une qu'il qu'elle cocktail cocktails question".split(" "));
function tokens(t){return (t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/[a-z0-9]{5,}/g)||[]).filter(w=>!STOP.has(w));}
const FTXT=FICHES.map(f=>(f.t+" "+f.html.replace(/<[^>]+>/g," ")).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""));
function findFiche(q){
  const tk=[...new Set([...tokens(q.o[q.r]),...tokens(q.o[q.r]),...tokens(q.q)])];
  let best=-1,bi=0;
  FICHES.forEach((f,i)=>{ let s=f.p===q.t[0]?1.5:0; tk.forEach(w=>{ if(FTXT[i].includes(w)) s+=1; }); if(s>best){best=s;bi=i;} });
  return {i:bi,tk};
}
function openLesson(id){
  const q=BYID[id]||session.qs[session.i]; const {i,tk}=findFiche(q); const f=FICHES[i];
  document.getElementById("modal").innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box2" style="--pc:'+PC[f.p]+'">'+
    '<div class="mh"><h3>'+esc(f.t)+'</h3><button onclick="closeModal()">Fermer</button></div>'+
    '<div class="fiche open" style="--pc:'+PC[f.p]+'"><div class="bd"><div class="seyes" id="mbody">'+f.html+'</div></div></div></div></div>';
  markWords(document.getElementById("mbody"),tk);
  const m=document.querySelector("#mbody mark"); if(m) setTimeout(()=>m.scrollIntoView({block:"center"}),60);
}
function markWords(root,tk){
  if(!tk.length) return;
  const rx=new RegExp("("+tk.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","i");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  let n=0;
  nodes.forEach(tn=>{ if(n>40) return; const plain=tn.data.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const m=plain.match(rx); if(!m) return; const st=m.index, en=st+m[0].length;
    const mid=tn.splitText(st); mid.splitText(en-st); const mk=document.createElement("mark"); mid.parentNode.replaceChild(mk,mid); mk.appendChild(mid); n++; });
}
function modalOpen(){return !!document.querySelector("#modal .modal");}
function closeModal(){ const m=document.getElementById("modal"); if(m) m.innerHTML=""; }

/* ================= EXERCICES ================= */
let exo=null;
function renderExo(){
  exo=null; view="exo";
  document.getElementById("stage").innerHTML='<div class="sheet seyes hero"><h3>Cahier <span>d\'exercices</span></h3>'+
   '<p>Deux jeux pour ancrer les dates et les créateurs autrement qu\'en QCM. Chaque bonne réponse rapporte un bon point.</p>'+
   '<div class="exo-pick"><button class="exo-card" onclick="startFrise()"><span class="ic">📅</span><h4>La frise</h4><p>Remets 5 événements dans l\'ordre chronologique.</p></button>'+
   '<button class="exo-card" onclick="startRelier()"><span class="ic">✏️</span><h4>Relie par une flèche</h4><p>Associe 5 barmen à leur création.</p></button></div></div>';
  renderRail();
}
function startFrise(){
  const ev=[], years=new Set();
  for(const e of shuffle(CHRONO)){ if(!years.has(e.y)){ years.add(e.y); ev.push(e); } if(ev.length===5) break; }
  exo={type:"frise",ev:shuffle(ev),pick:[],done:false}; drawFrise();
}
function drawFrise(){
  const x=exo, sorted=x.ev.slice().sort((a,b)=>a.y-b.y);
  document.getElementById("stage").innerHTML='<div class="sheet seyes" style="--pc:var(--h)"><div class="q-top"><span class="tag">Exercice, la frise</span><span class="bons">'+x.pick.length+' / 5 placés</span></div>'+
   '<div class="q">Clique les événements du plus ancien au plus récent.</div><div class="frise">'+
   x.ev.map((e,i)=>{ const r=x.pick.indexOf(i); let cls="ev"+(r>=0?" picked":"");
     if(x.done){ cls+=sorted[r]===e?" good":" bad"; }
     return '<button class="'+cls+'" onclick="pickEv('+i+')"'+(x.done?" disabled":"")+'><span class="rk">'+(r>=0?r+1:"")+'</span><span>'+esc(e.n)+(x.done?'<span class="sr">Réf. : '+esc(e.s)+'</span>':'')+'</span>'+(x.done?'<span class="yr">'+e.y+'</span>':'')+'</button>'; }).join("")+
   '</div>'+(x.done?'<div class="comment" style="text-align:left">'+x.score+' sur 5 bien placés. '+(x.score===5?"Chronologie parfaite !":"Le bon ordre : "+sorted.map(e=>e.y).join(", ")+".")+'</div><div class="gain">+'+x.score+' bons points</div>':'')+
   '<div class="btns" style="margin-top:14px">'+(x.done?'<button class="btn" onclick="startFrise()">Nouvelle frise</button>':'<button class="btn" onclick="checkFrise()"'+(x.pick.length<5?" disabled":"")+'>Vérifier</button><button class="btn ghost" onclick="exo.pick=[];drawFrise()">Recommencer</button>')+
   '<button class="btn ghost" onclick="renderExo()">Autres exercices</button></div></div>';
}
function pickEv(i){ const x=exo; if(x.done) return; const r=x.pick.indexOf(i); if(r>=0) x.pick.splice(r); else if(x.pick.length<5) x.pick.push(i); drawFrise(); }
function checkFrise(){
  const x=exo; const sorted=x.ev.slice().sort((a,b)=>a.y-b.y);
  x.score=x.pick.filter((ei,r)=>sorted[r]===x.ev[ei]).length; x.done=true;
  addBP(x.score); S.hist.push({d:Date.now(),m:"frise",ok:x.score,tot:5,n:x.score*4,by:{}}); save(); drawFrise(); renderRail();
}
function startRelier(){
  const ps=shuffle(PAIRS).slice(0,5);
  exo={type:"relier",ps,left:shuffle(ps.map((p,i)=>i)),right:shuffle(ps.map((p,i)=>i)),sel:null,ok:new Set(),err:0,done:false};
  drawRelier();
}
function drawRelier(flash){
  const x=exo;
  document.getElementById("stage").innerHTML='<div class="sheet seyes" style="--pc:var(--c)"><div class="q-top"><span class="tag">Exercice, relie par une flèche</span><span class="bons">'+x.ok.size+' / 5 reliés, '+x.err+' erreur'+(x.err>1?"s":"")+'</span></div>'+
   '<div class="q">Clique un barman, puis sa création.</div><div class="cols"><div class="col">'+
   x.left.map(i=>'<button class="pl'+(x.ok.has(i)?" done":"")+(x.sel===i?" sel":"")+'" onclick="selL('+i+')"'+(x.ok.has(i)?" disabled":"")+'>'+esc(x.ps[i].a)+'</button>').join("")+'</div><div class="col">'+
   x.right.map(i=>'<button class="pl'+(x.ok.has(i)?" done":"")+(flash===i?" err":"")+'" onclick="selR('+i+')"'+(x.ok.has(i)?" disabled":"")+'>'+esc(x.ps[i].b)+'</button>').join("")+'</div></div>'+
   (x.done?'<div class="comment" style="text-align:left">'+(x.err===0?"Sans faute !":x.err+" erreur"+(x.err>1?"s":"")+" en route.")+'</div><div class="gain">+'+x.gain+' bons points</div><ul class="srcs">'+x.ps.map(p=>'<li>'+esc(p.a)+' : '+esc(p.b)+'. Réf. : '+esc(p.s)+'</li>').join("")+'</ul>':'')+
   '<div class="btns" style="margin-top:14px">'+(x.done?'<button class="btn" onclick="startRelier()">Nouvelle série</button>':'')+'<button class="btn ghost" onclick="renderExo()">Autres exercices</button></div></div>';
}
function selL(i){ exo.sel=i; drawRelier(); }
function selR(i){
  const x=exo; if(x.sel===null||x.done) return;
  if(x.sel===i){ x.ok.add(i); x.sel=null; if(x.ok.size===5){ x.done=true; x.gain=Math.max(0,5-x.err); addBP(x.gain); S.hist.push({d:Date.now(),m:"relier",ok:x.gain,tot:5,n:x.gain*4,by:{}}); save(); renderRail(); } drawRelier(); }
  else { x.err++; drawRelier(i); }
}

/* ================= BULLETIN ================= */
function renderBulletin(){
  view="bulletin";
  const q=S.hist.filter(h=>QMODES.includes(h.m)), last=q.slice(-20);
  const moy=last.length?Math.round(last.reduce((a,h)=>a+h.n,0)/last.length*2)/2:null;
  const streakAlive=S.dj.last===today()||S.dj.last===yesterday();
  const unlocked=Math.min(Math.floor(S.bp/10),IMAGES.length);
  // par matière, 30 derniers jours
  const since=Date.now()-30*DAY, agg={h:[0,0],c:[0,0],p:[0,0]};
  q.filter(h=>h.d>=since).forEach(h=>Object.entries(h.by||{}).forEach(([t,v])=>{agg[t[0]][0]+=v[0];agg[t[0]][1]+=v[1];}));
  const pts=q.slice(-30);
  let chart='<div class="empty">Pas encore de copie rendue. Ta courbe apparaîtra ici.</div>';
  if(pts.length){
    const W=640,H=200,pl=34,pr=12,pt=12,pb=26, X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)), Y=n=>pt+(20-n)*(H-pt-pb)/20;
    const line=pts.map((h,i)=>X(i).toFixed(1)+","+Y(h.n).toFixed(1)).join(" ");
    chart='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe des notes">'+
      [0,5,10,15,20].map(v=>'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+(v===10?"#E4505E":"#CFE0F3")+'" stroke-width="'+(v===10?1.5:1)+'"'+(v===10?' stroke-dasharray="5 4"':'')+'/><text x="'+(pl-8)+'" y="'+(Y(v)+4)+'" font-size="11" text-anchor="end" fill="#5C6270" font-family="Lexend">'+v+'</text>').join("")+
      '<polyline points="'+line+'" fill="none" stroke="#1F46A8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map((h,i)=>'<circle cx="'+X(i)+'" cy="'+Y(h.n)+'" r="4.5" fill="'+(h.n>=10?"#1E9E5A":"#D93A46")+'" stroke="#1D2433" stroke-width="1.5"><title>'+fmtDate(h.d)+' : '+fr(h.n)+'/20</title></circle>').join("")+
      '<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="#5C6270" font-family="Lexend">'+fmtDate(pts[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="#5C6270" font-family="Lexend">'+fmtDate(pts[pts.length-1].d)+'</text></svg></div>';
  }
  const MODEN={interro:"Interro",defi:"Défi du jour",libre:"Réponse libre",frise:"La frise",relier:"Relier"};
  const fls=Object.entries(S.fl);
  document.getElementById("stage").innerHTML='<div class="sheet seyes">'+
   '<div class="bh">Bulletin de Jocelyn</div><div class="bsub">Culture Bar, année '+new Date().getFullYear()+'</div>'+
   '<div class="kpis"><div class="kpi"><div class="v">'+(moy===null?"–":fr(moy))+'</div><div class="k">moyenne sur 20 (20 dernières copies)</div></div>'+
   '<div class="kpi"><div class="v">'+q.length+'</div><div class="k">copies rendues</div></div>'+
   '<div class="kpi"><div class="v">'+(streakAlive?S.dj.streak:0)+'</div><div class="k">jours de défi d\'affilée (record : '+S.dj.best+')</div></div>'+
   '<div class="kpi"><div class="v">'+S.bp+'</div><div class="k">bons points ('+unlocked+' image'+(unlocked>1?'s':'')+')</div></div></div>'+
   '<div class="bsec">Mes notes<small>30 dernières copies, la ligne rouge marque 10/20</small></div>'+chart+
   '<div class="bsec">Par matière<small>réussite sur 30 jours et maîtrise globale</small></div>'+
   '<div class="tw"><table class="bt"><tr><th>Matière</th><th>Note (30 j)</th><th>Questions sues</th><th>Appréciation</th></tr>'+
   PARTS.map(p=>{ const a=agg[p.k], n=a[1]?Math.round(a[0]/a[1]*40)/2:null, s=stat(idsOfPart(p.k));
     return '<tr><td><span class="dot" style="background:'+PC[p.k]+'"></span>'+p.n+'</td><td class="nt">'+(n===null?"–":fr(n)+"/20")+'</td><td>'+s.mas+' / '+s.tot+'</td><td class="ap">'+(n===null?"Pas encore évalué":appreciation(n)[1])+'</td></tr>'; }).join("")+'</table></div>'+
   '<div class="bsec">Dernières copies</div>'+
   (S.hist.length?'<div class="tw"><table class="bt"><tr><th>Date</th><th>Épreuve</th><th>Résultat</th><th>Note</th></tr>'+
     S.hist.slice(-12).reverse().map(h=>'<tr><td>'+fmtDate(h.d)+'</td><td>'+(MODEN[h.m]||h.m)+'</td><td>'+h.ok+' / '+h.tot+'</td><td class="nt">'+fr(h.n)+'/20</td></tr>').join("")+'</table></div>':'<div class="empty">Rien pour l\'instant.</div>')+

   '<div class="bsec">Mes signalements<small>'+fls.length+' question'+(fls.length>1?'s':'')+' à faire vérifier</small></div>'+
   (fls.length?fls.map(([id,f])=>{const qq=BYID[id]; return qq?'<div class="flag"><button class="tool" onclick="unflag(\''+id+'\')">Retirer</button><b>'+esc(qq.q)+'</b><div>Réponse : '+esc(qq.o[qq.r])+'</div><div class="c">'+esc(f.c)+'</div><div class="d">'+fmtDate(f.d)+', réf. : '+esc(qq.s)+'</div></div>':"";}).join("")+
     '<div class="btns"><button class="btn ghost" onclick="copyText(flagText(),this)">Copier la liste</button><button class="btn ghost" onclick="download(\'culture-bar-signalements-\'+today()+\'.txt\',flagText())">Télécharger (.txt)</button></div>'
     :'<div class="empty">Aucun signalement. Pendant une interro, le bouton 🚩 sous la correction permet d\'en ajouter.</div>')+
   '<div class="bsec">Sauvegarde<small>pour passer d\'un appareil à l\'autre</small></div>'+
   '<div class="save"><div class="btns"><button class="btn" onclick="download(\'culture-bar-progression-\'+today()+\'.json\',JSON.stringify(S),\'application/json\')">Télécharger ma progression</button>'+
   '<label class="btn ghost" style="cursor:pointer">Charger un fichier<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div>'+
   '<div style="font-size:13px;color:var(--mine)">Ou par copier-coller, pratique entre téléphone et ordinateur :</div>'+
   '<div class="btns"><button class="tool" onclick="copyText(exportCode(),this)">Copier mon code</button><button class="tool" onclick="importCode()">Charger le code collé</button></div>'+
   '<textarea id="codebox" placeholder="Colle ici un code de progression"></textarea><div class="msg" id="savemsg"></div></div>'+
   '</div>';
  renderRail();
}
function exportCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function applyImport(obj){
  if(!obj||typeof obj!=="object"||!obj.L){ alert("Ce fichier ou ce code ne ressemble pas à une progression Culture Bar."); return; }
  if(!confirm("Remplacer la progression de cet appareil par celle-ci ?")) return;
  S=Object.assign(fresh(),obj); save(); renderBulletin();
  const m=document.getElementById("savemsg"); if(m) m.textContent="Progression chargée !";
}
function importCode(){ const v=document.getElementById("codebox").value.trim(); if(!v) return;
  try{ applyImport(JSON.parse(decodeURIComponent(escape(atob(v))))); }catch(e){ alert("Code illisible : vérifie qu'il a été copié en entier."); } }
function importFile(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ applyImport(JSON.parse(r.result)); }catch(e){ alert("Fichier illisible."); } }; r.readAsText(f); }

/* ================= CAHIER DE COURS ================= */
function renderFiches(){
  view="fiches";
  let html='<input class="srch" type="search" placeholder="Chercher dans le cahier de cours" oninput="filtFiches(this.value)"><div id="fl">';
  PARTS.forEach(p=>{
    html+='<h3 class="fh" style="--pc:'+PC[p.k]+'" data-k="'+p.k+'">'+p.n+'</h3>';
    FICHES.forEach((f,i)=>{ if(f.p!==p.k) return;
      html+='<div class="fiche" style="--pc:'+PC[p.k]+'" data-k="'+p.k+'" data-t="'+esc(FTXT[i])+'">'+
        '<button aria-expanded="false" onclick="const o=this.parentElement.classList.toggle(\'open\');this.setAttribute(\'aria-expanded\',o)">'+esc(f.t)+'</button>'+
        '<div class="bd"><div class="seyes">'+f.html+'</div></div></div>';
    });
  });
  document.getElementById("stage").innerHTML=html+'</div>';
}
function filtFiches(v){
  v=v.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  document.querySelectorAll("#fl .fiche").forEach(f=>{ f.style.display=(!v||f.dataset.t.includes(v))?"":"none"; });
  document.querySelectorAll("#fl .fh").forEach(h=>{
    const any=[...document.querySelectorAll('#fl .fiche[data-k="'+h.dataset.k+'"]')].some(f=>f.style.display!=="none");
    h.style.display=any?"":"none";
  });
}

/* ================= CLAVIER ================= */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modalOpen()){ closeModal(); return; }
  if(!session||modalOpen()||/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(session.mode==="libre"){
    if(!session.revealed&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); reveal(); return; }
    if(session.revealed&&!session.answered&&(e.key==="1"||e.key==="2")){ selfGrade(e.key==="1"); return; }
    if(session.answered&&e.key==="Enter"){ e.preventDefault(); next(); }
    return;
  }
  if(e.key==="Enter"){ e.preventDefault(); next(); return; }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4&&!session.answered){ const o=document.querySelectorAll("#opts .opt"); if(o[n-1]) o[n-1].click(); }
});

load(); renderRail(); home();
